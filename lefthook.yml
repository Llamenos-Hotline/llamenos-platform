pre-commit:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
      stage_fixed: true
    lint:
      # Covers src/ and tests/ (incl. the k6 load-test *.js specs under
      # tests/load/ — ESLint's TS-oriented rules still apply to plain JS via
      # espree) alongside every other *.ts/*.tsx in the repo. #703 took
      # src + tests (minus tests/steps/backend/, backend-owned, #702) to zero.
      glob: "{**/*.{ts,tsx},tests/**/*.js}"
      files: git diff --cached --diff-filter=d --name-only
      run: bunx eslint {files}
      stage_fixed: true
    codegen-freshness:
      glob: "packages/protocol/schemas/*.ts"
      run: bun run codegen:check
    block-generated-files:
      run: |
        # Block commits that include generated files.
        # These paths are gitignored, but can sneak in during merge conflict resolution
        # (git add -A, manual staging, or IDE auto-staging).
        PATTERN="packages/protocol/generated/|packages/i18n/generated/|apps/ios/Resources/Localizable/|apps/android/app/src/main/res/values.*/strings\.xml|apps/android/app/src/main/java/org/llamenos/i18n/I18n\.kt|\.features-gen/|\.features-gen-backend/|packages/protocol/openapi-snapshot\.json"
        STAGED=$(git diff --cached --name-only | grep -E "$PATTERN" || true)
        if [ -n "$STAGED" ]; then
          echo "ERROR: Generated files staged for commit:"
          echo "$STAGED"
          echo ""
          echo "Generated files must never be committed. They are regenerated by:"
          echo "  bun run codegen       # Protocol types (Swift/Kotlin/Rust)"
          echo "  bun run i18n:codegen  # iOS .strings, Android strings.xml, Kotlin I18n.kt"
          echo ""
          echo "Remove them with: git reset HEAD <file>"
          exit 1
        fi
    bddgen-freshness:
      glob: "{packages/test-specs/features/**/*.feature,tests/steps/**/*.ts}"
      # export warms the transform cache single-threaded first — see the build job in .github/workflows/ci.yml
      run: bunx bddgen export > /dev/null && bunx bddgen
    worker-unit-tests:
      glob: "apps/worker/**/*.{ts,tsx}"
      run: bun run test:worker:unit
    crypto-unit-tests:
      glob: "packages/crypto/**/*.rs"
      run: bun run crypto:test
    crypto-ffi-build:
      glob: "packages/crypto/**/*.rs"
      run: bun run crypto:build:server
    migration-drift:
      glob: "apps/worker/db/schema/*.ts"
      run: bun scripts/check-migration-drift.ts
    ipc-allowlist-check:
      glob: "{apps/desktop/src/**/*.rs,src/client/lib/platform.ts}"
      run: bun run check:ipc-allowlist
    i18n-validate:
      glob: "{packages/i18n/locales/*.json,src/client/**/*.tsx}"
      run: bun run i18n:validate:all
    test-specs-validate:
      glob: "{packages/test-specs/features/**/*.feature,tests/steps/**/*.ts}"
      run: bun run test-specs:validate
    i18n-codegen-freshness:
      glob: "packages/i18n/locales/*.json"
      run: bun run i18n:codegen && git diff --exit-code apps/ios/Resources/Localizable/ apps/android/app/src/main/res/values*/strings.xml apps/android/app/src/main/java/org/llamenos/i18n/I18n.kt
    no-generated-files:
      glob: "{apps/ios/Resources/Localizable/**/*.strings,apps/android/app/src/main/res/values*/strings.xml,apps/android/app/src/main/java/org/llamenos/i18n/I18n.kt,apps/ios/Sources/Generated/LlamenosCore.swift,packages/protocol/generated/**}"
      run: |
        # Only block additions/modifications of generated files, not deletions (git rm --cached is fine)
        added=$(git diff --cached --diff-filter=d --name-only -- \
          'apps/ios/Resources/Localizable/' \
          'apps/android/app/src/main/res/values*/strings.xml' \
          'apps/android/app/src/main/java/org/llamenos/i18n/I18n.kt' \
          'apps/ios/Sources/Generated/LlamenosCore.swift' \
          'packages/protocol/generated/' || true)
        if [ -n "$added" ]; then
          echo "ERROR - Generated files should not be committed. Run bun run codegen / bun run i18n:codegen instead."
          echo "Staged: $added"
          exit 1
        fi
    block-private-keys:
      run: |
        # Block committing private key literals (nsec1 bech32 or raw 64-char hex seeds)
        # into client-side source files. Private keys must never appear in browser bundles.
        STAGED_CLIENT=$(git diff --cached --diff-filter=d --name-only | grep -E '^src/client/' || true)
        if [ -z "$STAGED_CLIENT" ]; then
          exit 0
        fi
        if git diff --cached --diff-filter=d -- $STAGED_CLIENT | grep -E '\+.*nsec1[a-z0-9]{58,}' > /dev/null 2>&1; then
          echo "ERROR: nsec1 private key literal detected in staged client code."
          echo "Private keys must never be bundled in the browser. Move them to the server."
          exit 1
        fi
    block-env-files:
      run: |
        # Block actual .env files (which may contain secrets) but allow .env.example (template)
        staged=$(git diff --cached --name-only | grep -E 'deploy/docker/\.env' | grep -v '\.example$' || true)
        if [ -n "$staged" ]; then
          echo "ERROR: Refusing to commit deploy/docker/.env files."
          echo "These files contain secrets. Provision via orchestration layer instead."
          echo "Staged: $staged"
          exit 1
        fi

pre-push:
  commands:
    check-codegen-drift:
      run: bun run codegen:check
    check-migration-drift:
      run: bun scripts/check-migration-drift.ts
    rust-format-check:
      glob: "packages/crypto/**/*.rs"
      run: bun run crypto:fmt
