# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Include all targets, not just the host target
all-features = false
no-default-features = false

# ── Advisories (known vulnerability database) ──────────────────────────────
[advisories]
# The advisory database is fetched from the RustSec Advisory Database:
# https://github.com/rustsec/advisory-db
db-urls = ["https://github.com/rustsec/advisory-db"]
db-path = "~/.cargo/advisory-db"
version = 2

# cargo-deny 0.20 changed `unmaintained` from a severity string to a scope
# enum (which crates to check for unmaintained status). It is `all` here, so
# unmaintained transitive crates are hard errors, exactly like vulnerabilities.
unmaintained = "all"

# Always error on yanked crates — these are explicitly retracted.
yanked = "warn"

# Advisories we have explicitly assessed and accepted. This list is the ONLY
# way an advisory may fail to fail the build (the `cargo-deny` job in
# .github/workflows/security-audit.yml has no continue-on-error), so:
#
#   * one entry per advisory ID — never a wildcard, never a whole crate;
#   * `reason` states why it is not exploitable / not fixable today;
#   * `reason` MUST end with `[expires YYYY-MM-DD]`. The "Enforce advisory
#     ignore expiry" step in the workflow fails the build once that date has
#     passed (or if the marker is missing), forcing a re-triage instead of a
#     silent, permanent suppression.
#
# Vulnerabilities (rustls, quick-xml, rkyv) are deliberately NOT listed: they
# are fixed by upgrading, not by ignoring.
#
# All entries below are UNMAINTAINED (not vulnerable) crates in apps/desktop's
# Tauri-side dependency graph. Removing them needs an upstream release of
# Tauri / tauri-plugin-stronghold; we do not control it. Track re-triage in #646.
ignore = [
  # tauri-plugin-stronghold -> iota_stronghold -> bincode 1.3.3. Serialises the
  # local Stronghold snapshot only; maintainer stepped down, no vulnerability.
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 unmaintained; only via tauri-plugin-stronghold/iota_stronghold snapshot (de)serialisation of local data, no known vulnerability, needs upstream migration [expires 2026-12-31]" },
  # tauri-plugin-stronghold -> iota_stronghold -> stronghold_engine -> paste.
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained; compile-time proc-macro only (via stronghold_engine), absent from the shipped binary [expires 2026-12-31]" },
  # tauri -> tray-icon -> libappindicator -> gtk -> glib-macros -> proc-macro-error.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 unmaintained; compile-time proc-macro only (via gtk-rs 0.18 glib-macros), absent from the shipped binary, waits on Tauri's move to gtk4/gtk-rs 0.20 [expires 2026-12-31]" },
  # tauri-build / tauri-utils -> urlpattern 0.3.0 -> unic-* (5 crates, one advisory each).
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range unmaintained; via tauri-utils -> urlpattern (capability/URL-pattern parsing of our own tauri.conf.json), no untrusted input, no known vulnerability [expires 2026-12-31]" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common unmaintained; via tauri-utils -> urlpattern, same as RUSTSEC-2025-0075 [expires 2026-12-31]" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property unmaintained; via tauri-utils -> urlpattern, same as RUSTSEC-2025-0075 [expires 2026-12-31]" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version unmaintained; via tauri-utils -> urlpattern, same as RUSTSEC-2025-0075 [expires 2026-12-31]" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident unmaintained; via tauri-utils -> urlpattern, same as RUSTSEC-2025-0075 [expires 2026-12-31]" },
  # tauri-plugin-notification -> notify-rust -> zbus 5 and tauri-plugin-single-instance
  # -> zbus 5 (Linux D-Bus). zvariant/zbus_names/zvariant_derive were merged into
  # zbus 6.0.0, but every published notify-rust / tauri-plugin-notification /
  # tauri-plugin-single-instance still requires `zbus ^5` (checked 2026-10-18). Tracked in #1956.
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5.9.2 unmaintained (merged into zbus 6); via zbus 5 <- notify-rust and tauri-plugin-single-instance, no vulnerability, no upstream release on zbus 6 yet, tracked in #1956 [expires 2026-12-31]" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.1 unmaintained; same zbus 5 path as RUSTSEC-2026-0370, tracked in #1956 [expires 2026-12-31]" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.9.2 unmaintained; same zbus 5 path as RUSTSEC-2026-0370, tracked in #1956 [expires 2026-12-31]" },
  # zip: fixed only in >=9.0.0, and BOTH copies in the graph are pinned below it by
  # crates we do not control (tracked in #1956):
  #   * zip 4.6.1 <- tauri-plugin-updater (Windows target only; latest 2.14.0 and
  #     3.0.0-alpha.3 still require `zip ^4`). The `zip` feature also gates the
  #     tar/flate2 the macOS/Linux updater needs, so it cannot be disabled.
  #   * zip 8.6.0 <- libsodium-sys-stable build script (latest 1.24.3 still requires
  #     `zip ^8.6`), via stronghold-runtime <- iota_stronghold <- tauri-plugin-stronghold.
  # All three advisories concern `extract()` on an ATTACKER-SUPPLIED archive. Neither
  # copy ever sees one: the updater minisign-verifies the downloaded payload against
  # our pinned pubkey before it calls extract (updater.rs `verify_signature` precedes
  # `install`), and libsodium's build script minisign-verifies the libsodium MSVC zip
  # against libsodium's pinned key before extracting. Forging either needs a signing
  # key, which would already allow arbitrary code execution without any zip bug.
  { id = "RUSTSEC-2026-0367", reason = "zip <9.0.0 keeps SUID/SGID bits on extract; zip 4.6.1 (tauri-plugin-updater, Windows only) and 8.6.0 (libsodium-sys-stable build script) both only extract minisign-verified archives, no upgrade exists, tracked in #1956 [expires 2026-12-31]" },
  { id = "RUSTSEC-2026-0368", reason = "zip <9.0.0 extract() follows attacker symlinks; same two minisign-verified-only call sites as RUSTSEC-2026-0367, tracked in #1956 [expires 2026-12-31]" },
  { id = "RUSTSEC-2026-0369", reason = "zip <9.0.0 applies Unix permissions through symlinks on extract(); same two minisign-verified-only call sites as RUSTSEC-2026-0367, tracked in #1956 [expires 2026-12-31]" },
]

# ── Licenses ────────────────────────────────────────────────────────────────
[licenses]
version = 2

# Crates must use one of these licenses to be accepted.
# Covers the full set of common permissive and copyleft licenses used by the
# Rust ecosystem (OpenSSL exception accepted via ring/aws-lc-rs wrappers).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",           # used by webpki, rustls
  "OpenSSL",           # ring bundles BoringSSL-derived code
  "CDLA-Permissive-2.0", # webpki-root-certs — a data-only public CA cert bundle
]

# Crates under AGPL (our own code) are treated as confidential and exempt.
# The project itself is AGPL-3.0-or-later but cargo-deny only checks deps.
exceptions = [
  # ring uses a custom license that must be evaluated separately.
  { allow = ["ISC", "MIT", "OpenSSL"], name = "ring" },
  # llamenos-core (packages/crypto) and llamenos-desktop (apps/desktop) are
  # our own AGPL-3.0-or-later crates. cargo-deny checks workspace members
  # too, not only third-party deps — explicitly exempt our own packages
  # rather than adding AGPL to the allow list (which would also permit
  # AGPL in third-party deps).
  { allow = ["AGPL-3.0-or-later"], name = "llamenos-core" },
  { allow = ["AGPL-3.0-or-later"], name = "llamenos-desktop" },
]

# Confidence threshold for license detection (0.0 – 1.0).
# 0.8 avoids false positives while catching most licenses.
confidence-threshold = 0.8

# ── Bans (duplicate / forbidden crates) ────────────────────────────────────
[bans]
# Error on multiple versions of the same crate. This catches accidental
# dependency duplication that inflates binary size and complicates audits.
# Change individual entries to "warn" below if a duplicate is unavoidable.
multiple-versions = "warn"

# Wildcard deps in published crates are a supply-chain risk.
wildcards = "allow"        # we don't publish, so this is informational only

# Crates that must never appear in the dependency graph.
deny = [
  # openssl — prefer rustls or ring for TLS; openssl is a C dep and
  # historically vulnerable. Audit any exception carefully.
  # { name = "openssl" },
]

# Known-acceptable duplicate versions (generated by transitive dep conflicts).
# Add entries here as needed after triaging with `cargo deny list`.
skip = []
skip-tree = []

# ── Sources (crate registry and git sources) ────────────────────────────────
[sources]
# Only allow crates from crates.io and git sources we explicitly list.
unknown-registry = "warn"
unknown-git = "warn"

# Allow git sources that we've explicitly pinned (e.g. security patches).
allow-git = [
  # hpke-rs-libcrux is patched in apps/desktop/Cargo.toml to pull a fix for
  # RUSTSEC-2026-0124 (libcrux-chacha20poly1305 DoS) before a crates.io
  # release is available. Remove once hpke-rs-libcrux >=0.6.2 is on crates.io.
  "https://github.com/celabshq/hpke-rs",
]
