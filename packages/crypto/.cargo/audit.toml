# which is what CI runs, with no `-D warnings`):
#
#   * RUSTSEC-2026-0190 (anyhow `Error::downcast_mut()` unsoundness) was FIXED
#     rather than ignored: anyhow 1.0.102 -> 1.0.104 (patched >= 1.0.103). This
#     one did ship, via uniffi in the `mobile` builds, so it mattered.
#
#   * RUSTSEC-2026-0173 (proc-macro-error2 unmaintained) has `patched = []` —
#     no fixed release exists, the author has retired the crate. It reaches us
#     only as a build-time proc-macro via hax-lib-macros -> libcrux-sha3, i.e.
#     only under `--features mls`, and emits no runtime code into any shipped
#     binary. It stays an unignored warning so it remains visible; silencing it
#     would only hide the day it becomes actionable.
