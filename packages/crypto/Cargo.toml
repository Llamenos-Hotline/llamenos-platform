[package]
name = "llamenos-core"
version = "0.2.0"
edition = "2021"
description = "Shared cryptographic core for Llamenos — Ed25519/X25519, HPKE (RFC 9180), AES-256-GCM, sigchain"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Llamenos-Hotline/llamenos-platform"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Ed25519 signing
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }

# X25519 key agreement
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }

# HPKE: DHKEM(X25519, HKDF-SHA256) + HKDF-SHA256 + AES-256-GCM
hpke = { version = "0.13", default-features = false, features = ["x25519", "alloc"] }

# AES-256-GCM (standalone symmetric operations — PIN encryption, items_key)
aes-gcm = "0.10"

# Key derivation
hkdf = "0.12"
argon2 = "0.5"

# Hashing
sha2 = "0.10"
hmac = "0.12"

# Memory safety for key material
zeroize = { version = "1", features = ["derive"] }

# Unicode normalization (for blind index canonicalization)
unicode-normalization = "0.1"

# Date/time (for blind index epoch bucketing)
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

# Encoding
hex = "0.4"
base64 = "0.22"

# Randomness
rand = "0.8"
getrandom = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Constant-time comparison
subtle = "2"

# Error handling
thiserror = "2"

# UniFFI for Swift/Kotlin bindings
uniffi = { version = "0.31", optional = true }

# MLS (RFC 9420) — optional, behind the `mls` feature (see [features] below).
# Not required for notes/calls/messaging (all HPKE-based); pulls in the
# openmls -> hpke-rs -> libcrux dependency chain, which has carried aarch64
# constant-time advisories (RUSTSEC-2026-0212, -0207, -0208) affecting every
# shipped iOS/Android build when compiled in unconditionally. Gated so mobile
# and server builds exclude it unless a consumer opts in.
# openmls 0.9 -> openmls_rust_crypto 0.6 -> hpke-rs 0.7 pins the patched
# libcrux releases (libcrux-sha3 =0.0.10, libcrux-traits =0.0.8 ->
# libcrux-secrets =0.0.6), resolving those advisories for `mls` opt-in builds.
openmls = { version = "0.9", features = ["openmls_rust_crypto"], optional = true }
openmls_rust_crypto = { version = "0.6", optional = true }
openmls_basic_credential = { version = "0.6", optional = true }

[features]
default = []
server = []
# test-kdf: Use fast Argon2id parameters (m=8KB, t=1, p=1) instead of production
# params (m=64MB, t=3, p=4). SECURITY: This feature MUST ONLY be enabled in test/debug
# builds — never in release builds shipped to users. It reduces KDF brute-force
# resistance from ~seconds to ~microseconds per guess.
test-kdf = []
mobile = ["dep:uniffi"]
uniffi-bindgen = ["mobile", "uniffi/cli"]
# mls: Enable OpenMLS-backed hub-state group messaging (src/mls.rs). Default-off.
# See packages/crypto/CLAUDE.md#feature-flags for the security rationale.
mls = ["dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["uniffi-bindgen"]


[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# UniFFI bindgen needs unstripped binary to read metadata symbols.
# Use this profile when generating bindings: cargo build --profile release-bindgen
[profile.release-bindgen]
inherits = "release"
strip = false

# Android emulator (test-kdf, x86_64) build: optimized like release, but keeps
# debug_assertions on so the C-M3 compile-time guard in kdf_params.rs can tell
# this apart from a real release build shipped to production devices.
[profile.emulator]
inherits = "release"
debug-assertions = true
