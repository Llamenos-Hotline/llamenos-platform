# Boot the BUILT app image against PostgreSQL 17 — on the runner's CPU and on
# a KVM guest whose virtual CPU model hides SSE4.2 (-cpu kvm64) — whenever
# something that changes the image's runtime changes (notably Dependabot bumps
# of the oven/bun base image).
#
# The release gate is the same pair of smokes in release.yml's `docker-stable`
# job, which blocks the publish; this workflow is the earlier, PR-time signal.
# Why the masked-CPU run exists: see the "simdutf kernel pin" block in
# deploy/docker/Dockerfile and scripts/image-smoke.sh.
name: Image Smoke

on:
  pull_request:
    paths:
      - 'deploy/docker/Dockerfile'
      - 'deploy/docker/docker-entrypoint.sh'
      - 'deploy/docker/docker-compose.yml'
      - 'scripts/image-smoke.sh'
      - 'scripts/verify-runtime.ts'
      - 'scripts/run-migrations.ts'
      - 'drizzle/migrations/**'
      - 'bun.lockb'
      - '.github/workflows/image-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # OCI registries reject a mixed-case repository path outright
      # ("repository name must be lowercase"), and `github.repository`
      # carries the owner's *display* casing — `Llamenos-Hotline/...` since
      # the org move. The fold has to happen in a `run:` block: neither
      # `${{ }}` expressions nor the `with:` input below have a lowercase
      # function, so `${VAR,,}` at the use site would be inert there.
      # Emitting a single already-folded output is what keeps this from
      # drifting back — `cache-from` cannot reach the raw value at all.
      #
      # This one is the quiet case: the cache import is a soft dependency,
      # so an invalid ref here does not fail the job, it just silently costs
      # a full rebuild on every PR that touches the Dockerfile.
      - name: Compute cache image reference
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: app
          load: true
          push: false
          tags: llamenos-image-smoke:${{ github.sha }}
          # Read-only import of the public cache docker-buildcache.yml keeps
          # warm; never exported from here.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache

      - name: Smoke image against PostgreSQL 17 (runner CPU)
        env:
          IMAGE: llamenos-image-smoke:${{ github.sha }}
        run: scripts/image-smoke.sh "$IMAGE"

      - name: Enable KVM for the CPUID-masked smoke
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils genisoimage

      - name: Smoke image on a CPUID-masked KVM guest (-cpu kvm64)
        env:
          IMAGE: llamenos-image-smoke:${{ github.sha }}
        run: scripts/image-smoke.sh --cpu kvm64 "$IMAGE"
