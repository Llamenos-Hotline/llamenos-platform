name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
  # Ruleset 15885614 requires `gitleaks` as a status check on the merge
  # queue's own ref too. A required context that never reports on
  # `merge_group` blocks the queue forever (same failure mode `fleet/verify`
  # and `ci-status` were fixed for in ci.yml — see the "Fleet gates" comment
  # there). `fetch-depth: 0` below already gives gitleaks the full history it
  # needs regardless of which ref triggered the run.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  # Pin the scanner the same way every action in this repo is pinned. Bump
  # both together; the checksum is from the release's `*_checksums.txt`.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # The check-run name the ruleset requires is this job's name, `gitleaks`.
  # BOTH scan steps below live in this one job precisely so the reported
  # context is byte-identical on every event: a step-level `if:` selects the
  # scanner, it never changes the check name and it never skips the job.
  gitleaks:
    # gitleaks-action uploads its SARIF artifact with $HOME as the artifact
    # root directory. On the self-hosted runner $HOME (/home/runner) is not a
    # parent of the work directory (/opt/runner-llamenos-*/_work/...), so the
    # upload throws even when no leaks are found. Keep this job hosted.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # `push` / `pull_request`: keep the action, which adds PR annotations
      # and a SARIF upload on top of the scan.
      - name: Run gitleaks
        if: github.event_name != 'merge_group'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `merge_group`: gitleaks-action hard-errors with
      #   "ERROR: The [merge_group] event is not yet supported"
      # (run 36303839160 on the queue's first entry, #1181). The action is a
      # thin wrapper — the scanner binary does not care which event invoked
      # it — so drive the binary directly here.
      #
      # This must NOT become a job-level `if:` that skips on merge_group:
      # per #848, branch protection treats a skipped required check exactly
      # like a green one, which would turn the required secret scan into a
      # fail-open on every queued merge.
      #
      # Scope matches what the action scans for a PR: the commit range the
      # merge group adds on top of its base. `--first-parent`/`--no-merges`
      # (which gitleaks-action passes on push/PR) are deliberately omitted —
      # a merge-group ref's first-parent lineage is the base branch, so those
      # flags would walk straight past the very commits under review.
      # A git-range scan also keeps `.gitleaksignore` working: its
      # fingerprints are `commit:file:rule:line`, which a worktree
      # (`gitleaks dir`) scan cannot match.
      - name: Run gitleaks (merge_group)
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

          # An empty range would scan nothing and pass — that is a fail-open,
          # not a clean bill of health. Refuse instead.
          commits="$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")"
          echo "Scanning ${commits} commit(s) in ${BASE_SHA}..${HEAD_SHA}"
          if [ "${commits}" -eq 0 ]; then
            echo "::error::merge_group range ${BASE_SHA}..${HEAD_SHA} is empty; refusing to report a scan that examined nothing."
            exit 1
          fi

          /tmp/gitleaks git . \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --verbose
