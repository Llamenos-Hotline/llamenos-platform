name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
  # Ruleset 15885614 requires `gitleaks` as a status check on the merge
  # queue's own ref too. A required context that never reports on
  # `merge_group` blocks the queue forever (same failure mode `fleet/verify`
  # and `ci-status` were fixed for in ci.yml — see the "Fleet gates" comment
  # there). `fetch-depth: 0` below already gives gitleaks the full history it
  # needs regardless of which ref triggered the run.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  # Pin the scanner the same way every action in this repo is pinned. Bump
  # both together; the checksum is from the release's `*_checksums.txt`.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # The check-run name the ruleset requires is this job's name, `gitleaks`.
  # BOTH scan steps below live in this one job precisely so the reported
  # context is byte-identical on every event: a step-level `if:` selects the
  # scanner, it never changes the check name and it never skips the job.
  gitleaks:
    # Hosted, deliberately. The former gitleaks-action uploaded a SARIF
    # artifact rooted at $HOME, which is not a parent of the self-hosted
    # runners' work directory, so the upload threw even with no leaks found.
    # The action is gone now, but hosted is still right: this job needs no
    # warm cache, and a public repo gets hosted minutes free.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # The gitleaks BINARY, on every event — the `gitleaks/gitleaks-action`
      # wrapper is gone. Two independent reasons it had to go:
      #
      # 1. LICENSING. The action is free for individual accounts and requires
      #    a paid licence for organisations. When this repo transferred to the
      #    `Llamenos-Hotline` org it began failing every run with
      #    "[Llamenos-Hotline] is an organization. License key is required."
      #    Since `gitleaks` is a REQUIRED status check, that froze merges
      #    repo-wide. The scanner itself is MIT and free; only the wrapper is
      #    licensed.
      # 2. It hard-errors on `merge_group` ("The [merge_group] event is not
      #    yet supported" — run 36303839160, the merge queue's first entry),
      #    so a queued merge could never satisfy the same required check.
      #
      # Driving the binary directly fixes both, removes a paid dependency, and
      # takes one third-party action out of a security-critical path. Pinned by
      # version and verified by SHA-256 rather than trusting the tarball.
      #
      # This must NOT become a job-level `if:` that skips on any event: per
      # #848, branch protection treats a skipped required check exactly like a
      # green one, which would turn the required secret scan into a fail-open.
      - name: Run gitleaks
        env:
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

          # Range per event. `--first-parent`/`--no-merges` are deliberately
          # NOT used: on a merge-group ref the first-parent lineage is the base
          # branch, so those flags walk straight past the commits under review.
          # A git-range scan also keeps `.gitleaksignore` working — its
          # fingerprints are `commit:file:rule:line`, which a worktree
          # (`gitleaks dir`) scan can never match.
          case "${GITHUB_EVENT_NAME}" in
            merge_group)   base="${MG_BASE}";     head="${MG_HEAD}" ;;
            pull_request)  base="${PR_BASE}";     head="${PR_HEAD}" ;;
            push)          base="${PUSH_BEFORE}"; head="${PUSH_AFTER}" ;;
            *)             base="";               head="${GITHUB_SHA}" ;;
          esac

          # A push that creates a branch reports an all-zero `before`, and
          # workflow_dispatch has no range at all. Scan the full history
          # rather than silently scanning nothing.
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base for event ${GITHUB_EVENT_NAME}; scanning full history."
            /tmp/gitleaks git . --redact --verbose
            exit $?
          fi

          # An empty range would scan nothing and pass — that is a fail-open,
          # not a clean bill of health. Refuse instead.
          commits="$(git rev-list --count "${base}..${head}")"
          echo "Scanning ${commits} commit(s) in ${base}..${head}"
          if [ "${commits}" -eq 0 ]; then
            echo "::error::range ${base}..${head} is empty; refusing to report a scan that examined nothing."
            exit 1
          fi

          /tmp/gitleaks git . \
            --log-opts="${base}..${head}" \
            --redact \
            --verbose
