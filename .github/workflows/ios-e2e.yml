# iOS E2E Tests (XCUITest)
#
# Build once, test in 4 parallel shards on macOS runners.
# Each shard gets its own isolated test hub for proper isolation.
# Triggered on push to main/desktop and on pull requests.

name: iOS E2E

# DISABLED on push/pull_request until #661 is resolved: the backend bootstrap
# needs Docker, which GitHub-hosted macOS runners do not provide, so every
# shard fails (exit 125) regardless of the change under test. Under the
# "no red check" merge rule a check that cannot pass must be switched off
# deliberately rather than merged around. Re-enable the triggers below in the
# PR that closes #661.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ios-e2e-pr-{0}', github.ref) || format('ios-e2e-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}  # deny-all; per-job permissions below

env:
  BUN_VERSION: "1.3.5"
  TEST_ADMIN_PUBKEY: "79215a4c04f08fcd817c6f820c87169beb8cddf96dfa590a1315556b78af9183"

jobs:
  # ─── Detect Changed Files ─────────────────────────────────────
  # Delegates to the SAME path map ci.yml's `changes` job uses — see
  # .github/scripts/detect-changed-platforms.sh for the single source of
  # truth (#664). Consolidated from what used to be this workflow's own
  # `ios_related` regex. This workflow stays on `workflow_dispatch` only
  # (see the header comment above `on:`) — that is an independent, deliberate
  # decision pending #661, unrelated to the path-map consolidation here.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Same guard, same scoping fix as ci.yml's `changes` job (#812) — kept in
    # sync even though this workflow's `on:` block is currently
    # `workflow_dispatch` only (#661), so `github.event_name` here is never
    # `push` today. Fixing it anyway so re-enabling `pull_request`/`push`
    # later doesn't silently reintroduce the bug this job was copy-pasted
    # from.
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')"

    outputs:
      ios_related: ${{ steps.filter.outputs.ios }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          if [[ -z "$BASE" ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD^"
          fi
          if [[ -z "$HEAD" ]] || ! git cat-file -e "$HEAD" 2>/dev/null; then
            HEAD="HEAD"
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files ($BASE..$HEAD):"
          echo "$CHANGED"

          printf '%s\n' "$CHANGED" | bash .github/scripts/detect-changed-platforms.sh | tee -a "$GITHUB_OUTPUT"

  # ─── Build App + Backend Once ──────────────────────────────────
  ios-e2e-build:
    needs: changes
    if: needs.changes.outputs.ios_related == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 45

    outputs:
      simulator: ${{ steps.sim.outputs.device }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun (for codegen)
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies and run codegen
        run: bun install --frozen-lockfile && bun run codegen && bun run i18n:codegen

      # Fails fast, before the expensive XCFramework/simulator build, the
      # moment a test references an accessibility identifier the app no
      # longer defines anywhere (see #755). New regressions fail the build;
      # pre-existing, unrelated stale identifiers are tracked in
      # stale-identifiers-baseline.txt so this doesn't block on debt this
      # check didn't introduce.
      - name: Check for stale accessibility identifiers in iOS UI tests
        run: python3 apps/ios/scripts/check-stale-identifiers.py

      # Cache the XCFramework AND generated Swift bindings together.
      # Both must come from the same Rust build or checksums will mismatch.
      - name: Cache crypto XCFramework + bindings
        id: xcframework-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/LlamenosCoreFFI.xcframework
            packages/crypto/dist/ios/LlamenosCore.swift
          key: xcframework-v2-ios-${{ runner.os }}-${{ hashFiles('packages/crypto/src/**/*.rs', 'packages/crypto/Cargo.toml', 'packages/crypto/Cargo.lock', 'packages/crypto/scripts/build-mobile.sh') }}

      - name: Install Rust stable (for crypto xcframework)
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/crypto

      - name: Build crypto XCFramework
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        run: |
          cd packages/crypto
          ./scripts/build-mobile.sh ios
          cp -r dist/ios/LlamenosCoreFFI.xcframework ../../apps/ios/

      - name: Copy UniFFI bindings (from build or cache)
        run: |
          cp packages/crypto/dist/ios/LlamenosCore.swift apps/ios/Sources/Generated/LlamenosCore.swift

      - name: Check for hardcoded secrets in Swift source
        run: |
          if grep -rE '[0-9a-f]{64}' apps/ios/Sources/ --include="*.swift" | grep -v 'gitleaks:allow'; then
            echo "ERROR: Potential hardcoded hex secret found in iOS source"
            exit 1
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Detect simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data.get('devices', {}).items(), reverse=True):
              if 'iOS' in runtime:
                  for d in devices:
                      if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                          print(d['name'])
                          sys.exit(0)
          print('iPhone 16')
          ")
          echo "device=$SIM" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM"

      - name: Build app for testing
        working-directory: apps/ios
        run: |
          xcodebuild build-for-testing \
            -project Llamenos.xcodeproj \
            -scheme Llamenos \
            -configuration UITesting \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath /tmp/llamenos-build \
            -parallelizeTargets \
            EAGER_LINKING=YES \
            DEBUG_INFORMATION_FORMAT=dwarf

      - name: Upload test build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-e2e-build-${{ github.run_id }}
          path: |
            /tmp/llamenos-build/Build/Products/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - name: Build backend bundle
        run: bun run build:server

      - name: Upload backend bundle + tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-e2e-backend-${{ github.run_id }}
          path: |
            dist/server/
            scripts/run-migrations.ts
            node_modules/
            bun.lockb
            package.json
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  # ─── Run E2E Tests (4 Shards) ─────────────────────────────────
  ios-e2e:
    needs: [changes, ios-e2e-build]
    if: needs.changes.outputs.ios_related == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout (for test file discovery)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download test build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.7
        with:
          name: ios-e2e-build-${{ github.run_id }}
          path: /tmp/llamenos-build/Build/Products/
          if-no-files-found: error

      - name: Download backend bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.7
        with:
          name: ios-e2e-backend-${{ github.run_id }}
          path: .
          if-no-files-found: error

      - name: Detect simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data.get('devices', {}).items(), reverse=True):
              if 'iOS' in runtime:
                  for d in devices:
                      if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                          print(d['name'])
                          sys.exit(0)
          print('iPhone 16')
          ")
          echo "device=$SIM" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM"

      # ─── Docker (not pre-installed on macOS runners) ───────────
      - name: Setup Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0

      # ─── Start Backend Services ────────────────────────────────
      - name: Bootstrap backend
        uses: ./.github/actions/bootstrap-backend
        with:
          admin_pubkey: ${{ env.TEST_ADMIN_PUBKEY }}

      - name: Disable macOS firewall for tests
        run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

      # ─── Create Test Hub for This Shard ────────────────────────
      - name: Create test hub for shard ${{ matrix.shard }}
        id: hub
        run: |
          RESPONSE=$(curl -s -X POST http://127.0.0.1:3000/api/test-create-hub \
            -H "Content-Type: application/json" \
            -H "X-Test-Secret: test-reset-secret" \
            -d "{\"name\":\"ios-e2e-shard-${{ matrix.shard }}\",\"description\":\"iOS E2E test hub for shard ${{ matrix.shard }}\"}")
          echo "Response: $RESPONSE"
          HUB_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$HUB_ID" ]; then
            echo "::error::Failed to create test hub"
            exit 1
          fi
          echo "hub_id=$HUB_ID" >> "$GITHUB_OUTPUT"
          echo "Created hub $HUB_ID for shard ${{ matrix.shard }}"

      # ─── Determine Tests for This Shard ────────────────────────
      - name: Collect UI test classes for this shard
        id: shard-tests
        run: |
          # Find all UI test files and sort them
          TEST_FILES=($(find apps/ios/Tests/UI -name "*UITests.swift" -o -name "*Tests.swift" | grep -v "BaseUITest.swift" | sort))
          TOTAL=${#TEST_FILES[@]}
          echo "Total UI test files: $TOTAL"

          SHARD_ID=${{ matrix.shard }}
          TOTAL_SHARDS=${{ strategy.job-total }}

          # Build -only-testing arguments for tests assigned to this shard
          ONLY_TESTING_ARGS=""
          IDX=0
          for file in "${TEST_FILES[@]}"; do
            if [ $((IDX % TOTAL_SHARDS)) -eq "$SHARD_ID" ]; then
              CLASS_NAME=$(basename "$file" .swift)
              ONLY_TESTING_ARGS="${ONLY_TESTING_ARGS} -only-testing:LlamenosUITests/${CLASS_NAME}"
              echo "Shard ${SHARD_ID}: ${CLASS_NAME}"
            fi
            IDX=$((IDX + 1))
          done

          echo "tests=${ONLY_TESTING_ARGS}" >> "$GITHUB_OUTPUT"

      # ─── Run XCUITests for This Shard ──────────────────────────
      - name: Run XCUITests (shard ${{ matrix.shard }})
        working-directory: apps/ios
        run: |
          xcodebuild test-without-building \
            -xctestrun $(find /tmp/llamenos-build/Build/Products -name "*.xctestrun" -print -quit) \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -parallel-testing-enabled NO \
            ${{ steps.shard-tests.outputs.tests }}
        env:
          TEST_HUB_ID: ${{ steps.hub.outputs.hub_id }}
          TEST_HUB_URL: http://localhost:3000

      - name: Show backend runtime logs
        if: ${{ !cancelled() }}
        run: cat /tmp/backend.log || true

      # ─── Upload Test Results ───────────────────────────────────
      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ios-e2e-results-shard-${{ matrix.shard }}
          path: |
            /tmp/llamenos-build/Logs/Test/
            apps/ios/build/reports/
          retention-days: 7

      - name: Tear down Docker Compose
        if: always()
        run: |
          docker compose --env-file .env \
            -f deploy/docker/docker-compose.yml \
            -f deploy/docker/docker-compose.test.yml \
            down -v 2>/dev/null || true

      - name: Stop backend services
        if: always()
        run: |
          pkill -f "bun dist/server/index.js" || true
          pkill -f rustfs || true
          pg_ctl -D /tmp/pgdata stop 2>/dev/null || true
