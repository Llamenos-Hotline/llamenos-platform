# iOS E2E — the LlamenosUITests (XCUITest) target against a live backend.
#
# Called by ci.yml's `ios-e2e` job whenever a change touches iOS paths, which
# puts it inside the `ci-status` required aggregate: a failing UI test blocks
# the merge. Also runnable by hand (workflow_dispatch) for a full re-run.
#
# History this replaces (#661, #1221): from 2026-05-04 (#168) the UI target was
# not a member of the `Llamenos` scheme's test action, so `build-for-testing`
# produced no UI test bundle; from 2026-05-10 the backend came from Docker
# Compose, which GitHub-hosted macOS runners do not have (exit 125); from
# 2026-09-12 (#682) the workflow was `workflow_dispatch`-only. For those four
# months no iOS UI test ran anywhere in CI, while the coverage validator
# credited scenarios to them.
#
# Shape: one job builds the app + UI test bundle once (UITesting
# configuration, so the UI_TESTING launch hooks exist) and the server crypto
# library; N shard jobs each start a native backend
# (apps/ios/scripts/native-backend.sh — Homebrew PostgreSQL + `bun`, no
# Docker) and run a disjoint, count-balanced slice of the test classes
# (apps/ios/scripts/ui-tests.py). No retries: a flaky test is a failing test.

name: iOS E2E

on:
  workflow_call:
    inputs:
      include-quarantined:
        description: Also run the tests listed in apps/ios/Tests/UI/ci-quarantine.txt
        type: boolean
        default: false
      tier:
        description: >-
          full (all 326 tests, 4 shards) or smoke (the ci-smoke.txt classes,
          2 shards). ci.yml passes the tier detect-changed-platforms.sh chose;
          anything that can rebuild the iOS binary gets full. Defaults to full,
          so an unset or unrecognised value never silently narrows the gate.
        type: string
        default: full
  workflow_dispatch:
    inputs:
      include-quarantined:
        description: Also run the tests listed in apps/ios/Tests/UI/ci-quarantine.txt
        type: boolean
        default: true
      tier:
        description: full (all tests) or smoke (ci-smoke.txt classes only)
        type: choice
        options: [full, smoke]
        default: full
      take-screenshots:
        description: >-
          Also run the ci-non-gating.txt classes (ScreenshotAuditTests) and
          publish their screenshots as an artifact. Off by default and
          available ONLY here — not on workflow_call, so ci.yml cannot turn it
          on, and not on schedule, which supplies no inputs. Those 42 methods
          contain no assertions and took ~20 minutes of merge-gate critical
          path to produce attachments nobody ever collected.
        type: boolean
        default: false
  # ci.yml's `ios` flag is set by apps/ios/ and shared dependencies, not by
  # apps/worker/ or src/server/ — so a backend-only PR that breaks the iOS
  # client's API contract never runs this suite. The nightly run on main
  # catches that within a day. It also runs the quarantined tests, so each
  # quarantined defect stays visible daily until it is fixed.
  #
  # "Visible" means the `report` job at the bottom of this file: a red scheduled
  # run opens one `[nightly-ios-e2e]` issue (#2057). Until it existed this run
  # was red on every night from the first, 2026-09-29, and nobody was told.
  schedule:
    - cron: "17 3 * * *"

permissions: {}  # deny-all; per-job permissions below

env:
  BUN_VERSION: "1.3.5"

jobs:
  # The same classification as ci.yml's `changes` job — the one shared path map
  # (.github/scripts/detect-changed-platforms.sh, #664) behind the same
  # push-scoped release-commit guard (#812). Called from ci.yml it agrees with
  # the gate that already decided to call this workflow; the nightly schedule
  # and a manual dispatch run the suite whatever changed (see `build`).
  build:
    name: build
    # No `needs:` and no `if:` — deliberately. This workflow used to open with
    # its own `changes` job computing an `ios_related` flag that gated this
    # one. That flag could never be false when it mattered: ci.yml already
    # gates the whole `uses:` call on `changes.outputs.ios == 'true'`, and the
    # `schedule` / `workflow_dispatch` paths ran regardless via the same
    # condition's `||` arms. It was a second copy of a decision already made,
    # and it cost a serialised ubuntu job before any macOS work could start.
    #
    # Measured on one merge-queue run: the run was created at 20:13:30,
    # `changes` started 20:13:55 and finished 20:14:04, and `build` could not
    # start until 20:14:07 — where android-e2e's shards were already working
    # at 20:13:46. Deleting it lets the build dispatch immediately, which is
    # what pulls the whole iOS gate forward.
    # The Mac mini, not `macos-latest`. Runners `mac-mini-ios-1` and `-2`
    # serve; 3 and 4 are registered but deliberately not running (four
    # shards on this host completed zero tests in 20 minutes).
    #
    # GitHub's macOS concurrency cap is 5 jobs REPO-WIDE, and money does not
    # move it: Free, Pro and Team are all 5 (only Enterprise Cloud is 50),
    # and larger runners share the same 5 while being billed even on public
    # repos. Hardware we already own is the only lever that adds capacity.
    #
    # This job is the one worth moving first. It gates everything — the four
    # `ui` shards cannot start until it finishes — so whenever it queues for
    # a macOS slot, the entire iOS gate queues behind it. It is also the only
    # macOS job here that needs no Docker, no sudo and no booted simulator,
    # which is what makes it safe to co-tenant today.
    #
    # Built ONCE PER RUNNER CLASS, because a test bundle cannot cross between
    # them. The Mac mini is on Xcode 27.0 with only the iOS 26.5 simulator
    # runtime; GitHub's macOS image is on Xcode 26.6. An `.xctestrun` is bound
    # to the SDK it was built against, so a Mac-built bundle will not run on a
    # hosted simulator (or vice versa). The two builds run concurrently on
    # different hardware, so this costs no wall-clock — only a second hosted
    # macOS slot for ~4 minutes.
    #
    # The alternative, building once and running everywhere, is what the
    # artifact names below used to imply. It cannot work across two Xcode
    # versions, and failing that way would look like a test bug rather than a
    # toolchain mismatch.
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.tier == 'smoke' && '["mac"]' || '["mac", "hosted"]') }}
    runs-on: ${{ matrix.host == 'mac' && fromJSON('["self-hosted", "macOS", "ARM64", "ios-e2e"]') || 'macos-15' }}
    permissions:
      contents: read
    # 45 minutes for the build itself (measured max 10.0 over 71 green Mac
    # builds), PLUS the disk guard's 36-minute step cap below. The guard's
    # wait must not come out of the build's own budget: a wait that ends in a
    # pass at minute 35 would otherwise leave the build 10 minutes, and turn
    # an honest fast refusal into a timeout cancellation.
    timeout-minutes: 81

    steps:
      # MANDATORY, and must stay the literal first step: this job now runs on
      # a machine the operator owns, so a fork PR's code must never reach it
      # — before the checkout, before anything else. Same guard, same
      # reasoning, as the one fronting `fleet/review` (see fleet-review.yml).
      # The repo's fork-PR approval policy (`all_external_contributors`) is
      # the first layer; this is the second, because a policy is a setting
      # someone can change and this is not.
      #
      # WHY THIS IS NOT DEAD CODE, since it reads like it might be. This file
      # has no `pull_request` trigger of its own — it is reached via
      # `workflow_call` from ci.yml. It is a reasonable assumption that
      # `github.event_name` is therefore `workflow_call` and that
      # `github.event.pull_request` is absent, which would make this guard
      # inert. It is not: for a REUSABLE workflow the `github` context is the
      # CALLER's, so a run invoked from ci.yml's `on: pull_request` sees
      # `event_name == 'pull_request'` with the full PR payload.
      # `workflow_call` appears in `github.event_name` only when a workflow is
      # itself triggered by an external `workflow_call` event, never when it is
      # invoked via `uses:`.
      #
      # Measured, not assumed — run 36761873368, this job's own log:
      #     EVENT_NAME: pull_request
      #     HEAD_REPO:  Llamenos-Hotline/llamenos-platform
      #     THIS_REPO:  Llamenos-Hotline/llamenos-platform
      # The `changes` job in this same file has relied on the same property
      # since before these runners existed (`case "$EVENT_NAME" in`), and would
      # have been misclassifying every PR if it did not hold.
      #
      # A `fleet/review` pass rejected this guard as dead code on exactly that
      # assumption. The comment is here so the next reader does not have to
      # re-derive it — and if you are about to "fix" this by removing the
      # event_name check, read the log above first.
      - name: Refuse to run on a fork PR (self-hosted runner guard)
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$THIS_REPO" ]]; then
            echo "::error::ios-e2e/build FAILED: fork-pr-guard — this job runs on a self-hosted runner and must never process a fork PR (head repo '$HEAD_REPO' != '$THIS_REPO')"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Disk headroom, before anything expensive and before this job creates a
      # simulator or a build product.
      #
      # #1665: this host's shared data volume filled up mid-run and the runner
      # AGENT died — not the job — throwing `IOException: No space left on
      # device` from its own `_diag` tracing writer. Both agents on the host
      # went within one second of each other, because they share one volume.
      # The consequence is why this step is worth a minute of every iOS job:
      # no job log was uploaded at all (`BlobNotFound`), every step from the
      # test onward recorded a `null` conclusion, and the merge queue ejected
      # a PR that needed no code change — with the only evidence in the
      # check-run annotations. A job that REFUSES is a red check somebody can
      # read; an agent that crashes produces nothing.
      #
      # The same step reclaims, and that half has to live HERE rather than in
      # a teardown step: a crashed or cancelled job runs no `if: always()`, so
      # its simulator (2.4-2.6 GiB of device data, measured) leaks permanently
      # and the volume ratchets down ~5 GiB per incident. Job start is the only
      # point guaranteed to run however the previous job died — the same
      # reasoning #1639 applies to the backend port it leaks for the same
      # reason. It deletes only what it can prove CI created; read the script
      # header for what it refuses to touch and why.
      #
      # A no-op on a GitHub-hosted runner: that VM is thrown away after the
      # job and shares nothing with anybody.
      #
      # A refusal WAITS while another CI job on this host is still running,
      # because that job's teardown is what returns the space: a `ui` shard
      # deletes a 2.4-2.6 GiB simulator and its build products, a build
      # deletes its DerivedData. Refusing at once is the wrong failure when
      # the shortfall is a co-tenant that will be gone in minutes.
      #
      # Measured, 2026-10-18 15:44-15:47 UTC: with one `ui (3)` holding the
      # disk on mac-mini-ios-1, mac-mini-ios-2 refused SIX jobs from three
      # merge groups in under three minutes (10.8-10.9 GiB free, 12 needed),
      # ~15 s each. A runner that refuses in seconds immediately takes the next
      # queued job and refuses that too, so one co-tenant drained the queue
      # and ejected all three PRs. That `ui (3)` finished at 15:48:02, two
      # minutes after the last refusal.
      #
      # With NO other CI job on the host there is nothing to wait for, and
      # the refusal is immediate, as before: the space is held by something
      # only a human can free.
      #
      # 35 minutes covers a whole `ui` shard (p90 29 min over 122 Mac shards)
      # plus its teardown. A queued or waiting job still spends the merge
      # queue's 240-minute check_response_timeout: a merge-group run's iOS
      # leg finishes at p90 72 min, so a full wait leaves it under ~110.
      #
      # The job's timeout-minutes is 45 + this step's cap, so the build that
      # follows a full wait still has its whole 45. Change them together.
      - name: Guard the runner's disk headroom (wait out a co-tenant)
        timeout-minutes: 36
        env:
          DISK_WAIT_MAX_MIN: "35"
          DISK_WAIT_POLL_SEC: "60"
        run: |
          set -uo pipefail
          # This runner's install root, so its own Runner.Worker is not
          # mistaken for a co-tenant: .../actions-runner-ios-1/_work/<repo>.
          own_root="${RUNNER_WORKSPACE%%/_work/*}"
          deadline=$(( SECONDS + DISK_WAIT_MAX_MIN * 60 ))
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            # Each attempt's summary goes to a scratch file and only the last
            # one is published, so a wait that ends well leaves no stale
            # REFUSED line in the job summary.
            : > "$RUNNER_TEMP/disk-guard-summary.md"
            if GITHUB_STEP_SUMMARY="$RUNNER_TEMP/disk-guard-summary.md" \
                bash scripts/ci/mac-runner-disk-guard.sh guard >"$RUNNER_TEMP/disk-guard.log" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            others=$(pgrep -fl '/bin/Runner.Worker' 2>/dev/null | grep -vF "$own_root/" | grep -c . || true)
            if [ "$rc" -eq 0 ] || [ "$others" -eq 0 ] || [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/disk-guard.log"
              cat "$RUNNER_TEMP/disk-guard-summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              waited="$((attempt - 1)) x ${DISK_WAIT_POLL_SEC}s"
              if [ "$rc" -eq 0 ]; then
                [ "$attempt" -eq 1 ] || echo "disk headroom passed on attempt $attempt, after waiting $waited for a co-tenant CI job's teardown"
              elif [ "$others" -gt 0 ]; then
                echo "::error::still refused after waiting $waited for $others co-tenant CI job(s) on this host to release space"
              elif [ "$attempt" -gt 1 ]; then
                echo "::error::still refused after waiting $waited: every co-tenant CI job has finished and the space did not come back, so what holds it is not CI's"
              fi
              exit "$rc"
            fi
            # Not `::warning::` — a wait that ends in a pass is not a problem.
            echo "disk headroom short (attempt $attempt): $(grep -o 'only [0-9.]* GiB free' "$RUNNER_TEMP/disk-guard.log" | head -1); $others other CI job(s) on this host will release space at teardown; re-checking in ${DISK_WAIT_POLL_SEC}s ($(( (deadline - SECONDS) / 60 )) min left)"
            sleep "$DISK_WAIT_POLL_SEC"
          done

      # bun's install temp dir is BUN_TMPDIR, and it must be per-runner. This
      # step exists in every job that can land on the self-hosted Mac — here,
      # `ui` below, and ci.yml's ios-build-test — before its first bun step,
      # and tests/guards.test.ts fails CI if one is missing or out of order.
      #
      # bun 1.3.5 on macOS does NOT read TMPDIR for `bun install`: its temp
      # dir is `BUN_TMPDIR orelse "/private/tmp"` (src/fs.zig,
      # getDefaultTempDir). So both runners on the host install into ONE
      # /private/tmp, where bun writes a node-gyp shim dir named
      # `.<hex(now_ns | 12345)>-00000001.node-gyp`. macOS's realtime clock is
      # microsecond-resolution and the OR folds neighbouring microseconds
      # together, so two installs that reach that point in the same instant
      # compute the SAME name; APFS then fails the loser's
      # create-inside-the-new-dir with ENOENT, and bun dies with
      # `error: FileNotFound creating node-gyp tempdir`. The two jobs of one
      # merge group do reach it in the same instant: #1910's `ui (0)`/`ui (3)`
      # started `bun install` 2 µs apart, #1916's ios-build-test/build 43 ms
      # apart, and each time /private/tmp holds ONE shim dir where every other
      # run left two. A same-name race of exactly bun's syscall sequence fails
      # one side 3000/3000 times on that host, 0/3000 with separate parents,
      # 0/500 staggered by 5 ms, and 0/2000 on Linux.
      #
      # #1919 pinned TMPDIR on these steps for the same error, which bun
      # never reads here, so it changed nothing; #1916 was ejected with it in
      # place. RUNNER_TEMP is per-runner and emptied between jobs, and it is
      # on the same APFS volume as ~/.bun/install/cache, so bun's
      # extract-then-rename into the cache still works. Were it not, bun would
      # fall back to <cache>/.tmp — shared by both runners again.
      #
      # Exported through GITHUB_ENV so every later step inherits it, including
      # scripts that run bun internally: a per-step pin is only as good as the
      # list of steps someone remembered.
      - name: Give bun a per-runner temp dir
        run: |
          mkdir -p "$RUNNER_TEMP/bun-tmp"
          echo "BUN_TMPDIR=$RUNNER_TEMP/bun-tmp" >> "$GITHUB_ENV"

      # TMPDIR is still pinned on the bun/node steps: it is what node and
      # bun's own JS `os.tmpdir()` use, and keeping those files under
      # RUNNER_TEMP is the same co-tenancy rule as everything else here. It
      # is NOT what `bun install` uses — see the step above.
      #
      # `${{ runner.temp }}`, not `$RUNNER_TEMP`: an `env:` value is not
      # shell-expanded, and the `runner` context is only available at STEP
      # level — a job-level `env:` cannot read it.
      - name: Setup Bun (for codegen)
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies and run codegen
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun install --frozen-lockfile && bun run codegen && bun run i18n:codegen

      # Fails fast, before the expensive build, the moment a test references
      # an accessibility identifier the app no longer defines anywhere (#755).
      - name: Check for stale accessibility identifiers in iOS UI tests
        run: python3 apps/ios/scripts/check-stale-identifiers.py

      # Every test the merge gate skips must exist and name the issue that owns it.
      - name: Check the UI test quarantine
        run: python3 apps/ios/scripts/ui-tests.py check-quarantine

      # A smoke entry naming a deleted class would shrink the smoke tier
      # silently — the tier must fail loudly instead, like the quarantine does.
      - name: Check the UI smoke tier
        run: python3 apps/ios/scripts/ui-tests.py check-smoke

      # A class excused from the gate must make no claims. Without this, parking
      # a real test in ci-non-gating.txt would silently stop checking it — the
      # same silent-non-execution failure the file exists to avoid, not create.
      - name: Check the non-gating classes assert nothing
        run: python3 apps/ios/scripts/ui-tests.py check-non-gating

      # A Mac-pinned entry naming a deleted class would stop pinning it
      # silently, and the class would drift back onto hosted runners.
      - name: Check the Mac-pinned classes exist
        run: python3 apps/ios/scripts/ui-tests.py check-mac-shards

      # The packer prices every class per host (ci-timings.json), because one
      # host-blind figure predicted a 20s spread across shards that ran 834s
      # apart (#1873). These pin that behaviour, and the timings file's shape.
      - name: Test the shard packer
        run: python3 -m unittest discover -s apps/ios/scripts -p "test_*.py"

      # Cache the XCFramework AND generated Swift bindings together.
      # Both must come from the same Rust build or checksums will mismatch.
      - name: Cache crypto XCFramework + bindings
        id: xcframework-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/LlamenosCoreFFI.xcframework
            packages/crypto/dist/ios/LlamenosCore.swift
          key: xcframework-v2-ios-${{ runner.os }}-${{ hashFiles('packages/crypto/src/**/*.rs', 'packages/crypto/Cargo.toml', 'packages/crypto/Cargo.lock', 'packages/crypto/scripts/build-mobile.sh') }}

      # Needed on every run: the server crypto library (below) is built here
      # even when the XCFramework comes from cache.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/crypto

      - name: Build crypto XCFramework
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        run: |
          cd packages/crypto
          ./scripts/build-mobile.sh ios
          cp -r dist/ios/LlamenosCoreFFI.xcframework ../../apps/ios/

      - name: Copy UniFFI bindings (from build or cache)
        run: cp packages/crypto/dist/ios/LlamenosCore.swift apps/ios/Sources/Generated/LlamenosCore.swift

      # The backend's crypto goes through bun:ffi into this library
      # (packages/crypto/ffi.ts); the shards run the server natively.
      - name: Build server crypto library
        run: packages/crypto/scripts/build-server.sh

      # The runners on this box share one /opt/homebrew prefix, and
      # concurrent `brew install` against a shared prefix is not safe. This
      # is a no-op on the Mac mini (xcodegen 2.44.1 is installed) and still
      # installs normally anywhere it is genuinely absent.
      - name: Install xcodegen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      # Reuse a usable iPhone simulator when the host has one; CREATE one when
      # it has none. This step used to abort with "no available iPhone
      # simulator", which made every build depend on a persistent non-CI
      # device that nothing in the repo creates (#1875): when disk reclamation
      # removed it, the next merge-group build died here and ejected a healthy
      # PR from the queue.
      #
      # - ios-e2e-* devices are never reused. They are the `ui` shards' own
      #   transient devices (deleted at the end of their job), so a scan hit on
      #   one is a race, not a fixture.
      # - The device is created ONLY when the scan finds nothing. Creating one
      #   per run would leak a multi-GiB simulator every run and trip the
      #   12 GiB disk guard on the Mac. The fixture is deliberately NOT named
      #   ios-e2e-*: the operator sweep reaps those, so this one persists and
      #   the next run reuses it.
      # - The device type is found by ITERATING iPhone types (simctl lists
      #   them newest first) until `simctl create` accepts one. A regex +
      #   `head -1` once picked iPhone-18-Pro against the iOS 26.5 runtime
      #   and simctl refused ("Incompatible device", 403): types newer than
      #   the installed runtime are listed and unusable.
      # - Every refusal is logged, and exhausting the list fails the step with
      #   simctl's own stderr. A create that fails silently would leave the
      #   job dying later with a misleading message.
      - name: Detect or create simulator
        id: sim
        run: |
          set -euo pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data.get('devices', {}).items(), reverse=True):
              if 'iOS' in runtime:
                  for d in devices:
                      name = d.get('name', '')
                      is_iphone = 'iPhone' in d.get('deviceTypeIdentifier', '') or 'iPhone' in name
                      if d.get('isAvailable') and is_iphone and not name.startswith('ios-e2e-'):
                          print(name)
                          sys.exit(0)
          ")

          if [ -n "$SIM" ]; then
            echo "device=$SIM" >> "$GITHUB_OUTPUT"
            echo "Using existing simulator: $SIM (none created)"
            exit 0
          fi

          echo "No usable iPhone simulator on this host; creating one"
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rs = [r for r in json.load(sys.stdin)['runtimes']
                if r.get('isAvailable') and r.get('platform') == 'iOS']
          if not rs: sys.exit('no available iOS runtime')
          print(sorted(rs, key=lambda r: r['version'], reverse=True)[0]['identifier'])
          ")
          TYPES=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          ts = [t['identifier'] for t in json.load(sys.stdin)['devicetypes']
                if t.get('name', '').startswith('iPhone')]
          if not ts: sys.exit('simctl lists no iPhone device types')
          for t in ts:
              print(t)
          ")
          NAME="llamenos-build-fixture"
          ERR="$RUNNER_TEMP/simctl-create.err"
          UDID=""
          REASON=""
          for TYPE in $TYPES; do
            if UDID=$(xcrun simctl create "$NAME" "$TYPE" "$RUNTIME" 2>"$ERR"); then
              echo "Created simulator: $NAME ($UDID) from $TYPE on $RUNTIME"
              break
            fi
            UDID=""
            REASON=$(tr '\n' ' ' < "$ERR")
            echo "simctl refused $TYPE on $RUNTIME: $REASON"
          done
          if [ -z "$UDID" ]; then
            echo "::error::could not create an iPhone simulator on $RUNTIME; simctl refused every iPhone device type (last refusal: $REASON)"
            exit 1
          fi

          echo "device=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"

      # UITesting configuration: the UI_TESTING launch hooks the suite relies
      # on (--test-authenticated, --test-hub-url, ...) are compiled out of
      # every other configuration.
      - name: Build app + UI tests for testing
        working-directory: apps/ios
        run: |
          if ! xcodebuild build-for-testing \
              -project Llamenos.xcodeproj \
              -scheme Llamenos \
              -configuration UITesting \
              -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
              -derivedDataPath ${{ runner.temp }}/llamenos-build \
              -parallelizeTargets \
              EAGER_LINKING=YES \
              DEBUG_INFORMATION_FORMAT=dwarf \
              >"$RUNNER_TEMP/build-for-testing.log" 2>&1; then
            grep -E "error:" "$RUNNER_TEMP/build-for-testing.log" | head -50
            tail -40 "$RUNNER_TEMP/build-for-testing.log"
            exit 1
          fi
          grep -E "\*\* TEST BUILD" "$RUNNER_TEMP/build-for-testing.log"
          # The scheme regression this workflow was dark behind (#168): a
          # build that succeeds without producing the UI test runner.
          test -d ${{ runner.temp }}/llamenos-build/Build/Products/UITesting-iphonesimulator/LlamenosUITests-Runner.app \
            || { echo "::error::build-for-testing produced no LlamenosUITests-Runner.app"; exit 1; }

      # Named by run_id alone (no run_attempt): a partial re-run skips this
      # job (it already succeeded) and the `ui` shards must find the SAME
      # artifact name their attempt-1 build produced. `overwrite: true`
      # covers the other case — a FULL re-run, where this job runs again and
      # would otherwise collide with attempt-1's artifact under this name.
      - name: Upload test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-e2e-build-${{ matrix.host }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/llamenos-build/Build/Products/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload server crypto library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-e2e-server-crypto-${{ matrix.host }}-${{ github.run_id }}
          path: packages/crypto/dist/server/libllamenos_core.dylib
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      # A hosted runner is thrown away after the job; this one is not, and the
      # DerivedData tree is several GB per build. RUNNER_TEMP is unique per
      # runner and the runner clears it between jobs, so this is belt to that
      # braces rather than the only thing standing between us and a full disk.
      - name: Remove this build's DerivedData
        if: always()
        run: rm -rf "$RUNNER_TEMP/llamenos-build"

  ui:
    name: ui (${{ matrix.shard }})
    needs: build
    # Same self-hosted macOS runners as `build`. This is where the capacity
    # actually goes: GitHub's cap is 5 concurrent macOS jobs REPO-WIDE, so a
    # full-tier PR's four shards took FOUR of the repo's five slots and two
    # such PRs saturated everything. Here they take none.
    #
    # Everything a shard touches must be per-shard, because these four now
    # share one host instead of getting a VM each. Each one gets its own
    # simulator (created below, not "the first available iPhone" — which is
    # the same device for all four), its own backend HTTP and PostgreSQL
    # ports, and its own RUNNER_TEMP for every file that used to be a fixed
    # /tmp path.
    #
    # There is deliberately NO `concurrency:` group on the Mac jobs. The
    # runner pool already is the semaphore for this host: two runners, one
    # job each, and every excess job QUEUES for a runner rather than landing
    # on the box. Measured over 300 CI runs (101 h, 2026-10-14..19): never
    # more than 2 CI jobs on the host at once; queue wait p90 28 min, max 83.
    # One full run is 4 Mac jobs in two waves of two — ios-build-test with
    # `build (mac)`, then `ui (0)` with `ui (3)` behind `needs: build` — so
    # one run fits the pool exactly. A concurrency group could only do worse:
    # each key holds ONE job, so allowing two means fixed per-shard keys,
    # which idle a free runner whenever both waiting jobs share a key; and
    # the default `queue: single` CANCELS the older pending job, which in a
    # merge group is an ejection. The concurrency knob that matters is the
    # runner count, and it lives on the host (see `build`).
    runs-on: ${{ matrix.host == 'mac' && fromJSON('["self-hosted", "macOS", "ARM64", "ios-e2e"]') || 'macos-15' }}
    permissions:
      contents: read
    timeout-minutes: 65

    strategy:
      fail-fast: false
      matrix:
        # `--total` below is `strategy.job-total`, so the shard count follows
        # this list automatically — the smoke tier partitions its own classes
        # across 2 shards rather than running a fraction of the full 4.
        # Each shard carries the runner class it runs on, so all four start at
        # once instead of four queueing through the Mac's two runners.
        #
        # The split is MEASURED, not arbitrary. Shards 0 and 3 are the two that
        # have actually failed on GitHub's macOS runners — shard 0 on
        # `testClockInViaAPI` / `testShiftStatusWithAPI` (10s waits that a
        # contended runner misses) and shard 3 on
        # `testPINWipeAfterTenFailedAttempts` at 313s against XCTest's 300s
        # allowance. Shards 1 and 2 have passed on hosted runners twice each.
        # So the fragile pair goes to the hardware where they pass, and the
        # proven pair goes to the capacity that is otherwise idle.
        #
        # This also puts 5 of the 7 day-one-critical classes
        # (apps/ios/Tests/UI/ci-smoke.txt) on the Mac: shard 0 carries
        # APIConnectedUITests, AuthFlowUITests, PanicWipeUITests and
        # ShiftFlowUITests; shard 3 carries SecurityUITests.
        #
        # Re-check this split if `ui-tests.py shard` changes its partition —
        # the indices are positional, and a reshuffle would silently send the
        # slow classes to the slow runners.
        #
        # The smoke tier stays entirely on the Mac: it is two shards, which is
        # exactly the Mac's concurrency, so there is nothing to gain from
        # splitting it and a toolchain to avoid straddling.
        include: ${{ fromJSON(inputs.tier == 'smoke'
          && '[{"shard":0,"host":"mac"},{"shard":1,"host":"mac"}]'
          || '[{"shard":0,"host":"mac"},{"shard":3,"host":"mac"},{"shard":1,"host":"hosted"},{"shard":2,"host":"hosted"}]') }}

    steps:
      # MANDATORY, and must stay the literal first step — same guard, same
      # reasoning, as `build` and `fleet/review`: a fork PR's code must never
      # execute on a machine the operator owns.
      - name: Refuse to run on a fork PR (self-hosted runner guard)
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$THIS_REPO" ]]; then
            echo "::error::ios-e2e/ui FAILED: fork-pr-guard — this job runs on a self-hosted runner and must never process a fork PR (head repo '$HEAD_REPO' != '$THIS_REPO')"
            exit 1
          fi

      # Each concurrent job on this host needs its own HTTP and PostgreSQL
      # port. The number MUST come from the RUNNER, not from the shard index.
      #
      # Both runners live on the same Mac mini, so shard-derived ports are
      # only disjoint WITHIN one run. Two overlapping runs — a `pull_request`
      # run and a `merge_group` run, say — each have a shard 2; they land one
      # on each runner and both bind the same port on one machine. That is
      # exactly how `ui (2)` failed here with "port 3102 is already listening"
      # while every shard of its own run was perfectly disjoint. A runner
      # executes one job at a time, so a per-runner port cannot collide no
      # matter how many runs overlap.
      #
      # native-backend.sh takes both ports as env. A port held by a process it
      # cannot prove is its own is a loud failure rather than two servers
      # quietly sharing a database; a port held by a backend this workflow
      # leaked is reclaimed by the next step. NATIVE_BACKEND_DIR defaults to
      # RUNNER_TEMP, which is already per-runner, so pgdata/logs/pid need no
      # help.
      #
      # Runs before the checkout on purpose: it needs nothing but RUNNER_NAME,
      # and the reclaim below cannot run until the ports are known.
      - name: Allocate this runner's backend ports
        run: |
          set -euo pipefail
          # Arithmetic lives in the shell, never in a workflow expression:
          # GitHub's expression syntax has no arithmetic operators at all, so
          # "3100 + something" there is a parse error that fails the ENTIRE
          # workflow at startup — no jobs, no logs, just "this run likely
          # failed because of a workflow file issue". (Expressions are parsed
          # inside run blocks too, including in shell comments, so an empty
          # one written here as an example would break it the same way.)
          #
          # Trailing digits of the runner name: mac-mini-ios-2 -> 2, which
          # keeps the ports readable against the runner in the log. The 10#0
          # prefix forces base 10 and makes an empty match 0 rather than a
          # syntax error. A name with no usable index hashes the whole name
          # instead of falling back to a constant — a constant would
          # reintroduce precisely the collision this step exists to remove.
          slot=$(( 10#0${RUNNER_NAME##*[^0-9]} ))
          # Out of range as well as absent: a hosted runner is called
          # "GitHub Actions 1000015958", whose trailing digits are an account
          # id, not a slot — 3100 + that is not a port at all. Anything above
          # the plausible number of runners on one host is not an index.
          if [ "$slot" -lt 1 ] || [ "$slot" -gt 50 ]; then
            slot=$(( 0x$(printf '%s' "$RUNNER_NAME" | shasum -a 256 | cut -c1-4) % 50 + 1 ))
            echo "::warning::runner '$RUNNER_NAME' has no trailing index; hashed it to slot $slot"
          fi
          # Slots are 1-based, so no port can land on 3100 (the
          # signal-notifier sidecar's documented port) and none is near the
          # 3000/5432 a local `dev:server` and its Postgres occupy — this host
          # is also somebody's development machine, and shard 0 on 3000
          # collided with a running one on the very first try. Keeping CI off
          # the conventional defaults means a person can run the app here
          # without breaking the merge gate.
          echo "NATIVE_BACKEND_PORT=$((3100 + slot))" >> "$GITHUB_ENV"
          echo "NATIVE_BACKEND_PGPORT=$((5500 + slot))" >> "$GITHUB_ENV"
          echo "$RUNNER_NAME (slot $slot) -> http $((3100 + slot)) / pg $((5500 + slot))"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The loop this breaks (#1639): a cancelled job can leave its backend
      # running, that backend holds this runner's slot port, and every later
      # job on the runner then dies at "Start native backend". Each death
      # ejects a merge group, each ejection cancels more jobs, and each
      # cancellation leaks another backend. One leak sustained itself for
      # 5h34m against a 65-minute job cap.
      #
      # Placed HERE, before `bun install` and the two artifact downloads,
      # because the old failure came ~48s into the job and read like a test
      # problem. A port conflict is knowable from the moment the checkout
      # lands, and saying so then is the difference between a one-line verdict
      # and an hour of archaeology.
      #
      # On a persistent runner it kills only what it can PROVE this workflow
      # started — an argv marker, our own PostgreSQL data directory, or a
      # process running out of the runner's work tree — and refuses loudly on
      # anything else. It never matches on the program name: the Mac host is
      # also somebody's development machine and their `bun run dev:server` is
      # a bun process too. It also refuses outright to act on 3000/5432, which
      # is why the allocator above keeps CI off those numbers.
      #
      # This matrix is MIXED — two shards run here on the self-hosted Mac and
      # two on GitHub-hosted macOS — so the step runs on both kinds and
      # no-ops on a hosted one: a fresh VM per job cannot have inherited a
      # leak, and refusing a job there over whatever else might hold a hashed
      # slot port would be a failure mode invented for no benefit. Left
      # unconditional rather than given an `if:`, so the log states which
      # branch it took instead of the step silently disappearing.
      #
      # `start` still refuses an occupied port on EVERY runner kind, reclaim
      # or no reclaim: that check is what keeps the suite off a database this
      # job did not create.
      - name: Reclaim this runner's backend ports
        run: apps/ios/scripts/native-backend.sh reclaim

      # Per-runner BUN_TMPDIR — see `build`'s copy of this step for why. Two
      # shards run on the self-hosted Mac at once, which is exactly the race.
      - name: Give bun a per-runner temp dir
        run: |
          mkdir -p "$RUNNER_TEMP/bun-tmp"
          echo "BUN_TMPDIR=$RUNNER_TEMP/bun-tmp" >> "$GITHUB_ENV"

      # TMPDIR pinned on every bun/node step for node's and bun's JS temp
      # files — see `build` for why it is not what `bun install` uses.
      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun install --frozen-lockfile

      - name: Download test build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.7
        with:
          name: ios-e2e-build-${{ matrix.host }}-${{ github.run_id }}
          path: ${{ runner.temp }}/llamenos-build/Build/Products/

      - name: Download server crypto library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.7
        with:
          name: ios-e2e-server-crypto-${{ matrix.host }}-${{ github.run_id }}
          path: packages/crypto/dist/server/

      # Runs bun twice (the migration script, then the server, which keeps
      # this TMPDIR for its whole life) — so it is pinned like the install.
      - name: Start native backend
        env:
          SHARD: ${{ matrix.shard }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          echo "shard $SHARD on $RUNNER_NAME -> http $NATIVE_BACKEND_PORT / pg $NATIVE_BACKEND_PGPORT"
          apps/ios/scripts/native-backend.sh start

      # Hosted runners only. The firewall on a persistent host is configured
      # once by its operator, not turned off per job — and this host has no
      # passwordless sudo, so attempting it would only fail the shard.
      - name: Disable macOS application firewall
        if: runner.environment == 'github-hosted'
        run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

      # A DEDICATED device per shard, created here rather than picked from the
      # pool. The old "first available iPhone" returns the SAME device to all
      # four shards, which is harmless when each runs in its own VM and
      # catastrophic when they share a host: four test runs driving one
      # simulator. Creating it also removes the pre-existing-device
      # assumption entirely — a fresh host needs no manual setup.
      #
      # Still resolved by UDID for both boot and destination: resolving by
      # name twice once found no device right after the boot (run 36356469649).
      - name: Create simulator for shard ${{ matrix.shard }}
        id: sim
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rs = [r for r in json.load(sys.stdin)['runtimes']
                if r.get('isAvailable') and r.get('platform') == 'iOS']
          if not rs: sys.exit('no available iOS runtime')
          print(sorted(rs, key=lambda r: r['version'], reverse=True)[0]['identifier'])
          ")
          NAME="ios-e2e-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}"
          UDID=$(xcrun simctl create "$NAME" "iPhone 17 Pro" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Created simulator: $NAME ($UDID) on $RUNTIME"

      # Boot before the first test: booting on a 3-core runner starved the backend
      # badly enough that the first class's hub creation took 30-49s (runs
      # 36343743065, 36348376614).
      - name: Boot simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      # Boot is not warm. Booting the simulator never launches the app, so the
      # FIRST test of a shard paid the whole cold-start bill — installd
      # registering the bundle, RunningBoard's first assertion for the process,
      # dyld mapping the app and its frameworks — inside XCTest's
      # assertion-acquisition budget, which cannot be raised. #1873: on hosted
      # runners the first two tests of a shard failed with
      #   Failed to get background assertion for target app ... Timed out
      # without ever evaluating an assertion (trace: Launch at 1.28s, Tear Down
      # at 41.32s), and every test after them passed on the same simulator.
      #
      # So pay it here, once, outside any test: install the app, launch it,
      # terminate it. Not a sleep and not a raised timeout — the same work the
      # first test would have done, done before the clock starts. The elapsed
      # time is printed, so a run's log shows what the first launch cost.
      #
      # A failed warm-up only means the first test is cold again, so it
      # annotates instead of failing the shard; a missing app is a broken
      # build artifact and does fail.
      - name: Warm the app (install, launch once, terminate)
        timeout-minutes: 5
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -uo pipefail
          products="$RUNNER_TEMP/llamenos-build/Build/Products/UITesting-iphonesimulator"
          apps=()
          while IFS= read -r app; do apps+=("$app"); done < <(find "$products" -maxdepth 1 -name "*.app" ! -name "*-Runner.app")
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error::expected exactly one app under $products, found ${#apps[@]}: ${apps[*]:-none}"
            exit 1
          fi
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "${apps[0]}/Info.plist")
          start=$SECONDS
          if xcrun simctl install "$UDID" "${apps[0]}" \
              && xcrun simctl launch --terminate-running-process "$UDID" "$bundle_id" \
              && xcrun simctl terminate "$UDID" "$bundle_id"; then
            echo "warm-up of $bundle_id took $((SECONDS - start))s"
          else
            echo "::warning::warm-up of $bundle_id failed after $((SECONDS - start))s; the first test of this shard will launch cold"
          fi

      # Per-PR runs (ci.yml) skip the quarantine; the nightly schedule and a
      # manual dispatch run it too.
      - name: Select test classes for shard ${{ matrix.shard }}
        id: shard
        env:
          INCLUDE_QUARANTINED: ${{ github.event_name == 'schedule' || inputs.include-quarantined }}
          # Only the literal string `smoke` narrows the selection. The nightly
          # schedule and push runs pass no tier at all and so run full.
          IOS_TIER: ${{ inputs.tier }}
        run: |
          extra=()
          if [ "$INCLUDE_QUARANTINED" = "true" ]; then extra=(--include-quarantined); fi
          if [ "$IOS_TIER" = "smoke" ]; then extra+=(--only-smoke); fi
          # Unset on workflow_call and schedule, which is the point: neither the
          # gate nor the nightly can select these.
          if [ "${{ inputs.take-screenshots }}" = "true" ]; then extra+=(--include-non-gating); fi
          # The shard indices this workflow routes to the Mac, handed to the
          # packer so the classes in ci-mac-shards.txt can only land there.
          # Must match the `host: mac` entries in the matrix above;
          # guards.test.ts asserts the two agree, because a silent mismatch
          # puts the fragile classes back on hosted runners — which is the
          # failure this whole mechanism exists to prevent.
          extra+=(--mac-shards 0,3)
          python3 apps/ios/scripts/ui-tests.py shard --index ${{ matrix.shard }} --total ${{ strategy.job-total }} "${extra[@]}" | tee "$RUNNER_TEMP/shard-args.txt"
          test -s "$RUNNER_TEMP/shard-args.txt" || { echo "::error::shard ${{ matrix.shard }} selected no test classes"; exit 1; }

      # Inside the job's 65: leaves room for setup (5-7 min) and the always()
      # report/upload steps. Shards are balanced by measured time (ui-tests.py
      # shard) at ~37 min per-PR; the nightly adds the quarantined tests. At 45 the
      # heaviest count-balanced shard timed out after its last test had passed
      # (43.2 min of test time, run 36368999711).
      - name: Run XCUITests (shard ${{ matrix.shard }})
        timeout-minutes: 50
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          # xcodebuild strips the TEST_RUNNER_ prefix and forwards the rest
          # into the test runner's environment, where BaseUITest reads
          # TEST_HUB_URL. This shard's backend is not on 3000, so without it
          # every shard would drive the same (wrong) server.
          #
          # Reads the port the allocation step chose. It must NOT recompute it
          # from the shard index: the backend's port is derived from the
          # RUNNER, and shard N does not run on runner N. When this line did
          # its own `3100 + SHARD` arithmetic, shard 3 on mac-mini-ios-1
          # started a backend on 3101 and then pointed the test runner at
          # 3103, and all 33 of that shard's tests failed with "No test hub
          # for <class>". Shard 2 passed only because it happened to land on
          # mac-mini-ios-2, where the two numbers coincide — which is exactly
          # how a mismatch like this hides.
          export TEST_RUNNER_TEST_HUB_URL="http://127.0.0.1:$NATIVE_BACKEND_PORT"

          # Confirm the shard is pointed at a backend that answers, rather than
          # letting every test fail its setup one by one — a port mismatch once
          # cost a full shard and surfaced as 33 identical assertion failures.
          #
          # POLLED, not a single attempt. The first version used one
          # `curl --max-time 10` and failed a merge-queue run on a backend that
          # was perfectly healthy: the hosted runner was busy booting a
          # simulator, the request sat unaccepted for over 10s, and curl
          # returned "(28) timed out ... 0 bytes received" while the server log
          # showed it answering 200 moments later. A fixed timeout sized for a
          # fast machine is exactly the defect this step exists to surface, so
          # it must not contain one itself.
          #
          # Up to ~2 minutes. Long enough to outlast simulator boot on a loaded
          # hosted runner; far short of the 50-minute step budget, so a backend
          # that genuinely never came up still fails fast and loudly.
          hub_ok=0
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 "$TEST_RUNNER_TEST_HUB_URL/api/health/live" >/dev/null 2>&1; then
              hub_ok=1
              echo "hub reachable at $TEST_RUNNER_TEST_HUB_URL (attempt $attempt)"
              break
            fi
            sleep 5
          done
          if [ "$hub_ok" != "1" ]; then
            echo "::error::ios-e2e/ui FAILED: hub-unreachable — shard $SHARD on $RUNNER_NAME points at $TEST_RUNNER_TEST_HUB_URL and nothing answered in ~2 minutes. The backend was started on NATIVE_BACKEND_PORT=$NATIVE_BACKEND_PORT: if those two numbers differ, a port is being derived in two places; if they match, read the backend log step below — the server is either down or too starved to accept a connection."
            exit 1
          fi
          XCTESTRUN=$(find ${{ runner.temp }}/llamenos-build/Build/Products -name "*.xctestrun" -print -quit)
          test -n "$XCTESTRUN" || { echo "::error::no .xctestrun in the downloaded build"; exit 1; }
          # shellcheck disable=SC2046
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/ios-e2e-shard-${{ matrix.shard }}.xcresult" \
            $(cat "$RUNNER_TEMP/shard-args.txt") \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      # always(): a shard that hits its timeout must still report what ran.
      - name: Report (shard ${{ matrix.shard }})
        if: always()
        run: |
          python3 apps/ios/scripts/ui-tests.py report "$RUNNER_TEMP/xcodebuild-test.log" \
            --json "$RUNNER_TEMP/ui-test-results-shard-${{ matrix.shard }}.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # How much headroom did four concurrent shards actually leave? A hosted
      # macOS runner gives a shard 3 cores and 7 GB to itself; four shards on
      # this 10-core/16 GB host get ~2.5 cores and ~4 GB each, which is LESS
      # memory per shard than hosted. Whether that matters is a measurement,
      # not an opinion — and the tests are known to be resource-sensitive
      # (see the "Boot simulator" comment: a starved backend took 30-49s to
      # create a hub). Swap used here is the number that decides whether this
      # host should run 4 shards at once or 2.
      - name: Host headroom during this shard
        if: always()
        run: |
          {
            echo "### Shard ${{ matrix.shard }} host headroom"
            echo '```'
            sysctl -n vm.swapusage 2>/dev/null || true
            echo "load:$(sysctl -n vm.loadavg 2>/dev/null || true)"
            echo "booted simulators: $(xcrun simctl list devices booted 2>/dev/null | grep -c Booted || echo '?')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show backend log
        if: always()
        run: cat "$RUNNER_TEMP/llamenos-native-backend/server.log" || true

      # Why those screenshots were never used: nothing took them out of the
      # .xcresult. Captured with `lifetime = .keepAlways`, bundled into an
      # ~80 MB result file, uploaded, never opened. Exporting them to a plain
      # directory is what makes the opt-in worth having at all.
      - name: Export screenshots
        if: always() && inputs.take-screenshots == true
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/screenshots-shard-${{ matrix.shard }}"
          mkdir -p "$out"
          xcresult="$RUNNER_TEMP/ios-e2e-shard-${{ matrix.shard }}.xcresult"
          if [ ! -d "$xcresult" ]; then
            echo "::warning::no xcresult at $xcresult — nothing to export"
            exit 0
          fi
          # Tolerated rather than required: a change to this CLI must not fail a
          # run whose tests already passed. The .xcresult artifact still has them.
          if ! xcrun xcresulttool export attachments \
                 --path "$xcresult" --output-path "$out" 2>"$RUNNER_TEMP/export.err"; then
            echo "::warning::xcresulttool export attachments failed"
            sed 's/^/  /' "$RUNNER_TEMP/export.err" || true
            exit 0
          fi
          echo "exported $(find "$out" -type f | wc -l | tr -d ' ') file(s)"

      - name: Upload screenshots
        if: always() && inputs.take-screenshots == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-screenshots-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/screenshots-shard-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-e2e-results-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/ios-e2e-shard-${{ matrix.shard }}.xcresult
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/ui-test-results-shard-${{ matrix.shard }}.json
            ${{ runner.temp }}/llamenos-native-backend/server.log
            ${{ runner.temp }}/llamenos-native-backend/watchdog.log
          retention-days: 7

      # The same per-test results, WITHOUT the ~80 MB .xcresult, so the nightly
      # `report` job can fold them into an issue without downloading four of
      # those. Scheduled runs only: nothing else reads it.
      - name: Upload per-test results for the nightly report
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-e2e-results-json-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-test-results-shard-${{ matrix.shard }}.json
          retention-days: 3
          if-no-files-found: ignore

      # Reads the ports from the environment the allocation step wrote, so
      # there is exactly one place deriving them. The guard matters: with
      # these unset, native-backend.sh falls back to 3000/5432 and would try
      # to stop the OPERATOR's development server on this shared host.
      #
      # `always()` is the ORDERLY path and cannot be the only one: a hard
      # cancellation — which is what a merge-queue ejection does to every job
      # in the group — can kill this job before this step is ever reached. Two
      # other mechanisms cover that, neither of which needs anything in this
      # job to run again: `start` leaves a watchdog that tears the backend
      # down when the runner's job process goes away, and the next job on this
      # runner reclaims the port before it installs anything (#1639).
      - name: Stop native backend
        if: always() && env.NATIVE_BACKEND_PORT != ''
        run: apps/ios/scripts/native-backend.sh stop

      # This host keeps every simulator ever created — each is GBs of runtime
      # state, and a week of runs would fill the disk. Deleted unconditionally,
      # including on cancellation, plus a sweep for the runs that never got
      # here (killed mid-job, runner restarted).
      - name: Delete this shard's simulator
        if: always()
        run: |
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" 2>/dev/null || true
          xcrun simctl delete "${{ steps.sim.outputs.udid }}" 2>/dev/null || true

      # Sweep by AGE, never by name alone: other PRs' shards run on this same
      # host concurrently and their devices are also called ios-e2e-*.
      # Deleting those would kill a live run. A shard's job cap is 65 min, so
      # anything untouched for 6h provably belongs to no running job.
      - name: Sweep simulators orphaned by earlier runs
        if: always()
        run: |
          find "$HOME/Library/Developer/CoreSimulator/Devices" -maxdepth 1 -type d -mmin +360 \
            -exec test -e '{}/device.plist' ';' -print 2>/dev/null | while read -r dir; do
            udid=$(basename "$dir")
            name=$(/usr/libexec/PlistBuddy -c 'Print :name' "$dir/device.plist" 2>/dev/null || echo "")
            case "$name" in
              ios-e2e-*) xcrun simctl delete "$udid" 2>/dev/null && echo "swept $name ($udid)" ;;
            esac
          done || true


  # ---------------------------------------------------------------------------
  # The nightly run is the ONLY standing signal about iOS on `main` outside a
  # merge group (ios-e2e is skipped on pull_request, and push-to-main CI is
  # deliberately thin). #2057: it was red on every scheduled run from the first
  # (2026-09-29) to the day it was looked at, and nothing told anyone — the
  # signal went to a Actions tab nobody opens, while merge groups paid for the
  # same failures one group at a time.
  #
  # So a red scheduled run opens (or comments on) ONE issue, the same way the
  # post-merge canary does for the desktop shards (main-canary.yml, #2053): a
  # `ci`-labelled issue whose title carries a fixed prefix, deduplicated on
  # that prefix, closed again by the first green run. An open issue therefore
  # always means "the last nightly was red".
  #
  # What it adds beyond "the job failed":
  #   * the failing tests, split into those NO quarantine entry owns (news) and
  #     those ci-quarantine.txt already names (known, shown so they stay
  #     visible daily, which is what running the quarantine nightly is for);
  #   * quarantined tests that PASSED, whose entry is stale;
  #   * shards that never reported (runner refused, toolchain stale) — a run
  #     that lost half its tests must not read as a short list of failures;
  #   * how long it has been red, and the commits since the previous nightly.
  # A repeat of an unchanged failing set adds no comment: ten identical comments
  # are how a signal becomes wallpaper.
  #
  # Runs on a GitHub-hosted Linux runner. It must never queue for a Mac: the two
  # Macs serve every merge group.
  #
  # Not a gate and never a required context, and not for `workflow_call`
  # (merge groups report through ci-status) or `workflow_dispatch` (a manual run
  # of some branch says nothing about `main`).
  report:
    name: report
    needs: [build, ui]
    # `failure` AND `cancelled`. A job that exceeds its timeout-minutes is
    # recorded as cancelled, not failed: the 2026-09-30 and 2026-10-01 nightlies
    # both ended that way (ui shards cancelled after 65-70 min waiting on a
    # starved Mac), delivered no verdict, and a failure-only condition would
    # have reported neither. A run with no verdict is a red nightly.
    # `build` failing leaves `ui` skipped, so both are checked.
    if: >-
      ${{ always() && github.event_name == 'schedule'
      && (contains(fromJSON('["failure","cancelled"]'), needs.build.result)
      || contains(fromJSON('["failure","cancelled"]'), needs.ui.result)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Tolerated: if every shard died there is nothing to download, and that
      # absence is itself what the report has to say.
      - name: Download per-test results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.7
        with:
          pattern: ios-e2e-results-json-shard-*
          path: ${{ runner.temp }}/results

      - name: Open or update the nightly issue
        env:
          RESULTS: ${{ runner.temp }}/results
          SHARDS: "4"
        run: |
          set -euo pipefail
          PREFIX='[nightly-ios-e2e]'

          FAILED_JOBS="$(gh run view "$RUN_ID" --repo "$REPO" --json jobs \
            -q '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | join("|")')"

          BODY="$(mktemp)"
          python3 apps/ios/scripts/ui-tests.py nightly-report "$RESULTS" --shards "$SHARDS" \
            --failed-jobs "$FAILED_JOBS" --run-url "$RUN_URL" > "$BODY"
          SIGNATURE="$(head -n1 "$BODY")"

          # How long has it been red? Walk the scheduled runs newest-first until
          # one is green. Cancelled and skipped runs carry no verdict either way,
          # so they neither extend nor break the streak.
          RUNS="$(gh run list --repo "$REPO" --workflow ios-e2e.yml --event schedule --limit 60 \
            --json databaseId,conclusion,createdAt,headSha)"
          STREAK="$(jq -c --argjson id "$RUN_ID" '
            [ .[] | select(.conclusion != "cancelled" and .conclusion != "skipped" and .conclusion != "") ] as $done
            | ($done | map(.conclusion == "success") | index(true)) as $green
            | (if $green == null then $done else $done[0:$green] end) as $red
            | {count: ($red | length),
               since: ($red | last | .createdAt // ""),
               sinceSha: ($red | last | .headSha // ""),
               everGreen: ($green != null)}' <<<"$RUNS")"
          COUNT="$(jq -r .count <<<"$STREAK")"
          SINCE="$(jq -r '.since[0:10]' <<<"$STREAK")"
          SINCE_SHA="$(jq -r .sinceSha <<<"$STREAK")"
          if [[ "$(jq -r .everGreen <<<"$STREAK")" == "true" ]]; then
            HISTORY="Red on the last $COUNT consecutive scheduled run(s), since $SINCE (\`${SINCE_SHA:0:9}\`)."
          else
            HISTORY="Red on all $COUNT scheduled run(s) on record, since $SINCE (\`${SINCE_SHA:0:9}\`) — there is no green nightly to compare with."
          fi

          # Suspects: commits since the last GREEN nightly when there is one,
          # else since the previous nightly. Newest 40 are listed.
          LOWER="$(jq -r '[.[] | select(.conclusion == "success")][0].headSha // empty' <<<"$RUNS")"
          if [[ -z "$LOWER" ]]; then
            LOWER="$(jq -r --argjson id "$RUN_ID" '[.[] | select(.databaseId != $id)][0].headSha // empty' <<<"$RUNS")"
            RANGE="since the previous nightly (${LOWER:0:9})"
          else
            RANGE="since the last green nightly (${LOWER:0:9})"
          fi
          SUSPECTS="$(mktemp)"
          # shellcheck disable=SC2016  # literal backticks (markdown) inside a jq program, not a substitution
          if [[ -n "$LOWER" && "$LOWER" != "$SHA" ]] && gh api "repos/$REPO/compare/$LOWER...$SHA" \
               --jq '"\(.total_commits)\n" + ([.commits | reverse | .[0:40][] | "- `\(.sha[0:9])` \(.commit.message | split("\n")[0])"] | join("\n"))' \
               > "$SUSPECTS" 2>/dev/null; then
            TOTAL="$(head -n1 "$SUSPECTS")"; tail -n +2 "$SUSPECTS" > "$SUSPECTS.list"
            if [[ "$TOTAL" -gt 40 ]]; then echo "- … and $((TOTAL - 40)) older commit(s)" >> "$SUSPECTS.list"; fi
          elif [[ "$LOWER" == "$SHA" ]]; then
            RANGE="since the previous nightly: none, it ran on this same commit"
            : > "$SUSPECTS.list"
          else
            RANGE="(no earlier run to bound the range)"
            echo "- \`${SHA:0:9}\`" > "$SUSPECTS.list"
          fi

          FULL="$(mktemp)"
          {
            echo "The nightly iOS E2E run on \`main\` failed. It is the only standing check of the iOS suite outside a merge group."
            echo
            echo "**Commit:** \`$SHA\`  "
            echo "**Run:** $RUN_URL  "
            echo "**History:** $HISTORY"
            echo
            sed '1d' "$BODY"
            echo
            echo "### Commits $RANGE"
            cat "$SUSPECTS.list"
            echo
            echo "This is a detector, not a gate: it blocks nothing and is not a required check. It closes itself when a later scheduled run is green."
            echo "$SIGNATURE"
          } > "$FULL"

          { echo "### iOS nightly RED at \`${SHA:0:9}\`"; echo; echo "$HISTORY"; echo; sed '1d' "$BODY"; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=nightly iOS E2E red::main is red at $SHA — $HISTORY"

          # One issue at a time, found by title prefix. Comment only when the
          # failing set changed since the issue (or its newest comment) last
          # recorded it.
          OPEN="$(gh issue list --repo "$REPO" --state open --label ci \
            --search "\"$PREFIX\" in:title" --json number -q '.[0].number // empty')"
          if [[ -z "$OPEN" ]]; then
            gh issue create --repo "$REPO" --label ci \
              --title "$PREFIX nightly iOS E2E is red on main (since $SINCE)" --body-file "$FULL"
          else
            LAST="$(gh issue view "$OPEN" --repo "$REPO" --json body,comments \
              -q '[.body, (.comments[].body)] | map(select(contains("<!-- ios-nightly-signature:"))) | last // ""' \
              | grep -o '<!-- ios-nightly-signature:[0-9a-f]* -->' | tail -n1 || true)"
            if [[ "$LAST" == "$SIGNATURE" ]]; then
              echo "Failing set unchanged since the last report on #$OPEN; not commenting again."
            else
              gh issue comment "$OPEN" --repo "$REPO" --body-file "$FULL"
            fi
          fi

  # Green -> close the open nightly issue, so an issue that is still open always
  # means the last scheduled run was red.
  recover:
    name: recover
    needs: [build, ui]
    if: ${{ always() && github.event_name == 'schedule' && needs.build.result == 'success' && needs.ui.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Close the open nightly issue
        run: |
          set -euo pipefail
          for n in $(gh issue list --repo "$REPO" --state open --label ci \
                       --search '"[nightly-ios-e2e]" in:title' --json number -q '.[].number'); do
            gh issue close "$n" --repo "$REPO" \
              --comment "Nightly iOS E2E green again at \`$SHA\` ($RUN_URL)."
          done
