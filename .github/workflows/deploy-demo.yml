name: Deploy Demo

# Manual-only workflow: deploy the Llamenos demo VPS instance via Ansible.
#
# Required secrets:
#   DEMO_INVENTORY_YML       — content of inventory-demo.yml (Ansible inventory)
#   ANSIBLE_VAULT_PASSWORD   — password for ansible-vault encrypted demo_vars.yml
#   DEMO_VARS_YML_ENCRYPTED  — content of encrypted demo_vars.yml
#   DEMO_SSH_PRIVATE_KEY     — SSH private key for the demo VPS deploy user

on:
  workflow_dispatch:
    inputs:
      reset_data:
        description: "Reset demo data after deploying?"
        type: boolean
        default: false
        required: false

# Two Ansible runs against one VPS interleave their `docker compose up` and
# their sshd restarts. `release.yml` dispatches this workflow on every
# release while an operator can also dispatch it by hand, so the overlap is
# reachable, not theoretical. deploy-prod.yml has always had this block;
# this one was missing it.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy-demo:
    name: Deploy to Demo VPS
    # `[self-hosted, linux, x64]` alone also matches llamenos-review-box,
    # which is not provisioned to deploy. Every other self-hosted job in
    # this repo pins the full label set; this one did not.
    runs-on: [self-hosted, linux, x64, hetzner, llamenos]
    environment: demo
    timeout-minutes: 30

    steps:
      # This job stays on the self-hosted box, where $HOME and /tmp are shared
      # by every concurrent job. Scope each toolchain's cache/state under this
      # job's own $RUNNER_TEMP so two jobs can never corrupt each other.
      - name: Isolate per-job toolchain caches
        run: |
          {
            echo "CARGO_HOME=$RUNNER_TEMP/cargo"
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup"
            echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle"
            echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache"
            echo "npm_config_cache=$RUNNER_TEMP/npm-cache"
            echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache"
            echo "ANSIBLE_COLLECTIONS_PATH=$RUNNER_TEMP/ansible-collections"
            echo "ANSIBLE_LOCAL_TEMP=$RUNNER_TEMP/ansible-tmp"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each secret below is later written to a file with `printf '%s' "$VAR"`,
      # which SUCCEEDS on an unset secret and leaves a 0-byte file. Ansible
      # then reads the empty inventory, matches no hosts, and EXITS 0 — so a
      # missing secret does not fail this workflow, it makes it report success
      # having deployed nothing. Fail here, before anything is written, and
      # name every missing secret at once rather than one per re-run.
      #
      # Only names are printed. Never echo a secret's value.
      - name: Verify required secrets are present
        env:
          DEMO_INVENTORY_YML: ${{ secrets.DEMO_INVENTORY_YML }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          DEMO_VARS_YML_ENCRYPTED: ${{ secrets.DEMO_VARS_YML_ENCRYPTED }}
          DEMO_SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in DEMO_INVENTORY_YML ANSIBLE_VAULT_PASSWORD \
                      DEMO_VARS_YML_ENCRYPTED DEMO_SSH_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::required secret $name is unset or empty"
            done
            echo "Set them in the repository's 'demo' environment, then re-dispatch." >&2
            exit 1
          fi
          echo "All 4 required secrets are present."

      - name: Install Ansible
        run: |
          # Pinned to the same version CI validates the playbooks against
          # (ci.yml's ansible-lint job). Unpinned, an upstream ansible release
          # could change collection behaviour under a deploy with nothing in
          # this repo having changed — ansible.cfg's header already documents
          # one such breakage from a community.general bump.
          pip install ansible==14.1.0
          ansible-galaxy collection install community.docker

      - name: Write Ansible inventory
        env:
          INVENTORY_YML: ${{ secrets.DEMO_INVENTORY_YML }}
        run: |
          mkdir -p deploy/ansible
          printf '%s' "$INVENTORY_YML" > deploy/ansible/inventory-demo.yml

      - name: Write Ansible vault password
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s' "$VAULT_PASSWORD" > "$RUNNER_TEMP/vault-pass"
          chmod 600 "$RUNNER_TEMP/vault-pass"

      - name: Write encrypted demo vars
        env:
          DEMO_VARS: ${{ secrets.DEMO_VARS_YML_ENCRYPTED }}
        run: |
          printf '%s' "$DEMO_VARS" > deploy/ansible/demo_vars.yml

      - name: Load SSH key into agent
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "$SSH_KEY" | ssh-add -
          ssh-keyscan -H "$(grep ansible_host deploy/ansible/inventory-demo.yml | head -1 | awk '{print $2}')" >> ~/.ssh/known_hosts 2>/dev/null || true

      # `ansible-playbook` against an inventory that matches no hosts prints
      # two WARNINGs and exits 0, so every play is skipped and the job goes
      # green having done nothing. The secret guard above stops the empty-file
      # case; this stops the subtler one — a syntactically valid inventory
      # that simply has no `demo` group (the shipped inventory.example.yml
      # defines `llamenos_servers`, not `demo`, so this is an easy mistake).
      - name: Verify the inventory resolves at least one demo host
        working-directory: deploy/ansible
        run: |
          set -euo pipefail
          if ! ansible -i inventory-demo.yml demo --list-hosts > hosts.txt 2>err.txt; then
            echo "::error::inventory-demo.yml is not a parseable Ansible inventory"
            sed -e 's/^/  /' err.txt >&2
            exit 1
          fi
          count=$(sed -n 's/^[[:space:]]*hosts (\([0-9][0-9]*\)):.*/\1/p' hosts.txt | head -1)
          rm -f hosts.txt err.txt
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::inventory-demo.yml matched 0 hosts for the 'demo' group — every play would be skipped and this job would pass having deployed nothing"
            exit 1
          fi
          echo "inventory-demo.yml resolves $count host(s) in group 'demo'."

      - name: Deploy demo instance
        working-directory: deploy/ansible
        run: |
          ansible-playbook playbooks/deploy-demo.yml \
            -i inventory-demo.yml \
            --vault-password-file "$RUNNER_TEMP/vault-pass"
        # Ansible picks up SSH_AUTH_SOCK automatically

      - name: Reset demo data
        if: ${{ inputs.reset_data }}
        working-directory: deploy/ansible
        run: |
          ansible-playbook playbooks/reset-demo.yml \
            -i inventory-demo.yml \
            --vault-password-file "$RUNNER_TEMP/vault-pass"

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k || true

      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/vault-pass"
          rm -f deploy/ansible/inventory-demo.yml
          rm -f deploy/ansible/demo_vars.yml
