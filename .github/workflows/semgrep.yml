# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow file requires a free account on Semgrep.dev to
# manage rules, file ignores, notifications, and more.
#
# See https://semgrep.dev/docs

name: Semgrep

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '16 16 * * 3'

concurrency:
  # A superseded push cancels its own PR run (#2094); every other event gets a per-SHA group that nothing can cancel.
  group: ${{ github.event_name == 'pull_request' && format('semgrep-pr-{0}', github.ref) || format('semgrep-{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  semgrep:
    # Release-PR exemption (#1817) — the SAME predicate codeql.yml
    # and security-audit.yml carry; keep them byte-identical.
    # The knope release PR (head branch `release`) diffs version strings and
    # a changelog — no code — so a full Semgrep scan per regeneration (6 on
    # 2026-10-11) measures nothing. The scan still runs on the push to main
    # the merge produces. Semgrep is not a required context, so the skipped
    # job cannot strand the PR.
    if: github.event_name != 'pull_request' || github.head_ref != 'release'
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout project source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scan code using project's configuration on https://semgrep.dev/manage
      - uses: returntocorp/semgrep-action@fcd5ab7459e8d91cb1777481980d1b18b4fc6735
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          generateSarif: "1"

      # Upload SARIF file generated in previous step
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
        if: always()
