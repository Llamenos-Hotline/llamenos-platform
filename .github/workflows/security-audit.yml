# Security Audit Workflow (Epic 297)
#
# Runs on:
#   - Daily schedule (2:00 AM UTC)
#   - Push to main (when security-relevant files change)
#   - Manual dispatch
#
# Jobs:
#   1. Dependency audit (bun audit + cargo audit)
#   2. Dockerfile scanning (Trivy config scan)
#   3. Container image scanning (Trivy image scan)
#   4. Rust dependency audit (cargo-audit)

name: Security Audit

on:
  schedule:
    # Daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lockb'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      # The files that can mute an advisory: editing one must re-run the expiry
      # enforcer, or a bare ignore lands without ever being checked.
      - 'deny.toml'
      - '**/audit.toml'
      - '**/Dockerfile*'
      - 'deploy/docker/**'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lockb'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '**/audit.toml'
      - '**/Dockerfile*'
      - 'deploy/docker/**'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

permissions: {}  # deny-all; per-job permissions below

env:
  BUN_VERSION: "1.3.5"

jobs:
  # ─── JavaScript/TypeScript Dependency Audit ─────────────────
  # The five PR-eligible jobs below each carry the SAME release-PR exemption
  # (#1817) as codeql.yml, desktop-e2e.yml and semgrep.yml — keep the
  # predicate byte-identical across all four files. The knope release PR
  # (head branch `release`) diffs version strings and a changelog; this
  # workflow's pull_request paths filter matches its Cargo.toml/Cargo.lock
  # bumps, so it used to burn a full audit + three image builds per
  # regeneration (6 on 2026-10-11) over a diff with no dependency changes.
  # Every job still runs on the push to main the release merge produces,
  # which is where the bumped manifests actually land.
  dependency-audit:
    if: github.event_name != 'pull_request' || github.head_ref != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit JS dependencies (critical)
        run: bun audit --audit-level=critical

      # Informational only. The critical-severity gate above is the hard gate and
      # stays blocking. This step is allowed to fail (continue-on-error) so lower
      # severities are surfaced as a failed step in the UI without reddening the
      # job — `|| true` on top of that would only hide the step's own result.
      - name: Audit JS dependencies (all severities — informational)
        run: bun audit
        continue-on-error: true

  # ─── Rust Dependency Audit ─────────────────────────────────
  rust-audit:
    # Release-PR exemption (#1817) — see the comment above dependency-audit.
    if: github.event_name != 'pull_request' || github.head_ref != 'release'
    # GitHub-hosted, like every job a `pull_request` can reach. cargo-audit
    # comes from install-action as a prebuilt, checksum-verified release
    # binary (seconds), never `cargo install` (a from-source compile).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      # `cargo audit` reads Cargo.lock; it compiles nothing. But running it
      # from apps/desktop makes rustup honour that directory's
      # rust-toolchain.toml and install a second, pinned toolchain (1.88.0
      # plus rustfmt, clippy and four cross targets — ~1.7 GB) just to run a
      # lockfile scan. Naming the channel here skips that.
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Install cargo-audit (pinned — avoid silent behaviour drift)
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.1
          # Prebuilt binary or a hard failure — never a silent source build.
          fallback: none

      # `cargo audit` on a crate with no Cargo.lock cannot audit anything. That
      # used to be handled by making the apps/desktop step never fail, which
      # turned "lockfile missing" into "vulnerabilities ignored". Assert the
      # precondition loudly and specifically instead, and let the audit steps
      # below fail for real.
      - name: Assert Cargo.lock is committed (packages/crypto, apps/desktop)
        run: |
          missing=0
          for lock in packages/crypto/Cargo.lock apps/desktop/Cargo.lock; do
            if [ ! -f "$lock" ]; then
              echo "::error file=$lock::$lock is not committed — cargo audit has nothing to audit. Commit the lockfile; do not disable this check."
              missing=1
            fi
          done
          exit "$missing"

      - name: Audit Rust dependencies (packages/crypto)
        working-directory: packages/crypto
        run: cargo audit

      - name: Audit Rust dependencies (apps/desktop)
        working-directory: apps/desktop
        run: cargo audit

  # ─── Dockerfile Security Scanning ──────────────────────────
  dockerfile-scan:
    # Release-PR exemption (#1817) — see the comment above dependency-audit.
    if: github.event_name != 'pull_request' || github.head_ref != 'release'
    # aquasecurity/trivy-action restores/installs the trivy binary under
    # $HOME/.local/bin and adds it to $GITHUB_PATH, but on the self-hosted
    # runner that PATH update doesn't take effect for the next step ("trivy:
    # command not found", exit 127) — same class of $HOME/PATH mismatch as
    # the gitleaks and ansible-lint self-hosted issues. Keep hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scan Dockerfile.build with Trivy (SARIF, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile.build'
          format: 'sarif'
          output: 'dockerfile-build-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      # G6 (CI gate audit, 2026-09-11): config scans are clean as of this PR
      # (fixed DS-0002 — Dockerfile.build ran as root, no USER directive).
      # Fail the build on CRITICAL/HIGH misconfigurations going forward;
      # MEDIUM stays report-only via the SARIF upload above.
      - name: Scan Dockerfile.build with Trivy (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile.build'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan deploy/docker/Dockerfile with Trivy (SARIF, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'deploy/docker/Dockerfile'
          format: 'sarif'
          output: 'dockerfile-deploy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Scan deploy/docker/Dockerfile with Trivy (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'deploy/docker/Dockerfile'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan Docker Compose files with Trivy (SARIF, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'deploy/docker'
          format: 'sarif'
          output: 'docker-compose-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Scan Docker Compose files with Trivy (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'deploy/docker'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Dockerfile.build scan results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        # upload-sarif requires GitHub Advanced Security (public repos or GHAS license).
        # Skip on private repos to avoid action_required failures.
        if: always() && github.repository_visibility == 'public'
        with:
          sarif_file: 'dockerfile-build-results.sarif'
          category: 'dockerfile-build'

      - name: Upload deploy Dockerfile scan results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        if: always() && github.repository_visibility == 'public'
        with:
          sarif_file: 'dockerfile-deploy-results.sarif'
          category: 'dockerfile-deploy'

      - name: Upload Docker Compose scan results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        if: always() && github.repository_visibility == 'public'
        with:
          sarif_file: 'docker-compose-results.sarif'
          category: 'docker-compose'

  # ─── Container Image Vulnerability Scan ────────────────────
  image-scan:
    # Release-PR exemption (#1817) — see the comment above dependency-audit.
    if: github.event_name != 'pull_request' || github.head_ref != 'release'
    # GitHub-hosted, like every job a `pull_request` can reach. A hosted
    # runner starts with an empty Docker daemon, so layer reuse comes from
    # BuildKit's GitHub Actions cache backend (below) via a
    # docker/setup-buildx-action builder.
    runs-on: ubuntu-latest
    # Measured on ubuntu-latest per leg: 4.6-5.7 min with an empty gha
    # cache, 1.0-1.6 min warm. Self-hosted, warm: 1.7-6.2 min.
    timeout-minutes: 20
    env:
      SCAN_IMAGE: llamenos-scan:${{ matrix.image.name }}

    permissions:
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        image:
          # `deploy/docker/Dockerfile` is multi-stage; Docker defaults to its
          # LAST stage (`static`), so each entry names its stage explicitly.
          # `target: ''` means "single-stage Dockerfile, no stage to select".
          - name: app
            dockerfile: deploy/docker/Dockerfile
            context: .
            target: app
          - name: static
            dockerfile: deploy/docker/Dockerfile
            context: .
            target: static
          - name: build
            dockerfile: Dockerfile.build
            context: .
            target: ''

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Installed once for the job's four scans below (each passes
      # `skip-setup-trivy: true`). The first scan restores the vulnerability
      # DB from the Actions cache into trivy-action's default cache dir; the
      # later scans read the same dir, so they set `cache: false`.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: false
          load: true
          tags: ${{ env.SCAN_IMAGE }}
          # One gha cache scope per leg, or the three legs overwrite each
          # other's cache index under BuildKit's shared default scope. The
          # repo's Actions cache has a fixed quota shared with every other
          # workflow, so a full quota must degrade to an uncached build, never
          # a failed scan: `ignore-error=true`.
          cache-from: type=gha,scope=image-scan-${{ matrix.image.name }}
          cache-to: type=gha,scope=image-scan-${{ matrix.image.name }},mode=max,ignore-error=true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.SCAN_IMAGE }}
          format: 'sarif'
          output: 'image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # G6 (CI gate audit, 2026-09-11): measured findings on 2026-09-11 —
      # 83 debian OS + 22 node-pkg HIGH/CRITICAL total, but only 3 CRITICAL
      # (perl-base, no fix available upstream yet) and those disappear
      # entirely with --ignore-unfixed. Failing on all CRITICAL/HIGH today
      # would redden CI (52 fixable HIGH findings — see the tracking issue
      # filed alongside this PR for the full list), so this hard-fails only
      # on FIXABLE CRITICAL vulnerabilities and leaves HIGH as report-only
      # via the SARIF upload and table step below.
      #
      # 2026-09-12: that measurement only covered the `app` image. The `build`
      # image tripped this gate with 5 fixable CRITICALs — an openssl CVE from
      # the Debian base and Go stdlib CVEs in the esbuild binaries sitting in
      # bun's install cache. All five were build-toolchain artefacts that
      # Dockerfile.build shipped by accident; it is now multi-stage and the
      # final image carries only /build/dist, so the gate is genuinely clean
      # rather than suppressed.
      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          cache: false
          image-ref: ${{ env.SCAN_IMAGE }}
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # G7 (issue #650, re-measured 2026-09-20): CRITICAL is 0 across all three
      # matrix legs now (perl-base fixed in #668). Re-measuring the fixable-HIGH
      # action item split cleanly by layer:
      #   - Debian OS layer (`app`/`static` targets' base): 0 fixable HIGH — the
      #     43 remaining HIGH findings have no upstream fix yet (util-linux/
      #     systemd/ncurses/login family); routine `apt-get upgrade` + Dependabot
      #     base-image bumps already pick up a fix the moment one ships.
      #   - Alpine OS layer (`static` target, Caddy image): was 23 fixable HIGH
      #     (curl/c-ares/libcrypto3/libssl3) — fixed in this PR by bumping the
      #     `caddy:2.11.4-alpine`/`caddy:2.11.4-builder-alpine` digest pins to
      #     the current latest for the same tag (same Caddy version, refreshed
      #     Alpine layer only). Re-scan confirms 0 fixable HIGH remain there.
      #   - Node/npm layer (`app` target): 19 fixable HIGH (browserslist,
      #     form-data, h3, hono, nanoid, postcss, protobufjs, smol-toml, svgo,
      #     undici, vite) — fixing these means editing package.json/bun.lock,
      #     which is outside this workflow file's ownership; tracked by the
      #     "bun audit" issue referenced in #650.
      #   - Go-module layer (`static` target, our xcaddy-built caddy binary):
      #     6 fixable HIGH (golang.org/x/crypto, x/net, x/text, grpc) baked
      #     into the Caddy 2.11.4 release's resolved dependency set — a digest
      #     bump can't reach these, only an actual Caddy version bump can, and
      #     that needs Caddyfile.production + caddy-ratelimit plugin compat
      #     validation first. Left as a follow-up.
      # Scoping this gate to `vuln-type: os` hard-fails the moment a *fixable*
      # OS-package HIGH/CRITICAL appears (e.g. a base-image bump regresses)
      # without blocking on the Node/Go-module findings this workflow can't
      # fix by itself.
      - name: Fail on fixable HIGH/CRITICAL OS-package vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          cache: false
          image-ref: ${{ env.SCAN_IMAGE }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        if: always() && github.repository_visibility == 'public'
        with:
          sarif_file: 'image-results.sarif'
          category: 'image-scan-${{ matrix.image.name }}'

      - name: Scan image with Trivy (table output for review)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          cache: false
          image-ref: ${{ env.SCAN_IMAGE }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ─── Crypto Guardrails (informational) ─────────────────────
  # Findings are emitted as ::warning:: annotations and never fail the build —
  # that is by design. Everything else (a missing path, a bad regex, a crashed
  # step) DOES fail the job: there is deliberately no job-level continue-on-error
  # and no blanket `|| true`. grep exits 1 for "no match", which here means
  # "clean" and is tolerated; exit >= 2 is a real error and is not.
  crypto-guardrails:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Crypto code guardrails (warn-only findings)
        run: |
          set -euo pipefail
          paths=(packages/crypto/src/ apps/desktop/src/crypto.rs)

          # scan <ERE-to-find> <ERE-of-lines-to-exclude>
          # Prints matching lines. Tolerates ONLY grep's "no match" (exit 1).
          scan() {
            local raw rc=0
            raw=$(grep -rnE "$1" "${paths[@]}" --include='*.rs') || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error::grep failed (exit $rc) scanning ${paths[*]}" >&2
              return "$rc"
            fi
            [ -n "$raw" ] || return 0
            rc=0
            printf '%s\n' "$raw" | grep -Ev "$2" || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error::grep filter failed (exit $rc)" >&2
              return "$rc"
            fi
          }

          echo "=== Checking for raw unwrap() in crypto crate ==="
          # Flag unwrap() calls that aren't in test files
          FINDINGS=$(scan '\.unwrap\(\)' '#\[cfg\(test\)\]|_test\.rs:|tests\.rs:|mod tests')
          if [ -n "$FINDINGS" ]; then
            echo "::warning::Found unwrap() calls in crypto code (consider proper error handling):"
            echo "$FINDINGS"
          else
            echo "No unwrap() calls found in production crypto code."
          fi

          echo "=== Checking for non-cryptographic RNG in crypto crate ==="
          FINDINGS=$(scan 'use rand::' 'rand::rngs::OsRng|rand::CryptoRng|_test\.rs:|tests\.rs:')
          if [ -n "$FINDINGS" ]; then
            echo "::warning::Found non-OsRng/non-CryptoRng rand usage in crypto code:"
            echo "$FINDINGS"
          else
            echo "No suspicious RNG usage found."
          fi

          echo "=== Checking for hardcoded keys in crypto code ==="
          FINDINGS=$(scan '(0x[0-9a-fA-F]{32,}|\\x[0-9a-fA-F]{2}){8,}' '_test\.rs:|tests\.rs:|#\[cfg\(test\)\]|mod tests')
          if [ -n "$FINDINGS" ]; then
            echo "::warning::Found potential hardcoded keys in production crypto code:"
            echo "$FINDINGS"
          else
            echo "No hardcoded keys found in production crypto code."
          fi

  # ─── Rust Dependency Policy (cargo deny) ───────────────────
  # Every check here is a hard gate — there is no continue-on-error at job or
  # step level. History: G5 (CI gate audit, 2026-09-11) made licenses/bans/
  # sources blocking and pinned cargo-deny (an unpinned install had drifted to
  # 0.20, whose config schema silently broke deny.toml). `advisories` stayed
  # warn-only pending RUSTSEC triage (#646); that left the job unable to go red
  # on a TLS-library vulnerability, so it is blocking now.
  #
  # The only sanctioned way to accept an advisory is a per-ID, justified,
  # dated entry in deny.toml `[advisories].ignore` (cargo-deny) or an audit.toml
  # `[advisories].ignore` (cargo-audit, the `rust-audit` job) — enforced by the
  # expiry step below, which reads both.
  cargo-deny:
    # Release-PR exemption (#1817) — see the comment above dependency-audit.
    if: github.event_name != 'pull_request' || github.head_ref != 'release'
    # GitHub-hosted, like every job a `pull_request` can reach. cargo-deny
    # comes from install-action as a prebuilt, checksum-verified release
    # binary (seconds); compiling it from source was once most of this job's
    # runtime.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Install cargo-deny (pinned — avoid silent config-schema drift)
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
          # Prebuilt binary or a hard failure — never a silent source build.
          fallback: none

      # Neither cargo-deny nor cargo-audit has a native expiry for an ignored
      # advisory, so enforce one for EVERY file that can mute an advisory:
      # deny.toml (read by cargo-deny) and each audit.toml (read by cargo-audit,
      # the `rust-audit` job). The two tools read different files, so a policy
      # that checked only one left the other muted for good. Files are
      # enumerated from git, never hardcoded, so a new audit.toml is covered
      # the day it is committed.
      #
      #   deny.toml   { id = "RUSTSEC-…", reason = "… [expires YYYY-MM-DD]" }
      #   audit.toml  "RUSTSEC-…", # … [expires YYYY-MM-DD]
      #
      # cargo-audit's `ignore` is a plain list of strings with no reason field,
      # so its justification is the trailing comment on the ID's own line. Every
      # entry needs a reason ending in `[expires YYYY-MM-DD]`, and that date
      # must not have passed. The step fails closed: an ID that is not on its
      # own commented line (bare, several to a line, inline array) is an error.
      - name: Enforce advisory ignore expiry (deny.toml + every audit.toml)
        run: |
          python3 - <<'PY'
          import datetime, os, re, subprocess, sys, tomllib

          EXPIRES = re.compile(r"\[expires (\d{4}-\d{2}-\d{2})\]\s*$")
          today = datetime.date.today()
          problems = 0
          checked = 0


          def fail(path, line, msg):
              global problems
              problems += 1
              print(f"::error file={path},line={line}::{msg}")


          def check_reason(path, line, rid, reason):
              global checked
              checked += 1
              m = EXPIRES.search(reason)
              if not m:
                  fail(path, line, f"{rid}: reason must end with `[expires YYYY-MM-DD]`")
                  return
              if not reason[: m.start()].strip():
                  fail(path, line, f"{rid}: reason needs a justification before the expiry marker")
              try:
                  expires = datetime.date.fromisoformat(m.group(1))
              except ValueError:
                  fail(path, line, f"{rid}: `{m.group(1)}` is not a real date")
                  return
              if expires < today:
                  fail(path, line, f"{rid}: ignore EXPIRED on {m.group(1)} — re-triage (fix, or renew with a fresh justification)")


          def code_line(lines, rid):
              # First non-comment line naming the ID, so the annotation lands on the entry.
              for n, text in enumerate(lines, 1):
                  if rid in text and not text.lstrip().startswith("#"):
                      return n
              return 1


          tracked = subprocess.run(
              ["git", "ls-files", "-z"], check=True, capture_output=True, text=True
          ).stdout.split("\0")
          deny_files = sorted(p for p in tracked if os.path.basename(p) == "deny.toml")
          audit_files = sorted(p for p in tracked if os.path.basename(p) == "audit.toml")
          if not deny_files:
              print("::error::no deny.toml is tracked — the cargo-deny job has nothing to enforce")
              sys.exit(1)
          print(f"deny.toml:  {', '.join(deny_files)}")
          print(f"audit.toml: {', '.join(audit_files) or '(none)'}")

          for path in deny_files:
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              lines = text.splitlines()
              for entry in tomllib.loads(text).get("advisories", {}).get("ignore", []):
                  if not isinstance(entry, dict) or "id" not in entry or not entry.get("reason"):
                      fail(path, 1, f"{entry!r}: must be {{ id = \"RUSTSEC-…\", reason = \"…\" }} (bare IDs carry no justification)")
                      continue
                  check_reason(path, code_line(lines, entry["id"]), entry["id"], entry["reason"])

          for path in audit_files:
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              lines = text.splitlines()
              for rid in tomllib.loads(text).get("advisories", {}).get("ignore", []):
                  if not isinstance(rid, str):
                      fail(path, 1, f"{rid!r}: cargo-audit ignores are plain RUSTSEC id strings")
                      continue
                  entry_line = re.compile(r"""^\s*(["'])""" + re.escape(rid) + r"""\1\s*,?\s*#\s*(.*?)\s*$""")
                  hits = [(n, m.group(2)) for n, l in enumerate(lines, 1) if (m := entry_line.match(l))]
                  if not hits:
                      fail(path, code_line(lines, rid), f"{rid}: must sit on its own line as `\"{rid}\", # reason [expires YYYY-MM-DD]` (a bare ID carries no justification)")
                  for n, reason in hits:
                      check_reason(path, n, rid, reason)

          print(f"{checked} advisory ignore(s) checked across {len(deny_files) + len(audit_files)} file(s), {problems} problem(s)")
          sys.exit(1 if problems else 0)
          PY

      - name: Check packages/crypto (licenses, bans, sources)
        run: cargo deny --manifest-path packages/crypto/Cargo.toml check licenses bans sources

      - name: Check apps/desktop (licenses, bans, sources)
        run: cargo deny --manifest-path apps/desktop/Cargo.toml check licenses bans sources

      - name: Check packages/crypto advisories
        run: cargo deny --manifest-path packages/crypto/Cargo.toml check advisories

      - name: Check apps/desktop advisories
        run: cargo deny --manifest-path apps/desktop/Cargo.toml check advisories
