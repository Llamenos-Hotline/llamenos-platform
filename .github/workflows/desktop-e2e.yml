# CI workflow for desktop Playwright E2E tests.
# Runs Playwright tests against a Vite build with mocked Tauri IPC.
# Backend services (PostgreSQL, RustFS, WebSocket relay) via Docker Compose — globalSetup
# requires a running backend for state reset and admin bootstrap.
#
# Trigger: every pull request; the `changes` job below decides whether the
# `desktop` platform is actually relevant and gates `build`/`test`
# accordingly. Manual dispatch always runs.
# Epic 88: Desktop & Mobile E2E Tests.
#
# Note: Windows matrix removed — Docker Compose backend is not reliably available
# on Windows GHA runners. The ci.yml e2e job provides Linux coverage on ALL PRs;
# this workflow adds broader (non-BDD chromium) coverage gated on the same
# `desktop` platform flag ci.yml computes.
#
# This workflow is NOT currently a required check — folding it into
# `ci.yml`'s `ci-status` aggregate is tracked separately. It still needs to
# report `skipped` rather than never trigger at all once it IS made required,
# though (#664): a required check whose *workflow* never triggers on a given
# PR never reports, and the PR becomes unmergeable. That is why this trigger
# is unfiltered `pull_request` with the platform decision made by a job-level
# `if:` instead of `on.pull_request.paths:` — a workflow-level `paths:`
# filter is exactly the shape that breaks a required check.

name: Desktop E2E Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.5"
  TEST_ADMIN_PUBKEY: "79215a4c04f08fcd817c6f820c87169beb8cddf96dfa590a1315556b78af9183"

jobs:
  # ─── Detect Changed Files ─────────────────────────────────────
  # Delegates to the SAME path map ci.yml's `changes` job uses — see
  # .github/scripts/detect-changed-platforms.sh for the single source of
  # truth (#664). Consolidated from what used to be this workflow's own
  # `on.pull_request.paths:` list.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          if [[ -z "$BASE" ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD^"
          fi
          if [[ -z "$HEAD" ]] || ! git cat-file -e "$HEAD" 2>/dev/null; then
            HEAD="HEAD"
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files ($BASE..$HEAD):"
          echo "$CHANGED"

          printf '%s\n' "$CHANGED" | bash .github/scripts/detect-changed-platforms.sh | tee -a "$GITHUB_OUTPUT"

  # ─── Build (codegen + typecheck + vite build) ─────────────────
  # Separated from test so the 45-min test timeout is not eaten by build steps.
  build:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run codegen
        run: bun run codegen

      - name: Run i18n codegen
        run: bun run i18n:codegen

      - name: Typecheck
        run: bun run typecheck

      - name: Build frontend (with Tauri IPC mocks for test builds)
        run: PLAYWRIGHT_TEST=true bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-build
          path: dist/
          retention-days: 1

  # ─── Test (Playwright E2E) ────────────────────────────────────
  test:
    needs: [changes, build]
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            os_label: Linux

    runs-on: ${{ matrix.platform }}
    name: E2E (${{ matrix.os_label }})
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-build
          path: dist

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # ── Start backend services ──────────────────────────────────
      - name: Bootstrap backend
        uses: ./.github/actions/bootstrap-backend
        with:
          admin_pubkey: ${{ env.TEST_ADMIN_PUBKEY }}

      # ── WASM build (required for crypto-interop-wasm.spec.ts) ──
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      # Keyed on BOTH lockfiles (not just packages/crypto's) so a change to
      # either invalidates the cache. This cache backs both the crypto interop
      # step below AND tests/tauri-lockfile-consistency.spec.ts's
      # `cargo metadata --locked --manifest-path apps/desktop/Cargo.toml` call
      # — see the "Warm cargo cache for apps/desktop" step for why that
      # matters (#927: a cold `~/.cargo/registry`/`~/.cargo/git` made that
      # check's resolve slow enough to look like a hang). rust-cache is the
      # sole owner of `~/.cargo/registry`, `~/.cargo/git` and each listed
      # workspace's `target` dir — a second hand-rolled `actions/cache` step
      # targeting the same paths raced this one's save/restore lifecycle and
      # produced a cache that matched neither key (#901).
      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            packages/crypto
            apps/desktop

      - name: Generate interop test vectors
        run: cargo test --manifest-path packages/crypto/Cargo.toml --test interop

      # tests/tauri-lockfile-consistency.spec.ts (run later via Playwright)
      # calls `cargo metadata --locked --manifest-path apps/desktop/Cargo.toml`
      # to verify apps/desktop/Cargo.lock is consistent. A cold registry index
      # plus a fresh clone of the `hpke-rs` git patch dependency made that call
      # slow enough on a cache-miss runner to look indistinguishable from a
      # hang (#927). Warm both here so the check's own cargo call is normally
      # a cache hit. `--locked` means this can only read the committed
      # lockfile, never rewrite it; `|| true` makes this step best-effort so a
      # genuine drift or network failure here doesn't short-circuit the actual
      # rail test's more precise classification (timeout vs environment vs
      # real drift) downstream.
      - name: Warm cargo cache for apps/desktop
        run: cargo fetch --locked --manifest-path apps/desktop/Cargo.toml || true

      # ── Generate BDD test files from Gherkin features ───────────
      - name: Generate BDD test files
        # export warms the transform cache single-threaded first — see the build job in ci.yml
        run: bunx bddgen export > /dev/null && bunx bddgen

      # ── Start preview server and run Playwright ─────────────────
      - name: Start Vite preview server
        run: |
          bunx vite preview --port 8788 --strictPort &
          PREVIEW_PID=$!
          echo "preview_pid=$PREVIEW_PID" >> "$GITHUB_ENV"
          for _i in $(seq 1 30); do
            if bun -e "try{await fetch('http://localhost:8788');process.exit(0)}catch{process.exit(1)}" 2>/dev/null; then
              echo "Preview server ready"
              break
            fi
            sleep 1
          done

      - name: Run desktop E2E tests
        # BDD tests already run in ci.yml's e2e job on every PR.
        # This workflow only runs the chromium (non-BDD spec) tests to avoid duplication.
        run: bunx playwright test --project=bootstrap --project=chromium
        env:
          CI: "true"
          PLAYWRIGHT_TEST: "true"
          PLAYWRIGHT_BASE_URL: "http://localhost:8788"
          E2E_TEST_SECRET: "test-reset-secret"
          DEV_RESET_SECRET: "test-reset-secret"
          TEST_HUB_URL: "http://localhost:3000"

      - name: Stop Vite preview server
        if: always()
        run: kill "$preview_pid" 2>/dev/null || true

      - name: Tear down Docker Compose
        if: always()
        run: |
          docker compose --env-file .env \
            -f deploy/docker/docker-compose.yml \
            -f deploy/docker/docker-compose.test.yml \
            down -v || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
