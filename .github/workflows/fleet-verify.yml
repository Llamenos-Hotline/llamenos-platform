# Fleet Verify
#
# The mechanical half of the fleet's merge gate (scope, never-write, impact,
# diff-targeted tests against the judged commit) — see the "Fleet gates"
# comment above `fleet-review` in ci.yml for the split rationale between the
# two gate jobs. This job lives in its OWN workflow file, split out of
# ci.yml in round 3 of #844.
#
# Why a separate file, not just a step-level tweak: this job deliberately
# executes the PR HEAD's own code — its "Verify" step runs the judged
# commit's own tests (see that step's comment below) — and CodeQL's
# actions/cache-poisoning/poisonable-step query flags ANY job that does that
# if its ENCLOSING WORKFLOW also triggers on an event with default-branch
# cache-write access: `push`, `workflow_dispatch`, `repository_dispatch`,
# `delete`, `registry_package`, `page_build`, or `schedule` (see
# `hasDefaultBranchCacheWriteAccess` / `defaultBranchCacheWriteEvent()` in
# CodeQL's `actions` query pack, codeql/actions-all —
# CachePoisoningQuery.qll). That reachability is computed from the
# WORKFLOW's `on:` block via `JobImpl.getATriggerEvent()`, which returns
# every event the enclosing workflow responds to — NOT filtered by this
# job's own `if:`. ci.yml triggers on both `push` (to main/desktop) and
# `workflow_dispatch` for its other jobs, so as long as `fleet-verify` lived
# there, CodeQL treated it as reachable from both those cache-write events
# regardless of its `if:` excluding them.
#
# This file's `on:` block is deliberately narrower than ci.yml's: only
# `pull_request` and `merge_group`. Neither appears in CodeQL's
# cache-write-event list above, so `hasDefaultBranchCacheWriteAccess` is
# false for every event this job can now be triggered by — that is what
# actually clears the alert (3 HIGH, PR #844 round 3), not any per-step
# cache setting. Confirmed by testing: `no-cache: true` on the "Setup Bun"
# step, tried first, did NOT clear it — CodeQL's flagged "poisonable steps"
# are the `bun ...` commands themselves (matched by its
# `poisonableCommandsDataModel`, which lists `bun` alongside `npm`/`cargo`/
# `pip install -r`/etc. as commands capable of running attacker-controlled
# lifecycle code), independent of whether any caching action is used at
# all. `no-cache: true` is kept below anyway as defense in depth — it costs
# nothing for a job that reinstalls fresh every run — but it is not what
# makes CodeQL go green.
name: Fleet Verify

on:
  # `types:` is spelled out rather than left bare, and `review_requested` is
  # the addition (#1124). A bare `pull_request:` means exactly
  # `[opened, synchronize, reopened]`, and that list is why `scope:<lane>`
  # grants (#1117) were inert: a grant is read HERE, inside this gate —
  # `resolveGrantedLanes` in orchestrator/src/ci.ts reads the PR's own labels
  # — but applying a label is not one of those three events, so nothing
  # re-evaluated the PR afterwards. The PR went on showing the `scope=fail`
  # verdict computed before the grant existed, until an unrelated push
  # happened to re-trigger the gate. Verified live before this fix: #1060
  # (scope:infra), #1064 (scope:desktop, scope:shared) and #1072
  # (scope:desktop) each carried their grant and each still reported the
  # stale failure.
  #
  # `review_requested`, not `labeled`, for two reasons. First, requesting a
  # review is ONE "re-evaluate this PR" event that serves both gates —
  # fleet/review already keys off the review-request flow (#1158/#1164), so
  # the operator applies the grant, requests a review, and verify re-runs
  # with the grant live while review runs on the fresh verdict. Second,
  # `labeled` fires on EVERY label change, because `on:` cannot filter by
  # label name; the only way to narrow it is a job-level `if:`, and per #848
  # a job instantiated on an event and then skipped by `if:` satisfies
  # branch protection exactly as a green check does. That is a fail-open,
  # and it is precisely the trap `review_requested` avoids by needing no
  # filtering at all. Do not add a job-level `if:` here to filter events.
  #
  # None of these four is in CodeQL's cache-write-event list above, so the
  # isolation this whole file exists to provide is unaffected.
  pull_request:
    types: [opened, synchronize, reopened, review_requested]
  merge_group:
    types: [checks_requested]

concurrency:
  # A distinct group name from ci.yml's own `ci-pr-*`/`ci-push-*` groups —
  # concurrency groups are scoped to the whole repository by default, not
  # per workflow file, so reusing ci.yml's names here would cancel or queue
  # against unrelated ci.yml runs sharing the same PR ref/SHA.
  group: ${{ github.event_name == 'pull_request' && format('fleet-verify-pr-{0}', github.ref) || format('fleet-verify-mg-{0}', github.sha) }}
  # Never cancelled: same reasoning as ci.yml's own `concurrency:` block — a
  # merge_group check that gets cancelled mid-run leaves its required check
  # permanently missing, which stalls the queue rather than failing it
  # loudly.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}  # deny-all; the job below sets its own

env:
  BUN_VERSION: "1.3.5"

jobs:
  fleet-verify:
    name: fleet/verify
    # `merge_group` alongside `pull_request`: cheap and mechanical, so it runs
    # at PR-open time for fast feedback AND again on the queue ref right
    # before the commit lands, satisfying it as a required check there too
    # (a required check that never reports on `merge_group` blocks the queue
    # forever). `fleet/review` does NOT get this treatment — see that job in
    # ci.yml. Kept even though this workflow's own `on:` block now only
    # carries these two events — redundant with the trigger list, but cheap
    # and it keeps the job self-documenting if another event is ever added
    # above.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # merge_group carries no PR context of its own (no `head.ref`, no
      # `number`) — only a queue ref (`gh-readonly-queue/<base>/pr-<n>-<sha>`)
      # with no lane grammar of its own. Resolving the PR's actual branch
      # name (`fleet/<lane>/<item>`, which is what `resolveLane` in ci.ts
      # reads) needs exactly one read of the PR's own metadata.
      pull-requests: read
    timeout-minutes: 20

    steps:
      # One step resolves what every later step and the CLI itself need,
      # regardless of which event triggered this run — nothing past this
      # point branches on `github.event_name` again.
      #
      # On `pull_request` these are the event's own base/head/branch/number.
      # On `merge_group` they are the QUEUE's base/head — the exact commits
      # that will land, which can differ from the PR's raw head if the queue
      # rebased it onto other entries ahead of it in line — and the PR's
      # ORIGINAL branch name, looked up because the queue ref does not carry
      # it. `head_ref`'s format is `refs/heads/gh-readonly-queue/<base>/
      # pr-<number>-<sha>` (confirmed against GitHub's published payload
      # example); the PR number is parsed out of it and validated as digits
      # only, before it goes anywhere near a `gh api` path segment.
      - name: Resolve the base/head SHAs and PR context for this event
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MQ_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"; head_sha="$PR_HEAD_SHA"; branch="$PR_HEAD_REF"; pr="$PR_NUMBER"
          else
            pr=$(echo "$MQ_HEAD_REF" | grep -oE 'pr-[0-9]+-' | grep -oE '[0-9]+' || true)
            if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
              echo "::error::could not parse a numeric PR number out of merge_group.head_ref: $MQ_HEAD_REF"
              exit 1
            fi
            branch=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq '.head.ref')
            base_sha="$MQ_BASE_SHA"; head_sha="$MQ_HEAD_SHA"
          fi
          {
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "branch=$branch"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"

      # The BASE commit, not the head. Everything the gate decides is computed
      # from this tree: its git history, its orchestrator code, its lockfile,
      # its node_modules. The commit under judgement never becomes code here.
      - name: Checkout the PR BASE (trusted)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.ctx.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      # The head arrives as DATA: fetched as an object, extracted with
      # `git archive | tar`. No `.git`, no checkout, nothing on a module path,
      # nothing executed. verify-ci/review-ci refuse outright if a `.git` ever
      # appears in there — see headDirRefusal in ci.ts.
      - name: Export the PR head as data
        env:
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          mkdir -p "$RUNNER_TEMP/head"
          git archive "$HEAD_SHA" | tar -x -C "$RUNNER_TEMP/head"
          test ! -e "$RUNNER_TEMP/head/.git"

      # `no-cache: true` — defense in depth, not what clears the CodeQL
      # alert (see the file-level comment above: the real fix is this
      # workflow's narrower `on:` block). Costs nothing for a job that
      # reinstalls fresh every run, and it still means this job never asks
      # GitHub's cache service for anything, belt-and-suspenders on top of
      # the trigger-scoping fix.
      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      # From the BASE lockfile, and `--ignore-scripts` on top: a postinstall is
      # the shortest path from "PR edits a dependency" to "PR runs code inside
      # its own judge".
      - name: Install dependencies (base lockfile, no install scripts)
        run: bun install --frozen-lockfile --ignore-scripts

      # The head export must have no node_modules of its own. `git archive`
      # exports whatever is committed, and a plain `ln -s` onto an existing
      # directory does not fail — it nests the link INSIDE it, leaving the
      # PR's own `node_modules/.bin/vitest` in place. So a committed
      # `node_modules` (directory, file or symlink) is refused before anything
      # is linked, and `ln -T` refuses to nest regardless.
      #
      # This is one of three locks on the same door: verify.ts also runs the
      # runner by absolute path from $GITHUB_WORKSPACE (never `bunx` from the
      # export), and refuses an export whose node_modules is not, by realpath,
      # this trusted install. The PR supplies test files and nothing else.
      - name: Make base dependencies available to the head export
        run: |
          set -euo pipefail
          head_modules="$RUNNER_TEMP/head/node_modules"
          if [ -e "$head_modules" ] || [ -L "$head_modules" ]; then
            echo "::error::the commit under judgement contains node_modules — refusing to judge it with a runner it could supply"
            exit 1
          fi
          ln -s -T "$GITHUB_WORKSPACE/node_modules" "$head_modules"

      # Two phases inside one command: scope/never-write/impact first, from
      # the base checkout with nothing of the PR's executing; then the PR's
      # own diff-targeted tests against the export, whose result can only AND
      # into the verdict already computed and printed. This job holds no
      # secrets, which is what makes running those tests acceptable at all.

      # Bootstrap guard. The gate runs from the BASE checkout by design, so
      # the FIRST pull request that introduces the gate cannot be judged by
      # it: the base predates it. This says so, instead of surfacing as an
      # unrelated "usage: llamenos-fleet <...>" and exit 2.
      #
      # It fails CLOSED, deliberately. After the gate has merged once, a base
      # without it means someone removed it from `main` — and that must stop
      # every PR until a human looks, never silently wave them through.
      - name: Check the base provides the gate
        run: |
          set -eu
          usage="$(bun orchestrator/src/cli.ts 2>&1 || true)"
          case "$usage" in
            *verify-ci*) ;;
            *)
              echo "::error::the base commit has no 'verify-ci' command, so it cannot judge this PR"
              echo "The gate deliberately runs from the BASE, never from the commit it judges."
              echo "The PR that INTRODUCES the gate therefore cannot pass it. Merge that one PR"
              echo "with these checks not yet required by the ruleset; every later PR is judged"
              echo "by the now-trusted, merged gate."
              exit 1
              ;;
          esac

      # GH_TOKEN: `verify-ci` reads the PR's live labels with `gh api
      # repos/<repo>/pulls/<n>` (readPrFacts in cli.ts) to resolve its
      # `scope:<lane>` grants (#1115). Without a token that read fails on
      # every run and the grants are silently dropped. The workflow token,
      # never a secret: this step runs the judged commit's own tests, and the
      # job's `pull-requests: read` is all that read needs. A rail
      # (tests/orchestrator/fleet-verify-token.test.ts) fails any step here
      # that reaches `gh` without one.
      #
      # That read is NOT a review lookup. This job has no review stage — its
      # trace's `review=not-run` is printed on every run — and the review is
      # the separate required `fleet/review`, which reads the PR itself and
      # fails closed on an unreadable read. The same rail file pins both
      # jobs' behaviour when the read fails.
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
          FLEET_CI_BRANCH: ${{ steps.ctx.outputs.branch }}
          FLEET_CI_PR: ${{ steps.ctx.outputs.pr }}
          FLEET_CI_HEAD_DIR: ${{ runner.temp }}/head
          FLEET_CI_HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          FLEET_CI_BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
        run: bun orchestrator/src/cli.ts verify-ci
