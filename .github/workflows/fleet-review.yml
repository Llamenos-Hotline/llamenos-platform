# Fleet Review
#
# The non-author-review half of the fleet's merge gate (see the "Fleet gates"
# comment above `fleet-verify` in `fleet-verify.yml` for the split between the
# two gate jobs). ONE job, ONE check named `fleet/review`, N reviews inside it.
#
# HOW IT IS TRIGGERED (#1158): a review being REQUESTED — or re-requested —
# from `llamenos-auto`; or from `rhonda-rodododo` on the `release` PR and on
# any PR `llamenos-auto` itself authored, where GitHub refuses to request
# `llamenos-auto` (#1232). Never from a team. `reviewTriggerLogins`
# (orchestrator/src/ci.ts) is the one statement of that rule.
# Requesting a review is a real, human-meaningful act that already means
# "look at this now". The `review` LABEL this replaces never meant that, and
# a required context producible only by a `labeled` event has no path forward
# whenever labelling fails: release PRs were never labelled at all, so they
# could never satisfy the gate (#1114), while showing no red check.
#
# WHAT IT REVIEWS: the general non-author review always runs. Reviewer
# PROFILES run alongside it, concurrently, in this same job — decided from
# the PR's `-reviewer` LABELS and from the PR ITSELF (a crypto diff gets the
# crypto review whether or not anyone remembered the label). See
# `decideReviewSet` in orchestrator/src/ci.ts. ANY FAIL FAILS. Once the whole
# set has PASSED, the second job below removes the labels it acted on — a
# self-clearing worklist, so what is still on the PR is what is still owed.
# #1092's per-specialist `fleet/review/<agent>` checks are GONE: they were N
# jobs and N required-looking contexts for one decision, and #1086 sat
# unmergeable behind one of them with no way forward.
#
# WHERE IT REPORTS (#1187): on a PULL REQUEST it reviews, and on a
# MERGE_GROUP it REPORTS the verdict the PR already earned — see "The merge
# queue's own arm" step below. `fleet/review` is a required context, and a
# required context that cannot report on the queue's synthetic
# `gh-readonly-queue/<base>/pr-<n>-<sha>` commit does not fail the entry, it
# leaves it at `AWAITING_CHECKS` forever. That is #1187: #1185 sat at
# position 1 with `CI`, `Fleet Verify` and `Secret Scanning` all green and
# this context simply absent, and the queue had to be turned off again.
#
# ---------------------------------------------------------------------------
# SIX THINGS THAT MUST NOT CHANGE. Each is a bug this file already shipped.
# ---------------------------------------------------------------------------
# 1. NO JOB-LEVEL `if:` ON `fleet-review`, EVER (#844/#848). GitHub treats a
#    SKIPPED required check as satisfied, exactly like a green one. #844
#    merged with `fleet/review` reporting "skipping" and no review ever run.
#    The job therefore always runs and always reaches a real conclusion; the
#    "Decide whether to run the review engine" step is what used to be the
#    `if:`, and its `not-requested` branch FAILS rather than skipping. A
#    review requested from somebody else is a red check, never a green skip.
#    Pinned by a rail in tests/orchestrator/guards.test.ts.
# 2. A PUSH MAY REPUBLISH A VERDICT; IT MAY NEVER START ONE (#1284).
#    `synchronize` IS a trigger now — this invariant used to forbid it
#    outright, and that wording is retired, not weakened. Read both halves.
#
#    WHY IT IS A TRIGGER. `fleet/review` is a required context under
#    `strict_required_status_checks_policy`, and a check run attaches to the
#    commit it ran on. A rebase moves the head, the earned verdict stays on
#    the OLD sha, and the new head carries NO `fleet/review` at all — a
#    permanent block that nothing but a manual remove-then-re-add of the
#    reviewer could clear (ten of them in one morning, once per open PR).
#    "The check must EXIST on this head" and "a review is WARRANTED" are two
#    different questions; a rebase changes only the first.
#
#    WHY IT IS NOT THE QUOTA BURN #812 FIXED. That fix predates #1158's
#    verdict cache, which is keyed on the DIFF HASH (`review-cache.ts`), so a
#    rebase with an unchanged diff is a `cache-hit` — no model call, the
#    stored verdict republished on the new head. A push that DID change the
#    diff has nothing cached, and the gate concludes `not-requested`: a red
#    check saying so, still no model call. `run-engine` is unreachable on a
#    push, and not by luck — `isRepublishOnlyEvent` (ci.ts) is passed to
#    `decideReviewGate` as `republishOnly`, which refuses `run-engine`
#    outright rather than resting on a `synchronize` payload happening to
#    carry no `requested_reviewer`. Pinned by rails in
#    tests/orchestrator/guards.test.ts.
#
#    STILL NEVER `opened`, `labeled` or `push`. `opened` re-enters through
#    CODEOWNERS (see `reviewTriggerLogins`), `labeled` is what #1158 retired,
#    and a `push` event carries no PR to attach a check to. That ban is
#    unchanged and nothing below relaxes it.
#
#    `review_requested` remains the ONLY thing that can start a review AND
#    clear this context. `workflow_dispatch` runs a real review too, but its
#    check run does not reach the PR's rollup — see its own comment under
#    `on:` below, and do not mistake it for a second route to a green gate.
#
#    AND THE RE-REQUEST IS NOT ALWAYS RE-EMITTABLE (#1471). When the required
#    reviewer is a CODEOWNER of a path the PR touches, GitHub re-adds the
#    request the instant you remove it, so the remove-then-re-add recovery
#    this file documents emits NO event: `DELETE .../requested_reviewers`
#    answers 200 with the PR object and changes nothing, the follow-up POST
#    no-ops on a login already requested, and `requested_reviewers` cannot
#    tell "requested just now" from "requested four days ago and never
#    re-fired" — so every command in the sequence reports success while
#    nothing happens. Measured both directions in one session: on #1372
#    (reviewer a code owner of a touched path) the list stayed populated and
#    the newest event stayed four days old; on #1467 (reviewer owning nothing
#    it touched) the identical sequence emptied the list and emitted a fresh
#    event. The honest check is the EVENTS endpoint, never `reviewRequests`:
#      gh api repos/<o>/<r>/issues/<n>/events \
#        --jq '[.[] | select(.event|test("review_request"))] | last'
#    `reviewNotRequestedAdvice` (ci.ts) is what stops the red check sending
#    its reader into that loop. The remaining gap — a verdict that can be
#    RECORDED when no event can be made to fire — is #1471, still open.
#
#    The republish arm never runs on `llamenos-review-box` — see `runs-on`
#    below. It cannot reach the engine, so it must not queue in front of a
#    review that can, and it must not add PR-triggered runs to the machine
#    holding the operator's logged-in `claude` session.
# 3. THE GATE RUNS FROM THE BASE REF; THE HEAD IS DATA (#665). This job
#    checks out the PR's BASE commit, installs from the BASE lockfile with
#    `--ignore-scripts`, and runs the orchestrator from that trusted tree.
#    The head arrives via `git archive | tar` with no `.git` and is never
#    executed, never installed, never on a module path; agent configuration
#    and every symlink are stripped from it. `headDirRefusal` (ci.ts) refuses
#    outright if a `.git` ever appears in there. The first version of this
#    design checked out the head and ran `bun install` from it, which handed
#    any PR editing `package.json` arbitrary execution inside its own judge.
# 4. FAIL CLOSED. Unreadable labels, an unresolvable reviewer profile, a
#    missing agent registry, an engine that cannot run — every one of them is
#    a red check naming the rule it broke. None may become "no review needed".
# 5. THE CHECK NAME IS `fleet/review`, EXACTLY, ON EVERY EVENT. It is a
#    required context in ruleset 15885614 (with `ci-status`, `gitleaks`,
#    `CodeQL`, `fleet/verify`). Renaming it needs a ruleset change and leaves
#    every open PR unmergeable in between. The job NAME is the check; do not
#    rename the `name:` value — and because ONE job serves both
#    `pull_request` and `merge_group`, there is exactly one `name:` to keep
#    right, which is the whole reason the merge-queue arm below is a STEP in
#    this job and not a second job of its own.
# 6. THE MERGE-QUEUE ARM MUST NEVER BECOME A SKIP (#1187, and invariant 1
#    again). `merge_group` is a trigger here, so this job is instantiated on
#    the queue ref and MUST publish a real conclusion there. Making it skip
#    instead — a job-level `if:`, or a second same-named job that skips on
#    the other event — would satisfy branch protection exactly like a green
#    check and let every queued merge bypass review invisibly: strictly
#    worse than the deadlock it replaces. Pinned by rails in
#    tests/orchestrator/fleet-review-merge-group.test.ts, which also runs
#    the arm's real script against every fail-closed branch it has.
#
# The label-clearing job below is deliberately a SEPARATE, GitHub-hosted job:
# it is the only thing here with write access, it checks out nothing and runs
# no repository code at all, and keeping it separate is what lets the review
# job — the one that runs a model next to the review key — stay read-only
# (`contents: read`, `pull-requests: read`, `actions: read`), which a rail in
# guards.test.ts pins.
#
# Outcomes of the gate step, all of which reach a real conclusion:
#   `review-set-unresolved` → FAIL. Could not work out what to review.
#   `cache-hit`             → no model call. A prior SUBSTANTIVE verdict
#                             exists for this exact diff AND this exact
#                             review set (`reviewSetTag`, review-cache.ts):
#                             a cached PASS concludes SUCCESS, a cached FAIL
#                             concludes RED with the original verdict
#                             restated. An UNREADABLE is never cached, so an
#                             infrastructure failure is always retried.
#   `low-tier`              → SUCCESS, no model call. `tierFor` (impact.ts)
#                             classifies every changed file Tier 0/1 — no
#                             reviewable content. Checked before the request
#                             check so a docs-only PR never sits red.
#   `not-requested`         → FAIL. Tier 2, no cached PASS, and either this
#                             review request was not for us, or this was a
#                             PUSH (#1284) — which changed the diff, so
#                             nothing the PR already earned covers the new
#                             head. Still no model call either way. Its
#                             ADVICE is `reviewNotRequestedAdvice` (ci.ts),
#                             which refuses to print "request a review from
#                             X" when the live `requested_reviewers` already
#                             lists X — that re-request emits no event, so
#                             the old fixed advice sent every reader into the
#                             one loop that cannot terminate (#1471). It
#                             names the dispatch instead.
#   `run-engine`            → the real review, then the label clear. Reached
#                             from a `review_requested`, or from a
#                             `workflow_dispatch` — both run the same review
#                             set and both can FAIL, but only the former's
#                             check run reaches the PR's rollup (see the
#                             `workflow_dispatch` comment under `on:`).
#
# Every run's outcome — each of those, and every way the review itself can
# end — is then NAMED on the check by the job's last step, "Name this run's
# outcome" (#1230): `PASS:…`, `REJECTED:…` (a reviewer rejected the diff) or
# `NO-VERDICT:…` (red because the gate fails closed; nothing judged the diff).
# The conclusion never changes: every non-PASS outcome is still `failure`.
#
# Workflow-file honesty: on a `pull_request` event the workflow definition is
# read from the PR's OWN head, so a PR can edit this file and have the edited
# version run. `.github/workflows/` is CODEOWNERS-protected; closing it fully
# needs #773. Base code re-strips the export (`REVIEWER_CONTROL_NAMES`,
# review.ts) and re-resolves the review set (`runReviewCi`) for exactly this
# reason: nothing base code decides may rest on a step in this file.
#
# Operator decision (#812): coding-agent SESSIONS review better than a thin
# API call. A self-hosted runner is registered for exactly this job — name
# `llamenos-review-box`, labels `self-hosted,Linux,X64,fleet-review` — with
# `claude` pre-installed and logged in under the operator's own account; that
# login state under `HOME` is the whole authentication mechanism (see
# `VERIFIER_ENV_ALLOWLIST` in orchestrator/src/review.ts).
# `FLEET_REVIEW_API_KEY` is kept only as the operator's "review is enabled"
# toggle and to keep CodeQL's cache-poisoning query treating this job as
# privileged (see `REVIEW_KEY_ENV` in ci.ts). Running PR-triggered work on a
# machine the operator owns is why "Refuse to run on a fork PR" is the
# literal first step of every job here. If the box is offline this job
# QUEUES — a PR simply cannot merge until it is back, which is fail-closed.
#
# The honest cost: the fleet's workers author with `claude` and the reviewer
# is also `claude` — a different session on a different machine with no
# shared context, but no longer an independent VENDOR. `FLEET_REVIEW_MODEL`
# (a repo variable, never a code change) is the dial for running the reviewer
# on a different model tier than the lanes use.
name: Fleet Review

on:
  # TWO actions, doing two different jobs — see invariant 2 in the header.
  #
  # `review_requested` is the only one that can START a review: a review
  # being requested, or re-requested, from `llamenos-auto` (or
  # `rhonda-rodododo` where `llamenos-auto` cannot be asked). It fires on
  # both the first request and every re-request, which is the whole signal.
  #
  # `synchronize` (#1284) exists so the required context REAPPEARS on a head
  # that moved. It can only republish what the PR already earned for this
  # exact diff (`cache-hit`), conclude on its own terms (`low-tier`,
  # `bot-authored`), or go red — never a model call, structurally
  # (`republishOnly`, ci.ts). Without it a rebase leaves the new head with no
  # `fleet/review` at all and the PR unmergeable until a human removes and
  # re-adds the reviewer by hand.
  #
  # NEVER add `opened`/`labeled`/`push` — see invariant 2.
  # GitHub cannot filter this trigger by WHO was requested, so the job runs
  # on every review request and the gate step decides; it must never become
  # a job-level `if:` (invariant 1).
  pull_request:
    types: [review_requested, synchronize]
  # The ESCAPE HATCH — and a real one, which is the whole of #1471. It runs
  # the full review set, reaches `run-engine` like any review request, and
  # can return FAIL. It is write-access-gated (a `workflow_dispatch` cannot
  # be triggered without write access to this repository), which is why
  # `reviewRequestFor` (ci.ts) accepts it with no reviewer login to check:
  # somebody with write access typing this PR's number IS the "look at this
  # now" that a review request means on the other arm.
  #
  # IT DOES NOT SATISFY THE REQUIRED CONTEXT, and this comment used to say it
  # did (#1471). A dispatch run's check DOES attach to `github.sha`, which for
  # `--ref <branch>` is that branch's tip at trigger time — but the check
  # SUITE a `workflow_dispatch` creates on a branch is not associated with the
  # PULL REQUEST, so that check run never enters the PR's status-check rollup.
  # Measured on three of #1471's PRs at once: #1372's head carries a
  # `pull_request` FAILURE and a later `workflow_dispatch` SUCCESS, and the
  # rollup surfaces only the FAILURE; #1378 the same; #1184's head carries TWO
  # dispatch successes and still shows a four-day-old red. So a dispatch is
  # how you GET a verdict (a real review, a real check run on the commit, a
  # readable outcome in the log) — not how you CLEAR the gate. Treat it as
  # debugging and as evidence, and do not route a blocked PR through it
  # expecting to merge.
  #
  # ALWAYS dispatch with `--ref <the PR's own head branch>`: the ctx step
  # refuses any other ref outright rather than review a diff nobody asked for
  # and write a `fleet/review` onto a commit that is not the PR's.
  #
  # Not the primary path: it takes an operator typing a PR number, so
  # nothing routine should depend on it, and `review_requested` stays the
  # trigger the fleet actually uses. Also used for local debugging and for
  # forcing a re-review after a provider-variable change (see "Switching the
  # review engine provider" in
  # docs/superpowers/specs/2026-09-11-llamenos-fleet-orchestrator-design.md).
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review — dispatch with --ref <that PR''s own head branch>; runs the real review set and can FAIL'
        required: true
        type: string
  # The merge queue's own event (#1187). REQUIRED, not optional: a required
  # status context that never reports on the queue's synthetic commit stalls
  # every entry at `AWAITING_CHECKS` indefinitely rather than failing it
  # loudly — `ci.yml`, `fleet-verify.yml` and `secret-scan.yml` all carry
  # this trigger for exactly that reason, and this file's absence of it is
  # the whole of #1187. It does NOT re-run the reviewer: the "Report the
  # queued PR's own review verdict" step republishes the verdict the PR head
  # already earned. See that step for why re-reviewing the queue commit is
  # the wrong answer.
  #
  # This adds no CodeQL cache-poisoning exposure: `merge_group` is not one of
  # the default-branch cache-write events that query keys off (`push`,
  # `workflow_dispatch`, `repository_dispatch`, `delete`, `registry_package`,
  # `page_build`, `schedule` — see fleet-verify.yml's file header), and this
  # job is excluded from that query anyway by its explicit
  # `secrets.FLEET_REVIEW_API_KEY` reference marking it privileged.
  merge_group:
    types: [checks_requested]

concurrency:
  # Distinct group names from ci.yml's and fleet-verify.yml's own groups —
  # concurrency groups are repo-scoped, not per-file, so reusing either of
  # their names here would cancel or queue against unrelated runs sharing the
  # same SHA/run id. `pull_request` groups by PR NUMBER, so a second event on
  # the same PR while a run is still in flight queues behind it instead of
  # racing two runs to publish the same context — which is exactly what
  # #1284's `synchronize` arm needs, since a push and a review request on one
  # PR are now two events that both conclude `fleet/review`;
  # `workflow_dispatch` groups by `run_id`
  # because two manual dispatches can target two different PRs at once and
  # must never collide.
  # `merge_group` groups by the queue commit: two entries in the queue are
  # two different commits and must never cancel or queue behind each other.
  group: ${{ github.event_name == 'pull_request' && format('fleet-review-pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('fleet-review-mg-{0}', github.sha) || format('fleet-review-wd-{0}', github.run_id) }}
  # Never cancelled: a required check that gets cancelled mid-run leaves its
  # context permanently missing rather than failing loudly (same reasoning as
  # ci.yml's and fleet-verify.yml's own `concurrency:` blocks) — which on a
  # `merge_group` ref is precisely the stall #1187 is about. A
  # workflow_dispatch run is already uniquely grouped by run id above, so
  # cancellation there would only ever cancel itself — moot either way, so
  # this stays `false` unconditionally rather than branching on event name
  # for no behavioral difference.
  cancel-in-progress: false

permissions: {}  # deny-all; the job below sets its own

env:
  BUN_VERSION: "1.3.5"

jobs:
  # The job NAME is the required check — `fleet/review` in the ruleset refers
  # to this `name:` value, not the job key. Do not rename it (invariant 5).
  #
  # The job posts no commit status of its own: a job result already IS a
  # check run under this name, so a same-named status would be a second copy
  # of the same verdict, and the `statuses: write` it would need is what
  # makes fork PRs (whose GITHUB_TOKEN is read-only) permanently unmergeable.
  #
  # This job never executes the judged commit's own code — only reads it as
  # data for the review model (the "Export the PR head as data" step strips
  # and never runs it) — so, unlike `fleet-verify`, it does not need file
  # isolation from a default-branch-cache-write event to clear CodeQL's
  # cache-poisoning query: its explicit `secrets.FLEET_REVIEW_API_KEY` access
  # makes CodeQL treat it as "privileged", which that specific query excludes
  # by design.
  fleet-review:
    name: fleet/review
    # NO job-level `if:` here — deliberately, and never again (invariant 1 in
    # the file header). GitHub cannot filter a `pull_request` trigger by WHO
    # a review was requested from, only by `types:`, so this job IS
    # instantiated on every review request, including ones aimed at a human
    # colleague — and, since #1284, on every push too. The "Decide whether to
    # run the review engine" step is what used to be this `if:`; the
    # difference is that its `not-requested` branch FAILS the job instead of
    # skipping it, and its `cache-hit`, `low-tier` and `bot-authored`
    # branches SUCCEED the job instead of skipping it — either way the job
    # reaches a real, reported conclusion, which a job-level `if:` can never
    # guarantee once GitHub decides the job merely "didn't run". That is also
    # why the push arm is not an `if:` on this job: a skipped `fleet/review`
    # on a pushed head would satisfy the ruleset exactly like a green one.
    # #812: a dedicated self-hosted runner for every event that CAN reach the
    # review engine — see the file header, and the "Refuse to run on a fork
    # PR" step below.
    #
    # The ONE exception (#1284) is the republish arm: a `pull_request` whose
    # action is `synchronize`. That arm provably cannot reach the engine
    # (`republishOnly` in ci.ts refuses `run-engine` on it), so it needs
    # nothing `llamenos-review-box` has — and putting it there would be
    # actively wrong twice over. `llamenos-review-box` is ONE machine that
    # every merge in this repo waits on, and `cancel-in-progress` is
    # deliberately `false`, so a push storm would queue in front of the real
    # reviews it exists to run. It is also the machine holding the operator's
    # logged-in `claude` session under `HOME`, which is why a fork guard is
    # this job's literal first step; multiplying the PR-triggered runs that
    # land on it, for an arm that needs none of that, buys exposure for
    # nothing.
    #
    # Decided from the event payload alone, so it resolves before the job
    # starts and can never disagree with the gate's own later decision.
    # Pinned by a rail in tests/orchestrator/guards.test.ts, which also
    # asserts `ubuntu-latest` appears here ONLY under that condition.
    runs-on: ${{ github.event.action == 'synchronize' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","fleet-review"]') }}
    # Read by the label-clearing job below. `outcome` and `clear_labels` are
    # written by the gate step (`runReviewGate`, cli.ts); `clear_labels` is
    # non-empty ONLY on the `run-engine` path, so a cache hit, a low-tier
    # pass or any failure clears nothing.
    outputs:
      outcome: ${{ steps.gate.outputs.outcome }}
      clear_labels: ${{ steps.gate.outputs.clear_labels }}
      # The commit this run judged, so every comment the publishing job
      # posts can NAME it (#1230): a verdict comment outlives its head, and
      # one that says which head it judged is visibly stale once the PR
      # moves on, rather than merely old.
      head_sha: ${{ steps.ctx.outputs.head_sha }}
    permissions:
      # contents: read — the reviewer runs inside this job, so the
      # containment that matters is that NOTHING from the commit under
      # judgement ever executes here: it is a `git archive` export the model
      # reads, never a checkout, never installed, never on a module path.
      contents: read
      # Used only on the workflow_dispatch path (`gh api .../pulls/$pr`) to
      # resolve the PR's branch name and base/head SHAs. The `pull_request`
      # (labeled) path needs no API call at all — the label event's own
      # payload already carries all three.
      pull-requests: read
      # Read-only, for the review-cache lookup (`review-cache.ts`'s
      # `GET .../actions/artifacts?name=...`) — never `: write`. See the
      # "review job still has no write permission" rail in guards.test.ts:
      # this line is exactly why that rail asserts `read`, not the whole
      # key's absence.
      actions: read
      # Read-only, for the merge-queue arm alone: reading the `fleet/review`
      # CHECK RUN already recorded on the queued PR's head
      # (`GET .../commits/<sha>/check-runs`) is what lets this job report
      # that verdict on the queue commit instead of spending a second model
      # call re-deriving it. Never `: write` — this job publishes its verdict
      # by BEING the check run, never by writing someone else's.
      checks: read
    # HIGH_IMPACT_TIMEOUT_MS is 20 minutes (review.ts — widened at #812 from
    # the old thin-API-call budget now that the reviewer is a full claude
    # session on the operator's own Max subscription, not a metered,
    # quota'd provider); this stays comfortably above that so the JOB itself
    # is never what kills a review still within its own budget — checkout,
    # deps, the smoke call and the cache lookup all have to fit in the
    # difference too.
    timeout-minutes: 30

    # Repo Settings > Secrets and variables > Actions > Variables — so
    # raising the reviewer's model tier is an operator action (one repo
    # variable), never a code change or a PR. The smoke-test step below and
    # the "Review" step both key off this; `review.ts`'s `REVIEWER_MODEL`
    # reads the identical env var with the identical default, so a variable
    # change moves the smoke test and the real review together. There is no
    # `FLEET_REVIEW_PROVIDER` any more — `claude`, pre-authenticated on this
    # runner, is the only provider now (see the file header).
    #
    # #891 banned a silent literal default for the review engine, but that
    # was about a swappable PROVIDER id going stale and being guessed at
    # invisibly (`kimi-for-coding`, retired twice under everyone's feet — see
    # the comment above `DEFAULT_OPENCODE_MODEL` in `orchestrator/src/
    # review.ts`, kept for that history even though it no longer drives this
    # job). This job has no provider left to guess at: `claude` is the only
    # engine (`reviewerBinaryFor` hard-fails for anything else), and
    # `'sonnet'` is a real, always-valid model tier, not a dead id someone
    # forgot to update — the smoke test below still classifies a bad
    # `FLEET_REVIEW_MODEL` as `engine-misconfigured` before the real review
    # ever runs, so an operator TYPO is still loud, just not an unconfigured
    # variable being silently invisible the way an absent provider id was.
    env:
      FLEET_REVIEW_MODEL: ${{ vars.FLEET_REVIEW_MODEL || 'sonnet' }}
      # The reviewer's tool restriction, carried BY THIS WORKFLOW rather than
      # imported from `orchestrator/src/review.ts` at gate time. It must
      # equal `REVIEWER_TOOLS` in that module, and
      # `tests/orchestrator/guards.test.ts` asserts exactly that — in the
      # TEST SUITE, where this file and that module are the same commit.
      #
      # It cannot be an import here, because this job executes the HEAD's
      # copy of this YAML against a BASE checkout of the source
      # (`ref: base_sha`, deliberate — the gate never runs the code it
      # judges). Those two refs are different by design, so a `bun -e`
      # import of any symbol the head ADDS resolves against a base that
      # does not have it yet and dies with `SyntaxError: Export named
      # 'REVIEWER_TOOLS' not found` — which deadlocks the gate for the very
      # PR adding the symbol, and for every future one that does the same.
      # That is not a bootstrap quirk to absorb once; it is a trap that
      # re-arms. A literal here crosses no version boundary, and the drift
      # it could otherwise hide is caught by the test above instead.
      FLEET_REVIEWER_TOOLS: Read,Grep,Glob

    steps:
      # MANDATORY, and must stay the literal first step: a self-hosted
      # runner executing PR-triggered work is dangerous enough that this
      # check must run before anything else in the job — before the base
      # checkout, before the head export, before even `bun` is on PATH. A
      # `workflow_dispatch` run has no `pull_request` payload at all (it is
      # an operator-triggered, write-access-gated event), so it is exempt by
      # construction rather than by an explicit allowlist.
      - name: Refuse to run on a fork PR (self-hosted runner guard)
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$THIS_REPO" ]]; then
            echo "::error::fleet/review FAILED: fork-pr-guard — this gate must never process a fork PR, on either arm: the review arm runs on a self-hosted runner, and the republish arm would republish a verdict onto a head this repository does not control (head repo '$HEAD_REPO' != '$THIS_REPO')"
            exit 1
          fi

      # ── The merge queue's own arm (#1187): REPORT, do not re-review ─────
      # A merge queue builds a synthetic `gh-readonly-queue/<base>/pr-<n>-<sha>`
      # commit and waits for every required context on THAT commit. This step
      # is how `fleet/review` reports there.
      #
      # It republishes the verdict the PR head already earned rather than
      # reviewing the queue commit, because the queue commit is the PR merged
      # into the CURRENT base — a DIFFERENT diff. The content-hashed review
      # cache (`review-cache.ts`) therefore misses by construction, so
      # re-reviewing is a full model call for every queued merge, on top of
      # the one the PR already paid; this repo ran 100 review jobs in 24
      # hours to land 6 PRs, and doubling that is the wrong direction. It
      # would also be re-judging code that has already been reviewed and
      # approved, against a base that moved for reasons unrelated to the PR.
      # The claim stays honest either way: "this code was reviewed" is true
      # of the PR head, and the queue commit adds only `main`, which was
      # reviewed on its own way in.
      #
      # THIS STEP MUST NEVER BECOME A SKIP (invariant 6, and invariant 1
      # before it). It is a step inside the one `fleet/review` job — not a
      # job-level `if:`, not a second same-named job — so the job is
      # instantiated on the queue ref and reaches a real conclusion there.
      # Every path below either exits 0 having PROVEN a passing review
      # exists, or exits 1 naming the PR and the reason. "Assert this run
      # reached a real verdict", at the end of the job, refuses to let the
      # job conclude green if this step did not run when it should have.
      #
      # The PR number is parsed out of `merge_group.head_ref` with the exact
      # two lines `fleet-verify.yml`'s own `ctx` step uses, kept byte-for-byte
      # identical by a rail in
      # tests/orchestrator/fleet-review-merge-group.test.ts — two gates that
      # disagreed about which PR a queue entry belongs to would be a far
      # worse bug than the duplication.
      - name: Report the queued PR's own review verdict (merge_group)
        id: queue
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MQ_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MQ_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          pr=$(echo "$MQ_HEAD_REF" | grep -oE 'pr-[0-9]+-' | grep -oE '[0-9]+' || true)
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::fleet/review FAILED: queue-ref-unparseable — could not parse a numeric PR number out of merge_group.head_ref: $MQ_HEAD_REF"
            exit 1
          fi

          # Guarded captures throughout (`if ! x=$(...)`), for the same
          # reason the workflow_dispatch branch of the `ctx` step below is:
          # under the inherited `-e` a bare assignment dies on the first API
          # hiccup with nothing but gh's raw stderr, and a required check
          # that goes red with no reason is what stalls a queue entry a
          # human then has to dig out of the logs.
          if ! pr_json="$(gh api "repos/$REPO/pulls/$pr" 2>&1)"; then
            echo "::error::fleet/review FAILED: queue-pr-lookup — \`gh api .../pulls/$pr\` failed while resolving the PR behind queue entry $MQ_HEAD_REF:"
            printf '%s\n' "$pr_json"
            exit 1
          fi
          pr_head="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
          if [[ ! "$pr_head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::fleet/review FAILED: queue-pr-head-unresolved — PR #$pr's head SHA did not parse out of the API response (got '$pr_head')"
            exit 1
          fi

          # The verdict is read from the CHECK RUN this same job already
          # published on the PR's head — the same context, the same name, the
          # same job — never from a PR approval or a comment. An approving
          # GitHub review is a human artifact the fleet must not read as its
          # own gate, and a comment is text. `--paginate` with a jq filter
          # rather than the `check_name=` query parameter: a head commit here
          # carries well over a page of check runs, and a filter that
          # silently matched nothing would fail this step for a PR that was
          # in fact reviewed.
          if ! runs="$(gh api --paginate "repos/$REPO/commits/$pr_head/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name == "fleet/review")' | jq -s -c '.')"; then
            echo "::error::fleet/review FAILED: queue-check-lookup — could not read the check runs on PR #$pr's head $pr_head:"
            printf '%s\n' "$runs"
            exit 1
          fi
          completed="$(printf '%s' "$runs" | jq -c '[.[] | select(.status == "completed")] | sort_by(.completed_at)')"
          in_flight="$(printf '%s' "$runs" | jq -r '[.[] | select(.status != "completed")] | length')"
          if [ "$in_flight" != "0" ]; then
            echo "::warning::PR #$pr has $in_flight fleet/review run(s) still in flight on $pr_head; this verdict is the latest COMPLETED one"
          fi
          if [ "$(printf '%s' "$completed" | jq -r 'length')" = "0" ]; then
            echo "::error::fleet/review FAILED: queue-pr-unreviewed — PR #$pr's head $pr_head carries no completed fleet/review check run, so this queue entry has no review to report"
            echo "Request a review from the fleet reviewer on PR #$pr, let fleet/review conclude on its head, then re-queue it."
            exit 1
          fi
          # The LATEST completed run, never "any of them passed": a
          # re-requested review that found a problem after an earlier pass
          # must block the queue, not be outvoted by the run it supersedes.
          conclusion="$(printf '%s' "$completed" | jq -r 'last | .conclusion')"
          run_url="$(printf '%s' "$completed" | jq -r 'last | .html_url')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::fleet/review FAILED: queue-pr-review-not-passing — PR #$pr's own fleet/review concluded '$conclusion' on its head $pr_head ($run_url); refusing to report a pass for queue commit $MQ_HEAD_SHA"
            exit 1
          fi
          echo "fleet/review PASS — reported, not re-run."
          echo "PR #$pr's own fleet/review concluded 'success' on its head $pr_head ($run_url)."
          echo "Queue commit $MQ_HEAD_SHA is that reviewed head merged onto $MQ_BASE_SHA, which was itself reviewed on its own way into main."

      # Everything from here to the end of the job is the PULL REQUEST /
      # WORKFLOW_DISPATCH review path, and every step of it carries
      # `if: github.event_name != 'merge_group'` — the queue arm above has
      # already produced this job's verdict, and the reviewing pipeline must
      # not spend a checkout, an install or a model call re-deriving it.
      # These are STEP-level conditions, which skip a step without ever
      # touching the JOB's conclusion; the job still runs and still reports
      # (invariants 1 and 6).
      #
      # On `pull_request` (the review-request event), the base/head SHAs and
      # the PR's own branch name all come straight from the event's own
      # payload — GitHub computed it for exactly this event, so there is no
      # race to defend against and no extra `gh api` round trip needed
      # (unlike the workflow_dispatch path below). This is also the event
      # whose check-run attaches to the right commit automatically — see the
      # file header for why that property is the whole reason this file no
      # longer triggers on `merge_group`/`workflow_dispatch` alone.
      #
      # On `workflow_dispatch`, `pr_number` is the operator-supplied input —
      # validated as digits-only before it goes anywhere near a `gh api` path
      # segment, even though this input is not attacker-reachable
      # (workflow_dispatch requires write access to trigger at all).
      #
      # `head_sha` on workflow_dispatch is `github.sha`, NOT a fresh
      # `pulls/$pr` query of `.head.sha`: GitHub attaches this run's check
      # runs to `github.sha`, which for a `workflow_dispatch` event is fixed
      # at trigger time to the tip of whatever `--ref <branch>` resolved to,
      # and stays fixed even if the branch moves before this job starts. A
      # live `.head.sha` query is a DIFFERENT commit any time a push lands in
      # that race window — which would review a commit the check-run does not
      # actually correspond to. Pinning to `github.sha` guarantees the two
      # are always the same commit by construction, not by timing luck.
      - name: Resolve the base/head SHAs and PR context for this event
        id: ctx
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
          DISPATCH_SHA: ${{ github.sha }}
          # The ref this run was dispatched against — checked against the
          # PR's own head branch below, so a dispatch can never publish a
          # verdict onto a commit belonging to something else.
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pr="$PR_EVENT_NUMBER"
          else
            pr="$DISPATCH_PR"
          fi
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::fleet/review FAILED: no-pr-number — no numeric PR number to review (pull_request number=$PR_EVENT_NUMBER, workflow_dispatch pr_number=$DISPATCH_PR)"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_EVENT_BASE_SHA"
            head_sha="$PR_EVENT_HEAD_SHA"
            branch="$PR_EVENT_BRANCH"
          else
            # Guarded (`if ! x=$(...)`, not a bare assignment): under this
            # step's inherited `-e`, an unguarded `pr_json="$(gh api ...)"`
            # would die the instant `gh api` failed (bad PR number, an
            # unreachable API, an expired token) with nothing beyond gh's own
            # raw stderr tying the failure back to "resolving PR #$pr for
            # workflow_dispatch" at all.
            if ! pr_json="$(gh api "repos/${{ github.repository }}/pulls/$pr" 2>&1)"; then
              echo "::error::fleet/review FAILED: gh-api-pr-lookup — \`gh api .../pulls/$pr\` failed while resolving context for workflow_dispatch:"
              printf '%s\n' "$pr_json"
              exit 1
            fi
            branch="$(echo "$pr_json" | jq -r '.head.ref')"
            base_sha="$(echo "$pr_json" | jq -r '.base.sha')"
            head_sha="$DISPATCH_SHA"
            live_head="$(echo "$pr_json" | jq -r '.head.sha')"
            if [[ "$branch" == "null" || -z "$branch" || "$base_sha" == "null" || -z "$base_sha" ]]; then
              echo "::error::fleet/review FAILED: gh-api-pr-parse — \`gh api .../pulls/$pr\` returned data that did not parse into a branch/base_sha (got branch='$branch' base_sha='$base_sha'); raw response:"
              printf '%s\n' "$pr_json"
              exit 1
            fi
            # The dispatched REF must be the PR's own head branch. This is
            # the one thing that keeps the dispatch arm honest now that it is
            # a real trigger (#1471): a dispatch run's check attaches to
            # `github.sha`, which is whatever `--ref` resolved to, NOT
            # anything derived from `pr_number`. Dispatching `--ref main -f
            # pr_number=1184` would therefore review 1184's base-to-main diff
            # and publish the verdict as a `fleet/review` on main's tip; with
            # `--ref some-other-pr-branch` it would publish it on ANOTHER
            # PR's head, handing that PR a required green it never earned.
            # Both are a check that does not describe the commit it is
            # attached to, which is the whole failure class this file's
            # invariants exist to prevent. Refuse, naming the fix, rather
            # than review a diff nobody asked for.
            if [[ "$DISPATCH_REF" != "$branch" ]]; then
              echo "::error::fleet/review FAILED: dispatch-ref-mismatch — this run was dispatched against ref '$DISPATCH_REF', but PR #$pr's head branch is '$branch'. A dispatch run's check attaches to the dispatched ref's commit ($head_sha), so reviewing PR #$pr from here would publish its verdict onto a commit that is not the PR's head."
              echo "Re-dispatch with the PR's own branch: gh workflow run fleet-review.yml --ref $branch -f pr_number=$pr"
              exit 1
            fi
            if [[ "$live_head" != "$head_sha" ]]; then
              echo "::warning::PR #$pr's current head ($live_head) differs from the dispatched commit ($head_sha) — a newer commit has landed since this run was triggered. Reviewing the dispatched commit only; re-dispatch against the new head once it is ready."
            fi
          fi
          # NOTE: whether this event actually ASKS US for a review is NOT
          # decided here. It is `reviewRequestFor` (orchestrator/src/ci.ts),
          # evaluated inside the gate step from the raw event fields below —
          # one testable, fail-closed place, rather than a bash comparison
          # nothing pins. This step only resolves WHAT is being judged.
          {
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "branch=$branch"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"

      # The BASE commit, not the head. Everything the gate decides is computed
      # from this tree: its git history, its orchestrator code, its lockfile,
      # its node_modules. The commit under judgement never becomes code here.
      - name: Checkout the PR BASE (trusted)
        if: github.event_name != 'merge_group'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.ctx.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      # The head arrives as DATA: fetched as an object, extracted with
      # `git archive | tar`. No `.git`, no checkout, nothing on a module path,
      # nothing executed. verify-ci/review-ci refuse outright if a `.git` ever
      # appears in there — see headDirRefusal in ci.ts.
      #
      # Agent instructions and configuration are then stripped, with every
      # symlink: `opencode.json(c)` declares MCP servers that get spawned,
      # `.opencode/` holds tool and plugin modules that get imported and run,
      # `AGENTS.md`/`CONTEXT.md`/`CLAUDE.md` are prompt text an engine obeys,
      # `.claude/` and `.agents/` carry hooks and skills. A PR controls all of
      # them, and the reviewer runs next to the review key. A symlink would
      # turn the reviewer's read access to this tree into read access to
      # `~/.local/share/opencode/auth.json`. review.ts strips the same set
      # again (REVIEWER_CONTROL_NAMES) from base code, because this workflow
      # file is the PR's own copy on the ref this job checked out.
      - name: Export the PR head as data
        if: github.event_name != 'merge_group'
        env:
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          mkdir -p "$RUNNER_TEMP/head"
          git archive "$HEAD_SHA" | tar -x -C "$RUNNER_TEMP/head"
          # A bare `test ! -e ...` here would die under `-e` with ZERO
          # output the moment a `.git` ever appeared in the export — exactly
          # the opaque "exit code 1" this file's steps must never produce,
          # and on the one invariant (never execute the judged commit's own
          # code — see the gate's first catch, #665) this step exists to
          # enforce. Spelled out as an explicit if/exit instead.
          if [ -e "$RUNNER_TEMP/head/.git" ]; then
            echo "::error::fleet/review FAILED: git-export-invariant — \`git archive\` produced a .git entry at $RUNNER_TEMP/head/.git; this export must never carry a git object database"
            exit 1
          fi
          control=( \( -iname opencode.json -o -iname opencode.jsonc -o -iname .opencode
            -o -iname AGENTS.md -o -iname CONTEXT.md -o -iname .agents
            -o -iname CLAUDE.md -o -iname .claude -o -type l \) )
          find "$RUNNER_TEMP/head" -mindepth 1 "${control[@]}" -prune -print -exec rm -rf {} +
          left="$(find "$RUNNER_TEMP/head" -mindepth 1 "${control[@]}" -print -quit)"
          if [ -n "$left" ]; then
            echo "::error::fleet/review FAILED: agent-config-strip — agent configuration survived the strip: $left"
            exit 1
          fi

      - name: Setup Bun
        if: github.event_name != 'merge_group'
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # From the BASE lockfile, and `--ignore-scripts` on top: a postinstall is
      # the shortest path from "PR edits a dependency" to "PR runs code inside
      # its own judge".
      - name: Install dependencies (base lockfile, no install scripts)
        if: github.event_name != 'merge_group'
        run: bun install --frozen-lockfile --ignore-scripts

      # Bootstrap guard, part 1 of 2 — guards the INVOCATION OF THE GATE
      # ITSELF, before it ever runs. (Part 2 is the existing "Check the base
      # provides the gate" step further down, which guards `review-ci` the
      # same way, once `review-gate` has already succeeded.)
      #
      # "Decide whether to run the review engine" below assumes the BASE
      # checkout has both `orchestrator/src/cli.ts` and its `review-gate`
      # command. For the PR that first introduces either, that is false by
      # construction — the gate runs from the BASE, never from the commit it
      # judges, so the PR that adds the gate cannot yet be judged by it (see
      # "Check the base provides the gate" below, which already documents
      # and handles exactly that one-time case for `review-ci`).
      #
      # What that existing step does NOT cover is every PR *after* that one:
      # GitHub does not refresh an open PR's `base.sha` on every push to the
      # base branch — it is only recomputed when the PR itself receives a
      # synchronize/update event — so a PR nobody has touched in days (a
      # dependabot PR routinely sits for weeks) can carry a `base.sha` from
      # well before `review-gate` (or even `cli.ts` itself) landed on main,
      # with no PR-side action having removed anything.
      #
      # Verified against two real, currently-open dependabot PRs re-reviewed
      # by the operator (run 35403493398 for #630, run 35403500475
      # for #626): #630's base predates `orchestrator/src/cli.ts` entirely,
      # so `bun orchestrator/src/cli.ts review-gate` a few steps below failed
      # with bun's own uncaught `error: Module not found` — no diagnostic, no
      # `outcome` output, the job just goes red. #626's base has `cli.ts` but
      # predates `review-gate` being registered in its command table, so the
      # same invocation printed `usage: llamenos-fleet <doctor|tick|...>`
      # (no `review-gate` in the list) and exited 2 — same result, different
      # uncaught shape. Either way, because the crash happens INSIDE the gate
      # step, the existing "Check the base provides the gate" step (which
      # only runs `if: steps.gate.outputs.outcome == 'run-engine'`) can never
      # be reached to explain it — `outcome` was never set.
      #
      # This step runs unconditionally, before that first invocation, so
      # BOTH shapes above become one clear, actionable failure instead of an
      # opaque crash: update or rebase the PR against a newer main to pick up
      # `review-gate`, then re-request the review.
      - name: Check the base provides the review gate itself
        id: base_gate
        if: github.event_name != 'merge_group'
        run: |
          set -euo pipefail
          if [ ! -f orchestrator/src/cli.ts ]; then
            echo "::error::fleet/review FAILED: base-predates-gate — the base commit predates the fleet review gate (orchestrator/src/cli.ts does not exist), so it cannot judge this PR"
            echo "The gate deliberately runs from the BASE, never from the commit it judges."
            echo "This PR's base is stale — update/rebase it against a newer main to pick up fleet review support, then re-request the review."
            exit 1
          fi
          usage="$(bun orchestrator/src/cli.ts 2>&1 || true)"
          case "$usage" in
            *review-gate*) ;;
            *)
              echo "::error::fleet/review FAILED: base-missing-review-gate-command — the base commit has no 'review-gate' command, so it cannot judge this PR"
              echo "This PR's base predates the fleet review gate — update/rebase it against a newer main to pick up review-gate support, then re-request the review."
              exit 1
              ;;
          esac

      # This is what used to be the job's `if:` (see the file header) —
      # moved inside the job, as a real step with a real exit code, so the
      # JOB always reaches a conclusion instead of sometimes not running at
      # all. `decideReviewGate` (ci.ts) does the actual work; this step only
      # wires its four outcomes to the pipeline:
      #   - `cache-hit`     → no model call either way. Every later step's
      #     `if:` below reads `outcome == 'run-engine'` and skips, so
      #     nothing past this point spends one. A cached PASS exits 0 and
      #     the job concludes SUCCESS; a cached substantive FAIL exits 1,
      #     restating the original verdict (#1158) — the diff has not
      #     changed since, so re-reviewing could only reach the same
      #     conclusion. An UNREADABLE is never cached.
      #   - `low-tier`      → exits 0, with the tier and contributing files
      #     printed to this step's own stdout (`runReviewGate`, cli.ts) —
      #     `tierFor` (impact.ts) classified every changed file as Tier 0/1
      #     (no executable content, or instructions/tooling already earning a
      #     code-owner review). Every later step skips exactly as in
      #     `cache-hit` — the job concludes SUCCESS with no engine call,
      #     regardless of who the review was requested from.
      #   - `run-engine`    → exits 0, later steps proceed. `profiles` names
      #     the reviewer profiles to run alongside the general review, and
      #     `clear_labels` the labels to remove once they all pass.
      #   - `review-set-unresolved` → exits 1: the PR's labels could not be
      #     read, or a review it asks for (by label or by its own content)
      #     does not resolve to a known agent. Fail closed — "we could not
      #     work out what to review" never becomes "nothing needed it".
      #   - `not-requested` → exits 1 (see `runReviewGate` in cli.ts). Either
      #     the review was requested from somebody else, or this was a PUSH
      #     that changed the diff (#1284), which can never start a review
      #     whatever else is true (`republishOnly`, ci.ts). Exiting 1
      #     stops every later step from running at all (GitHub Actions does
      #     not run subsequent steps after a failure unless they opt in with
      #     `if: always()`/`if: failure()` — none of the engine steps do)
      #     and fails the job. No engine call, no skip, fail closed.
      #
      # The four `FLEET_REVIEW_*` event fields below are what `reviewRequestFor`
      # (ci.ts) judges, read by `reviewRequestEventFromEnv` — passed through
      # `env:` and never interpolated into this script, because a login is
      # attacker-influenced text, and never compared HERE: a YAML copy of the
      # rule is exactly what drifted into #1213's shim. The PR AUTHOR decides
      # who may trigger the review (#1232: GitHub refuses to request a PR's
      # author, so on a PR `llamenos-auto` wrote, the operator stands in).
      # A TEAM request leaves `requested_reviewer` empty and fills
      # `requested_team`, which is passed only so the red `not-requested`
      # check can say a team was asked, and whom to ask instead.
      #
      # Needs only `contents: read` (git, already granted for the checkout
      # above), `pull-requests: read` (the live label/description read that
      # decides the review set) and `actions: read` (the cache lookup) — no
      # new permission for this step.
      - name: Decide whether to run the review engine
        id: gate
        if: github.event_name != 'merge_group'
        env:
          FLEET_CI_BRANCH: ${{ steps.ctx.outputs.branch }}
          FLEET_CI_PR: ${{ steps.ctx.outputs.pr }}
          FLEET_CI_HEAD_DIR: ${{ runner.temp }}/head
          FLEET_CI_HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          FLEET_CI_BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
          FLEET_REVIEW_EVENT_NAME: ${{ github.event_name }}
          # WHICH `pull_request` action fired. The event NAME cannot tell
          # `review_requested` from `synchronize`, and the two mean opposite
          # things here — one asks for a review, the other only moves the
          # head under one already given (`isRepublishOnlyEvent`, ci.ts).
          FLEET_REVIEW_EVENT_ACTION: ${{ github.event.action }}
          FLEET_REVIEW_REQUESTED_REVIEWER: ${{ github.event.requested_reviewer.login }}
          FLEET_REVIEW_REQUESTED_TEAM: ${{ github.event.requested_team.slug }}
          FLEET_REVIEW_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # A re-published cached verdict is written here too, so a cache
          # hit still reads as a review on the PR rather than a bare status.
          FLEET_REVIEW_REPORT_DIR: ${{ runner.temp }}/review-report
          GH_TOKEN: ${{ github.token }}
        run: bun orchestrator/src/cli.ts review-gate

      # Bootstrap guard, the SAME shape as "Check the base provides the
      # review gate itself" / "Check the base provides the gate" above and
      # below — for the same underlying reason, one function narrower:
      # `reviewerInvocationFor` (review.ts) is THIS PR's own addition, and
      # the smoke step two steps down imports it from the BASE checkout, not
      # from this PR's head (the gate always judges from base — see the file
      # header). A base that predates it cannot run that import at all: `bun
      # -e "import { reviewerInvocationFor } from ..."` fails at module-load
      # time with bun's own uncaught `SyntaxError: Export named
      # 'reviewerInvocationFor' not found`, before the smoke step's own
      # `fail()` classification ever gets a chance to run — the exact opaque
      # crash shape the two gate-bootstrap steps above already exist to
      # replace with a named, actionable failure.
      #
      # This is the PR that introduces `reviewerInvocationFor` (#866 itself),
      # so this check will FAIL on this PR's own `fleet/review` run, by
      # construction — the identical, already-accepted bootstrap limitation
      # "Check the base provides the gate" documents for `review-ci`: merge
      # with this check not yet required by the ruleset (or via an
      # authorized override), and every later PR is judged by the
      # now-trusted, merged engine-resolution code, because base will then
      # actually provide the symbol this checks for.
      - name: Check the base provides reviewerInvocationFor
        if: steps.gate.outputs.outcome == 'run-engine'
        run: |
          set -euo pipefail
          if ! grep -q '^export function reviewerInvocationFor' orchestrator/src/review.ts 2>/dev/null; then
            echo "::error::fleet/review FAILED: base-missing-reviewer-invocation-for — the base commit's orchestrator/src/review.ts has no 'reviewerInvocationFor' export, so the smoke test below (which imports it from THIS base checkout) cannot run"
            echo "The gate deliberately runs from the BASE, never from the commit it judges."
            echo "This is expected for the PR that INTRODUCES reviewerInvocationFor (#866) — merge"
            echo "that one PR with this check not yet required by the ruleset; every later PR is"
            echo "judged by the now-trusted, merged engine-resolution code."
            exit 1
          fi

      # #812: no "Install the non-author review engine" or "Authenticate the
      # review engine" step any more. `claude` is pre-installed on
      # `llamenos-review-box` and already logged in under the operator's own
      # account (that login state lives under `HOME`, which the runner sets
      # to the operator's own home directory — see `VERIFIER_ENV_ALLOWLIST`'s
      # doc comment in `orchestrator/src/review.ts`). There is nothing left
      # to fetch or configure before the smoke test below — there is no
      # provider variable left to validate either (see the job-level `env:`
      # comment above): `FLEET_REVIEW_MODEL` always resolves to a real value
      # (the repo variable or the `'sonnet'` default), and a bad value is
      # caught by the smoke test's own `engine-misconfigured` classification,
      # not by a separate "is this set" step.
      #
      # Proves the binary, the model id AND the reviewer's non-interactive,
      # read-only posture all work BEFORE the real review runs — so "the
      # reviewer is misconfigured" can never again be indistinguishable from
      # "the reviewer read the diff and could not produce a verdict". This is
      # the exact lesson the retired opencode reviewer paid for twice (a
      # model id that did not exist, an invalid `--format` value) — every
      # review had silently been UNREADABLE until each was caught here first.
      #
      # Invoked the way `review.ts`'s `invokeVerifierEngine` invokes it: an
      # EMPTY project root (never the checkout, never an export — there is
      # no export at this point in the job), `--print` (non-interactive) with
      # `--permission-mode plan` (read-only: no edits, no destructive
      # commands, never the flag that lets a worker write without being
      # asked — see `invokeVerifierEngine`'s own doc comment in review.ts).
      #
      # Judged by the review's OWN code — `parseVerdict` (exact final line),
      # imported from this trusted base checkout — never a looser substring
      # or shell comparison: an engine whose output grows colour codes or a
      # trailing line must fail HERE, not pass the smoke step and then make
      # every real review UNREADABLE.
      #
      # A failure here is ALWAYS a job failure — nothing below turns a bad
      # engine call into a pass. A failure names WHY, on one line, before the
      # job goes red, distinguishing three causes so an operator never has to
      # open the log to tell "the account hit a usage limit" (`engine-quota`)
      # from "the runner's claude login expired" (`engine-auth`) from
      # everything else (`engine-unavailable` — a bad model id, a missing
      # binary, or the engine running but never producing a valid verdict).
      - name: Smoke-test the review engine
        id: smoke
        if: steps.gate.outputs.outcome == 'run-engine'
        run: |
          # Deliberately without -e (and with `set +e` below to make sure of
          # it): GitHub invokes `run:` steps as `bash -e {0}` by default, and
          # that -e is already active by the time this script starts — a
          # bare `set -uo pipefail` does NOT clear an inherited -e, it only
          # adds -u/pipefail on top. Left alone, the FIRST unguarded failing
          # assignment below (`run_out="$(... "$rev_binary" ... )"` when the
          # engine call fails) is a failing simple command, so -e kills the
          # script on that line — before `run_status=$?` is read, before
          # `classify` runs, before `fail` ever prints anything. The step
          # then dies silently with exit 1 and no diagnostic, which is the
          # exact opacity this step exists to remove. `set +e` clears the
          # inherited -e so every capture below reaches its own status check
          # and, on failure, `fail()` — which is the only path that exits,
          # and always exits 1. This bug and fix were originally found and
          # applied against the retired non-author engine's smoke test
          # (#872); the same unguarded-capture shape (`run_out=`,
          # `verdict_out=`, and now `engine_json=`) carries over unchanged to
          # this `claude`-based rewrite (#866), so the fix stays required
          # here too.
          set -uo pipefail
          set +e
          root="$(mktemp -d)"
          # Set before engine resolution runs, so `fail()` can reference them
          # under `set -u` even if resolution itself is what failed.
          rev_binary=""
          rev_model=""

          # $1: engine-misconfigured | engine-quota | engine-auth |
          # engine-unavailable. $2: the raw engine text to print for a
          # human, then always exits 1 — this function is the only way the
          # step fails, and it always fails. The class is also written where
          # "Name this run's outcome" reads it (#1230), so a usage limit is
          # named `NO-VERDICT:engine-quota` on the check itself and is never
          # again confused with a reviewer rejecting the diff — or the reverse.
          fail() {
            echo "fleet/review FAILED: review engine smoke test FAILED: $1 (engine=${rev_binary:-unresolved} model=${rev_model:-unresolved})"
            printf '%s\n' "$2"
            printf '%s\n' "$1" > "$RUNNER_TEMP/fleet-review-engine-failure"
            exit 1
          }

          # Best-effort classification of the engine's own error text —
          # heuristic, not authoritative, because claude does not expose a
          # structured error code here. A `--model` id claude itself refuses
          # to run at all (`classifyEngineFailure` in review.ts carries the
          # identical check — see its doc comment for why a bare, slash-free
          # id like the `sonnet` that triggered #866 must classify here too,
          # not just a well-formed-but-unknown one) is engine-misconfigured;
          # usage-limit language is engine-quota; 401/invalid-credential/
          # not-logged-in language is engine-auth; anything else the engine
          # said is engine-unavailable.
          classify() {
            local text="$1"
            if printf '%s' "$text" | grep -qiE "unrecognized_model|isn'?t described by this version'?s model catalog|issue with the selected model"; then
              echo "engine-misconfigured"
            elif printf '%s' "$text" | grep -qiE 'quota|rate.?limit|usage.?limit|too many requests|\b429\b'; then
              echo "engine-quota"
            elif printf '%s' "$text" | grep -qiE '\b401\b|unauthorized|invalid.*(api.?key|token|credential)|not logged in|please (run|login|re-?authenticate)|authenticat(e|ion)? (fail|error|required)'; then
              echo "engine-auth"
            else
              echo "engine-unavailable"
            fi
          }

          # THE single source for what to smoke-test: a `bun -e` import of
          # `reviewerInvocationFor` from THIS job's own BASE checkout of
          # review.ts — the exact function `invokeVerifierEngine` (the real
          # "Review" step below) calls too. Deliberately NOT a literal
          # `claude`/`$FLEET_REVIEW_MODEL` pair typed into this file: #866
          # shipped with exactly that pair, agreeing with the real review's
          # own resolution only by coincidence, and the coincidence broke
          # the instant this PR's OWN fix to `verifierFor` landed on this
          # branch without yet reaching the BASE this job actually runs
          # review-ci from (see the file header above for why the gate
          # always judges from base) — the smoke test kept "passing" against
          # `claude` while the real review, still running base's old
          # cross-engine logic, silently invoked a DIFFERENT reviewer binary
          # entirely, handed a `claude`-shaped model id it could not resolve.
          # Importing the same function both places removes the coincidence,
          # and therefore the failure mode, entirely: there is no second
          # literal left to drift.
          # stderr goes to its own temp file, exactly like `run_out`/`run_err`
          # below — never `2>&1` merged into `engine_json` itself, which must
          # stay pure JSON on the success path for `jq` to parse. A stray
          # warning line on stderr merged onto stdout would otherwise corrupt
          # every jq call after it for a reason with nothing to do with
          # engine configuration.
          #
          # Only symbols the BASE is known to have may be imported here. The
          # reviewer's tool list is NOT one of them — it travels as
          # `FLEET_REVIEWER_TOOLS` in this workflow's own `env:` instead, for
          # the version-boundary reason documented there.
          engine_json="$(bun -e '
            import { reviewerInvocationFor } from "./orchestrator/src/review.ts"
            const inv = reviewerInvocationFor("claude")
            console.log(JSON.stringify({ binary: inv.binary, model: inv.model }))
          ' 2>"$RUNNER_TEMP/engine-resolve-stderr.log")"
          engine_status=$?
          engine_err="$(cat "$RUNNER_TEMP/engine-resolve-stderr.log" 2>/dev/null || true)"
          if [ "$engine_status" -ne 0 ]; then
            fail "engine-misconfigured" "$engine_json"$'\n'"$engine_err"
          fi
          rev_binary="$(printf '%s' "$engine_json" | jq -r '.binary')"
          rev_model="$(printf '%s' "$engine_json" | jq -r '.model')"
          # The reviewer's tool restriction, from this workflow's own `env:`
          # — NOT imported from review.ts, because this YAML is the head's
          # while the checkout is the base's (see FLEET_REVIEWER_TOOLS).
          # `tests/orchestrator/guards.test.ts` pins this literal equal to
          # `REVIEWER_TOOLS` in the source, at a commit where both are the
          # same version, so the two still cannot drift apart silently.
          #
          # It is smoke-tested at all because `--tools` is the flag that
          # withholds `Bash` from the reviewer, and a runner whose `claude`
          # build does not accept it would otherwise pass this step (which
          # used to pass a hand-written, flag-poorer argv) and then fail
          # EVERY real review as an opaque `engine-unavailable`. Asserting
          # the flag here names it as a configuration problem instead.
          rev_tools="$FLEET_REVIEWER_TOOLS"
          if [ -z "$rev_tools" ]; then
            fail "engine-misconfigured" "FLEET_REVIEWER_TOOLS resolved to nothing — the reviewer would run with the full default tool set, Bash included"
          fi
          if [ -z "$rev_binary" ] || [ "$rev_binary" = "null" ] || [ -z "$rev_model" ] || [ "$rev_model" = "null" ]; then
            fail "engine-misconfigured" "reviewerInvocationFor printed unparseable output: $engine_json"$'\n'"$engine_err"
          fi

          if ! command -v "$rev_binary" >/dev/null 2>&1; then
            fail "engine-unavailable" "the $rev_binary CLI is not on PATH on this runner"
          fi

          run_out="$(cd "$root" && printf 'Reply with exactly: VERDICT: PASS\n' \
            | "$rev_binary" --print --permission-mode plan --tools "$rev_tools" --model "$rev_model" --max-turns 1 2>"$RUNNER_TEMP/claude-run-stderr.log")"
          run_status=$?
          run_err="$(cat "$RUNNER_TEMP/claude-run-stderr.log" 2>/dev/null || true)"
          if [ "$run_status" -ne 0 ]; then
            fail "$(classify "$run_out"$'\n'"$run_err")" "$run_out"$'\n'"$run_err"
          fi

          verdict_out="$(printf '%s' "$run_out" | bun -e '
            import { parseVerdict } from "./orchestrator/src/review.ts"
            const text = await Bun.stdin.text()
            console.log(text)
            const verdict = parseVerdict(text)
            console.log("smoke verdict (parseVerdict of claude output): " + verdict)
            process.exit(verdict === "PASS" ? 0 : 1)
          ')"
          verdict_status=$?
          if [ "$verdict_status" -ne 0 ]; then
            fail "engine-unavailable" "$verdict_out"
          fi
          printf '%s\n' "$verdict_out"
          echo "review engine smoke test OK (engine=$rev_binary model=$rev_model)"

      # Bootstrap guard. The gate runs from the BASE checkout by design, so
      # the FIRST pull request that introduces the gate cannot be judged by
      # it: the base predates it. This says so, instead of surfacing as an
      # unrelated "usage: llamenos-fleet <...>" and exit 2.
      #
      # It fails CLOSED, deliberately. After the gate has merged once, a base
      # without it means someone removed it from `main` — and that must stop
      # every PR until a human looks, never silently wave them through.
      - name: Check the base provides the gate
        if: steps.gate.outputs.outcome == 'run-engine'
        run: |
          set -eu
          usage="$(bun orchestrator/src/cli.ts 2>&1 || true)"
          case "$usage" in
            *review-ci*) ;;
            *)
              echo "::error::fleet/review FAILED: base-missing-review-ci-command — the base commit has no 'review-ci' command, so it cannot judge this PR"
              echo "The gate deliberately runs from the BASE, never from the commit it judges."
              echo "The PR that INTRODUCES the gate therefore cannot pass it. Merge that one PR"
              echo "with these checks not yet required by the ruleset; every later PR is judged"
              echo "by the now-trusted, merged gate."
              exit 1
              ;;
          esac

      - name: Review
        id: review
        if: steps.gate.outputs.outcome == 'run-engine'
        env:
          # Absent fails the job — never a skip and never a pass. A review
          # that could not run is not a review that passed. NOT actually
          # used to authenticate the reviewer any more (claude authenticates
          # via the runner's own login state under HOME — see
          # `VERIFIER_ENV_ALLOWLIST`'s doc comment in review.ts, and
          # `REVIEW_KEY_ENV`'s doc comment in ci.ts for why this secret
          # reference stays required anyway).
          FLEET_REVIEW_API_KEY: ${{ secrets.FLEET_REVIEW_API_KEY }}
          FLEET_CI_BRANCH: ${{ steps.ctx.outputs.branch }}
          FLEET_CI_PR: ${{ steps.ctx.outputs.pr }}
          FLEET_CI_HEAD_DIR: ${{ runner.temp }}/head
          FLEET_CI_HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          FLEET_CI_BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
          # Where every reviewer's FULL text is written for the publish
          # job to post on the PR. The review set is NOT passed in: base
          # code decides it from a live read of the PR (`runReviewCi`), so
          # this file — which on a `pull_request` event is the PR's own
          # copy — cannot shrink it.
          FLEET_REVIEW_REPORT_DIR: ${{ runner.temp }}/review-report
          # Read-only lookup of a prior PASS for this exact diff AND review
          # set — see `review-cache.ts`. `GH_TOKEN` is what lets that lookup
          # call `gh api`; `FLEET_REVIEW_CACHE_DIR` is where a FRESH pass
          # (never a replayed cache hit — `runReviewCi` in ci.ts only records
          # one it just produced) gets written for the upload step below.
          GH_TOKEN: ${{ github.token }}
          FLEET_REVIEW_CACHE_DIR: ${{ runner.temp }}/review-cache
          # Where `runReviewCi` (ci.ts) records WHICH outcome it reached —
          # `REVIEW_CI_RESULTS`: a verdict, or the refusal it stopped at
          # (#1230). The exit code says only pass/fail; this is what lets the
          # two steps below tell a reviewer rejecting the diff from a review
          # that never produced anything. Absent means no result.
          FLEET_REVIEW_RESULT_FILE: ${{ runner.temp }}/fleet-review-result
        run: bun orchestrator/src/cli.ts review-ci

      # Invariant 5 again, at the STEP level this time. Every reviewing step
      # above is opt-in (`if: ... == 'run-engine'`), which makes GREEN this
      # job's default: anything that leaves `outcome` unset or wrong skips
      # all of them and the job concludes SUCCESS with no review. This step
      # asserts the opposite — that a run which decided to review actually
      # did. `runReviewGate` (cli.ts) refuses on the same condition from its
      # own side; this is the half that cannot be bypassed by the CLI
      # failing to write its output at all.
      # #1187 widened this from `if: always() && steps.gate.conclusion ==
      # 'success'` to a bare `always()`, and moved the gate-conclusion test
      # inside the script, so that the MERGE_GROUP arm is covered by the same
      # assertion. Without that, a merge_group run whose queue step failed to
      # be selected at all — a typo in its `if:`, a renamed event — would
      # skip every step in this job and conclude SUCCESS: a green
      # `fleet/review` on a queue commit with no verdict behind it, which is
      # the exact fail-open shape invariant 6 exists to prevent.
      - name: Assert this run reached a real verdict
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUEUE_OUTCOME: ${{ steps.queue.outcome }}
          GATE_CONCLUSION: ${{ steps.gate.conclusion }}
          OUTCOME: ${{ steps.gate.outputs.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          RESULT_FILE: ${{ runner.temp }}/fleet-review-result
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            if [ "$QUEUE_OUTCOME" != "success" ]; then
              echo "::error::fleet/review FAILED: queue-verdict-missing — on merge_group the queued-PR verdict step reported '$QUEUE_OUTCOME'; refusing to conclude green on a queue commit with no verdict behind it"
              exit 1
            fi
            echo "merge_group arm: queued-PR verdict step=$QUEUE_OUTCOME"
            exit 0
          fi
          if [ "$GATE_CONCLUSION" != "success" ]; then
            echo "gate step conclusion='$GATE_CONCLUSION' — the job is already failing or never reached the gate; nothing further to assert"
            exit 0
          fi
          if [ -z "$OUTCOME" ]; then
            echo "::error::fleet/review FAILED: gate-outcome-missing — the gate step succeeded but wrote no outcome, so every reviewing step was skipped; refusing to conclude green with no review"
            exit 1
          fi
          if [ "$OUTCOME" = "run-engine" ] && [ "$REVIEW_OUTCOME" != "success" ]; then
            # #1230: the Review step also exits 1 on a FAIL VERDICT, so its
            # failure alone never meant "the review did not run" — yet every
            # real rejection used to be reported here as exactly that, with
            # the verdict sitting in a PR comment disagreeing with it. A
            # Review step that FAILED having recorded a result ran to a
            # conclusion, and its own failure is already this job's red: the
            # job cannot conclude green from here either way. Only a Review
            # step that never ran, or ran and recorded nothing, did not run.
            result=""
            if [ "$REVIEW_OUTCOME" = "failure" ] && [ -f "$RESULT_FILE" ]; then
              result="$(cat "$RESULT_FILE")"
            fi
            if [ -z "$result" ]; then
              echo "::error::fleet/review FAILED: review-did-not-run — the gate decided to review (outcome=$OUTCOME) but the Review step reported '$REVIEW_OUTCOME' and recorded no result"
              exit 1
            fi
            echo "gate outcome=$OUTCOME, review step=$REVIEW_OUTCOME, result=$result — the review reached a result; the Review step's own failure is this job's red"
            exit 0
          fi
          echo "gate outcome=$OUTCOME, review step=$REVIEW_OUTCOME"

      # Every reviewer's FULL text, for `fleet-review/publish` to post on
      # the PR. `if: always()` because a FAIL is exactly the case that most
      # needs its reasoning on the PR — two real reviews ran on #1117 and
      # left `pulls/1117/reviews` and `issues/1117/comments` both empty,
      # with the findings readable only via `gh run view --log`.
      - name: Upload the review report for publishing
        if: always() && github.event_name != 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-review-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-report
          retention-days: 7
          if-no-files-found: ignore

      # `if: always()` is load-bearing, not defensive: the review step exits
      # non-zero on a FAIL, and a substantive FAIL is exactly what #1158
      # added to the cache — without `always()` the record this step exists
      # to upload would be dropped on every run that produced one.
      # `if-no-files-found: ignore` covers the runs where `record()` wrote
      # nothing at all: a cache hit being re-published, or a verdict with an
      # UNREADABLE in it (never cached — see review-cache.ts).
      # Uploading uses the ephemeral per-run Actions
      # artifact token, never the job's own read-only `permissions:` above —
      # this step needs no permission this job does not already have to be a
      # write.
      - name: Cache the verdict, if this run produced a fresh substantive one
        if: always() && steps.review.outputs.cache_artifact_name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.review.outputs.cache_artifact_name }}
          path: ${{ runner.temp }}/review-cache
          # Long enough to outlive a PR that sits in the queue across a few
          # re-attempts; short enough that a cache this small never becomes
          # its own storage-cost concern.
          retention-days: 30
          if-no-files-found: ignore

      # ── Name this run's outcome (#1230) ─────────────────────────────────
      # `fleet/review` has well over a dozen distinct outcomes and used to
      # render every red one identically — `fleet/review: fail`, with the
      # reason only in the log. One operator session read six consecutive
      # reds as a dead review engine (five were Dependabot PRs correctly
      # refused as `not-requested`), and a helper refused a legitimate retry
      # on #1263 because an unparseable verdict and a real rejection looked
      # the same. Every fact needed was already decided by an earlier step;
      # this step only NAMES it, as ONE title:
      #
      #   <TOKEN> — <human detail>
      #
      # The token is everything before the first space and is an INTERFACE:
      # tooling matches on it, and the full list is `REVIEW_OUTCOME_TOKENS`
      # (orchestrator/src/ci.ts). The detail is prose and may change. The
      # class before the colon says what to do:
      #   PASS:        the check concluded success.
      #   REJECTED:    a reviewer read this diff and rejected it — fix the code.
      #   NO-VERDICT:  red because the gate fails closed; NOTHING judged the
      #                diff. Act on the named cause — it is not a rejection.
      # tests/orchestrator/review-outcome-titles.test.ts runs THIS script for
      # every outcome and pins it against that list: each outcome, its own
      # distinct title, no token a prefix or substring of another.
      #
      # Where the title goes: an annotation titled `fleet/review outcome` on
      # this job's own check run — readable with no log download via
      # `gh api repos/<R>/check-runs/<id>/annotations`, and shown on the PR's
      # Checks tab — and this run's summary page. It is not written into the
      # check run's `output.title`: that takes `checks: write`, which this job
      # must never hold (see its `permissions:` block).
      #
      # It cannot change the verdict. It runs last, reads what the steps above
      # already decided, and changes none of it: a step that only prints
      # cannot turn a red job green, and a crash in it could only add red.
      # The merge-queue arm is not named here: it republishes the PR head's
      # own verdict, and that run is the one carrying the name.
      - name: Name this run's outcome
        if: always() && github.event_name != 'merge_group'
        env:
          JOB_STATUS: ${{ job.status }}
          BASE_GATE_OUTCOME: ${{ steps.base_gate.outcome }}
          GATE_CONCLUSION: ${{ steps.gate.conclusion }}
          OUTCOME: ${{ steps.gate.outputs.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          RESULT_FILE: ${{ runner.temp }}/fleet-review-result
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
        run: |
          set -euo pipefail
          engine_failure=""
          if [ -f "$RUNNER_TEMP/fleet-review-engine-failure" ]; then
            engine_failure="$(cat "$RUNNER_TEMP/fleet-review-engine-failure")"
          fi
          # Only a Review step that actually ran in THIS job can have
          # recorded a result.
          result=""
          if { [ "$REVIEW_OUTCOME" = "success" ] || [ "$REVIEW_OUTCOME" = "failure" ]; } && [ -f "$RESULT_FILE" ]; then
            result="$(cat "$RESULT_FILE")"
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            case "$OUTCOME" in
              low-tier) token="PASS:low-tier" ;;
              cache-hit) token="PASS:cached" ;;
              run-engine)
                case "$result" in
                  pass) token="PASS:reviewed" ;;
                  cache-pass) token="PASS:cached" ;;
                  *) token="PASS:unclassified" ;;
                esac
                ;;
              *) token="PASS:unclassified" ;;
            esac
          elif [ "$GATE_CONCLUSION" != "success" ] && [ "$GATE_CONCLUSION" != "failure" ]; then
            # The gate never ran: the job failed before reaching it.
            if [ "$BASE_GATE_OUTCOME" = "failure" ]; then
              token="NO-VERDICT:base-predates-gate"
            else
              token="NO-VERDICT:setup-failed"
            fi
          else
            case "$OUTCOME" in
              '') token="NO-VERDICT:gate-error" ;;
              not-requested) token="NO-VERDICT:not-requested" ;;
              review-set-unresolved) token="NO-VERDICT:review-set-unresolved" ;;
              cache-hit)
                # The gate exits 1 on a cached FAIL and 0 on a cached PASS.
                if [ "$GATE_CONCLUSION" = "failure" ]; then
                  token="REJECTED:cached"
                else
                  token="NO-VERDICT:unclassified"
                fi
                ;;
              run-engine)
                case "$result" in
                  fail) token="REJECTED:reviewed" ;;
                  cache-fail) token="REJECTED:cached" ;;
                  unreadable) token="NO-VERDICT:unreadable" ;;
                  budget-exhausted) token="NO-VERDICT:budget-exhausted" ;;
                  scope) token="NO-VERDICT:scope" ;;
                  review-set-unresolved) token="NO-VERDICT:review-set-unresolved" ;;
                  unknown-lane) token="NO-VERDICT:unknown-lane" ;;
                  review-disabled) token="NO-VERDICT:review-disabled" ;;
                  export-unsafe) token="NO-VERDICT:export-unsafe" ;;
                  '')
                    # No result: the review never reached a conclusion. The
                    # smoke test names the engine's failure when it was the
                    # reason; anything else did not run for a reason only
                    # the log has.
                    case "$SMOKE_OUTCOME:$engine_failure" in
                      failure:engine-quota) token="NO-VERDICT:engine-quota" ;;
                      failure:engine-auth) token="NO-VERDICT:engine-auth" ;;
                      failure:engine-misconfigured) token="NO-VERDICT:engine-misconfigured" ;;
                      failure:engine-unavailable) token="NO-VERDICT:engine-unavailable" ;;
                      *) token="NO-VERDICT:did-not-run" ;;
                    esac
                    ;;
                  *) token="NO-VERDICT:unclassified" ;;
                esac
                ;;
              *) token="NO-VERDICT:unclassified" ;;
            esac
          fi

          case "$token" in
            PASS:reviewed) detail="every reviewer read this diff and passed it" ;;
            PASS:cached) detail="this exact diff and review set already passed; not reviewed again" ;;
            PASS:low-tier) detail="no reviewable content (tier 0/1); no review needed" ;;
            PASS:unclassified) detail="passed by a path this step has no name for; read the log" ;;
            REJECTED:reviewed) detail="a reviewer read this diff and rejected it; fix the code" ;;
            REJECTED:cached) detail="this exact diff was already rejected; push a fix" ;;
            NO-VERDICT:not-requested) detail="this review request does not start the fleet review; the log names whom to ask" ;;
            NO-VERDICT:review-set-unresolved) detail="could not work out which reviews this PR needs; none ran" ;;
            NO-VERDICT:scope) detail="the diff failed the lane scope / never-write pre-check; no reviewer ran" ;;
            NO-VERDICT:unreadable) detail="a reviewer ran but left no readable verdict; re-request the review" ;;
            # Deliberately NOT "re-request": that re-runs the same diff under the same
            # budget and exhausts again — a loop costing a full session per attempt
            # that can never clear. These remedies are ones that actually work.
            NO-VERDICT:budget-exhausted) detail="a reviewer used its whole turn budget without reaching a verdict; split the PR, or raise DEFAULT_MAX_TURNS/HIGH_IMPACT_MAX_TURNS in orchestrator/src/review.ts — re-requesting will exhaust again" ;;
            NO-VERDICT:did-not-run) detail="the gate chose to review but no review result was produced" ;;
            NO-VERDICT:engine-quota) detail="the review engine hit a usage limit before reviewing anything" ;;
            NO-VERDICT:engine-auth) detail="the review engine is not logged in on the runner" ;;
            NO-VERDICT:engine-misconfigured) detail="the review engine or its model id is misconfigured" ;;
            NO-VERDICT:engine-unavailable) detail="the review engine could not be run" ;;
            NO-VERDICT:unknown-lane) detail="the branch names a fleet lane that does not exist" ;;
            NO-VERDICT:review-disabled) detail="FLEET_REVIEW_API_KEY is not configured on this repository" ;;
            NO-VERDICT:export-unsafe) detail="the PR head export could not be made safe for a reviewer to read" ;;
            NO-VERDICT:gate-error) detail="the review gate itself failed before deciding anything" ;;
            NO-VERDICT:base-predates-gate) detail="the PR's base predates the review gate; update the branch and re-request" ;;
            NO-VERDICT:setup-failed) detail="the job failed before the review gate ran" ;;
            NO-VERDICT:unclassified) detail="failed by a path this step has no name for; read the log" ;;
          esac
          title="$token — $detail"

          case "$token" in
            PASS:*)
              level="notice"
              meaning="The check concluded success."
              ;;
            REJECTED:*)
              level="error"
              meaning="A reviewer read this diff and rejected it. Its findings are on the PR as a comment naming the head it judged. Change the code: re-requesting a review of an unchanged diff restates the same verdict."
              ;;
            *)
              level="error"
              meaning="Nothing judged this diff. The check is red because the gate fails closed, not because the code was rejected: act on the cause named above, and do not edit the code on review grounds."
              ;;
          esac
          echo "::$level title=fleet/review outcome::$title"
          {
            echo "### \`fleet/review\` outcome: $title"
            echo
            echo "$meaning"
            echo
            echo "Head judged: \`${HEAD_SHA:-unknown}\`. Tooling: match the token before the first space against \`REVIEW_OUTCOME_TOKENS\` (orchestrator/src/ci.ts)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Publishing the reviews, then clearing the worklist (#1158).
  # ---------------------------------------------------------------------------
  # `fleet/review` used to write a check run and a job log and nothing else.
  # Two real reviews ran on #1117 and left `pulls/1117/reviews` and
  # `issues/1117/comments` both EMPTY: both substantive findings existed only
  # inside Actions logs and had to be dug out with `gh run view --log`, while
  # anyone opening the PR saw a red check with no reason on it. A red check
  # whose reason lives only in a log is not reviewable.
  #
  # So this job posts each reviewer's full text as a PR COMMENT — never a
  # GitHub REVIEW. An approving review from the fleet is a review GitHub
  # COUNTS, one ruleset edit away from being an approval the fleet grants
  # itself; a comment records the same text in the same thread and can never
  # be that. (Same reasoning as `postReview`'s doc comment in review.ts.)
  #
  # THEN, and only then, it removes the `-reviewer` labels whose review
  # passed — so the worklist never clears without a visible trace. What is
  # still labelled on a PR is what is still owed.
  #
  # A FAIL posts and clears NOTHING, deliberately: leaving the label on is
  # what makes the next review request re-run that reviewer. Clearing on a
  # FAIL would be a fail-open — the worklist would forget a review that
  # found a problem.
  #
  # WHO the comments are authored by. They post as `llamenos-auto` — the
  # identity a review is requested FROM — via `FLEET_REVIEW_COMMENT_TOKEN`,
  # a FINE-GRAINED PAT owned by `llamenos-auto`, scoped to this repository
  # alone, with `Pull requests: write` (plus the implicit `Metadata: read`)
  # and nothing else. Never a classic PAT: `llamenos-auto`'s classic
  # `public_repo` token can write to every public repo that account reaches,
  # a scope escalation no comment attribution is worth. That token is used
  # for `gh pr comment` and NOTHING else — reading the thread and clearing
  # labels stay on `github.token`, and it must never submit a REVIEW (a
  # `Pull requests: write` token CAN approve, and an approval from
  # `llamenos-auto` is one the ruleset counts).
  #
  # The `fleet/review` CHECK stays `github-actions`, and must: it is the
  # `fleet-review` job's own check run, and GitHub refuses to create a check
  # run from any PAT (403 "must authenticate via a GitHub App").
  #
  # A missing, expired, revoked, wrong-account or under-scoped token NEVER
  # fails this job: the comment falls back to `github.token` (authored by
  # `github-actions[bot]`) with a `::warning::` naming the secret. Only the
  # attribution degrades. (Same shape as tauri-release.yml's "Detect updater
  # channel configuration": an unset secret is detected inside `run:` — an
  # unset secret interpolates as "" — and skipped loudly, never fatally.)
  #
  # A SEPARATE, GitHub-hosted job on purpose. It is the only thing in this
  # file with write access; it checks out nothing, installs nothing and runs
  # no repository code at all. Keeping it out of `fleet-review` is what lets
  # that job — the one that runs a model next to the operator's logged-in
  # `claude` session — stay read-only.
  #
  # This job's name is NOT a required context and must never become one: it
  # runs only when `fleet-review` did, so requiring it would block every PR
  # whose review was never requested. Its result cannot affect the gate —
  # `fleet/review` has already concluded by the time this starts.
  publish-reviews:
    name: fleet-review/publish
    needs: [fleet-review]
    # A job-level `if:` is safe HERE and only here, because this job's name
    # is not a required context: a skipped NON-required job satisfies
    # nothing. Never copy this into `fleet-review` — see invariant 1.
    # Runs on a FAIL too: that is the case whose reasoning the PR most needs.
    # `github.event_name != 'merge_group'`: the queue arm posts nothing (it
    # republishes a verdict already on the PR) and a `merge_group` event
    # carries no PR number for this job to post against.
    if: always() && github.event_name != 'merge_group' && (needs.fleet-review.result == 'success' || needs.fleet-review.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write   # post the comments, remove the labels
      actions: read          # download this run's own review report
    steps:
      - name: Refuse to run on a fork PR
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$THIS_REPO" ]]; then
            echo "::error::fleet-review/publish FAILED: fork-pr-guard — head repo '$HEAD_REPO' != '$THIS_REPO'"
            exit 1
          fi

      # Every value below reaches the script through `env:`, never a `${{ }}`
      # interpolation into the script text, so nothing a PR controls is ever
      # parsed as shell. `jq --raw-output` reads the report files; the bodies
      # are written to disk and passed with `--body-file`, never on a
      # command line.
      - name: Post each reviewer's findings on the PR, then clear the labels it passed
        env:
          GH_TOKEN: ${{ github.token }}
          # Comment authorship only — see the job comment above. Empty when
          # unset (and on every Dependabot PR, which gets no Actions secrets).
          FLEET_REVIEW_COMMENT_TOKEN: ${{ secrets.FLEET_REVIEW_COMMENT_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT: fleet-review-report-${{ github.run_id }}-${{ github.run_attempt }}
          PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.inputs.pr_number }}
          REVIEW_RESULT: ${{ needs.fleet-review.result }}
          CLEAR_LABELS: ${{ needs.fleet-review.outputs.clear_labels }}
          HEAD_SHA: ${{ needs.fleet-review.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::fleet-review/publish FAILED: no numeric PR number (got '$PR')"
            exit 1
          fi

          dir="$RUNNER_TEMP/review-report"
          mkdir -p "$dir"
          # No report is a legitimate state (a `not-requested` or
          # `review-set-unresolved` run reviews nothing), so a missing
          # artifact is not an error — but a report that EXISTS and cannot be
          # read is, because that is a review silently not reaching the PR.
          if gh run download "$RUN_ID" -R "$REPO" -n "$ARTIFACT" -D "$dir" 2>/dev/null; then
            echo "downloaded $ARTIFACT"
          else
            echo "no review report in this run — nothing to post"
          fi

          # The markers already on the PR, so a re-request on an UNCHANGED
          # diff re-posts nothing. Without this, every rebase-and-re-request
          # would pile another copy of the same review onto the thread —
          # the churn this issue exists to remove.
          gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[].body' > "$RUNNER_TEMP/existing.txt" || : > "$RUNNER_TEMP/existing.txt"

          # Who authors the comments. Every way the token can be unusable
          # degrades to `github.token` with a warning — never a failure.
          fallback="posting as github-actions[bot] instead of llamenos-auto; the review and the gate are unaffected"
          comment_token=""
          if [ -z "${FLEET_REVIEW_COMMENT_TOKEN:-}" ]; then
            echo "::warning::FLEET_REVIEW_COMMENT_TOKEN is not set — $fallback"
          elif ! login="$(GH_TOKEN="$FLEET_REVIEW_COMMENT_TOKEN" gh api user --jq '.login' 2>/dev/null)"; then
            echo "::warning::FLEET_REVIEW_COMMENT_TOKEN does not authenticate (expired or revoked?) — $fallback"
          elif [ "$login" != "llamenos-auto" ]; then
            echo "::warning::FLEET_REVIEW_COMMENT_TOKEN belongs to '$login', not llamenos-auto — $fallback"
          else
            comment_token="$FLEET_REVIEW_COMMENT_TOKEN"
            echo "posting as llamenos-auto"
          fi

          # post_comment <body-file> <marker>
          post_comment() {
            if [ -n "$comment_token" ]; then
              if GH_TOKEN="$comment_token" gh pr comment "$PR" -R "$REPO" --body-file "$1"; then
                return 0
              fi
              echo "::warning::FLEET_REVIEW_COMMENT_TOKEN could not comment on PR #$PR (does it lack 'Pull requests: write'?) — $fallback"
              comment_token=""
              # A call that errored can still have landed; never post one
              # review twice.
              gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[].body' > "$RUNNER_TEMP/recheck.txt" || : > "$RUNNER_TEMP/recheck.txt"
              if grep -qF -- "$2" "$RUNNER_TEMP/recheck.txt"; then
                return 0
              fi
            fi
            gh pr comment "$PR" -R "$REPO" --body-file "$1"
          }

          posted=0
          shopt -s nullglob
          for f in "$dir"/*.json; do
            reviewer="$(jq -r '.reviewer' "$f")"
            verdict="$(jq -r '.verdict' "$f")"
            marker="$(jq -r '.marker' "$f")"
            if [ -z "$marker" ] || [ "$marker" = "null" ]; then
              echo "::error::report entry $f has no marker — refusing to post an untrackable comment"
              exit 1
            fi
            if grep -qF -- "$marker" "$RUNNER_TEMP/existing.txt"; then
              echo "already posted: $reviewer ($verdict)"
              continue
            fi
            # Every comment names the head it judged (#1230). On #1217 a PASS
            # on a new head left the superseded head's FAIL comment as the
            # newest thing on the thread, and "rejected" was the natural —
            # wrong — reading of a green PR. Named, a stale verdict is
            # self-evidently about another commit. A report can only exist
            # once the job resolved its head, so an unparseable one here is a
            # broken run, and posting a verdict about an unknown commit is
            # refused rather than guessed at.
            if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::report entry $f has no judged head to name (got '$HEAD_SHA') — refusing to post a verdict that cannot say which commit it is about"
              exit 1
            fi
            {
              printf '%s\n\n' "$marker"
              printf "### \`fleet/review\` — %s: **%s** on \`%s\`\n\n" "$reviewer" "$verdict" "${HEAD_SHA:0:12}"
              printf "Judged head \`%s\`. The \`fleet/review\` check on the PR's current head is the verdict of record: if the head has moved since, this comment is about an older commit.\n\n" "$HEAD_SHA"
              jq -r '.body' "$f"
            } > "$RUNNER_TEMP/comment.md"
            post_comment "$RUNNER_TEMP/comment.md" "$marker"
            echo "posted: $reviewer ($verdict)"
            posted=$((posted + 1))
          done
          echo "posted $posted comment(s)"

          # Only AFTER the reviews are on the PR, and only on a PASS.
          if [ "$REVIEW_RESULT" != "success" ] || [ -z "$CLEAR_LABELS" ]; then
            echo "no labels to clear (review result=$REVIEW_RESULT)"
            exit 0
          fi
          IFS=',' read -r -a labels <<< "$CLEAR_LABELS"
          for label in "${labels[@]}"; do
            [ -n "$label" ] || continue
            # Re-checked here rather than trusting a value that crossed a job
            # boundary, even though `resolveReviewerLabel` (specialist.ts)
            # already matched each one against the BASE agent registry.
            if [[ ! "$label" =~ ^[a-z0-9]+(-[a-z0-9]+)*-reviewer$ ]]; then
              echo "::error::refusing to act on '$label' — not a well-formed reviewer label"
              exit 1
            fi
            # One call per label, so one label already gone (a human removed
            # it mid-run) cannot take the rest of the loop with it.
            if gh api -X DELETE "repos/$REPO/issues/$PR/labels/$label" --silent 2>/dev/null; then
              echo "cleared '$label' — its review passed on this diff"
            else
              echo "::warning::could not remove '$label' from PR #$PR (already gone?) — the review still passed"
            fi
          done
