name: Deploy Production

# Manual-only workflow: deploy the Llamenos production VPS instance via Ansible.
#
# Required secrets (in the "production" GitHub Environment):
#   PROD_INVENTORY_YML       — content of inventory-production.yml (Ansible inventory)
#   ANSIBLE_VAULT_PASSWORD   — password for ansible-vault encrypted vars-production.yml
#   PROD_VARS_YML_ENCRYPTED  — content of encrypted vars-production.yml
#   PROD_SSH_PRIVATE_KEY     — SSH private key for the production VPS deploy user
#
# THE FIRST RUN ON A FRESH VPS IS A SEPARATE STAGE.
# `setup.yml` refuses to be a one-shot first run, and says so in its own
# header: `harden.yml` moves sshd off port 22 onto `ssh_port`, so the
# inventory's `ansible_port` has to change between hardening and everything
# after it. This workflow used to run `setup.yml` unconditionally, which on a
# fresh host hardens the box and then loses the connection for every
# remaining play — a half-deployed server and a red run.
#
#   1. Dispatch with stage = `harden-first-run`.
#   2. Update `ansible_port` in the PROD_INVENTORY_YML secret to `ssh_port`.
#   3. Dispatch again with stage = `full`.
#
# Every later deploy is just stage = `full`. See docs/deployment/first-deploy.md.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Deploy stage (see note below about the first run)"
        type: choice
        required: true
        default: full
        options:
          - full
          - harden-first-run

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy-prod:
    name: Deploy to Production VPS
    # `[self-hosted, linux, x64]` alone also matches llamenos-review-box,
    # which is not provisioned to deploy. Pin the full label set, as every
    # other self-hosted job in this repo does.
    runs-on: [self-hosted, linux, x64, hetzner, llamenos]
    environment: production
    timeout-minutes: 30

    steps:
      # This job stays on the self-hosted box, where $HOME and /tmp are shared
      # by every concurrent job. Scope each toolchain's cache/state under this
      # job's own $RUNNER_TEMP so two jobs can never corrupt each other.
      - name: Isolate per-job toolchain caches
        run: |
          {
            echo "CARGO_HOME=$RUNNER_TEMP/cargo"
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup"
            echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle"
            echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache"
            echo "npm_config_cache=$RUNNER_TEMP/npm-cache"
            echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache"
            echo "ANSIBLE_COLLECTIONS_PATH=$RUNNER_TEMP/ansible-collections"
            echo "ANSIBLE_LOCAL_TEMP=$RUNNER_TEMP/ansible-tmp"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Each secret below is later written to a file with `printf '%s' "$VAR"`,
      # which SUCCEEDS on an unset secret and leaves a 0-byte file. An empty
      # `-e @vars-production.yml` does fail loudly, but an empty INVENTORY does
      # not: Ansible matches no hosts and EXITS 0, so preflight, setup and the
      # smoke check all pass having touched nothing. Fail here instead, naming
      # every missing secret at once rather than one per re-run.
      #
      # Only names are printed. Never echo a secret's value.
      - name: Verify required secrets are present
        env:
          PROD_INVENTORY_YML: ${{ secrets.PROD_INVENTORY_YML }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          PROD_VARS_YML_ENCRYPTED: ${{ secrets.PROD_VARS_YML_ENCRYPTED }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in PROD_INVENTORY_YML ANSIBLE_VAULT_PASSWORD \
                      PROD_VARS_YML_ENCRYPTED PROD_SSH_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::required secret $name is unset or empty"
            done
            echo "Set them in the repository's 'production' environment, then re-dispatch." >&2
            exit 1
          fi
          echo "All 4 required secrets are present."

      - name: Install Ansible
        run: |
          # Pinned to the same version CI validates the playbooks against
          # (ci.yml's ansible-lint job). Unpinned, an upstream ansible release
          # could change collection behaviour under a deploy with nothing in
          # this repo having changed — ansible.cfg's header already documents
          # one such breakage from a community.general bump.
          pip install ansible==14.1.0
          ansible-galaxy collection install community.docker

      - name: Write Ansible inventory
        env:
          INVENTORY_YML: ${{ secrets.PROD_INVENTORY_YML }}
        run: |
          mkdir -p deploy/ansible
          printf '%s' "$INVENTORY_YML" > deploy/ansible/inventory-production.yml

      - name: Write Ansible vault password
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s' "$VAULT_PASSWORD" > "$RUNNER_TEMP/vault-pass"
          chmod 600 "$RUNNER_TEMP/vault-pass"

      - name: Write encrypted production vars
        env:
          PROD_VARS: ${{ secrets.PROD_VARS_YML_ENCRYPTED }}
        run: |
          printf '%s' "$PROD_VARS" > deploy/ansible/vars-production.yml

      - name: Load SSH key into agent
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "$SSH_KEY" | ssh-add -
          ssh-keyscan -H "$(grep ansible_host deploy/ansible/inventory-production.yml | head -1 | awk '{print $2}')" >> ~/.ssh/known_hosts 2>/dev/null || true

      # A valid-but-wrong inventory (no `llamenos_servers` group) makes every
      # play skip and every step below pass green having deployed nothing.
      - name: Verify the inventory resolves at least one llamenos_servers host
        working-directory: deploy/ansible
        run: |
          set -euo pipefail
          if ! ansible -i inventory-production.yml llamenos_servers --list-hosts > hosts.txt 2>err.txt; then
            echo "::error::inventory-production.yml is not a parseable Ansible inventory"
            sed -e 's/^/  /' err.txt >&2
            exit 1
          fi
          count=$(sed -n 's/^[[:space:]]*hosts (\([0-9][0-9]*\)):.*/\1/p' hosts.txt | head -1)
          rm -f hosts.txt err.txt
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::inventory-production.yml matched 0 hosts for the 'llamenos_servers' group — every play would be skipped and this job would pass having deployed nothing"
            exit 1
          fi
          echo "inventory-production.yml resolves $count host(s) in group 'llamenos_servers'."

      - name: Run preflight
        working-directory: deploy/ansible
        run: |
          ansible-playbook playbooks/preflight.yml \
            -i inventory-production.yml \
            -e "@vars-production.yml" \
            -e "deployment_profile=official" \
            --vault-password-file "$RUNNER_TEMP/vault-pass"

      # First run only. Hardening is the step that moves sshd, so it is run
      # alone and the job stops afterwards: the operator updates
      # `ansible_port` in PROD_INVENTORY_YML and dispatches again as `full`.
      - name: Harden (first run only)
        if: ${{ inputs.stage == 'harden-first-run' }}
        working-directory: deploy/ansible
        run: |
          ansible-playbook playbooks/harden.yml \
            -i inventory-production.yml \
            -e "@vars-production.yml" \
            -e "deployment_profile=official" \
            --vault-password-file "$RUNNER_TEMP/vault-pass"

      - name: Explain the next step
        if: ${{ inputs.stage == 'harden-first-run' }}
        run: |
          {
            echo "### Hardening complete — one manual step before the deploy"
            echo
            echo "sshd has moved off port 22 onto \`ssh_port\`. Update \`ansible_port\`"
            echo "on every host in the **PROD_INVENTORY_YML** secret to match, then"
            echo "dispatch this workflow again with stage = \`full\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        if: ${{ inputs.stage == 'full' }}
        working-directory: deploy/ansible
        run: |
          ansible-playbook setup.yml \
            -i inventory-production.yml \
            -e "@vars-production.yml" \
            -e "deployment_profile=official" \
            --vault-password-file "$RUNNER_TEMP/vault-pass"

      - name: Smoke check
        if: ${{ inputs.stage == 'full' }}
        working-directory: deploy/ansible
        run: |
          ansible-playbook playbooks/smoke-check.yml \
            -i inventory-production.yml \
            -e "@vars-production.yml" \
            -e "deployment_profile=official" \
            --vault-password-file "$RUNNER_TEMP/vault-pass"

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k || true

      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/vault-pass"
          rm -f deploy/ansible/inventory-production.yml
          rm -f deploy/ansible/vars-production.yml
