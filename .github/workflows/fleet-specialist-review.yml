# Fleet Specialist Review (#1092)
#
# A PR label ending in `-reviewer` NAMES a specialist reviewer: applying
# `crypto-security-reviewer` runs the agent defined at
# `.claude/agents/crypto-security-reviewer.md` against the PR, and posts its
# verdict as the check `fleet/review/crypto-security-reviewer`. The agent is
# DERIVED FROM THE LABEL, so a new specialist is an agent definition (merged to
# main first — the registry is read from the BASE checkout) plus a label. This
# file never changes to add one.
#
# ---------------------------------------------------------------------------
# TRIGGER: `labeled` ONLY. Never add `synchronize`, `opened` or `unlabeled`.
# ---------------------------------------------------------------------------
# Every run is a real model call. Running one on every push is the
# provider-quota-burning bug #812 already fixed once for `fleet/review`, and
# `quotaBreaker` (orchestrator/src/circuit.ts) halts the WHOLE fleet at two
# QUOTA outcomes per engine. A specialist inherits that protection only by
# being wired the same way. Re-requesting a specialist review means
# re-applying its label — not a push, not a convenience trigger. Pinned by
# the "fleet-specialist-review" rail in tests/orchestrator/guards.test.ts.
#
# GitHub cannot filter a `pull_request` trigger by label VALUE, so the jobs
# below carry a job-level `if: endsWith(github.event.label.name, '-reviewer')`.
# That is safe HERE and only here because no job in this file is a required
# check (next section): a skipped NON-required job satisfies nothing. Do not
# copy this `if:` into `fleet-review.yml` — see its header for why a skipped
# REQUIRED check is the fail-open bug #844/#848. Note `endsWith` is
# case-insensitive in Actions expressions; `Crypto-REVIEWER` therefore RUNS,
# and then fails the lowercase-only label grammar — loudly, never a skip.
#
# ---------------------------------------------------------------------------
# `fleet/review/<agent>` IS NOT, AND MUST NEVER BE, A REQUIRED STATUS CHECK.
# ---------------------------------------------------------------------------
# The ruleset's required contexts are `ci-status`, `gitleaks`, `CodeQL`,
# `fleet/verify`, `fleet/review`. A check that only runs when a label is
# present cannot join them: GitHub would block every PR that never gets the
# label, permanently. Do not "fix" a specialist FAIL that merged-through by
# adding its context to the ruleset. It binds at the merge decision instead,
# in four places, and the composition rule is ANY FAIL FAILS — a specialist
# FAIL overrides a generalist PASS:
#
#   1. the REQUIRED `fleet/review` gate (`decideReviewGate`'s
#      `specialist-unmet` outcome, orchestrator/src/ci.ts): a PR carrying a
#      `-reviewer` label whose specialist has no PASS for the PR's exact diff
#      (the specialist's own diff-content cache entry) FAILS `fleet/review`
#      itself, so GitHub refuses the merge natively. Apply the specialist
#      label, wait for it to pass, then (re-)apply `review`;
#   2. the `disarm-auto-merge` job below: requesting a specialist disarms the
#      PR's auto-merge, so an already-armed PR cannot land on its required
#      checks while the specialist is still running or after it FAILs;
#   3. `llamenos-fleet board` (board.ts): any `fleet/review/*` FAIL on the
#      head → NEEDS_FIX, in flight → WAITING, labelled but absent on the head
#      → STALE_LABEL — ahead of the generalist's own verdict;
#   4. `llamenos-fleet review-and-merge` (review-and-merge.ts): refuses on
#      any of the same three.
#
# ---------------------------------------------------------------------------
# THE LABEL SELECTS CODE TO RUN — it is validated, and fails closed.
# ---------------------------------------------------------------------------
# `resolveSpecialistLabel` (orchestrator/src/specialist.ts) accepts only a
# lowercase `[a-z0-9-]` name ending `-reviewer` (bounded length), matched
# EXACTLY against the base checkout's `.claude/agents/` directory listing,
# a regular file (never a symlink), whose frontmatter `name:` equals the
# label. An unknown or malformed `-reviewer` label FAILS its check with the
# rule it broke — never a skip, because a specialist that quietly does not
# run leaves the PR looking reviewed. The raw label reaches no shell: it is
# passed only through `env:` and the job's display `name:`.
#
# ---------------------------------------------------------------------------
# Inherited from `fleet-review.yml`, unchanged — read that file's header:
# ---------------------------------------------------------------------------
#   - runs from the PR's BASE commit; the head arrives as DATA (`git archive`,
#     no `.git` — the git-export invariant) and never executes (#665);
#   - agent configuration and every symlink stripped from that export;
#   - the fork-PR guard is the literal first step of every job;
#   - the diff-content review cache (`review-cache.ts`), namespaced per
#     specialist so a GENERALIST PASS can never be re-published as a
#     specialist's — re-labelling unchanged content reuses a prior PASS; a
#     FAIL is never cached;
#   - bootstrap guards that fail closed with a named reason when the base
#     predates the command this job runs. The PR that INTRODUCES this file
#     (#1092) therefore cannot run a specialist on itself — its base has no
#     `specialist-review-ci` — exactly the bootstrap case `fleet-review.yml`
#     documents for `review-ci`.
#   - Workflow-file honesty, as there: on `pull_request` the workflow
#     definition is read from the PR's own head. `.github/workflows/` is
#     CODEOWNERS-protected; see #773.
#
# There is no separate engine smoke-test step (the generalist spends one
# model call on it per review). An engine that cannot run surfaces in this
# check's own summary as `<agent> misconfigured:` / `<agent> unavailable:`
# (`runSpecialistReviewCi`), distinct from a real `VERDICT: FAIL`, and both
# fail the check.
name: Fleet Specialist Review

on:
  # `labeled` ONLY — see the header. Never `synchronize`/`opened`/`unlabeled`.
  pull_request:
    types: [labeled]

concurrency:
  # One run per (PR, label) at a time; a re-label while one is in flight
  # queues behind it rather than racing two reviews of the same diff. Never
  # cancelled — a cancelled run is a missing verdict, not a failing one.
  group: fleet-specialist-review-pr-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

permissions: {}  # deny-all; each job sets its own

env:
  BUN_VERSION: "1.3.5"

jobs:
  # Binding (2) in the header. GitHub-hosted, checks out nothing, runs no
  # code from the repository at all — one `gh` read and at most one
  # `gh pr merge --disable-auto`, against the PR number from the event
  # payload. The only job in this file with write access, and deliberately
  # NOT the job that runs the model (which stays read-only, as
  # `fleet/review` does).
  disarm-auto-merge:
    name: fleet-specialist/disarm-auto-merge
    if: endsWith(github.event.label.name, '-reviewer')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Refuse to run on a fork PR
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPO" != "$THIS_REPO" ]]; then
            echo "::error::fleet-specialist/disarm-auto-merge FAILED: fork-pr-guard — head repo '$HEAD_REPO' != '$THIS_REPO'"
            exit 1
          fi

      - name: Disarm auto-merge while a specialist review is requested
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::no numeric PR number in the event payload (got '$PR')"
            exit 1
          fi
          # Guarded so a failed read names itself instead of dying opaquely
          # under -e. A read failure FAILS this job: an armed PR we could not
          # confirm is disarmed must not look handled.
          if ! armed="$(gh pr view "$PR" -R "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null' 2>&1)"; then
            echo "::error::could not read PR #$PR's auto-merge state: $armed"
            exit 1
          fi
          if [[ "$armed" == "true" ]]; then
            gh pr merge "$PR" -R "$REPO" --disable-auto
            echo "auto-merge DISARMED on PR #$PR: a specialist review was requested. Once every requested specialist and fleet/review pass, merge via review-and-merge or re-arm by hand."
          else
            echo "PR #$PR has no auto-merge armed — nothing to disarm."
          fi

  specialist-review:
    # The check name. Built from the RAW label so an unknown or malformed
    # `-reviewer` label's FAIL is posted where the merge-decision code
    # (`specialistMergeBlockers`) looks for it. When the label is not a
    # specialist request this job is skipped, under a name outside the
    # `fleet/review/` prefix so the skip reads as nothing at all.
    name: ${{ endsWith(github.event.label.name, '-reviewer') && format('fleet/review/{0}', github.event.label.name) || 'fleet-specialist/not-requested' }}
    if: endsWith(github.event.label.name, '-reviewer')
    # The same dedicated self-hosted runner `fleet/review` uses — see
    # `fleet-review.yml`'s header ("Operator decision (#812)") for why, and
    # the fork guard below for what that requires.
    runs-on: [self-hosted, fleet-review]
    permissions:
      contents: read       # the base checkout; the head is exported as data
      actions: read        # the review-cache lookup, never a write
    # HIGH_IMPACT_TIMEOUT_MS (review.ts) is 20 minutes and a specialist always
    # gets it; this leaves room for checkout, install and the cache lookup.
    timeout-minutes: 30
    env:
      FLEET_REVIEW_MODEL: ${{ vars.FLEET_REVIEW_MODEL || 'sonnet' }}

    steps:
      # MANDATORY, and must stay the literal first step — a self-hosted runner
      # must never process a fork PR.
      - name: Refuse to run on a fork PR (self-hosted runner guard)
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPO" != "$THIS_REPO" ]]; then
            echo "::error::specialist review FAILED: fork-pr-guard — this job runs on a self-hosted runner and must never process a fork PR (head repo '$HEAD_REPO' != '$THIS_REPO')"
            exit 1
          fi

      - name: Resolve the base/head SHAs and PR context for this event
        id: ctx
        env:
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_EVENT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::specialist review FAILED: no-pr-number — no numeric PR number in the event payload (got '$PR_EVENT_NUMBER')"
            exit 1
          fi
          {
            echo "base_sha=$PR_EVENT_BASE_SHA"
            echo "head_sha=$PR_EVENT_HEAD_SHA"
            echo "branch=$PR_EVENT_BRANCH"
            echo "pr=$PR_EVENT_NUMBER"
          } >> "$GITHUB_OUTPUT"

      # The BASE commit — the agent registry, the orchestrator, the lockfile
      # and node_modules all come from here. The commit under judgement never
      # becomes code in this job.
      - name: Checkout the PR BASE (trusted)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.ctx.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Identical to `fleet-review.yml`'s export step: `git archive`, the
      # git-export invariant, then the agent-config + symlink strip.
      - name: Export the PR head as data
        env:
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          mkdir -p "$RUNNER_TEMP/head"
          git archive "$HEAD_SHA" | tar -x -C "$RUNNER_TEMP/head"
          if [ -e "$RUNNER_TEMP/head/.git" ]; then
            echo "::error::specialist review FAILED: git-export-invariant — \`git archive\` produced a .git entry at $RUNNER_TEMP/head/.git; this export must never carry a git object database"
            exit 1
          fi
          control=( \( -iname opencode.json -o -iname opencode.jsonc -o -iname .opencode
            -o -iname AGENTS.md -o -iname CONTEXT.md -o -iname .agents
            -o -iname CLAUDE.md -o -iname .claude -o -type l \) )
          find "$RUNNER_TEMP/head" -mindepth 1 "${control[@]}" -prune -print -exec rm -rf {} +
          left="$(find "$RUNNER_TEMP/head" -mindepth 1 "${control[@]}" -print -quit)"
          if [ -n "$left" ]; then
            echo "::error::specialist review FAILED: agent-config-strip — agent configuration survived the strip: $left"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # BASE lockfile, `--ignore-scripts`: a postinstall is the shortest path
      # from "PR edits a dependency" to "PR runs code inside its own judge".
      - name: Install dependencies (base lockfile, no install scripts)
        run: bun install --frozen-lockfile --ignore-scripts

      # Bootstrap guard: a base that predates `specialist-review-ci` (every PR
      # whose base is older than #1092, and #1092 itself) fails here with a
      # named reason instead of bun's opaque usage line. Fails CLOSED — after
      # #1092 merges, a base without the command means someone removed it.
      - name: Check the base provides the specialist review command
        run: |
          set -euo pipefail
          if [ ! -f orchestrator/src/cli.ts ]; then
            echo "::error::specialist review FAILED: base-predates-gate — orchestrator/src/cli.ts does not exist in this PR's base; rebase onto a newer main, then re-apply the label"
            exit 1
          fi
          usage="$(bun orchestrator/src/cli.ts 2>&1 || true)"
          case "$usage" in
            *specialist-review-ci*) ;;
            *)
              echo "::error::specialist review FAILED: base-missing-specialist-review-ci — this PR's base has no 'specialist-review-ci' command, so it cannot run a specialist"
              echo "The review deliberately runs from the BASE, never from the commit it judges."
              echo "Rebase onto a main that includes #1092, then re-apply the label."
              exit 1
              ;;
          esac

      # Resolves the label against the base's agent registry (fail closed),
      # reuses a cached PASS for this exact diff, or runs the specialist
      # read-only against the export. The label reaches the CLI through env
      # only — never interpolated into this script.
      - name: Review
        id: review
        env:
          FLEET_SPECIALIST_LABEL: ${{ github.event.label.name }}
          FLEET_CI_BRANCH: ${{ steps.ctx.outputs.branch }}
          FLEET_CI_PR: ${{ steps.ctx.outputs.pr }}
          FLEET_CI_HEAD_DIR: ${{ runner.temp }}/head
          FLEET_CI_HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          FLEET_CI_BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          FLEET_REVIEW_CACHE_DIR: ${{ runner.temp }}/review-cache
        run: bun orchestrator/src/cli.ts specialist-review-ci

      # Best-effort, never affects the verdict — only a FRESH PASS writes a
      # record, so a cache hit or a FAIL uploads nothing.
      - name: Cache the verdict, if this run produced a fresh PASS
        if: always() && steps.review.outputs.cache_artifact_name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.review.outputs.cache_artifact_name }}
          path: ${{ runner.temp }}/review-cache
          retention-days: 30
          if-no-files-found: ignore
