name: Verify Backup Restore

# Scheduled + manual: proves production backups actually exist, are fresh,
# and (optionally) are restorable — instead of leaving that question
# unanswered until the day it matters.
#
# Two tiers, because the second one needs a security decision this workflow
# does not get to make unilaterally:
#
#   1. Backup status (always runs, no new secret). Calls
#      playbooks/backup-status.yml, which only reads file existence/age/size
#      — no decryption, no production data touched.
#   2. Restore test (runs only if PROD_RESTORE_AGE_PRIVATE_KEY is set). Calls
#      playbooks/test-restore.yml, which IS explicitly documented as
#      non-destructive — it restores the latest backup into a disposable,
#      throwaway container and never touches the running application or its
#      database. See deploy/ansible/playbooks/test-restore.yml.
#
# Why tier 2 is optional: backups are now always age-encrypted (see #1125),
# and test-restore.yml decrypts on the REMOTE host (it execs docker commands
# there) — there is no way to satisfy the issue's "run test-restore.yml on a
# schedule" ask without the age PRIVATE key being reachable from that host
# during the run. vars.example.yml's own guidance is that this key is "for
# restore operations only — NOT stored on server", i.e. a human deliberately
# stages it only when actually restoring. Keeping a copy in GitHub Secrets
# for unattended weekly use is a real change to that key's custody and isn't
# this workflow's call to make by itself. So: it is staged on the remote
# host ONLY for the duration of this job, written by a dedicated step, and
# removed by an `if: always()` step further down — but only ever happens if
# someone has explicitly decided to set PROD_RESTORE_AGE_PRIVATE_KEY.
# Without it, you still get tier 1 every week, and a clear note that tier 2
# did not run — not a silent gap and not a false "restore verified" claim.
#
# Required secrets (in the "production" GitHub Environment — the same ones
# deploy-prod.yml already uses):
#   PROD_INVENTORY_YML            — content of inventory-production.yml
#   ANSIBLE_VAULT_PASSWORD        — password for ansible-vault encrypted vars-production.yml
#   PROD_VARS_YML_ENCRYPTED       — content of encrypted vars-production.yml
#   PROD_SSH_PRIVATE_KEY          — SSH private key for the production VPS deploy user
# Optional secret, enables tier 2:
#   PROD_RESTORE_AGE_PRIVATE_KEY  — age private key matching backup_age_public_key
#
# A red run here means backups (or restores) are untested or broken — treat
# it the same as a failed deploy, not as routine noise to re-run until green.

on:
  schedule:
    # 05:00 UTC every Monday. Backups themselves run daily at 03:00 UTC
    # (backup_cron_hour/backup_cron_minute, deploy/ansible/vars.yml); this
    # gives two hours of slack and still re-verifies at least weekly.
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

concurrency:
  group: backup-restore-verify
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  verify-backups:
    name: Verify Backup Status and (Optionally) Test Restore
    # Needs SSH access to the production host, same as deploy-prod.yml.
    runs-on: [self-hosted, linux, x64, hetzner, llamenos]
    environment: production
    timeout-minutes: 20

    steps:
      - name: Isolate per-job toolchain caches
        run: |
          {
            echo "ANSIBLE_COLLECTIONS_PATH=$RUNNER_TEMP/ansible-collections"
            echo "ANSIBLE_LOCAL_TEMP=$RUNNER_TEMP/ansible-tmp"
            echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Same failure mode deploy-prod.yml guards against: `printf '%s'` on an
      # unset secret succeeds and leaves a 0-byte file, which Ansible then
      # reads as "no hosts" and exits 0 having verified nothing.
      - name: Verify required secrets are present
        env:
          PROD_INVENTORY_YML: ${{ secrets.PROD_INVENTORY_YML }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          PROD_VARS_YML_ENCRYPTED: ${{ secrets.PROD_VARS_YML_ENCRYPTED }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in PROD_INVENTORY_YML ANSIBLE_VAULT_PASSWORD \
                      PROD_VARS_YML_ENCRYPTED PROD_SSH_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::required secret $name is unset or empty"
            done
            echo "Set them in the repository's 'production' environment." >&2
            exit 1
          fi
          echo "All 4 required secrets are present."

      - name: Install Ansible
        run: |
          # Pinned to the same version CI validates the playbooks against.
          pip install ansible==14.1.0
          ansible-galaxy collection install community.docker

      - name: Write Ansible inventory
        env:
          INVENTORY_YML: ${{ secrets.PROD_INVENTORY_YML }}
        run: |
          mkdir -p deploy/ansible
          printf '%s' "$INVENTORY_YML" > deploy/ansible/inventory-production.yml

      - name: Write Ansible vault password
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s' "$VAULT_PASSWORD" > "$RUNNER_TEMP/vault-pass"
          chmod 600 "$RUNNER_TEMP/vault-pass"

      - name: Write encrypted production vars
        env:
          PROD_VARS: ${{ secrets.PROD_VARS_YML_ENCRYPTED }}
        run: |
          printf '%s' "$PROD_VARS" > deploy/ansible/vars-production.yml

      - name: Load SSH key into agent
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "$SSH_KEY" | ssh-add -
          ssh-keyscan -H "$(grep ansible_host deploy/ansible/inventory-production.yml | head -1 | awk '{print $2}')" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify the inventory resolves at least one llamenos_servers host
        working-directory: deploy/ansible
        run: |
          set -euo pipefail
          if ! ansible -i inventory-production.yml llamenos_servers --list-hosts > hosts.txt 2>err.txt; then
            echo "::error::inventory-production.yml is not a parseable Ansible inventory"
            sed -e 's/^/  /' err.txt >&2
            exit 1
          fi
          count=$(sed -n 's/^[[:space:]]*hosts (\([0-9][0-9]*\)):.*/\1/p' hosts.txt | head -1)
          rm -f hosts.txt err.txt
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::inventory-production.yml matched 0 hosts for the 'llamenos_servers' group — this job would pass having verified nothing"
            exit 1
          fi
          echo "inventory-production.yml resolves $count host(s) in group 'llamenos_servers'."

      - name: Check whether restore-test key is configured
        id: restore_key
        env:
          RESTORE_AGE_KEY: ${{ secrets.PROD_RESTORE_AGE_PRIVATE_KEY }}
        run: |
          if [ -n "${RESTORE_AGE_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Tier 1 — always runs. Freshness/size/manifest only, no decryption.
      - name: Run backup-status (read-only)
        working-directory: deploy/ansible
        run: |
          ansible-playbook playbooks/backup-status.yml \
            -i inventory-production.yml \
            -e "@vars-production.yml" \
            --vault-password-file "$RUNNER_TEMP/vault-pass"

      # Tier 2 — opt-in. Stages the age private key on the remote host only
      # for this step, so test-restore.yml's server-side decrypt can run.
      - name: Stage restore key on remote host
        if: steps.restore_key.outputs.present == 'true'
        env:
          RESTORE_AGE_KEY: ${{ secrets.PROD_RESTORE_AGE_PRIVATE_KEY }}
        working-directory: deploy/ansible
        run: |
          set -euo pipefail
          printf '%s' "$RESTORE_AGE_KEY" > "$RUNNER_TEMP/restore-key.txt"
          chmod 600 "$RUNNER_TEMP/restore-key.txt"
          # `src=` (not an inlined `content=`) so the key value never appears
          # in a shell command line / process listing on the runner.
          ansible -i inventory-production.yml llamenos_servers \
            -m ansible.builtin.copy \
            -a "src=$RUNNER_TEMP/restore-key.txt dest=/tmp/.llamenos-restore-test-key mode=0600" \
            --become
          rm -f "$RUNNER_TEMP/restore-key.txt"

      - name: Run test-restore (non-destructive)
        if: steps.restore_key.outputs.present == 'true'
        working-directory: deploy/ansible
        run: |
          ansible-playbook playbooks/test-restore.yml \
            -i inventory-production.yml \
            -e "@vars-production.yml" \
            -e "backup_age_private_key_path=/tmp/.llamenos-restore-test-key" \
            --vault-password-file "$RUNNER_TEMP/vault-pass"

      - name: Remove staged restore key from remote host
        if: always() && steps.restore_key.outputs.present == 'true'
        working-directory: deploy/ansible
        run: |
          ansible -i inventory-production.yml llamenos_servers \
            -m ansible.builtin.file \
            -a "path=/tmp/.llamenos-restore-test-key state=absent" \
            --become || true

      - name: Note that restore testing did not run
        if: steps.restore_key.outputs.present != 'true'
        run: |
          {
            echo "### Restore test skipped"
            echo
            echo "Only tier 1 (backup-status: existence/freshness/size) ran this week."
            echo "Tier 2 (an actual decrypt + restore into a scratch container, via"
            echo "\`playbooks/test-restore.yml\`) needs \`PROD_RESTORE_AGE_PRIVATE_KEY\`"
            echo "set on the production environment — a deliberate choice, since it"
            echo "means a copy of the backup decryption key is reachable by CI."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k || true

      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/vault-pass" "$RUNNER_TEMP/restore-key.txt"
          rm -f deploy/ansible/inventory-production.yml
          rm -f deploy/ansible/vars-production.yml
