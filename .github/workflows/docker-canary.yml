# Docker Canary
#
# Publishes the post-merge canary image (`llamenos:canary` +
# `llamenos:canary-<sha>`) to Docker Hub on every push to `main`, with SBOM
# attestation and cosign keyless signing.
#
# This job used to live in ci.yml, gated on `ci-status` of that workflow's
# own `push: main` run. #1830 dropped that trigger: the merge queue is the
# gate — a tree cannot reach `main` without passing `ci-status` on the merge
# group, and the tree the group validated IS the tree that lands here, byte
# for byte (that validation includes `production-smoke`, which builds this
# same Dockerfile target via the production compose stack). Re-running the
# full suite post-merge could not reject anything; it only bought a second
# opinion on bytes already approved, at a full duplicate run per merge.
#
# So this is deliberately a standalone PUBLISH job, not a gate: no test
# matrix, no ci-status dependency. A failure here means the publish pipeline
# itself is broken (registry, signing, Dockerfile drift on a path the smoke
# test does not cover) — fix the pipeline, not the tree.
name: Docker Canary

on:
  push:
    branches: [main]
  # Manual rebuild/republish of the canary from main.
  workflow_dispatch:

concurrency:
  # Two merges in quick succession supersede: only the newest tree's canary
  # matters, and `:canary` is a moving tag by definition. Cancelling the
  # older build is safe — nothing gates on a mid-flight canary publish.
  group: docker-canary
  cancel-in-progress: true

permissions: {}  # deny-all; per-job permissions below

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      REGISTRY: docker.io
      IMAGE_NAME: llamenos

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute canary tags
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          {
            echo "tags<<EOF"
            echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:canary"
            echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:canary-${SHORT_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push canary image
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          # `deploy/docker/Dockerfile` is multi-stage and its LAST stage is
          # `static` (the Caddy image that serves the SPA, consumed by
          # docker-compose.production.yml's `caddy` service). Docker defaults
          # to the last stage, so without an explicit target this would
          # publish the Caddy static-file server under the app image tags.
          target: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.1.0
        with:
          subject-name: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container image (keyless)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "Signed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
