# CodeQL — advanced setup (replaces GitHub-managed default setup)
#
# Why this file exists: the merge queue. GitHub only runs a workflow on the
# queue's own ref (`gh-readonly-queue/main/...`) if it triggers on
# `merge_group`, and default setup's triggers are fixed ("push and pull
# requests to main and protected branches" + weekly) — there is no merge_group
# option. With default setup, nothing analysed or uploaded on the queue's ref,
# so the required `CodeQL` context never reported there and the queue ejected
# every entry for "timed out awaiting a successful CI result".
#
# ─── The required `CodeQL` context: two check-runs, and both must pass ──────
# The ruleset requires the name `CodeQL` and pins no app, so every check-run
# of that name on the commit counts. Two sources emit one:
#   - the `codeql` rollup at the bottom (app github-actions), on EVERY event.
#     On `merge_group` it is the only `CodeQL` there is — what makes the
#     required context report on the queue's ref at all.
#   - on pull requests, GHAS's alert gate (app github-advanced-security,
#     "No new alerts in code changed by this pull request"), created once the
#     legs below upload. The legs feed it; they are not it.
# Same-named check-runs from different check suites stand side by side: the
# check-runs API's default `filter=latest` returns both, GraphQL marks both
# `isRequired` (both observed on #1244), and GitHub documents that a required
# name shared by a check-run and a commit status needs both to pass. So the
# rollup adds a requirement; it cannot stand in for the alert gate. (#1244
# records the one case not demonstrated live: a green rollup beside a red
# gate.)
#
# Why the rollup carries the name on pull requests too, not a name of its
# own: the alert gate goes `neutral` — which a required check accepts —
# whenever it cannot judge. "Error when processing the SARIF file" after a
# refused upload (#1244's own runs, while default setup was enabled); "N
# configurations not found" when nothing was analysed (every Dependabot PR
# under default setup). Under a separate name, `CodeQL` stayed satisfied by
# that neutral while the analysis itself had failed. Under `CodeQL`, a failed,
# refused or missing leg is a red required check.
#
# The legs are `Analyze advanced (<lang>)`, never default setup's
# `Analyze (<lang>)`: one check name, one source.
#
# ─── Cutover: red until default setup is disabled — fail-closed ─────────────
# Code scanning refuses every upload from this file while default setup is
# enabled: "CodeQL analyses from advanced configurations cannot be processed
# when the default setup is enabled". Every leg fails at `Perform CodeQL
# analysis`, the rollup fails, and `CodeQL` blocks. Default setup has to be
# disabled before this file can go green; #1244 records the order.
#
# ─── merge_group runs the full matrix ───────────────────────────────────────
# The queue's commit (main + the queued PRs) is exactly what lands on main,
# so it gets analysed, not rubber-stamped. Cost: the slowest leg is rust
# (~8 min avg, 9 min max under default setup) against a median ci.yml PR run
# of ~34 min, so CodeQL never becomes the queue's critical path; the price is
# five ubuntu-latest jobs of the Free plan's 20-concurrent-job pool per entry,
# for ~12 runner-minutes in total. Minutes themselves are free: this is a
# public repository.
#
# ─── Languages: exact parity with default setup ─────────────────────────────
# Default setup analysed seven identifiers: actions, javascript,
# javascript-typescript, python, ruby, rust, typescript. Three of them are ONE
# analysis — GitHub's CodeQL language-identifier table lists `javascript` and
# `typescript` as alternative identifiers for `javascript-typescript`, and
# codeql-action's own alias table (src/languages/builtin.json at the SHA
# pinned below) maps both `javascript-typescript` and `typescript` to the
# `javascript` extractor, which init de-duplicates into a single analysis:
#
#   javascript-typescript ─┐
#   javascript            ─┼─► one JS/TS analysis (the `javascript` extractor)
#   typescript            ─┘
#
# Default setup itself ran exactly the five legs below — build-mode none,
# category `/language:<identifier>` (code-scanning analyses API) — so the
# matrix reproduces them one for one, with the same categories, so the alert
# history carries over. `actions`, `python`, `ruby` and `rust` have no
# aliases; `rust` is packages/crypto, the most security-critical code in the
# repo.
#
# By the time default setup was disabled (2026-09-29) its configuration also
# listed c-cpp, java-kotlin and swift. None was ever analysed: default setup's
# single run of each (2026-09-27) ended "unsuccessful execution" with 0
# results. java-kotlin and swift are the staged jobs below; c-cpp has nothing
# to analyse — the tree's only C-family file is the UniFFI-generated
# packages/crypto/bindings/swift/LlamenosCoreFFI.h, whose code is the rust leg.
#
# scripts/check-codeql-languages.ts commits all ten identifiers and the alias
# table, and fails CI (ci.yml `docs-guard`, inside the required `ci-status`)
# if this matrix stops covering exactly the seven, if a staged language loses
# its job, or if a C/C++ source file appears with no c-cpp leg. Dropping a
# language is a red check, not a silent loss of coverage.
#
# Query suite and threat model match default setup: no `queries:` input means
# the `default` suite, and no `threat-models` configuration means `remote`.
#
# ─── Staged, NOT required: java-kotlin and swift (#1243) ────────────────────
# Default setup never analysed apps/android/ or apps/ios/. The two
# `Analyze staged (...)` jobs start that — visibly, and without any route to
# blocking a merge:
#   - neither is in the `codeql` rollup's `needs`, and the rollup reads only
#     `needs.analyze.result`, so its verdict is independent of theirs;
#   - neither runs on `pull_request` or `merge_group`, so neither can add
#     alerts to the GHAS `CodeQL` alert gate a PR is judged by;
#   - their names never equal a required context;
#   - neither uploads to code scanning at all (`upload: never`, and only
#     `security-events: read`, so it could not if asked); the SARIF is a
#     workflow artifact instead. This one protects the gate rather than the
#     merge: GHAS judges a PR against every configuration present on main,
#     and a configuration uploaded on main but never on PRs turns EVERY PR's
#     `CodeQL` check into "Code scanning cannot determine the alerts
#     introduced by this pull request" — conclusion `neutral`, which a
#     required check accepts. A staged upload on main would quietly take the
#     verdict out of the required gate for every PR.
# Promotion to required means all of it at once: run on pull_request and
# merge_group, upload, join the rollup's `needs`, and a matching change to the
# rail's expected set — so the configuration exists on both sides of every
# PR comparison. Not before both are reliably green.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue's own ref. See ci.yml's `on:` block: a required context
  # that never reports on the queue's ref blocks the queue forever.
  merge_group:
    types: [checks_requested]
  # Weekly, as default setup was. Also the only automatic trigger for the
  # staged swift job (see its comment for why).
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('codeql-pr-{0}', github.ref) || format('codeql-{0}-{1}', github.event_name, github.sha) }}
  # Never cancelled outside pull_request: a merge_group run cancelled mid-way
  # leaves `CodeQL` missing on the queue's ref, which stalls the queue instead
  # of failing it (same reasoning as ci.yml's concurrency block).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}  # deny-all; per-job permissions below

env:
  BUN_VERSION: "1.3.5"

jobs:
  # ─── Required legs: exact parity with default setup ───────────────────
  analyze:
    name: Analyze advanced (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 30
    strategy:
      # A cancelled leg uploads nothing; let every leg finish and let the
      # rollup report the failure.
      fail-fast: false
      matrix:
        include:
          - language: actions
          - language: javascript-typescript
          - language: python
          - language: ruby
          - language: rust

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  # ─── Staged, not required: java-kotlin (#1243) ────────────────────────
  # Kotlin needs a traced compile — build-mode none would analyse the Java
  # and skip every .kt file with only a warning. On main pushes as well as the
  # weekly schedule: it runs on ubuntu-latest, which costs nothing here.
  analyze-java-kotlin:
    name: Analyze staged (java-kotlin)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: read  # staged: no upload, so no write
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun (for codegen)
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The app compiles generated protocol types and I18n.kt, which are
      # gitignored. Generated before init, so only the Gradle build is traced.
      - name: Install dependencies and run codegen
        run: bun install --frozen-lockfile && bun run codegen && bun run i18n:codegen

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual

      # --no-build-cache: gradle.properties sets org.gradle.caching=true, and
      # a compile task restored FROM-CACHE never runs kotlinc — CodeQL would
      # extract nothing and report an empty, green analysis.
      - name: Build (traced)
        working-directory: apps/android
        run: ./gradlew --no-daemon --no-build-cache compileDebugKotlin --console=plain

      # upload: never — see the header: a staged configuration on main would
      # neutralise the required gate on every PR.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-results

      - name: Upload SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-staged-java-kotlin
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error

  # ─── Staged, not required: swift (#1243) ──────────────────────────────
  # Swift analysis needs macOS, priced as multiplier x minutes x frequency:
  # macOS bills at 10x Linux; a run is ~45 min (a clean, traced build plus
  # analysis — ci.yml's cached, untraced ios-build-test takes 5-10); weekly is
  # ~4.3 runs a month. So ~195 macOS minutes = ~1,950 Linux-equivalent
  # minutes a month, which would be nearly all of a private repo's 2,000
  # included. This repo is public, so standard runners cost $0, and the real
  # price is a slot: the Free plan allows 5 concurrent macOS jobs across every
  # workflow, shared with ci.yml's ios-build-test and ios-e2e.yml. On every
  # push to main (142 in the week to 2026-09-27) it would be ~20 runs a day,
  # ~15 slot-hours, so this runs weekly and on demand only.
  analyze-swift:
    name: Analyze staged (swift)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
      security-events: read  # staged: no upload, so no write
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun (for codegen)
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies and run codegen
        run: bun install --frozen-lockfile && bun run codegen && bun run i18n:codegen

      # Same cache key as ci.yml's ios-build-test: the XCFramework and the
      # UniFFI Swift bindings must come from the same Rust build.
      - name: Cache crypto XCFramework + bindings
        id: xcframework-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/LlamenosCoreFFI.xcframework
            packages/crypto/dist/ios/LlamenosCore.swift
          key: xcframework-v2-ios-${{ runner.os }}-${{ hashFiles('packages/crypto/src/**/*.rs', 'packages/crypto/Cargo.toml', 'packages/crypto/Cargo.lock', 'packages/crypto/scripts/build-mobile.sh') }}

      - name: Install Rust stable (for crypto xcframework)
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/crypto

      - name: Build crypto XCFramework
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        run: |
          cd packages/crypto
          ./scripts/build-mobile.sh ios
          cp -r dist/ios/LlamenosCoreFFI.xcframework ../../apps/ios/

      - name: Copy UniFFI bindings (from build or cache)
        run: cp packages/crypto/dist/ios/LlamenosCore.swift apps/ios/Sources/Generated/LlamenosCore.swift

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      # Initialised after the Rust build and project generation, so only
      # xcodebuild is traced.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual

      # A fresh DerivedData path, never a restored one: an incremental build
      # that skips swiftc extracts nothing. One simulator architecture, as
      # CodeQL recommends; signing is irrelevant to analysis.
      - name: Build (traced)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Llamenos.xcodeproj \
            -scheme Llamenos \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/codeql-deriveddata" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # upload: never — see the header: a staged configuration on main would
      # neutralise the required gate on every PR.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:swift
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-results

      - name: Upload SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-staged-swift
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error

  # ─── Rollup: the `CodeQL` check-run on every event (see the header) ───
  # Needs ONLY the required matrix. `needs.analyze.result` is `success` only
  # if every leg succeeded; a failed, cancelled or skipped leg fails this job
  # — unlike ci-status, `skipped` is not accepted, because `analyze` has no
  # condition under which skipping it would be legitimate.
  codeql:
    name: CodeQL
    needs: [analyze]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2

    steps:
      - name: Require every required leg to have analysed and uploaded
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          if [[ "$ANALYZE_RESULT" != "success" ]]; then
            echo "::error::Required CodeQL legs did not all succeed (analyze: $ANALYZE_RESULT). A missing leg is missing coverage — see the Analyze advanced (<language>) jobs."
            exit 1
          fi
          echo "All required CodeQL legs analysed and uploaded."
