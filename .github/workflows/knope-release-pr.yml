# Maintain the release PR by re-running `knope prepare-release` on every
# push to main. Knope opens or force-updates a PR on the `release` branch
# with the next version bump and a CHANGELOG.md entry. Merging that PR
# triggers release.yml to cut the actual release.
#
# Uses RELEASE_BOT_TOKEN (a fine-grained PAT with Contents:write and
# Pull requests:write), NOT GITHUB_TOKEN.
#
# Why: the repo's fork-PR approval policy is `all_external_contributors`,
# which is load-bearing — this is a public repo and nearly every other
# workflow runs on self-hosted runners, so that policy is what stops a fork
# PR from executing code on our own infrastructure. GitHub counts
# `github-actions[bot]` as an external contributor under that policy, so a
# GITHUB_TOKEN-authored release PR parks all of its runs in `action_required`
# and needs a manual "Approve and run" click before the required checks
# (ci-status, gitleaks, CodeQL, fleet/verify) can even start. Authoring the
# PR as a real collaborator via PAT sidesteps that gate without weakening it
# for forks. It also retires the old anti-recursion caveat: a PAT-authored
# PR triggers `pull_request` workflows normally.
#
# The PAT belongs to the fleet machine user `llamenos-auto` (#773), and the
# git identity below matches it.
#
# It MUST be a classic PAT with the `public_repo` scope. A fine-grained PAT
# cannot work here: this repo is owned by a personal account, a fine-grained
# PAT's resource owner is the token's own user, and a machine user that is
# merely a collaborator on someone else's personal repo can therefore never be
# granted access to it. Such a token still authenticates (`gh api user` works)
# and can still read the public repo, but every write is a 403 — including a
# plain, non-force push of a brand-new branch. The "Verify release token can
# push" step below exists to fail loudly on exactly that.

name: Knope — Prepare Release PR

on:
  push:
    branches: [main]

# Rapid-fire main merges collapse into a single recomputation.
concurrency:
  group: knope-prepare
  cancel-in-progress: true

# GITHUB_TOKEN is only used to fetch the knope release binary; every write
# goes through RELEASE_BOT_TOKEN.
permissions:
  contents: read

jobs:
  prepare-release:
    # Skip the merge commit produced by merging the release PR itself,
    # otherwise we'd recursively try to prepare a release of the release.
    # The head_commit.message is consumed only by the Actions expression
    # engine, never by a shell, so this is safe from injection.
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    # knope-dev/action's entrypoint.sh shells out to `gh` to fetch the knope
    # binary from GitHub Releases. On the self-hosted runners this fails with
    # "gh: command not found" (exit 127) even after gh was installed manually
    # on at least one runner — the failure is per-runner/PATH, not "missing
    # binary". Same class of $HOME/PATH mismatch as the gitleaks, ansible-lint,
    # and dockerfile-scan self-hosted issues (see security-audit.yml). This
    # job needs no self-hosted resources, so keep it hosted. The token
    # preflight below also depends on `gh` being present.
    runs-on: ubuntu-latest
    steps:
      # A PAT expires. Without this, an expired token would surface as a
      # knope failure swallowed by the continue-on-error below, and the
      # release PR would silently stop updating while this job stayed green.
      - name: Verify release token
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RELEASE_BOT_TOKEN is not set. Create a fine-grained PAT on this repo with Contents:write and Pull requests:write, then: gh secret set RELEASE_BOT_TOKEN"
            exit 1
          fi
          if ! gh api user -q .login; then
            echo "::error::RELEASE_BOT_TOKEN is set but rejected by the API — most likely expired or revoked. Reissue it and re-set the secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      # `gh api user` above only proves the token authenticates. Prove it can
      # WRITE, before knope does any work: the receive-pack handshake is where
      # a read-only token or a fine-grained PAT that cannot reach this repo is
      # rejected (403), and --dry-run does that handshake without changing
      # anything. --force so a non-fast-forward against an existing `release`
      # branch is not mistaken for an auth failure.
      - name: Verify release token can push
        run: |
          if ! git push --dry-run --force origin HEAD:refs/heads/release; then
            echo "::error::RELEASE_BOT_TOKEN authenticates but cannot push to this repo (403). It must be a classic PAT with the public_repo scope owned by llamenos-auto — a fine-grained PAT cannot write to a repo owned by another personal account. Reissue it and re-set the secret: gh secret set RELEASE_BOT_TOKEN"
            exit 1
          fi

      # Must match the account owning RELEASE_BOT_TOKEN (the machine user).
      - name: Configure git identity
        run: |
          git config user.name "llamenos-auto"
          git config user.email "333950803+llamenos-auto@users.noreply.github.com"

      - name: Install knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.4
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Tolerate exactly one failure: knope's `releases::no_release` — no
      # commits since the last tag bump any version, so there is nothing to
      # release. That error is raised by the PrepareRelease step, before
      # anything is committed or pushed. Every other non-zero exit (a rejected
      # push, a bad token, a knope crash) fails the job. This step used to be
      # `continue-on-error: true`, which also swallowed a 403 on push and left
      # release PRs silently dead while the workflow stayed green.
      - name: Prepare release PR
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          log="${RUNNER_TEMP}/knope-prepare-release.log"
          set +e
          knope prepare-release --verbose 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          if grep -q 'releases::no_release' "${log}"; then
            echo "::notice::No releasable commits since the last release tag; no release PR to open or update."
            exit 0
          fi
          echo "::error::knope prepare-release failed (exit ${status}) for a reason other than 'nothing to release'. See the log above."
          exit "${status}"
