# Release workflow — runs when the release PR (branch `release`,
# maintained by knope-release-pr.yml) is merged to main. Knope bumps the
# version; this workflow tags it, builds every installable artifact, signs the
# lot and publishes ONE GitHub Release that actually contains them.
#
# Steps:
#   1. Gate on release-PR merge (head_ref == 'release', merged == true)
#   2. Read the new version from package.json (knope already bumped it)
#   3. Build the web bundle (SLSA attestation + reproducible-build manifest)
#   4. `draft`: create the git tag and a **draft** GitHub Release
#   5. `desktop` + `android`: build and sign the installers and attach
#      version-free aliases of them to that draft (tauri-release.yml,
#      mobile-release.yml — called as reusable workflows, not dispatched)
#   6. `release`: checksum EVERYTHING now attached, SBOM, provenance, cosign,
#      GPG; assert the release is complete; only then publish it
#   7. `docker-stable` / `dispatch`: container image, iOS build
#
# Why the release is held as a draft until step 6: the repo has immutable
# releases, so assets cannot be added to a PUBLISHED release. Publishing
# `v<version>` first and building installers afterwards (what this workflow
# used to do) meant `v0.17`..`v0.19.19` shipped a signed CHECKSUMS.txt listing
# the web bundle's files and not one installer — nothing a person could run, and
# a manifest attesting to files nobody could download (#1229). A draft accepts
# uploads, so the installers are attached while it is still a draft and the
# release becomes public (and immutable) only once the guard in "Assert the
# release is complete" has seen every required artifact.
#
# Consequence worth knowing: a failed desktop or Android build now fails the
# release and leaves `v<version>` an unpublished draft — loudly, instead of a
# published release with nothing in it. Re-run the failed jobs; if the
# `desktop-v<version>` / `android-v<version>` release of the failed leg was
# already published (immutable, so it refuses a rebuild), bump the version.
#
# `…/releases/latest/download/<alias>` then resolves for every alias in the
# REQUIRED list below, because aliases carry no version in their names.
#
# This workflow calls (not dispatches) the desktop and Android builds so that
# `release` can wait for them. It still dispatches the iOS build, which
# nothing here depends on: GitHub Releases created by
# GITHUB_TOKEN do NOT fire `release: published` for downstream workflows
# (anti-recursion rule), so `gh workflow run` is the only way to start them —
# see #712. Dispatching via `POST /actions/workflows/{id}/dispatches` requires
# `actions: write` on the job token (#711). (A dispatch to deploy-demo.yml went
# with demo mode in #1604: there is no demo deployment to push a release to.)

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

# Never cancel a release in progress.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}  # deny-all; per-job permissions below

env:
  BUN_VERSION: "1.3.5"

jobs:
  # --- Gate + version read ---
  check:
    # github.head_ref is used only in this Actions expression (not shell).
    if: >-
      github.event.pull_request.merged == true &&
      github.head_ref == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read new version from package.json
        id: read
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  # --- Web bundle build (reproducible-build manifest + attestation subject) ---
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run codegen
        run: bun run codegen

      - name: Set build-time constants
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build frontend
        run: bun run build

      # This lists the files of the web bundle, which is not itself a download —
      # it is the manifest a reproducible-build check compares a rebuild against.
      # It used to be published AS `CHECKSUMS.txt`, which made the signed manifest
      # of every release describe files that are not attached to it (#1229).
      # `CHECKSUMS.txt` is now built by the `release` job over what is really
      # published, and this file is published under its true name.
      - name: Compute web bundle manifest
        run: |
          cd dist
          find client -type f -exec sha256sum {} \; | sort > ../BUILD-MANIFEST.txt
          cd ..
          sha256sum bun.lockb >> BUILD-MANIFEST.txt
          echo "$(wc -l < BUILD-MANIFEST.txt) files in the web bundle manifest"

      - name: Upload app build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build
          path: dist/
          retention-days: 1

      - name: Upload web bundle manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-manifest
          path: BUILD-MANIFEST.txt
          retention-days: 7

  # --- Tag + DRAFT GitHub Release (installers are attached to it next) ---
  draft:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download web bundle manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-manifest

      - name: Create git tag (idempotent for retries)
        env:
          NEW_VERSION: ${{ needs.check.outputs.version }}
        run: |
          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${NEW_VERSION} already exists locally — skipping"
          else
            git tag "v${NEW_VERSION}"
          fi
          git push origin "v${NEW_VERSION}" --force

      - name: Extract changelog section for this version
        id: changelog
        env:
          NEW_VERSION: ${{ needs.check.outputs.version }}
        run: |
          BODY=$(awk -v ver="$NEW_VERSION" '
            /^## / {
              if (found) exit
              if (index($0, ver)) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "::warning::No changelog section found for v${NEW_VERSION}"
          fi
          echo "$BODY" > release-notes.md

          # Download section. The names are the stable aliases the `release` job's
          # guard requires; `releases/latest/download/<name>` always serves the newest
          # release's file of that exact name. Written by hand because the release is
          # still a draft with nothing attached when these notes are created.
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          FENCE='```'
          {
            echo ""
            echo "---"
            echo ""
            echo "### Downloads"
            echo ""
            echo "These links always resolve to the newest release:"
            echo ""
            echo "- Linux (x64): [AppImage](${BASE}/llamenos-linux-x86_64.AppImage), [deb](${BASE}/llamenos-linux-x86_64.deb), [rpm](${BASE}/llamenos-linux-x86_64.rpm)"
            echo "- Windows (x64): [msi](${BASE}/llamenos-windows-x64.msi), [setup.exe](${BASE}/llamenos-windows-x64-setup.exe)"
            echo "- Android: [APK](${BASE}/llamenos-android.apk)"
            echo "- macOS: attached as \`llamenos-macos-universal.dmg\` only when the build is Apple-signed and notarized (#741); otherwise it is withheld."
            echo ""
            echo "Every file here is byte-identical to the one on the versioned \`desktop-v${NEW_VERSION}\` / \`android-v${NEW_VERSION}\` releases, which keep the original file names."
            echo ""
            echo "### Verify"
            echo ""
            echo "\`CHECKSUMS.txt\` lists the SHA-256 of **every** file attached to this release, and is signed (keyless cosign, \`CHECKSUMS.txt.cosign.sig\` / \`.pem\`)."
            echo ""
            echo "${FENCE}bash"
            echo "sha256sum -c CHECKSUMS.txt --ignore-missing   # run next to the files you downloaded"
            echo "${FENCE}"
            echo ""
            echo "Desktop installers also carry a minisign \`.sig\`; see the \`desktop-v${NEW_VERSION}\` release notes for the command."
            echo ""
            echo "Desktop update metadata is published to the [llamenos-releases](https://github.com/Llamenos-Hotline/llamenos-releases) repository."
          } >> release-notes.md

          echo "--- Release notes ---"
          cat release-notes.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Clean up any broken release from a prior failed run
          if gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "Deleting stale release v${NEW_VERSION} from previous attempt"
            gh release delete "v${NEW_VERSION}" --yes
          fi
          gh release create "v${NEW_VERSION}" \
            --draft \
            --title "v${NEW_VERSION}" \
            --notes-file release-notes.md \
            BUILD-MANIFEST.txt

  # --- Installers: built, signed and attached to the draft ---
  # Called as reusable workflows, not dispatched, so `release` below can wait
  # for them. `release-tag` is both the ref that gets built and the draft that
  # receives the version-free aliases. The permissions are the union of what the
  # called jobs declare; a called job cannot exceed its caller's.
  desktop:
    needs: [check, draft]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/tauri-release.yml
    with:
      version: ${{ needs.check.outputs.version }}
      release-tag: v${{ needs.check.outputs.version }}
    secrets: inherit

  android:
    needs: [check, draft]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/mobile-release.yml
    with:
      version: ${{ needs.check.outputs.version }}
      platform: android
      release-tag: v${{ needs.check.outputs.version }}
    secrets: inherit

  # --- Seal the draft (checksums, SBOM, provenance, signatures), then publish ---
  release:
    needs: [check, build, draft, desktop, android]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write       # OIDC for cosign keyless + attestations
      attestations: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEW_VERSION: ${{ needs.check.outputs.version }}

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download app build (for attestation)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-build
          path: dist/

      - name: Generate provenance metadata JSON
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO: ${{ github.repository }}
        run: |
          cat > provenance.json <<PROVEOF
          {
            "builder": { "id": "https://github.com/actions/runner" },
            "buildType": "https://github.com/slsa-framework/slsa/blob/main/docs/spec/v1.0/levels.md",
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${REPO}@refs/tags/v${NEW_VERSION}",
                "digest": { "sha1": "${MERGE_SHA}" },
                "entryPoint": ".github/workflows/release.yml"
              },
              "parameters": {
                "SOURCE_DATE_EPOCH": "$(git log -1 --format=%ct)",
                "bunVersion": "${BUN_VERSION}"
              }
            },
            "buildConfig": {
              "dockerfile": "deploy/docker/Dockerfile",
              "steps": ["bun install --frozen-lockfile", "bun run codegen", "bun run build"]
            },
            "metadata": {
              "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "buildFinishedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "completeness": { "parameters": true, "environment": false, "materials": false },
              "reproducible": true
            },
            "materials": [
              {
                "uri": "git+https://github.com/${REPO}@refs/tags/v${NEW_VERSION}",
                "digest": { "sha1": "${MERGE_SHA}" }
              }
            ]
          }
          PROVEOF
          python3 -c "
          import json
          with open('provenance.json') as f:
              data = json.load(f)
          with open('provenance.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          echo "--- provenance.json ---"
          cat provenance.json

      # Before the installers are downloaded, so the scan reads the source tree and
      # not 300 MB of binaries.
      - name: Generate CycloneDX SBOM
        run: |
          npx --yes @cyclonedx/cdxgen -o sbom.cdx.json --spec-version 1.5 \
            --exclude ".mcp.json"
          echo "SBOM generated: $(jq '.components | length' sbom.cdx.json) components"

      # Everything the installer builds attached to the draft, exactly as it sits
      # there now. `gh release download` resolves a draft by tag.
      - name: Download everything attached to the draft
        run: |
          mkdir release-assets
          gh release download "v${NEW_VERSION}" --dir release-assets
          echo "--- attached so far ---"
          find release-assets -type f | sort

      # CHECKSUMS.txt covers every file that will be published, so an alias is
      # visibly the same bytes as the installer it copies and nothing published is
      # unaccounted for. It cannot list the files derived FROM it (its own
      # signatures, the SBOM attestation over it) or the signature of
      # provenance.json — "Assert the release is complete" names that same set.
      - name: Compute CHECKSUMS.txt over every published file
        run: |
          cp sbom.cdx.json provenance.json release-assets/
          (cd release-assets && sha256sum -- * | sort -k2) > CHECKSUMS.txt
          echo "$(wc -l < CHECKSUMS.txt) files checksummed"
          cat CHECKSUMS.txt

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.1.0
        with:
          subject-path: |
            CHECKSUMS.txt
            dist/client/**/*.js
            dist/client/**/*.css

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin explicitly: the installer's own default happens to be
          # v3.0.6 today, but that default lives in the action, not here —
          # a routine Dependabot bump of the installer's SHA could change
          # the resolved cosign version with zero diff in this file. cosign
          # v3 flipped `--new-bundle-format`/`--use-signing-config` to
          # default true, which is what broke signing below; pinning here
          # means that class of surprise requires an explicit version bump
          # we review, not a silent installer update.
          cosign-release: 'v3.0.6'

      - name: Attest SBOM
        run: |
          # --output-file is cosign's generic "log output to a file" flag —
          # it does NOT write the attestation; the real flag is
          # --output-attestation. That flag (like sign-blob's
          # --output-signature/--output-certificate below) is silently
          # ignored under cosign v3's default new bundle format, so this
          # step could report success while sbom.cdx.json.att holds no
          # usable attestation, which scripts/verify-build.sh's
          # `cosign verify-blob-attestation` would only catch much later.
          # Force the legacy single-file output explicitly so this
          # produces a real, verifiable attestation now.
          cosign attest-blob --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            --new-bundle-format=false \
            --use-signing-config=false \
            --output-attestation sbom.cdx.json.att \
            CHECKSUMS.txt
          echo "SBOM attestation attached to CHECKSUMS.txt"

      - name: Sign release artifacts (keyless)
        run: |
          # cosign v3 defaults --new-bundle-format and --use-signing-config
          # to true, which makes --output-signature/--output-certificate
          # deprecated-and-ignored and instead requires --bundle. Without a
          # --bundle path, cosign tries to create a bundle file at an EMPTY
          # path and fails: "create bundle file: open : no such file or
          # directory". Force the legacy flags explicitly so this keeps
          # producing separate .cosign.sig/.cosign.pem files, which is what
          # scripts/verify-build.sh (outside this PR's ownership) verifies
          # against. No `|| true` / `continue-on-error` anywhere here: a
          # signing failure must fail this job, not publish an unsigned
          # release.
          for f in CHECKSUMS.txt provenance.json; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes \
              --new-bundle-format=false \
              --use-signing-config=false \
              --output-signature "${f}.cosign.sig" \
              --output-certificate "${f}.cosign.pem" \
              "$f"
            echo "Signed: $f"
          done

      - name: GPG sign CHECKSUMS.txt
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_KEY_ID" ]; then
            echo "GPG signing secrets not configured — skipping signature"
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --armor --local-user "$GPG_KEY_ID" --detach-sign CHECKSUMS.txt
          echo "GPG signature generated: CHECKSUMS.txt.asc"
          gpg --verify CHECKSUMS.txt.asc CHECKSUMS.txt
          echo "GPG signature verified successfully"

      - name: Attach checksums, SBOM, provenance and signatures to the draft
        run: |
          UPLOADS=()
          for f in \
            CHECKSUMS.txt \
            CHECKSUMS.txt.asc \
            CHECKSUMS.txt.cosign.sig \
            CHECKSUMS.txt.cosign.pem \
            provenance.json \
            provenance.json.cosign.sig \
            provenance.json.cosign.pem \
            sbom.cdx.json \
            sbom.cdx.json.att; do
            [ -f "$f" ] && UPLOADS+=("$f")
          done
          gh release upload "v${NEW_VERSION}" --clobber "${UPLOADS[@]}"

      # The exact set that is about to become public, kept as a workflow
      # artifact so a mirror can be populated with files byte-identical to the
      # GitHub Release (CHECKSUMS.txt and the signatures included). Signing happens
      # here, in CI's keyless context — never on whatever host serves the bytes.
      - name: Re-download the draft as it will be published
        run: |
          rm -rf published-view
          mkdir published-view
          gh release download "v${NEW_VERSION}" --dir published-view
          find published-view -type f | sort

      - name: Upload the final release asset set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-final
          path: published-view/
          retention-days: 30
          if-no-files-found: error

      # THE guard (#1229). A release that publishes a checksum manifest and no
      # installable artifact must FAIL, not succeed quietly. It reads the files that
      # are actually on the draft (downloaded again above, not the local copies), so
      # it judges what would land, and runs before anything is made public.
      - name: Assert the release is complete
        env:
          ASSET_DIR: published-view
        run: |
          set -euo pipefail
          cd "$ASSET_DIR"
          failed=0
          fail() { echo "::error::Release v${NEW_VERSION:-?} is incomplete: $*"; failed=1; }

          # What a person can actually run. Version-free names: these are the
          # `releases/latest/download/<name>` links. macOS is deliberately absent —
          # the build is withheld until it is Apple-signed (#741); when it IS
          # attached it is covered by the checksum rules below like everything else.
          REQUIRED="
            llamenos-linux-x86_64.AppImage llamenos-linux-x86_64.AppImage.sig
            llamenos-linux-x86_64.deb      llamenos-linux-x86_64.deb.sig
            llamenos-linux-x86_64.rpm      llamenos-linux-x86_64.rpm.sig
            llamenos-windows-x64.msi       llamenos-windows-x64.msi.sig
            llamenos-windows-x64-setup.exe llamenos-windows-x64-setup.exe.sig
            llamenos-android.apk
            BUILD-MANIFEST.txt sbom.cdx.json provenance.json
            CHECKSUMS.txt CHECKSUMS.txt.cosign.sig CHECKSUMS.txt.cosign.pem
            provenance.json.cosign.sig provenance.json.cosign.pem sbom.cdx.json.att
          "
          # Derived from CHECKSUMS.txt (or the signature of provenance.json), so it
          # cannot list them. Everything else attached must be listed.
          SEALS="CHECKSUMS.txt CHECKSUMS.txt.asc CHECKSUMS.txt.cosign.sig CHECKSUMS.txt.cosign.pem provenance.json.cosign.sig provenance.json.cosign.pem sbom.cdx.json.att"

          for name in $REQUIRED; do
            if [ ! -f "$name" ]; then fail "required asset ${name} is missing"
            elif [ ! -s "$name" ]; then fail "required asset ${name} is empty"; fi
          done

          if [ -s CHECKSUMS.txt ]; then
            # Every manifest line must name a file that exists and hashes to it ...
            if ! sha256sum --check --strict --quiet CHECKSUMS.txt; then
              fail "CHECKSUMS.txt lists files that are absent or whose SHA-256 does not match"
            fi
            # ... and every published file must be in the manifest.
            listed=$(awk '{print $2}' CHECKSUMS.txt)
            for f in *; do
              case " $SEALS " in *" $f "*) continue ;; esac
              printf '%s\n' "$listed" | grep -qxF -- "$f" || fail "${f} is published but not covered by CHECKSUMS.txt"
            done
          else
            fail "CHECKSUMS.txt is missing or empty"
          fi

          if [ "$failed" -ne 0 ]; then
            echo "--- assets that would be published ---"
            ls -la
            exit 1
          fi
          echo "Release v${NEW_VERSION:-?} is complete: $(find . -maxdepth 1 -type f | wc -l) assets, every one accounted for by CHECKSUMS.txt."

      - name: Publish release
        run: gh release edit "v${NEW_VERSION}" --draft=false --latest

      # `releases/latest/download/<alias>` resolves through the release that GitHub
      # considers "latest". Prove that is the one just published and that it serves
      # the aliases, so a link a person pastes cannot be dead the moment it is public.
      - name: Confirm releases/latest serves the new release
        run: |
          set -euo pipefail
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          if [ "$LATEST" != "v${NEW_VERSION}" ]; then
            echo "::error::releases/latest is ${LATEST}, not v${NEW_VERSION} — the stable download links do not serve this release."
            exit 1
          fi
          for alias in llamenos-linux-x86_64.AppImage llamenos-windows-x64.msi llamenos-android.apk CHECKSUMS.txt; do
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.assets[].name' | grep -qxF -- "$alias" \
              || { echo "::error::releases/latest/download/${alias} would 404."; exit 1; }
            echo "OK: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${alias}"
          done

  docker-stable:
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # required by github/codeql-action/upload-sarif
      id-token: write
      attestations: write

    env:
      REGISTRY: ghcr.io
      # Published under this repository's own GHCR namespace — no
      # operator-provided secret to configure or rotate (unlike the Docker
      # Hub push this replaces, #885/#902, which never had DOCKERHUB_USERNAME
      # / DOCKERHUB_TOKEN configured and so never produced an image).
      #
      # This value USED to be required to match `registry.app` in
      # `site/src/config.ts`. Since the org move it deliberately does not: a
      # repository transfer does not carry its container packages, so the
      # address the download page advertises
      # (`ghcr.io/rhonda-rodododo/llamenos-platform`) is still the old one and
      # is the only address that currently resolves, while the only address
      # this job's GITHUB_TOKEN can write is this repository's own. Both ends
      # are pinned in tests/orchestrator/release-ghcr-publish.test.ts, which
      # fails if EITHER moves — #1223 collapses them back together once the
      # new package exists and an operator has made it public.
      #
      # See the lowercase fold in "Compute stable tags": `github.repository`
      # renders the owner in display casing, which registries reject.
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GITHUB_TOKEN already carries `packages: write` from this job's
      # permissions block above, so — unlike the Docker Hub login it
      # replaces — there is no "unconfigured" case to skip: this step runs
      # unconditionally on every release, and a real login failure fails the
      # job like any other step here (no `if:` gate, no continue-on-error).
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute stable tags
        id: meta
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          # `github.repository` renders the owner in its GitHub display
          # casing (`Llamenos-Hotline`), and OCI registries reject a
          # mixed-case repository name outright ("repository name must be
          # lowercase"). Before the org move the owner happened to be all
          # lowercase, so this went unnoticed; since the move, every push
          # here would fail. Same fold as docker-buildcache.yml / image-smoke.yml.
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          IMAGE="${IMAGE,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:${MAJOR_MINOR}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Pre-publish gate: the image must actually boot against PostgreSQL ──
      # CI's E2E jobs build this Dockerfile too, but only ever run it on CI
      # hardware, whose CPUID is honest. 0.19.16 shipped an image that could
      # not authenticate to PostgreSQL (empty SCRAM proof) on a VPS whose
      # virtual CPU model hides SSE4.2 — see the "simdutf kernel pin" block in
      # deploy/docker/Dockerfile. Both smokes below must pass before anything
      # is pushed; the push step then rebuilds from this builder's cache, so
      # the published image is the one that was tested.
      - name: Build image for the pre-publish smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: app
          load: true
          push: false
          tags: llamenos-release-smoke:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache

      - name: Smoke image against PostgreSQL 17 (runner CPU)
        env:
          IMAGE: llamenos-release-smoke:${{ github.sha }}
        run: scripts/image-smoke.sh "$IMAGE"

      - name: Enable KVM for the CPUID-masked smoke
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils genisoimage

      - name: Smoke image on a CPUID-masked KVM guest (-cpu kvm64)
        env:
          IMAGE: llamenos-release-smoke:${{ github.sha }}
        run: scripts/image-smoke.sh --cpu kvm64 "$IMAGE"

      - name: Build and push stable image
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          # `deploy/docker/Dockerfile` is multi-stage and its LAST stage is
          # `static` (the Caddy image that serves the SPA, consumed by
          # docker-compose.production.yml's `caddy` service). Docker defaults
          # to the last stage, so without an explicit target this would
          # publish the Caddy static-file server under the app image tags.
          target: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Registry-backed cache, not `type=gha`. `type=gha,mode=max` was
          # the actual cause of every `docker-stable` failure on 0.19.14
          # (run 35520224670, three consecutive attempts): `mode=max`
          # exports every intermediate layer of this multi-stage build, and
          # this repo's single Actions cache quota (10GB total, shared with
          # docker.yml/ci.yml/security-audit.yml — see PR body) was pinned
          # at its ceiling with 167 of 224 entries being `buildkit-blob-*`
          # layers from this exact export. Purging those entries did not
          # fix the underlying failure: the next `mode=max` export from any
          # of the four workflows refills the same shared quota and
          # reproduces `error writing layer blob: failed to reserve cache`.
          # GHCR has no such shared/fixed quota, this job already
          # authenticates to it (`Log in to GHCR` above) with `packages:
          # write`, and moving here also means `docker-stable` no longer
          # competes with docker.yml/ci.yml/security-audit.yml for the one
          # shared Actions cache — see the PR body for why those three are
          # deliberately NOT touched here (#902/#903 own CI caching
          # strategy). `mode=max` is kept — worth it for a release build
          # that includes the Rust crypto FFI compile — because registry
          # storage isn't the resource that was exhausted.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max

      - name: Generate SBOM attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.1.0
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Same pin as the blob-signing job's "Install cosign" step, kept
          # in sync so both jobs always resolve the identical cosign
          # version instead of relying on the installer's own default.
          cosign-release: 'v3.0.6'

      - name: Sign container image (keyless)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ steps.meta.outputs.image }}@${DIGEST}"
          echo "Signed: ${{ steps.meta.outputs.image }}@${DIGEST}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ needs.check.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        # `always()` (pre-existing intent): upload even if the scan step
        # above failed, so a scan failure is still visible in the Security
        # tab rather than just failing the job silently-from-a-log-only
        # perspective. No gating condition needed anymore — this job runs
        # unconditionally, so there is no "scan never ran" case to guard
        # against as there was under the old Docker-Hub-configured gate.
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: 'trivy-results.sarif'

  # --- Dispatch what nothing in the release depends on ---
  #
  # The desktop and Android builds are NOT dispatched from here any more: they
  # are called (`desktop` / `android` above) so the release can wait for the
  # installers it publishes. What remains is the iOS build — its IPA is store-
  # only, not installable, and the macOS runners are scarce, so it must never
  # hold a release up.
  #
  # No continue-on-error here (#711): a rejected or failed `gh workflow run`
  # must turn this job red, not green. Each step also polls `gh run list`
  # for the run it just created and fails loudly if none appears, so the
  # log proves a run exists rather than merely that the dispatch command
  # exited 0.
  #
  # Deliberately does NOT need `docker-stable` (run 35489888506): publishing
  # container images is orthogonal to dispatching these, and an optional
  # publish step must never block a required step. `dispatch` only needs what
  # it actually consumes — the published release (`release`) and the version
  # (`check`'s output).
  dispatch:
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # required by POST /actions/workflows/{id}/dispatches (#711)
    steps:
      - name: Dispatch iOS release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          WORKFLOW="mobile-release.yml"
          gh workflow run "$WORKFLOW" \
            --repo "${{ github.repository }}" \
            --ref "v${NEW_VERSION}" \
            -f version="$NEW_VERSION" \
            -f platform=ios
          echo "Dispatched $WORKFLOW (ios) for v${NEW_VERSION}"

          RUN_URL=""
          for _ in $(seq 1 15); do
            sleep 2
            RUN_URL=$(gh run list --repo "${{ github.repository }}" \
              --workflow="$WORKFLOW" --limit 5 \
              --json url,createdAt,event \
              --jq '[.[] | select(.event=="workflow_dispatch")] | sort_by(.createdAt) | reverse | .[0].url // empty')
            [ -n "$RUN_URL" ] && break
          done
          if [ -z "$RUN_URL" ]; then
            echo "::error::$WORKFLOW dispatch did not produce a workflow run within 30s"
            exit 1
          fi
          echo "iOS Release run: $RUN_URL"
