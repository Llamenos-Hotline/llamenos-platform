# Release workflow — runs when the release PR (branch `release`,
# maintained by knope-release-pr.yml) is merged to main. Knope creates
# the tag + GitHub Release; this workflow attaches signed artifacts
# and dispatches platform-specific release workflows.
#
# Steps:
#   1. Gate on release-PR merge (head_ref == 'release', merged == true)
#   2. Read the new version from package.json (knope already bumped it)
#   3. Build the app (needed for CHECKSUMS and attestation)
#   4. Generate SBOM, sign with cosign keyless, GPG sign checksums
#   5. Create git tag, then a **draft** GitHub Release with artifacts
#      (draft-first avoids GitHub's immutable-release upload rejection)
#   6. Publish the release (draft -> published)
#   7. Dispatch downstream workflows (docker, desktop, mobile)
#
# release.yml explicitly dispatches downstream workflows because
# GitHub Releases created by GITHUB_TOKEN do NOT fire the `release: published`
# event for downstream workflows (anti-recursion rule). This is why the
# `dispatch` job below calls `gh workflow run` directly instead of relying on
# tauri-release.yml / mobile-release.yml / deploy-demo.yml to trigger
# themselves — see #712 for the decision record. Dispatching via
# `POST /actions/workflows/{id}/dispatches` requires `actions: write` on the
# job token; `contents: read` alone gets the request rejected (#711).

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

# Never cancel a release in progress.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}  # deny-all; per-job permissions below

env:
  BUN_VERSION: "1.3.5"

jobs:
  # --- Gate + version read ---
  check:
    # github.head_ref is used only in this Actions expression (not shell).
    if: >-
      github.event.pull_request.merged == true &&
      github.head_ref == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read new version from package.json
        id: read
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  # --- Build (needed for CHECKSUMS and attestation) ---
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run codegen
        run: bun run codegen

      - name: Set build-time constants
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build frontend
        run: bun run build

      - name: Compute build checksums
        run: |
          cd dist
          find client -type f -exec sha256sum {} \; | sort > ../CHECKSUMS.txt
          cd ..
          sha256sum bun.lockb >> CHECKSUMS.txt
          echo "$(wc -l < CHECKSUMS.txt) files checksummed"

      - name: Upload app build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-build
          path: dist/
          retention-days: 1

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: CHECKSUMS.txt
          retention-days: 7

  # --- Tag + GitHub Release, then attach signed artifacts ---
  release:
    needs: [check, build]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write       # OIDC for cosign keyless + attestations
      attestations: write

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums

      - name: Download app build (for attestation)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-build
          path: dist/

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.1.0
        with:
          subject-path: |
            CHECKSUMS.txt
            dist/client/**/*.js
            dist/client/**/*.css

      - name: Generate provenance metadata JSON
        env:
          NEW_VERSION: ${{ needs.check.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO: ${{ github.repository }}
        run: |
          cat > provenance.json <<PROVEOF
          {
            "builder": { "id": "https://github.com/actions/runner" },
            "buildType": "https://github.com/slsa-framework/slsa/blob/main/docs/spec/v1.0/levels.md",
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${REPO}@refs/tags/v${NEW_VERSION}",
                "digest": { "sha1": "${MERGE_SHA}" },
                "entryPoint": ".github/workflows/release.yml"
              },
              "parameters": {
                "SOURCE_DATE_EPOCH": "$(git log -1 --format=%ct)",
                "bunVersion": "${BUN_VERSION}"
              }
            },
            "buildConfig": {
              "dockerfile": "deploy/docker/Dockerfile",
              "steps": ["bun install --frozen-lockfile", "bun run codegen", "bun run build"]
            },
            "metadata": {
              "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "buildFinishedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "completeness": { "parameters": true, "environment": false, "materials": false },
              "reproducible": true
            },
            "materials": [
              {
                "uri": "git+https://github.com/${REPO}@refs/tags/v${NEW_VERSION}",
                "digest": { "sha1": "${MERGE_SHA}" }
              }
            ]
          }
          PROVEOF
          python3 -c "
          import json
          with open('provenance.json') as f:
              data = json.load(f)
          with open('provenance.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          echo "--- provenance.json ---"
          cat provenance.json

      - name: Generate CycloneDX SBOM
        run: |
          npx --yes @cyclonedx/cdxgen -o sbom.cdx.json --spec-version 1.5 \
            --exclude ".mcp.json"
          echo "SBOM generated: $(jq '.components | length' sbom.cdx.json) components"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin explicitly: the installer's own default happens to be
          # v3.0.6 today, but that default lives in the action, not here —
          # a routine Dependabot bump of the installer's SHA could change
          # the resolved cosign version with zero diff in this file. cosign
          # v3 flipped `--new-bundle-format`/`--use-signing-config` to
          # default true, which is what broke signing below; pinning here
          # means that class of surprise requires an explicit version bump
          # we review, not a silent installer update.
          cosign-release: 'v3.0.6'

      - name: Attest SBOM
        run: |
          # --output-file is cosign's generic "log output to a file" flag —
          # it does NOT write the attestation; the real flag is
          # --output-attestation. That flag (like sign-blob's
          # --output-signature/--output-certificate below) is silently
          # ignored under cosign v3's default new bundle format, so this
          # step could report success while sbom.cdx.json.att holds no
          # usable attestation, which scripts/verify-build.sh's
          # `cosign verify-blob-attestation` would only catch much later.
          # Force the legacy single-file output explicitly so this
          # produces a real, verifiable attestation now.
          cosign attest-blob --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            --new-bundle-format=false \
            --use-signing-config=false \
            --output-attestation sbom.cdx.json.att \
            CHECKSUMS.txt
          echo "SBOM attestation attached to CHECKSUMS.txt"

      - name: Sign release artifacts (keyless)
        run: |
          # cosign v3 defaults --new-bundle-format and --use-signing-config
          # to true, which makes --output-signature/--output-certificate
          # deprecated-and-ignored and instead requires --bundle. Without a
          # --bundle path, cosign tries to create a bundle file at an EMPTY
          # path and fails: "create bundle file: open : no such file or
          # directory". Force the legacy flags explicitly so this keeps
          # producing separate .cosign.sig/.cosign.pem files, which is what
          # scripts/verify-build.sh (outside this PR's ownership) verifies
          # against. No `|| true` / `continue-on-error` anywhere here: a
          # signing failure must fail this job, not publish an unsigned
          # release.
          for f in CHECKSUMS.txt provenance.json; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes \
              --new-bundle-format=false \
              --use-signing-config=false \
              --output-signature "${f}.cosign.sig" \
              --output-certificate "${f}.cosign.pem" \
              "$f"
            echo "Signed: $f"
          done

      - name: GPG sign CHECKSUMS.txt
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_KEY_ID" ]; then
            echo "GPG signing secrets not configured — skipping signature"
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --armor --local-user "$GPG_KEY_ID" --detach-sign CHECKSUMS.txt
          echo "GPG signature generated: CHECKSUMS.txt.asc"
          gpg --verify CHECKSUMS.txt.asc CHECKSUMS.txt
          echo "GPG signature verified successfully"

      - name: Create git tag (idempotent for retries)
        env:
          NEW_VERSION: ${{ needs.check.outputs.version }}
        run: |
          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${NEW_VERSION} already exists locally — skipping"
          else
            git tag "v${NEW_VERSION}"
          fi
          git push origin "v${NEW_VERSION}" --force

      - name: Extract changelog section for this version
        id: changelog
        env:
          NEW_VERSION: ${{ needs.check.outputs.version }}
        run: |
          BODY=$(awk -v ver="$NEW_VERSION" '
            /^## / {
              if (found) exit
              if (index($0, ver)) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "::warning::No changelog section found for v${NEW_VERSION}"
          fi
          echo "$BODY" > release-notes.md

          # Append desktop download info to release notes
          {
            echo ""
            echo "---"
            echo ""
            echo "### Desktop Downloads"
            echo ""
            echo "Desktop binaries are hosted on our self-hosted infrastructure at \`releases.llamenos-hotline.org\`."
            echo "See the [desktop release metadata](https://github.com/rhonda-rodododo/llamenos-releases) for checksums and SBOM."
          } >> release-notes.md

          echo "--- Release notes ---"
          cat release-notes.md

      - name: Create draft GitHub Release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Clean up any broken release from a prior failed run
          if gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "Deleting stale release v${NEW_VERSION} from previous attempt"
            gh release delete "v${NEW_VERSION}" --yes
          fi
          ARTIFACTS=()
          for f in \
            CHECKSUMS.txt \
            CHECKSUMS.txt.asc \
            CHECKSUMS.txt.cosign.sig \
            CHECKSUMS.txt.cosign.pem \
            provenance.json \
            provenance.json.cosign.sig \
            provenance.json.cosign.pem \
            sbom.cdx.json \
            sbom.cdx.json.att; do
            [ -f "$f" ] && ARTIFACTS+=("$f")
          done
          gh release create "v${NEW_VERSION}" \
            --draft \
            --title "v${NEW_VERSION}" \
            --notes-file release-notes.md \
            "${ARTIFACTS[@]}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.check.outputs.version }}
        run: gh release edit "v${NEW_VERSION}" --draft=false

  docker-stable:
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # required by github/codeql-action/upload-sarif
      id-token: write
      attestations: write

    env:
      REGISTRY: ghcr.io
      # Published under this repository's own GHCR namespace — no
      # operator-provided secret to configure or rotate (unlike the Docker
      # Hub push this replaces, #885/#902, which never had DOCKERHUB_USERNAME
      # / DOCKERHUB_TOKEN configured and so never produced an image). This
      # value MUST match `registry.app` in `site/src/config.ts`, the address
      # the download page advertises for `docker pull` — a rail in
      # tests/orchestrator/release-ghcr-publish.test.ts fails if the two ever
      # drift apart.
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GITHUB_TOKEN already carries `packages: write` from this job's
      # permissions block above, so — unlike the Docker Hub login it
      # replaces — there is no "unconfigured" case to skip: this step runs
      # unconditionally on every release, and a real login failure fails the
      # job like any other step here (no `if:` gate, no continue-on-error).
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute stable tags
        id: meta
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:${MAJOR_MINOR}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Pre-publish gate: the image must actually boot against PostgreSQL ──
      # CI's E2E jobs build this Dockerfile too, but only ever run it on CI
      # hardware, whose CPUID is honest. 0.19.16 shipped an image that could
      # not authenticate to PostgreSQL (empty SCRAM proof) on a VPS whose
      # virtual CPU model hides SSE4.2 — see the "simdutf kernel pin" block in
      # deploy/docker/Dockerfile. Both smokes below must pass before anything
      # is pushed; the push step then rebuilds from this builder's cache, so
      # the published image is the one that was tested.
      - name: Build image for the pre-publish smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: app
          load: true
          push: false
          tags: llamenos-release-smoke:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache

      - name: Smoke image against PostgreSQL 17 (runner CPU)
        env:
          IMAGE: llamenos-release-smoke:${{ github.sha }}
        run: scripts/image-smoke.sh "$IMAGE"

      - name: Enable KVM for the CPUID-masked smoke
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils genisoimage

      - name: Smoke image on a CPUID-masked KVM guest (-cpu kvm64)
        env:
          IMAGE: llamenos-release-smoke:${{ github.sha }}
        run: scripts/image-smoke.sh --cpu kvm64 "$IMAGE"

      - name: Build and push stable image
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          # `deploy/docker/Dockerfile` is multi-stage and its LAST stage is
          # `static` (the Caddy image that serves the SPA, consumed by
          # docker-compose.production.yml's `caddy` service). Docker defaults
          # to the last stage, so without an explicit target this would
          # publish the Caddy static-file server under the app image tags.
          target: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Registry-backed cache, not `type=gha`. `type=gha,mode=max` was
          # the actual cause of every `docker-stable` failure on 0.19.14
          # (run 35520224670, three consecutive attempts): `mode=max`
          # exports every intermediate layer of this multi-stage build, and
          # this repo's single Actions cache quota (10GB total, shared with
          # docker.yml/ci.yml/security-audit.yml — see PR body) was pinned
          # at its ceiling with 167 of 224 entries being `buildkit-blob-*`
          # layers from this exact export. Purging those entries did not
          # fix the underlying failure: the next `mode=max` export from any
          # of the four workflows refills the same shared quota and
          # reproduces `error writing layer blob: failed to reserve cache`.
          # GHCR has no such shared/fixed quota, this job already
          # authenticates to it (`Log in to GHCR` above) with `packages:
          # write`, and moving here also means `docker-stable` no longer
          # competes with docker.yml/ci.yml/security-audit.yml for the one
          # shared Actions cache — see the PR body for why those three are
          # deliberately NOT touched here (#902/#903 own CI caching
          # strategy). `mode=max` is kept — worth it for a release build
          # that includes the Rust crypto FFI compile — because registry
          # storage isn't the resource that was exhausted.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max

      - name: Generate SBOM attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.1.0
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Same pin as the blob-signing job's "Install cosign" step, kept
          # in sync so both jobs always resolve the identical cosign
          # version instead of relying on the installer's own default.
          cosign-release: 'v3.0.6'

      - name: Sign container image (keyless)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ steps.meta.outputs.image }}@${DIGEST}"
          echo "Signed: ${{ steps.meta.outputs.image }}@${DIGEST}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ needs.check.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        # `always()` (pre-existing intent): upload even if the scan step
        # above failed, so a scan failure is still visible in the Security
        # tab rather than just failing the job silently-from-a-log-only
        # perspective. No gating condition needed anymore — this job runs
        # unconditionally, so there is no "scan never ran" case to guard
        # against as there was under the old Docker-Hub-configured gate.
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        with:
          sarif_file: 'trivy-results.sarif'

  # --- Dispatch downstream release workflows ---
  #
  # No continue-on-error here (#711): a rejected or failed `gh workflow run`
  # must turn this job red, not green. Each step also polls `gh run list`
  # for the run it just created and fails loudly if none appears, so the
  # log proves a run exists rather than merely that the dispatch command
  # exited 0.
  #
  # Deliberately does NOT need `docker-stable` (run 35489888506): publishing
  # container images to Docker Hub is orthogonal to producing desktop and
  # mobile installers, and an unconfigured/failed optional publish step must
  # never block a required artifact step. `dispatch` only needs what it
  # actually consumes — the release existing (`release`) and the version
  # (`check`'s output). This was the only job in this file with that shape;
  # `release` needs `[check, build]` and `docker-stable` needs
  # `[check, release]`, and both of those are required-artifact dependencies,
  # not an optional publish gating a required step.
  dispatch:
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # required by POST /actions/workflows/{id}/dispatches (#711)
    steps:
      - name: Dispatch Desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          WORKFLOW="tauri-release.yml"
          gh workflow run "$WORKFLOW" \
            --repo "${{ github.repository }}" \
            --ref "v${NEW_VERSION}" \
            -f version="$NEW_VERSION"
          echo "Dispatched $WORKFLOW for v${NEW_VERSION}"

          RUN_URL=""
          for _ in $(seq 1 15); do
            sleep 2
            RUN_URL=$(gh run list --repo "${{ github.repository }}" \
              --workflow="$WORKFLOW" --limit 5 \
              --json url,createdAt,event \
              --jq '[.[] | select(.event=="workflow_dispatch")] | sort_by(.createdAt) | reverse | .[0].url // empty')
            [ -n "$RUN_URL" ] && break
          done
          if [ -z "$RUN_URL" ]; then
            echo "::error::$WORKFLOW dispatch did not produce a workflow run within 30s"
            exit 1
          fi
          echo "Desktop Release run: $RUN_URL"

      - name: Dispatch Mobile release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          WORKFLOW="mobile-release.yml"
          gh workflow run "$WORKFLOW" \
            --repo "${{ github.repository }}" \
            --ref "v${NEW_VERSION}" \
            -f version="$NEW_VERSION"
          echo "Dispatched $WORKFLOW for v${NEW_VERSION}"

          RUN_URL=""
          for _ in $(seq 1 15); do
            sleep 2
            RUN_URL=$(gh run list --repo "${{ github.repository }}" \
              --workflow="$WORKFLOW" --limit 5 \
              --json url,createdAt,event \
              --jq '[.[] | select(.event=="workflow_dispatch")] | sort_by(.createdAt) | reverse | .[0].url // empty')
            [ -n "$RUN_URL" ] && break
          done
          if [ -z "$RUN_URL" ]; then
            echo "::error::$WORKFLOW dispatch did not produce a workflow run within 30s"
            exit 1
          fi
          echo "Mobile Release run: $RUN_URL"

      - name: Dispatch Demo deploy
        # #712 decision: option (a), explicit dispatch from this job rather
        # than relying on `release: [published]` (which never fires for
        # GITHUB_TOKEN-created releases). Targets deploy-demo.yml, not
        # auto-deploy-demo.yml — deploy-demo.yml already declares
        # `workflow_dispatch` and needs no trigger changes; auto-deploy-demo.yml
        # only has the dead `release: [published]` trigger and is outside this
        # workflow's file ownership, so it is not wired up here (flagged
        # separately for retirement/follow-up).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          WORKFLOW="deploy-demo.yml"
          gh workflow run "$WORKFLOW" \
            --repo "${{ github.repository }}" \
            --ref "v${NEW_VERSION}"
          echo "Dispatched $WORKFLOW for v${NEW_VERSION}"

          RUN_URL=""
          for _ in $(seq 1 15); do
            sleep 2
            RUN_URL=$(gh run list --repo "${{ github.repository }}" \
              --workflow="$WORKFLOW" --limit 5 \
              --json url,createdAt,event \
              --jq '[.[] | select(.event=="workflow_dispatch")] | sort_by(.createdAt) | reverse | .[0].url // empty')
            [ -n "$RUN_URL" ] && break
          done
          if [ -z "$RUN_URL" ]; then
            echo "::error::$WORKFLOW dispatch did not produce a workflow run within 30s"
            exit 1
          fi
          echo "Demo Deploy run: $RUN_URL"
