# Desktop in-app audio (#1770): the pinned liblinphone SDK artifacts.
#
# Plan: docs/superpowers/plans/2026-10-10-desktop-sip-webrtc.md, Task 1.
#
# `gate` proves scripts/fetch-linphone-sdk.sh refuses what it claims to refuse
# (a tampered digest, an incomplete artifact, a malformed or missing pin) by
# feeding it those defects. `artifacts` then fetches each REAL pin on a runner
# of that OS through the same gate, so a pin that no longer matches upstream —
# a re-uploaded or replaced zip — fails here, not in a release build.
#
# Builds and gates only; it publishes nothing (CLAUDE.md "Publishing vs
# deploying"). The bindgen crate's build + smoke steps join `artifacts` in plan
# Task 2, and the Linux headless e2e job in Task 5.
#
# linux-x86_64 has no pin yet: upstream publishes no Linux SDK, and the Linux
# source is an open operator decision on #1770 (see the checksums file header).
name: desktop-voice

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/linphone-sdk-checksums.txt"
      - "scripts/fetch-linphone-sdk.sh"
      - "scripts/fetch-linphone-sdk.test.ts"
      - ".github/workflows/desktop-voice.yml"
  pull_request:
    paths:
      - "apps/desktop/linphone-sdk-checksums.txt"
      - "scripts/fetch-linphone-sdk.sh"
      - "scripts/fetch-linphone-sdk.test.ts"
      - ".github/workflows/desktop-voice.yml"
  workflow_dispatch:

concurrency:
  # A superseded push cancels its own PR run (#2094); every other event gets a per-SHA group that nothing can cancel.
  group: ${{ github.event_name == 'pull_request' && format('desktop-voice-pr-{0}', github.ref) || format('desktop-voice-{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}  # deny-all; per-job permissions below

env:
  BUN_VERSION: "1.3.5"

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Test the checksum gate by breaking it
        run: bun test scripts/fetch-linphone-sdk.test.ts

  artifacts:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        # macos-arm64 runs on the self-hosted Mac minis, not hosted
        # `macos-latest` (#2544). A job queued for the GitHub-hosted macOS
        # pool is abandoned after ~15 minutes when the repo-wide macOS cap is
        # spent (runner_name="", zero steps) and reports no verdict, while a
        # job queued for our own runners waits. The Macs ARE macOS arm64, so
        # the real pin is still fetched and verified on its own OS.
        # tests/orchestrator/guards.test.ts fails CI if any job can again
        # resolve to a hosted macOS image without an allowlisted reason.
        include:
          - { os: [self-hosted, macOS, ARM64, ios-e2e], target: macos-arm64 }
          - { os: windows-latest, target: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # MANDATORY, and must stay the literal first step: this workflow runs on
      # `pull_request`, and one leg of it is now a machine the operator owns,
      # so a fork PR's code must never reach it. Unconditional on every leg on
      # purpose — an `if:` that skips it is the shape a fail-open takes. Same
      # guard as ios-e2e.yml's `build` (see the long note there).
      - name: Refuse to run on a fork PR (self-hosted runner guard)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$THIS_REPO" ]]; then
            echo "::error::desktop-voice/artifacts FAILED: fork-pr-guard — this job runs on a self-hosted runner and must never process a fork PR (head repo '$HEAD_REPO' != '$THIS_REPO')"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned liblinphone SDK (checksum-gated)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/fetch-linphone-sdk.sh "$TARGET"
      - name: The installed tree records the digest it was verified against
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          recorded="$(cat "apps/desktop/vendor/linphone-sdk/$TARGET/.sdk-sha256")"
          pinned="$(awk -v t="$TARGET" '!/^[[:space:]]*#/ && $1 == t { print $3 }' apps/desktop/linphone-sdk-checksums.txt)"
          echo "recorded=$recorded pinned=$pinned"
          [ -n "$pinned" ] && [ "$recorded" = "$pinned" ]

      # A self-hosted runner keeps what a job leaves behind: drop the vendored
      # SDK rather than leave it on the Macs' shared, disk-guarded volume.
      - name: Remove the fetched SDK
        if: always()
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rm -rf "apps/desktop/vendor/linphone-sdk/$TARGET"
