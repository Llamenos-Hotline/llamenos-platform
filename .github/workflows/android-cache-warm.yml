# Android Gradle cache warm-up on `main` (#2879).
#
# THE PROBLEM THIS EXISTS FOR. A merge group's ref is not the default branch, so
# `setup-gradle` restores READ-ONLY there, and the only Gradle User Home it can
# restore is one a default-branch job wrote. `ci.yml` deliberately never runs on
# `push: main` (#1830), so the only writer was CodeQL's `analyze-java-kotlin`
# (`compileDebugKotlin`). That never resolves `debugUnitTestRuntimeClasspath`
# (junit arrives there, transitively via androidx.compose.ui:ui-test-junit4),
# nor the lint, androidTest or Kotlin-compiler-plugin classpaths — so EVERY merge
# group cold-fetched the unit-test graph from Maven Central. On 2026-11-19, with
# two groups building at once (`max_entries_to_build` 1 -> 2, #2828) from one
# egress address, Central answered 429 on all three gradle-retry.sh attempts of
# run 44629546088 and ejected #2854. The retry worked as designed and still lost:
# the defect is the number of requests, not their spacing.
#
# WHAT THIS DOES. Runs the SAME Gradle invocations as ci.yml's
# `android-build-test` on every push to `main` that can change what Android
# resolves, so the cache a merge group restores already holds the whole graph and
# the group makes (almost) no requests to Central. That is also what makes
# `max_entries_to_build: 2` safe: the traffic scales with cache misses, not with
# group concurrency.
#
# WHY THE JOB ID IS `android-build-test`. setup-gradle keys the Gradle User Home
# entry on runner OS + JOB ID (+ workflow name, matrix and sha) and restores the
# closest match: same job id is matched BEFORE any other job's entry, in any
# workflow. A merge group's `android-build-test` therefore finds this job's entry
# ahead of whatever CodeQL's `analyze-java-kotlin` wrote (which is now read-only,
# see codeql.yml, so it no longer competes). The dependencies / transforms
# entries the home entry points at are content-addressed and shared. Rename this
# job and the restore silently falls back to a stale or partial entry — the
# defect above, back again, with every check green. The display `name:` is
# different on purpose, so no check-run here reads like the queue-gated
# `android-build-test` context.
#
# WHAT THIS IS NOT.
#   * Not a gate: it is not in ci-status's `needs`, not a required context, and
#     MUST NEVER BE ONE. A red run here means "the cache was not refreshed", and
#     the merge group's own `android-build-test` still judges the tree.
#   * Not a publish step: it uploads nothing but the Actions cache. (CI builds and
#     gates; it never ships.)
#   * Not a test verdict. The tests run only because running them is the one way
#     to resolve exactly what the merge group resolves (a hand-maintained list of
#     configurations drifts; this cannot). A failing test still fails this run
#     and still does not refresh the cache: gradle-retry.sh returns its status.
#
# That includes Robolectric's ~150 MB `android-all-instrumented` framework jar (#3101):
# `prepareRobolectricSdks` in app/build.gradle.kts resolves it as an ordinary Gradle
# dependency (so it lands in this cache) and the tests run Robolectric offline against it.
# Before that, Robolectric fetched it into ~/.m2 DURING the tests, which no cache covers.
#
# `schedule` keeps the entry alive: GitHub evicts a cache entry nobody has
# touched for 7 days, and a quiet week would otherwise bring every merge group's
# cold fetch back.
#
# Verify it is working: a merge group's `android-build-test` log, step "Setup
# Gradle", must show `Cache hit for: gradle-dependencies-v2-...` AND its
# "Run unit tests" step must contain no `Downloading https://repo.maven.apache.org`
# lines for junit / mockk / robolectric.

name: Android Cache Warm

on:
  push:
    branches: [main]
    # Only what can change the set of artifacts Android resolves. The generated
    # Kotlin types (packages/protocol, packages/i18n) change source, not
    # dependencies, so they are not here. A skipped push produces no run at all.
    paths:
      - "apps/android/**"
      - ".github/workflows/android-cache-warm.yml"
      - "scripts/ci/gradle-retry.sh"
      - "scripts/ci/gradle-resolve-connected-test.init.gradle.kts"
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

# A push storm (the queue lands several PRs in a row) needs only the NEWEST tree
# warmed; the older runs would write an entry the next one supersedes. Cancelling
# is safe here, unlike a gate: nothing waits on this run's result.
concurrency:
  group: android-cache-warm
  cancel-in-progress: true

permissions: {} # deny-all; per-job permissions below

env:
  BUN_VERSION: "1.3.5"

jobs:
  # The id is load-bearing — see "WHY THE JOB ID IS `android-build-test`" above.
  android-build-test:
    name: Warm Gradle cache (android)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    # Same as ci.yml's android-build-test: app/build.gradle.kts relocates the
    # build directory off the checkout unless ANDROID_BUILD_DIR names one.
    env:
      ANDROID_BUILD_DIR: ${{ github.workspace }}/apps/android/app/build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun (for codegen)
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies and run codegen
        run: bun install --frozen-lockfile && bun run codegen && bun run i18n:codegen

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      # Default cache mode on the default branch is read-WRITE, which is the whole
      # point. cache-cleanup drops entries the build did not use, so the saved
      # entry is exactly the graph below — nothing stale accumulates.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Keep the first three steps identical to ci.yml's android-build-test. If that
      # job gains a Gradle invocation, add it here too, or the cache will not
      # cover it and the merge group will fetch it from Central.
      - name: Run unit tests
        working-directory: apps/android
        run: bash ../../scripts/ci/gradle-retry.sh testDebugUnitTest --console=plain

      - name: Lint
        working-directory: apps/android
        run: bash ../../scripts/ci/gradle-retry.sh lintDebug --console=plain

      - name: Build debug APK + androidTest APK
        working-directory: apps/android
        run: bash ../../scripts/ci/gradle-retry.sh assembleDebug assembleDebugAndroidTest --console=plain

      # The Unified Test Platform classpaths android-e2e's emulator step needs
      # (#2971). They are resolved by no other task here, so without this the cache
      # a merge group restores holds none of them, android-e2e's pre-emulator step
      # fetches them from Maven Central, and the emulator step (which runs
      # --offline) has nothing to fall back on if that fetch is throttled. Same
      # invocation as android-e2e's, so the two cannot drift.
      - name: Resolve the connected-test (Unified Test Platform) classpaths
        working-directory: apps/android
        run: bash ../../scripts/ci/gradle-retry.sh -I ../../scripts/ci/gradle-resolve-connected-test.init.gradle.kts resolveConnectedTestDependencies --console=plain
