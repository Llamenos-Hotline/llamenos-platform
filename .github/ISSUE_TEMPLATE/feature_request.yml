name: Feature request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who does it affect?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Affected platform(s)
      multiple: true
      options: [Desktop, iOS, Android, Backend/API, All]

  - type: input
    id: parent_epic
    attributes:
      label: Parent epic (optional)
      description: Issue number of the epic this belongs to, if you know it (see planning index #2988). A maintainer attaches the issue as a sub-issue; you don't need to.
      placeholder: "#2976"
