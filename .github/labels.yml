# ── Cross-lane scope grants (#1115) ──────────────────────────────
# Applied to a PR whose diff legitimately spans more than one lane: a
# permission fix touching the shared module, the server enforcing it and the
# client consuming it is one atomic change, not three. `fleet/verify` widens
# which lane's ownership a file may satisfy for each grant present.
#
# Two separate guards, easy to conflate:
#   - NEVER_WRITE_PATHS (secrets only) is absolute and no grant reaches it.
#   - GRANT_EXCLUDED_PATHS (.github/workflows, .github/actions, deploy/,
#     Dockerfile*, Caddyfile*, knope.toml) is what keeps CI and deploy config
#     out of a grant. Those ARE lane-owned, so without it a self-applied
#     scope:infra label would widen any worker onto the supply chain.
# The exclusion binds grants only — the owning lane still writes those paths
# on its own PR. Labels live outside the commit so a grant cannot arrive by
# merging a branch.
- name: "scope:backend"
  color: "5319e7"
  description: "fleet/verify: also judge this PR against the backend lane's scope"

- name: "scope:desktop"
  color: "5319e7"
  description: "fleet/verify: also judge this PR against the desktop lane's scope"

- name: "scope:shared"
  color: "5319e7"
  description: "fleet/verify: also judge this PR against the shared lane's scope"

- name: "scope:ios"
