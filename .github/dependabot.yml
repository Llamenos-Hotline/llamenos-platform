version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # init / analyze / upload-sarif must always be the same release: CodeQL
      # rejects a mismatched trio. Separate PRs each fail alone and can never
      # merge (the merge queue gates every entry independently), so every
      # codeql-action release arrives as ONE PR.
      codeql-action:
        patterns: ["github/codeql-action/*", "github/codeql-action"]
  - package-ecosystem: "docker"
    # Every directory holding a Dockerfile we ship. A Dockerfile outside this
    # list never gets a base-image bump: signal-notifier and sip-bridge sat on
    # Bun 1.3.5 — whose compiled-in root store still trusted the compromised
    # eMudhra hierarchy (#2582) — while deploy/docker moved to 1.4.4. For a Bun
    # service the base image's Bun release IS its outbound TLS trust store.
    directories:
      - "/deploy/docker"
      - "/signal-notifier"
      - "/sip-bridge"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # Digest-only pin with no tag to compare, so dependabot proposes whatever
      # `latest` is — Asterisk 23.5.0 against the vetted 22.10.1. Moving it is
      # a coordinated change (ASTERISK_VERSION + ASTERISK_SHA256 in
      # Dockerfile.asterisk, the compose pins, VETTED_DIGESTS in
      # asterisk-image-dtls-pin.test.ts), never a lone digest swap.
      - dependency-name: "andrius/asterisk"
    groups:
      docker-base-images:
        patterns: ["*"]
