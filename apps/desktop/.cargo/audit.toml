# cargo-audit policy for apps/desktop. Mirrors the zip entries in /deny.toml —
# `cargo audit` (security-audit.yml `rust-audit`) and `cargo deny` read
# different config files, so the same justified exception lives in both.
#
# Only the three zip VULNERABILITIES need listing here. The unmaintained /
# unsound / yanked findings are warnings, which do not fail `cargo audit`.
#
# zip is fixed only in >=9.0.0 and both copies in the lockfile are pinned
# below that by crates we do not control (verified 2026-10-18, tracked in #1956):
#   * zip 4.6.1 <- tauri-plugin-updater 2.10.1, Windows target only. Latest
#     2.14.0 and 3.0.0-alpha.3 still require `zip ^4`; the `zip` feature also
#     gates the tar/flate2 the macOS/Linux updater needs, so it cannot be off.
#   * zip 8.6.0 <- libsodium-sys-stable build script (latest 1.24.3 still
#     requires `zip ^8.6`) via stronghold-runtime <- iota_stronghold <-
#     tauri-plugin-stronghold. Build-time, MSVC targets only.
#
# NOT REACHABLE: all three advisories concern extract() on an attacker-supplied
# archive. The updater minisign-verifies the payload against our pinned pubkey
# before extract (tauri-plugin-updater `verify_signature` precedes `install`);
# libsodium's build script minisign-verifies its MSVC zip against libsodium's
# pinned key before extracting. Forging either needs a signing key, which would
# already allow arbitrary code execution without any zip bug.
#
# EXPIRY IS ENFORCED, not advisory. `cargo audit` has no expiry of its own, so
# the "Enforce advisory ignore expiry" step in security-audit.yml reads every
# audit.toml: each ID must sit on its own line with a trailing comment ending
# `[expires YYYY-MM-DD]`, and the build fails once that date has passed. Keep
# this date in step with the zip entries in /deny.toml.
#
# REVISIT by 2026-12-31, tracked in #1956: empty this list,
# `cargo update -p tauri-plugin-updater -p libsodium-sys-stable`, and run
# `cargo audit`. Anything that no longer fires is dead config.

# ── crypto-bigint 0.5.5 (RUSTSEC-2026-0387) ───────────────────────────────────
#
# Timing variability in constant-time bignum operations; patched only in
# crypto-bigint >= 0.7.6 (published 2026-10-23). Verified 2026-10-24.
#
# NO UPGRADE PATH EXISTS: crypto-bigint 0.5.5 <- elliptic-curve 0.13.8 <-
# ecdsa 0.16.9 / k256 0.13.4 <- iota-crypto 0.23.2 (`k256 = "0.13"`) <-
# iota_stronghold 2.1.0 / stronghold-runtime / stronghold_engine <-
# tauri-plugin-stronghold. iota-crypto 0.23.2, iota_stronghold 2.1.0 and
# tauri-plugin-stronghold 2.4.0 (its `iota-crypto ^0.23`) are all the latest
# stable releases, and `cargo update -p crypto-bigint --precise 0.7.6` is
# rejected by the elliptic-curve 0.13.8 requirement. k256 0.14.0 exists but
# iota-crypto has not moved to it.
#
# NOT REACHABLE: k256 is iota-crypto's secp256k1 ECDSA support, i.e. Stronghold's
# Secp256k1 sign procedures. We use Stronghold purely as an encrypted
# key/value vault (platform.ts: `client.getStore()` + `insert`/`get`/`remove`,
# PBKDF2-derived vault key in lib.rs). No Stronghold procedure is ever
# executed, and our own identity keys are Ed25519/X25519 inside llamenos-core
# (which does not depend on k256 or crypto-bigint at all).
#
# REVISIT by 2026-12-01 (same dated reason as /deny.toml): `cargo update -p
# tauri-plugin-stronghold -p iota-crypto`, then
# `cargo update -p crypto-bigint --precise 0.7.6`.
#
[advisories]
ignore = [
  "RUSTSEC-2026-0387", # crypto-bigint 0.5.5 timing variability; no release reaches >=0.7.6 (iota-crypto -> k256 0.13 pin), secp256k1 never invoked, tracked with #1956 [expires 2026-12-01]
  "RUSTSEC-2026-0367", # zip <9.0.0 keeps SUID/SGID bits on extract; only minisign-verified archives are extracted, no upgrade exists, tracked in #1956 [expires 2026-12-31]
  "RUSTSEC-2026-0368", # zip <9.0.0 extract() follows attacker symlinks; same two minisign-verified-only call sites as RUSTSEC-2026-0367, tracked in #1956 [expires 2026-12-31]
  "RUSTSEC-2026-0369", # zip <9.0.0 applies Unix permissions through symlinks on extract(); same two minisign-verified-only call sites as RUSTSEC-2026-0367, tracked in #1956 [expires 2026-12-31]
]
