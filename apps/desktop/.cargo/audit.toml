# cargo-audit policy for apps/desktop. Mirrors the zip entries in /deny.toml —
# `cargo audit` (security-audit.yml `rust-audit`) and `cargo deny` read
# different config files, so the same justified exception lives in both.
#
# Only the VULNERABILITIES need listing here. The unmaintained / unsound /
# yanked findings are warnings, which do not fail `cargo audit`.
#
# ── zip 8.6.0 (RUSTSEC-2026-0367 / 0368 / 0369 / 0429) ────────────────────────
#
# zip is fixed only in >=9.0.0 (tracked in #1956). Re-verified 2026-11-04:
#   * zip 4.6.1 <- tauri-plugin-updater is GONE. tauri-plugin-updater 2.14.1
#     (2026-10-28) moved to `zip ^9` and now resolves zip 9.3.0. It requires
#     tauri ^2.12 and Rust 1.90, which is why Tauri is 2.12.4 and
#     ../rust-toolchain.toml is 1.90.0.
#   * zip 8.6.0 <- libsodium-sys-stable build script REMAINS. Latest 1.24.3
#     still requires `zip ^8.6`, via stronghold-runtime <- iota_stronghold <-
#     tauri-plugin-stronghold (latest 2.4.0 / 3.0.0-alpha.3 unchanged).
#     `[patch]` cannot lift a `^8.6` requirement across a major to 9.
#     Build-time, MSVC targets only; absent from the shipped binary.
#
# NOT REACHABLE: all four advisories concern extract() on an attacker-supplied
# archive. libsodium-sys-stable's build script extracts only its precompiled
# MSVC zip, and only after `retrieve_and_verify_archive` has minisign-verified
# it against libsodium's pinned key. Forging that archive needs the signing key,
# which would already allow arbitrary code execution without any zip bug.
# RUSTSEC-2026-0429 (process abort on a huge declared symlink size) is a DoS; its
# worst case here is a failed MSVC build. Operator decision 2026-11-04: a dated
# exception, exactly like 0367/0368/0369.
#
# EXPIRY IS ENFORCED, not advisory. `cargo audit` has no expiry of its own, so
# the "Enforce advisory ignore expiry" step in security-audit.yml reads every
# audit.toml: each ID must sit on its own line with a trailing comment ending
# `[expires YYYY-MM-DD]`, and the build fails once that date has passed. Keep
# this date in step with the zip entries in /deny.toml.
#
# REVISIT by 2026-12-31, tracked in #1956: empty the zip entries,
# `cargo update -p libsodium-sys-stable -p tauri-plugin-stronghold`, and run
# `cargo audit`. Anything that no longer fires is dead config.

# ── crypto-bigint 0.5.5 (RUSTSEC-2026-0387) ───────────────────────────────────
#
# Timing variability in constant-time bignum operations; patched only in
# crypto-bigint >= 0.7.6 (published 2026-10-23). Verified 2026-10-24.
#
# NO UPGRADE PATH EXISTS: crypto-bigint 0.5.5 <- elliptic-curve 0.13.8 <-
# ecdsa 0.16.9 / k256 0.13.4 <- iota-crypto 0.23.2 (`k256 = "0.13"`) <-
# iota_stronghold 2.1.0 / stronghold-runtime / stronghold_engine <-
# tauri-plugin-stronghold. iota-crypto 0.23.2, iota_stronghold 2.1.0 and
# tauri-plugin-stronghold 2.4.0 (its `iota-crypto ^0.23`) are all the latest
# stable releases, and `cargo update -p crypto-bigint --precise 0.7.6` is
# rejected by the elliptic-curve 0.13.8 requirement. k256 0.14.0 exists but
# iota-crypto has not moved to it.
#
# NOT REACHABLE: k256 is iota-crypto's secp256k1 ECDSA support, i.e. Stronghold's
# Secp256k1 sign procedures. We use Stronghold purely as an encrypted
# key/value vault (platform.ts: `client.getStore()` + `insert`/`get`/`remove`,
# PBKDF2-derived vault key in lib.rs). No Stronghold procedure is ever
# executed, and our own identity keys are Ed25519/X25519 inside llamenos-core
# (which does not depend on k256 or crypto-bigint at all).
#
# REVISIT by 2026-12-01 (same dated reason as /deny.toml): `cargo update -p
# tauri-plugin-stronghold -p iota-crypto`, then
# `cargo update -p crypto-bigint --precise 0.7.6`.
#
[advisories]
ignore = [
  "RUSTSEC-2026-0387", # crypto-bigint 0.5.5 timing variability; no release reaches >=0.7.6 (iota-crypto -> k256 0.13 pin), secp256k1 never invoked, tracked with #1956 [expires 2026-12-01]
  "RUSTSEC-2026-0367", # zip 8.6.0 keeps SUID/SGID bits on extract; only via the libsodium-sys-stable build script, which extracts a minisign-verified archive only, no release on zip 9, tracked in #1956 [expires 2026-12-31]
  "RUSTSEC-2026-0368", # zip 8.6.0 extract() follows attacker symlinks; same minisign-verified-only libsodium-sys-stable build-script call site as RUSTSEC-2026-0367, tracked in #1956 [expires 2026-12-31]
  "RUSTSEC-2026-0369", # zip 8.6.0 applies Unix permissions through symlinks on extract(); same minisign-verified-only libsodium-sys-stable build-script call site as RUSTSEC-2026-0367, tracked in #1956 [expires 2026-12-31]
  "RUSTSEC-2026-0429", # zip 8.6.0 extract() aborts on a huge declared symlink size (DoS); same minisign-verified-only libsodium-sys-stable build-script call site as RUSTSEC-2026-0367, tracked in #1956 [expires 2026-12-31]
]
