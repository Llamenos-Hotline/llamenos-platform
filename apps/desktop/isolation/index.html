<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Isolation</title>
</head>
<body>
<script>
/**
 * Tauri Isolation Script — IPC command allowlist.
 *
 * This script runs in a separate, sandboxed iframe with a unique origin.
 * It intercepts ALL IPC calls from the webview and validates them before
 * forwarding to the Tauri core.
 *
 * Even if an attacker achieves arbitrary JS execution in the webview,
 * they cannot bypass this layer to invoke raw IPC commands.
 */
window.__TAURI_ISOLATION_HOOK__ = (payload) => {
  // Commands the webview is allowed to invoke.
  //
  // The app (non-`plugin:`) entries must be EXACTLY the commands registered in
  // `tauri::generate_handler![...]` in apps/desktop/src/lib.rs —
  // src/client/lib/desktop-ipc-boundary.test.ts fails if the two sets differ.
  // A command missing here works under `tauri:dev` and the Playwright IPC mock
  // (neither runs this iframe) and is rejected only in a packaged build.
  const ALLOWED_COMMANDS = new Set([
    // Device key management
    'unlock_with_pin',
    'lock_crypto',
    'is_crypto_unlocked',
    'device_generate_and_load',
    'device_import_and_load',
    'get_device_pubkeys',
    // Panic wipe: zeroize CryptoState + delete the Stronghold vault file
    'wipe_keys',
    // Ephemeral keypair for admin-created users (seed returned by design)
    'generate_ephemeral_ed25519',
    // Auth token
    'create_auth_token_from_state',
    'create_nonceless_auth_token_from_state',
    // HPKE crypto (v3)
    'hpke_seal',
    'hpke_seal_key',
    'hpke_open_from_state',
    'hpke_open_key_from_state',
    // Ed25519 signing is purpose-bound (no generic signer); verification is public-key-only
    'sign_ws_challenge_from_state',
    'ed25519_verify',
    // PUK (Per-User Key)
    'puk_create_from_state',
    'puk_rotate_from_state',
    'puk_unwrap_seed_from_state',
    // Sigchain
    'sigchain_create_link_from_state',
    'sigchain_verify',
    'sigchain_verify_link',
    // Hub key management (stateful — key never enters JS)
    'hpke_unwrap_and_set_hub_key',
    'generate_hub_key_in_state',
    'wrap_hub_key_for_member',
    // Hub-key field encryption (team/tag names — key stays in Rust)
    'encrypt_hub_field',
    'decrypt_hub_field',
    // Server event decryption
    'set_server_event_keys',
    'decrypt_hub_event',
    'decrypt_server_event',
    // SFrame voice E2EE
    'sframe_derive_key',
    // SAS emoji verification
    'derive_sas',
    // Device provisioning (signing seed never enters the webview)
    'provision_create_session',
    'provision_compute_sas',
    'provision_decrypt_and_import',
    // Configured backend address (#738) — persisted + validated in Rust
    'api_config_get',
    'api_config_set',
    'api_config_request_clear',
    'api_config_clear',
    // Runtime-enforced network egress (#739) — CSP connect-src is `ipc:` only
    'net_fetch',
    'net_probe_health',
    'net_ws_connect',
    'net_ws_send',
    'net_ws_close',
    // Invite deep link (#1128) — the code a llamenos://hub-invite link delivered
    'take_pending_invite',
    // Shamir verification (split/combine are internal-only — secrets never enter JS)
    'shamir_commit',
    'shamir_verify',
    // H16: Recovery group key isolation — private key AND plaintext shares never enter JS
    'recovery_group_create',
    'recovery_share_contribute_from_state',
    'recovery_group_reconstruct_from_shares',
    'recovery_group_decrypt',
    // Window plugin commands (window management + tray toggle)
    'plugin:window|is_visible',
    'plugin:window|show',
    'plugin:window|hide',
    'plugin:window|minimize',
    'plugin:window|unminimize',
    'plugin:window|is_minimized',
    'plugin:window|is_focused',
    'plugin:window|title',
    'plugin:window|set_title',
    // Stronghold plugin commands
    'plugin:stronghold|initialize',
    'plugin:stronghold|create_client',
    'plugin:stronghold|load_client',
    'plugin:stronghold|save',
    'plugin:stronghold|save_store_record',
    'plugin:stronghold|get_store_record',
    'plugin:stronghold|remove_store_record',
    'plugin:stronghold|destroy',
    // Store plugin commands (encrypted key persistence)
    'plugin:store|get',
    'plugin:store|set',
    'plugin:store|delete',
    'plugin:store|save',
    'plugin:store|load',
    // Notification plugin commands
    'plugin:notification|notify',
    'plugin:notification|is_permission_granted',
    'plugin:notification|request_permission',
    // Updater plugin commands
    'plugin:updater|check',
    'plugin:updater|download_and_install',
    // Window state plugin commands
    'plugin:window-state|restore_state',
    'plugin:window-state|save_window_state',
    // Log plugin commands
    'plugin:log|log',
    // Backup generation (device-state export during admin bootstrap)
    'generate_backup_from_state',
    'generate_recovery_key',
    'backup_verify_credential',
    'restore_backup_and_load',
    // Path plugin commands (store/stronghold resolve the app data directory)
    'plugin:path|resolve_directory',
    // Process plugin commands (for quit only)
    'plugin:process|exit',
  ]);

  // Event-plugin commands are allowed ONLY for the native→webview events the app
  // actually subscribes to — `net-ws:<id>` (the relay WebSocket proxy frames,
  // emitted by apps/desktop/src/net.rs), `check-for-updates` (tray menu) and
  // `invite-deep-link` (apps/desktop/src/deep_link.rs, payload-free). The
  // allowlist cannot be a flat entry: `plugin:event|listen` with an arbitrary
  // event name would let injected script eavesdrop on any native event, so the
  // event name in the payload is inspected. `plugin:event|emit` and `emit_to`
  // stay blocked — the webview has no reason to raise native events.
  //
  // `unlisten` is authorized by the SAME event-name check as `listen`. That is
  // possible because the stock unlisten function `listen()` returns in
  // `@tauri-apps/api` v2 invokes `plugin:event|unlisten` with
  // `{ event, eventId }` — and tauri's native command requires both
  // (`unlisten(webview, event: EventName, event_id: EventId)` in
  // tauri/src/event/plugin.rs), so a payload without `event` could not
  // deserialize anyway. `eventId` is the numeric id `listen` resolved with; it
  // must be an integer, so a call that is not the stock unlisten shape is refused.
  // src/client/lib/desktop-ipc-boundary.test.ts drives the real `listen()` →
  // unlisten function through this hook, so a change to that shape fails there.
  const ALLOWED_EVENT_NAME = /^(net-ws:[A-Za-z0-9_-]+|check-for-updates|invite-deep-link)$/;
  const SCOPED_EVENT_COMMANDS = new Set([
    'plugin:event|listen',
    'plugin:event|unlisten',
  ]);

  const cmd = payload?.cmd;
  if (cmd && SCOPED_EVENT_COMMANDS.has(cmd)) {
    const eventName = payload?.payload?.event;
    const eventIdOk =
      cmd !== 'plugin:event|unlisten' || Number.isInteger(payload?.payload?.eventId);
    if (typeof eventName === 'string' && ALLOWED_EVENT_NAME.test(eventName) && eventIdOk) {
      return payload;
    }
    return Promise.reject(
      new Error(
        "IPC command '" + cmd + "' is not allowed for event '" + eventName + "' by the isolation policy"
      )
    );
  }
  if (!cmd || !ALLOWED_COMMANDS.has(cmd)) {
    return Promise.reject(
      new Error(
        "IPC command '" + cmd + "' is not allowed by the isolation policy"
      )
    );
  }

  return payload;
};
</script>
</body>
</html>
