[package]
name = "llamenos-desktop"
version = "0.19.18"
edition = "2024"
rust-version = "1.88.0"
license = "AGPL-3.0-or-later"

[lib]
name = "llamenos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
# Pinned exact (not a "2" floating range): the Tauri CLI hard-fails `tauri build`
# when this crate's minor and @tauri-apps/api's minor (package.json) disagree,
# and a loose range on either side lets cargo/bun resolve them independently.
# Bump BOTH this line and package.json's @tauri-apps/api together; a rail test
# in tests/tauri-version-alignment.spec.ts fails loudly if they diverge again.
tauri = { version = "=2.11.1", features = ["tray-icon", "isolation"] }
tauri-plugin-stronghold = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared crypto core (in-repo since Epic 201)
llamenos-core = { path = "../../packages/crypto" }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
hkdf = "0.12"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
argon2 = "0.5"
subtle = "2"
# Runtime-enforced network egress (#739) — the webview's CSP connect-src allows
# only `ipc:`; all HTTP/WS traffic to the user-configured backend is proxied
# through these commands (see src/net.rs) instead of a browser fetch/WebSocket.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["sync", "net"] }
url = "2"
base64 = "0.22"
# Native OS confirmation dialog for api_config_request_clear (#788) — rendered
# outside the webview's DOM/JS sandbox so a compromised renderer cannot script
# a confirmation click.
tauri-plugin-dialog = "2"
# TLS certificate pinning for the network proxy (#775) — a custom rustls
# ServerCertVerifier (src/cert_pin.rs) applied to both the reqwest client and
# the WebSocket TLS connector. `default-features = false` + explicit `ring`
# keeps this on the same crypto backend `reqwest`/`tokio-tungstenite` already
# resolve to above (see Cargo.lock) instead of pulling in `aws-lc-rs` (rustls's
# own default), which would add a cmake/nasm build dependency for nothing.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "tls12", "std"] }
rustls-webpki = "0.103"

[dev-dependencies]
# Test-only self-signed certificate generation + TLS server acceptor for
# cert_pin.rs's pinning tests (#775) — never compiled into the shipped app.
rcgen = "0.14"
# `default-features = false` + explicit `ring` for the same reason as the
# `rustls` entry above: tokio-rustls's own default features pull in
# `aws-lc-rs`, and Cargo feature-unifies per package version across the whole
# graph — an unqualified dev-dependency here would drag `aws-lc-rs` (and its
# cmake/nasm build requirement) into every other consumer of `rustls` too.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
# Augments the `tokio` dependency above with the runtime + IO features the
# in-test TLS server needs; Cargo unions these into test builds only.
tokio = { version = "1", features = ["rt", "io-util"] }

[features]
default = ["custom-protocol", "updater"]
custom-protocol = ["tauri/custom-protocol"]
updater = ["dep:tauri-plugin-updater"]
