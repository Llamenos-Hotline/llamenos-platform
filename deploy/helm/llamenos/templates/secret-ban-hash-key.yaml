{{- if not .Values.secrets.existingBanHashKeySecret }}
{{- /* Its own Secret, apart from "-secrets": see llamenos.banHashKeySecretName. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llamenos.banHashKeySecretName" . }}
  labels:
    {{- include "llamenos.labels" . | nindent 4 }}
type: Opaque
data:
  ban-hash-key: {{ required "secrets.banHashKey is required (64 lowercase hex chars: openssl rand -hex 32, a different value from every other secret)" .Values.secrets.banHashKey | b64enc | quote }}
{{- end }}
