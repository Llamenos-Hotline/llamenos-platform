{{- if not .Values.secrets.existingMessagingHashKeySecret }}
{{- /* Its own Secret, apart from "-secrets" and from the ban key: see llamenos.messagingHashKeySecretName. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llamenos.messagingHashKeySecretName" . }}
  labels:
    {{- include "llamenos.labels" . | nindent 4 }}
type: Opaque
data:
  messaging-hash-key: {{ required "secrets.messagingHashKey is required (64 lowercase hex chars: openssl rand -hex 32, a different value from every other secret)" .Values.secrets.messagingHashKey | b64enc | quote }}
{{- end }}
