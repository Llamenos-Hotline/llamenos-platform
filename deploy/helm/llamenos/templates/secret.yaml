{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llamenos.fullname" . }}-secrets
  labels:
    {{- include "llamenos.labels" . | nindent 4 }}
type: Opaque
data:
  admin-pubkey: {{ .Values.secrets.adminPubkey | b64enc | quote }}
  {{- /* The admin X25519 HPKE recipient key. Required whenever adminPubkey is set:
         the app refuses to boot otherwise rather than seal admin envelopes to the
         Ed25519 signing key, which produces ciphertext nobody can open (#1283).
         `bun run bootstrap-admin` prints both from a single seed. */}}
  admin-decryption-pubkey: {{ if .Values.secrets.adminPubkey }}{{ required "secrets.adminDecryptionPubkey is required whenever secrets.adminPubkey is set (the admin X25519 key; run: bun run bootstrap-admin)" .Values.secrets.adminDecryptionPubkey | b64enc | quote }}{{ else }}{{ .Values.secrets.adminDecryptionPubkey | default "" | b64enc | quote }}{{ end }}
  postgres-password: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | b64enc | quote }}
  {{- /* values.yaml has declared secrets.hmacSecret since this chart was written, but
         nothing ever rendered it and deployment-app.yaml never set HMAC_SECRET. The app
         hard-fails in validateConfig() without it, so every `helm install` CrashLooped. */}}
  hmac-secret: {{ required "secrets.hmacSecret is required (64 lowercase hex chars: openssl rand -hex 32)" .Values.secrets.hmacSecret | b64enc | quote }}
  twilio-account-sid: {{ .Values.secrets.twilioAccountSid | default "" | b64enc | quote }}
  twilio-auth-token: {{ .Values.secrets.twilioAuthToken | default "" | b64enc | quote }}
  twilio-phone-number: {{ .Values.secrets.twilioPhoneNumber | default "" | b64enc | quote }}
  server-secret: {{ required "secrets.serverSecret is required" .Values.secrets.serverSecret | b64enc | quote }}
  {{- if .Values.rustfs.enabled }}
  rustfs-access-key: {{ required "rustfs.credentials.accessKey is required" .Values.rustfs.credentials.accessKey | b64enc | quote }}
  rustfs-secret-key: {{ required "rustfs.credentials.secretKey is required" .Values.rustfs.credentials.secretKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.sipBridge.enabled }}
  bridge-secret: {{ required "sipBridge.bridgeSecret is required" .Values.sipBridge.bridgeSecret | b64enc | quote }}
  {{- end }}
{{- end }}
