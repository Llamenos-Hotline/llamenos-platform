{{- /*
  Llamenos is not multi-instance safe: call routing, ringing state and
  WebSocket/relay sessions are process-local, and this chart has no shared
  pub/sub or sticky routing in front of them. A second replica silently drops
  calls rung on one pod and misses events published by the other — no crash,
  no error, just broken call handling (#1120). Refuse to render rather than
  let that ship quietly; autoscaling was removed from this chart for the same
  reason (see values.yaml).
*/}}
{{- if ne (int .Values.app.replicas) 1 }}
{{- fail (printf "app.replicas is %d, but this chart only supports 1: Llamenos's call routing and WebSocket/relay sessions are process-local with no shared state across pods. See values.yaml's comment on app.replicas and issue #1120." (int .Values.app.replicas)) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llamenos.fullname" . }}
  labels:
    {{- include "llamenos.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "llamenos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "llamenos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "llamenos.serviceAccountName" . }}
      containers:
        - name: app
          image: "{{ required "app.image.repository is required — set it to the registry/repo your own build actually publishes to (docker.io/<your-dockerhub-username>/llamenos by default, see .github/workflows/docker.yml; NOT ghcr.io)" .Values.app.image.repository }}:{{ include "llamenos.appImageTag" . }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
              name: http
              protocol: TCP
          env:
            - name: PLATFORM
              value: "bun"
            - name: PORT
              value: {{ .Values.app.port | quote }}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "llamenos.secretName" . }}
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}:$(PG_PASSWORD)@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
            - name: PG_POOL_SIZE
              value: {{ .Values.postgres.poolSize | quote }}
            - name: HOTLINE_NAME
              value: {{ .Values.app.env.HOTLINE_NAME | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.app.env.ENVIRONMENT | quote }}
            - name: ADMIN_PUBKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "llamenos.secretName" . }}
                  key: admin-pubkey
            - name: ADMIN_DECRYPTION_PUBKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "llamenos.secretName" . }}
                  key: admin-decryption-pubkey
                  optional: true
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: {{ include "llamenos.secretName" . }}
                  key: twilio-account-sid
                  optional: true
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "llamenos.secretName" . }}
                  key: twilio-auth-token
                  optional: true
            - name: TWILIO_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: {{ include "llamenos.secretName" . }}
                  key: twilio-phone-number
                  optional: true
            {{- if .Values.rustfs.enabled }}
            - name: STORAGE_ENDPOINT
              value: "http://{{ include "llamenos.fullname" . }}-rustfs:9000"
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "llamenos.secretName" . }}
                  key: rustfs-access-key
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "llamenos.secretName" . }}
                  key: rustfs-secret-key
            - name: STORAGE_BUCKET
              value: {{ .Values.rustfs.bucket | quote }}
            {{- end }}
            {{- if .Values.whisper.enabled }}
            - name: WHISPER_URL
              value: "http://{{ include "llamenos.fullname" . }}-whisper:8080/v1/audio/transcriptions"
            {{- end }}
            - name: SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "llamenos.secretName" . }}
                  key: server-secret
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "llamenos.secretName" . }}
                  key: hmac-secret
            {{- /* Required by the app whenever ENVIRONMENT is production, which is this
                   chart's default. Without it the app refuses to boot rather than fall back
                   to the spoofable Host header for webhook signature validation. */}}
            - name: WEBHOOK_BASE_URL
              value: {{ if eq .Values.app.env.ENVIRONMENT "production" }}{{ required "app.env.WEBHOOK_BASE_URL is required when ENVIRONMENT is production" .Values.app.env.WEBHOOK_BASE_URL | quote }}{{ else }}{{ .Values.app.env.WEBHOOK_BASE_URL | default "" | quote }}{{ end }}
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
