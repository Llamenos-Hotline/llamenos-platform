# Llamenos Helm chart values

app:
  image:
    # REQUIRED — no default. `.github/workflows/docker.yml` publishes the app
    # image to Docker Hub (`docker.io/<DOCKERHUB_USERNAME>/llamenos`), not
    # GHCR — set this to wherever your own build actually pushed it. A chart
    # that filled in a plausible-looking default here (as this one used to:
    # `ghcr.io/your-org/llamenos`) fails with a silent, confusing
    # ImagePullBackOff instead of a clear error at install time (#1120).
    repository: ""
    tag: ""  # Defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  # Llamenos is NOT safe to run with more than one replica yet: call routing,
  # ringing state, and WebSocket/relay sessions are process-local, and there
  # is no shared pub/sub or sticky routing in front of them (#1120). A second
  # pod silently drops calls rung on the first and misses events published by
  # it. templates/deployment-app.yaml refuses to render above 1 — change both
  # together, and only once that shared state exists.
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    HOTLINE_NAME: "Hotline"
    ENVIRONMENT: "production"
    # Required while ENVIRONMENT is "production" — the public https:// base URL
    # telephony/messaging webhooks are delivered to. The app refuses to boot
    # without it rather than trust the spoofable Host header.
    WEBHOOK_BASE_URL: ""

# PostgreSQL connection
postgres:
  host: ""       # Required: e.g. my-rds-instance.region.rds.amazonaws.com
  port: 5432
  database: llamenos
  user: llamenos
  poolSize: 10

# RustFS for blob storage
rustfs:
  enabled: true
  image:
    repository: rustfs/rustfs
    tag: "latest"
  persistence:
    size: 50Gi
    storageClass: ""
  # REQUIRED: Set unique credentials — never use defaults
  credentials:
    accessKey: ""
    secretKey: ""
  bucket: llamenos-files
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Whisper transcription
whisper:
  enabled: false
  image:
    repository: fedirz/faster-whisper-server
    tag: "0.4.1"  # digest pin pending: tag not yet published to Docker Hub — pin once available
  model: "Systran/faster-whisper-base"
  device: "cpu"  # or "cuda" for GPU
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

# NOT YET WIRED: asterisk, sipBridge, ntfy and signal below are declared here
# (and sipBridge.bridgeSecret is even rendered into the Secret, see
# templates/secret.yaml) but none of them has a Deployment/StatefulSet
# template. Enabling any of them creates config and no workload — it deploys
# nothing. Tracked as follow-up work, separate from #1120; left in place
# rather than deleted so the intent and required secret shape aren't lost.

# Asterisk PBX
asterisk:
  enabled: false
  image:
    repository: andrius/asterisk
    tag: "20.11"

# SIP bridge (supports Asterisk, FreeSWITCH, Kamailio via PBX_TYPE)
sipBridge:
  enabled: false
  image:
    repository: ghcr.io/your-org/llamenos-sip-bridge
    tag: ""
  # PBX backend: asterisk, freeswitch, or kamailio
  pbxType: "asterisk"
  # REQUIRED: set a strong random secret
  bridgeSecret: ""

# ntfy push relay (UnifiedPush for Android)
ntfy:
  enabled: false
  image:
    repository: binwiederhier/ntfy
    tag: "v2.11.0@sha256:ce845e0f0e7eba0f75e553ed4b3c550e74c1e3ab0e89b21b89b85a7d2b67cd42"
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Signal CLI messaging bridge
signal:
  enabled: false
  image:
    repository: bbernhard/signal-cli-rest-api
    tag: "0.92@sha256:702db336aa1a87611595e66755c9ccf65b24c25589857301eabef1d46056b3c5"
  persistence:
    size: 1Gi

# Autoscaling is deliberately NOT an option: every mechanism for running more
# than one `app` replica is removed together (#1120) — see the comment on
# `app.replicas` above. Re-add only alongside the shared session/call state
# that would make a second replica safe, not before.

# Prometheus metrics scraping
# metrics.enabled gates the ServiceMonitor; set metrics.scrapeTokenSecret to the K8s
# Secret name containing a "metrics-scrape-token" key matching METRICS_SCRAPE_TOKEN env var.
metrics:
  enabled: false
  interval: 30s
  path: /api/metrics/prometheus
  # Name of an existing K8s Secret with key "metrics-scrape-token" (METRICS_SCRAPE_TOKEN)
  # Leave empty to require authenticated admin access instead of a bearer token.
  scrapeTokenSecret: ""

# Monitoring (Prometheus Operator ServiceMonitor additional config)
monitoring:
  serviceMonitor:
    enabled: false  # deprecated — use metrics.enabled
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}

# Network policies (restrict pod-to-pod traffic)
networkPolicy:
  enabled: true
  ingressControllerLabels: {}
    # Use Caddy-ingress or Traefik labels here
    # nginx is NOT recommended due to its history of security vulnerabilities

# Ingress
ingress:
  enabled: true
  className: ""  # Use Caddy-ingress or Traefik; nginx is NOT recommended
  annotations: {}
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: hotline.example.org
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: llamenos-tls
  #   hosts:
  #     - hotline.example.org

# Secrets (reference existing K8s secrets)
secrets:
  # Create a secret named "llamenos-secrets" with these keys:
  #   admin-pubkey, admin-decryption-pubkey, postgres-password, twilio-account-sid,
  #   twilio-auth-token, twilio-phone-number
  existingSecret: ""
  # Or provide values directly (will be base64-encoded into a Secret)
  adminPubkey: ""           # Ed25519 identity key (verifies the admin's signatures)
  # X25519 HPKE recipient key — a DIFFERENT value from adminPubkey, printed
  # alongside it by `bun run bootstrap-admin`. Required whenever adminPubkey is
  # set: the app refuses to boot rather than seal admin envelopes to an Ed25519
  # key, which succeeds and makes every note permanently undecryptable (#1283).
  adminDecryptionPubkey: ""
  postgresPassword: ""  # Required
  hmacSecret: ""         # Required: 64-char hex, generate with: openssl rand -hex 32
  twilioAccountSid: ""
  twilioAuthToken: ""
  twilioPhoneNumber: ""
  serverSecret: ""       # Required: 64-char hex, generate with: openssl rand -hex 32

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod-level settings
podAnnotations: {}
podSecurityContext:
  fsGroup: 1000
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
