---
# Demo Instance Deployment Playbook
#
# Deploys the Llamenos demo instance to the 'demo' inventory group.
# Loads demo_vars.yml (or a custom vars file) before running.
#
# Per issue #718, the demo instance IS the Internal Availability milestone's
# staging backend: demo_vars.yml should set app_environment: demo and
# demo_mode: true (plus demo_mode_confirm: "DESTROY_ALL_DATA") rather than
# standing up a separate third deployment target.
#
# LAYOUT NOTICE (issue #1121): this playbook deploys the legacy `llamenos`
# role, which renders ONE monolithic {{ app_dir }}/docker-compose.yml, unlike
# every production host (playbooks/deploy.yml), which renders one compose
# file per service under {{ app_dir }}/services/<service>/. This is a
# deliberate, currently-unresolved gap: demo/staging therefore exercises a
# different deployment topology than production, and none of the day-2
# operations playbooks (backup/restore/update/rollback/security-update) run
# against it — they assert the per-service layout and refuse to run
# otherwise (playbooks/tasks/discover-services.yml). Do not point
# update.yml/restore.yml/rollback.yml/security-update.yml at a demo host;
# they will fail their own precondition. Migrating demo to the per-service
# roles (so it tests what production actually runs) is tracked as follow-up
# work, not done here.
#
# Usage:
#   ansible-playbook playbooks/deploy-demo.yml --ask-vault-pass
#   ansible-playbook playbooks/deploy-demo.yml --ask-vault-pass -e demo_vars_file=../demo_vars.yml

- name: Load demo configuration variables
  hosts: demo
  gather_facts: false
  tasks:
    - name: Include demo vars file
      ansible.builtin.include_vars:
        file: "{{ demo_vars_file | default('../demo_vars.yml') }}"
      tags: always

    # Demo/dev-only settings must never leak into a host mislabeled
    # app_environment: production. See deploy/ansible/playbooks/tasks/guard-demo-mode.yml
    # and issue #716.
    - name: Include shared demo/dev-mode production safety guard
      ansible.builtin.import_tasks: tasks/guard-demo-mode.yml
      tags: always

    # Android testers are rung through a self-hosted ntfy/UnifiedPush relay
    # (no FCM — see deploy/PUSH_NOTIFICATIONS.md). A staging backend without
    # it looks healthy but can never wake an Android device for a call, so a
    # demo/staging deploy REFUSES to proceed without it (issue #959).
    #
    # ntfy_domain must be a subdomain of this deployment's own `domain`, rather
    # than a hard-coded literal: `domain` is the one the mobile clients pin
    # (llamenos-hotline.org for the official build, #971/#726), so the guard
    # follows whatever domain the inventory and the pins use. The Android app
    # never connects to ntfy itself (the ntfy distributor app does), and the
    # backend publishes only to configured ntfy origins (#963), so the ntfy
    # host needs no pin of its own — only to sit under the staging domain.
    - name: Assert the ntfy push relay is enabled and publicly addressable
      ansible.builtin.assert:
        that:
          - llamenos_ntfy_enabled | default(false) | bool
          - ntfy_domain is defined
          - ntfy_domain | length > 0
          - domain is defined
          - domain | length > 0
          - ntfy_domain != domain
          - ntfy_domain.endswith('.' ~ domain)
        fail_msg: |
          REFUSING TO DEPLOY: the staging/demo backend must run the ntfy push relay,
          otherwise Android testers can never be rung for an incoming call.

          ntfy_domain must be a subdomain of `domain` (the pinned domain,
          llamenos-hotline.org for the official build), with real DNS + TLS,
          reachable from testers' phones.

          Set in demo_vars.yml:
            llamenos_ntfy_enabled: true
            ntfy_domain: "push.{{ domain | default('<staging host>') }}"

          Current values:
            llamenos_ntfy_enabled: {{ llamenos_ntfy_enabled | default(false) }}
            ntfy_domain:           {{ ntfy_domain | default('NOT SET') }}
            domain:                {{ domain | default('NOT SET') }}
        success_msg: "ntfy push relay enabled at {{ ntfy_domain }}"
      tags: always

- name: Harden demo server
  hosts: demo
  become: true
  roles:
    - role: common
      tags: [common, harden]
    - role: ssh-hardening
      tags: [ssh, harden]
    - role: firewall
      tags: [firewall, harden]
    - role: kernel-hardening
      tags: [kernel, harden]
    - role: fail2ban
      tags: [fail2ban, harden]

- name: Deploy demo instance
  hosts: demo
  become: true
  roles:
    - role: docker
      tags: [docker, deploy]
    - role: llamenos
      tags: [llamenos, deploy]

# Deploy is not "done" until the push relay demonstrably works from outside
# the host: health over public TLS, anonymous publish rejected, the backend's
# token accepted, and a subscriber receiving the message (issue #959).
- name: Verify the ntfy push relay end to end
  hosts: demo
  become: true
  gather_facts: false
  tasks:
    - name: Verify ntfy relay
      ansible.builtin.import_tasks: tasks/verify-ntfy.yml
      tags: [ntfy, verify]
