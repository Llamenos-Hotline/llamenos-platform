---
# Llamenos Deployment — Multi-Host Orchestration
#
# Deploys services in dependency order across all hosts.
# Each service role is self-selecting: it skips hosts not in its group.
#
# Usage:
#   ansible-playbook playbooks/deploy.yml --ask-vault-pass
#   ansible-playbook playbooks/deploy.yml --ask-vault-pass --tags postgres
#   ansible-playbook playbooks/deploy.yml --ask-vault-pass --tags app
#
# Tags: docker, service-discovery, internal-tls, postgres, rustfs, ntfy,
#       app, caddy, whisper, asterisk, signal, deploy

- name: Gather facts and run service discovery
  hosts: llamenos_servers
  become: true
  vars_files:
    - ../vars.yml
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags: [always]
  roles:
    - role: service-discovery
      tags: [always, service-discovery]

- name: Provision internal TLS (if enabled)
  hosts: llamenos_servers
  become: true
  vars_files:
    - ../vars.yml
  roles:
    - role: internal-tls
      tags: [internal-tls, deploy]
      when: llamenos_internal_tls_enabled | default(false)

- name: Deploy infrastructure services (database, storage)
  hosts: llamenos_servers
  become: true
  vars_files:
    - ../vars.yml
  roles:
    - role: docker
      tags: [docker, deploy]
    - role: llamenos-postgres
      tags: [postgres, deploy]
      when: llamenos_postgres_enabled | default(true)
    - role: llamenos-rustfs
      tags: [rustfs, deploy]
      when: llamenos_rustfs_enabled | default(true)
    - role: llamenos-ntfy
      tags: [ntfy, deploy]
      when: llamenos_ntfy_enabled | default(false) | bool
      # Must run before "Deploy application services" below: it sets the
      # ntfy_auth_token fact that roles/llamenos-app's env template reads.

- name: Deploy application services
  hosts: llamenos_servers
  become: true
  vars_files:
    - ../vars.yml
  roles:
    - role: llamenos-app
      tags: [app, deploy]
      when: llamenos_app_enabled | default(true)

- name: Deploy proxy and optional services
  hosts: llamenos_servers
  become: true
  vars_files:
    - ../vars.yml
  roles:
    - role: llamenos-caddy
      tags: [caddy, deploy]
      when: llamenos_caddy_enabled | default(true)
    - role: llamenos-whisper
      tags: [whisper, deploy]
      when: llamenos_transcription_enabled | default(false)
    - role: llamenos-asterisk
      tags: [asterisk, deploy]
      when: llamenos_asterisk_enabled | default(false)
    # The SIP edge. roles/kamailio existed but was on NO deploy path, so the
    # trust anchor it writes — the only thing that makes a self-hosted PBX
    # certificate verifiable on either mobile client — was never written on a
    # deployed host, and nothing said so (#1657). Default off: a phone-only
    # deployment needs no SIP edge. It runs AFTER llamenos-app on purpose,
    # because the certificate it generates has to exist before the app's next
    # restart reads the anchor — and it notifies that restart itself.
    - role: kamailio
      tags: [kamailio, sip, deploy]
      when: kamailio_enabled | default(false) | bool
    # The STUN/TURN relay. Without it /api/telephony/sip-token hands clients
    # STUN-only ICE and a call between two peers behind symmetric NAT has no
    # media path (#1657). Gated on the same variable as the TURN_HOST/TURN_SECRET
    # render, so the ICE set never names a relay that is not running.
    - role: llamenos-coturn
      tags: [coturn, turn, sip, deploy]
      when: llamenos_coturn_enabled | default(false) | bool
    - role: llamenos-signal
      tags: [signal, deploy]
      when: llamenos_signal_enabled | default(false)
    - role: llamenos-update-server
      tags: [update-server, deploy]
      when:
        - llamenos_update_server_enabled | default(false) | bool
        - inventory_hostname in groups.get('llamenos_proxy', [])
        # The updater vhosts live with the API (roles/llamenos-caddy), not on
        # a proxy that only fronts the push relay.
        - groups.get('llamenos_app', []) | length == 0 or inventory_hostname in groups.get('llamenos_app', [])

- name: Deploy auto-healing and maintenance
  hosts: llamenos_servers
  become: true
  vars_files:
    - ../vars.yml
  roles:
    - role: llamenos-watchdog
      tags: [watchdog, deploy, auto-healing]
    - role: llamenos-ntp-monitor
      tags: [ntp, deploy, auto-healing]
    - role: llamenos-maintenance
      tags: [maintenance, deploy, auto-healing]
    - role: alerting
      tags: [alerting, deploy]
      when: llamenos_alerting_enabled | default(false) | bool
