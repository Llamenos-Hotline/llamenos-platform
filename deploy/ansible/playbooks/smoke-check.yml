---
# Smoke-check Playbook
#
# Runs after deployment to validate that all hardening assertions hold
# and that application services are healthy. Exits non-zero on the first
# failure so CI/test scripts catch regressions.
#
# Usage:
#   ansible-playbook playbooks/smoke-check.yml -e '@vars.yml'
#   ansible-playbook playbooks/smoke-check.yml --check --diff

- name: Smoke-check hardening and services on target host
  hosts: llamenos_servers
  gather_facts: true
  become: true
  vars_files:
    - ../vars.yml
  vars:
    # Derive the API base URL from deployment config (matches Caddyfile logic)
    _api_host: "{{ api_subdomain + '.' + domain if (api_subdomain | default('') | length > 0) else domain }}"
    _api_base_url: "https://{{ _api_host }}"
    # Each probe runs only where its service is placed (same rule as the
    # service roles: an empty group means every llamenos_servers host). In the
    # two-tier layout the relay host runs ntfy + Caddy and nothing else.
    _smoke_serves_app: "{{ groups.get('llamenos_app', []) | length == 0 or inventory_hostname in groups.get('llamenos_app', []) }}"
    _smoke_serves_db: "{{ groups.get('llamenos_db', []) | length == 0 or inventory_hostname in groups.get('llamenos_db', []) }}"
    _smoke_serves_storage: "{{ groups.get('llamenos_storage', []) | length == 0 or inventory_hostname in groups.get('llamenos_storage', []) }}"
    _smoke_serves_ntfy: "{{ groups.get('llamenos_ntfy', []) | length == 0 or inventory_hostname in groups.get('llamenos_ntfy', []) }}"
    _smoke_serves_asterisk: "{{ groups.get('llamenos_asterisk', []) | length == 0 or inventory_hostname in groups.get('llamenos_asterisk', []) }}"

  tasks:
    - name: Initialize smoke-check results
      ansible.builtin.set_fact:
        smoke_results: []
      tags: always

    # ─── System hardening ────────────────────────────────────────────────────

    - name: Assert ufw is active with deny-incoming default
      ansible.builtin.shell: |
        set -euo pipefail
        ufw status verbose | grep -q "Status: active"
        ufw status verbose | grep -q "Default: deny (incoming)"
      args:
        executable: /bin/bash
      changed_when: false
      register: ufw_check
      ignore_errors: true
      tags: always

    - name: Record ufw result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'UFW active with deny-incoming', 'status': 'PASS' if ufw_check is succeeded else 'FAIL'}] }}"
      tags: always

    - name: Assert fail2ban is active
      ansible.builtin.command: systemctl is-active fail2ban
      changed_when: false
      register: fail2ban_check
      ignore_errors: true
      tags: always

    - name: Record fail2ban result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'fail2ban running', 'status': 'PASS' if fail2ban_check is succeeded else 'FAIL'}] }}"
      tags: always

    - name: Assert docker is active
      ansible.builtin.command: systemctl is-active docker
      changed_when: false
      register: docker_check
      ignore_errors: true
      tags: always

    - name: Record docker result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'Docker running', 'status': 'PASS' if docker_check is succeeded else 'FAIL'}] }}"
      tags: always

    - name: Assert docker userns-remap is enabled
      ansible.builtin.shell: |
        set -euo pipefail
        docker info --format '{{ "{{" }}.SecurityOptions{{ "}}" }}' | grep -q userns
      args:
        executable: /bin/bash
      changed_when: false
      register: userns_check
      ignore_errors: true
      tags: always

    - name: Record userns-remap result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'Docker userns-remap enabled', 'status': 'PASS' if userns_check is succeeded else 'FAIL'}] }}"
      tags: always

    - name: Assert sshd disables password + root login
      ansible.builtin.shell: |
        set -euo pipefail
        count=$(sshd -T 2>/dev/null | grep -cE '^(passwordauthentication|permitrootlogin) no$')
        test "$count" -eq 2
      args:
        executable: /bin/bash
      changed_when: false
      register: ssh_check
      ignore_errors: true
      tags: always

    - name: Record SSH hardening result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'SSH password auth disabled + root login disabled', 'status': 'PASS' if ssh_check is succeeded else 'FAIL'}]
          }}"
      tags: always

    - name: Assert tcp_syncookies is enabled
      ansible.builtin.command: sysctl -n net.ipv4.tcp_syncookies
      register: syncookies
      changed_when: false
      failed_when: syncookies.stdout | trim != "1"
      ignore_errors: true
      tags: always

    - name: Record syncookies result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'TCP syncookies enabled', 'status': 'PASS' if syncookies is succeeded else 'FAIL'}] }}"
      tags: always

    # ─── Container health ────────────────────────────────────────────────────

    - name: Check for unhealthy Docker containers
      ansible.builtin.shell: |
        set -euo pipefail
        unhealthy=$(docker ps --filter health=unhealthy --format '{{ "{{" }}.Names{{ "}}" }}' | tr '\n' ' ')
        if [ -n "$unhealthy" ]; then
          echo "UNHEALTHY: $unhealthy"
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
      register: container_health_check
      ignore_errors: true
      tags: always

    - name: Record container health result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'No unhealthy Docker containers', 'status': 'PASS' if container_health_check is succeeded else 'FAIL: ' + container_health_check.stdout
          | default('')}] }}"
      tags: always

    # ─── Application health endpoints ────────────────────────────────────────

    - name: Check app liveness probe (process alive)
      ansible.builtin.uri:
        url: "http://localhost:3000/api/health/live"
        method: GET
        status_code: 200
        return_content: true
      register: app_live
      retries: 3
      delay: 5
      ignore_errors: true
      when: _smoke_serves_app | bool
      tags: always

    - name: Record app liveness result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'App liveness probe /api/health/live (200)', 'status': 'PASS' if app_live is succeeded else 'FAIL'}] }}"
      when: _smoke_serves_app | bool
      tags: always

    - name: Check app readiness probe (all dependencies reachable)
      ansible.builtin.uri:
        url: "http://localhost:3000/api/health/ready"
        method: GET
        status_code: 200
        return_content: true
      register: app_ready
      retries: 5
      delay: 5
      ignore_errors: true
      when: _smoke_serves_app | bool
      tags: always

    - name: Record app readiness result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'App readiness probe /api/health/ready (200)', 'status': 'PASS' if app_ready is succeeded else 'FAIL (postgres/storage/relay
          dependency check failed)'}] }}"
      when: _smoke_serves_app | bool
      tags: always

    - name: Check app full health endpoint
      ansible.builtin.uri:
        url: "http://localhost:3000/api/health"
        method: GET
        status_code: 200
        return_content: true
      register: app_health
      retries: 3
      delay: 5
      ignore_errors: true
      when: _smoke_serves_app | bool
      tags: always

    - name: Record app health result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'App health endpoint /api/health (200)', 'status': 'PASS' if app_health is succeeded else 'FAIL'}] }}"
      when: _smoke_serves_app | bool
      tags: always

    # ─── Database ────────────────────────────────────────────────────────────

    - name: Check PostgreSQL is accepting connections
      ansible.builtin.shell: |
        set -euo pipefail
        docker compose -f "{{ app_dir }}/services/postgres/docker-compose.yml" exec -T postgres \
          pg_isready -U {{ backup_postgres_user | default('llamenos') }} -d {{ backup_postgres_db | default('llamenos') }}
      args:
        executable: /bin/bash
      changed_when: false
      register: postgres_check
      ignore_errors: true
      when:
        - llamenos_postgres_enabled | default(true) | bool
        - _smoke_serves_db | bool
      tags: always

    - name: Record PostgreSQL result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'PostgreSQL accepting connections', 'status': 'PASS' if postgres_check is succeeded else 'FAIL' if postgres_check
          is failed else 'SKIP'}] }}"
      when:
        - llamenos_postgres_enabled | default(true) | bool
        - _smoke_serves_db | bool
      tags: always

    # ─── Object storage ──────────────────────────────────────────────────────

    - name: Check RustFS is reachable (S3-compatible object storage)
      ansible.builtin.uri:
        url: "http://localhost:9000/"
        method: GET
        # RustFS returns 403 on unauthenticated root — still proves reachability
        status_code: [200, 403]
        return_content: false
      register: rustfs_check
      retries: 3
      delay: 5
      ignore_errors: true
      when:
        - llamenos_rustfs_enabled | default(true) | bool
        - _smoke_serves_storage | bool
      tags: always

    - name: Record RustFS result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'RustFS object storage reachable (port 9000)', 'status': 'PASS' if rustfs_check is succeeded else 'FAIL' if
          rustfs_check is failed else 'SKIP'}] }}"
      when:
        - llamenos_rustfs_enabled | default(true) | bool
        - _smoke_serves_storage | bool
      tags: always

    # ─── Optional sidecars ───────────────────────────────────────────────────

    - name: Check ntfy health endpoint (if push profile enabled)
      ansible.builtin.uri:
        url: "http://localhost:2586/v1/health"
        method: GET
        status_code: 200
        return_content: true
      register: ntfy_check
      retries: 2
      delay: 3
      ignore_errors: true
      when:
        - llamenos_ntfy_enabled | default(false) | bool
        - _smoke_serves_ntfy | bool
      tags: always

    - name: Record ntfy result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'ntfy health endpoint (200)', 'status': 'PASS' if ntfy_check is succeeded else 'FAIL' if ntfy_check is failed
          else 'SKIP'}] }}"
      when:
        - llamenos_ntfy_enabled | default(false) | bool
        - _smoke_serves_ntfy | bool
      tags: always

    # The app publishes wake-ups through the relay's PUBLIC vhost (on another
    # host in the two-tier layout), and Android devices subscribe through it:
    # probe it over real DNS + TLS from both ends.
    - name: Check the ntfy relay's public vhost
      ansible.builtin.uri:
        url: "https://{{ ntfy_domain }}/v1/health"
        method: GET
        status_code: 200
        return_content: true
        validate_certs: true
      register: ntfy_public_check
      retries: 3
      delay: 5
      ignore_errors: true
      when:
        - llamenos_ntfy_enabled | default(false) | bool
        - (_smoke_serves_app | bool) or (_smoke_serves_ntfy | bool)
      tags: always

    - name: Record ntfy public vhost result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'ntfy public vhost https://' + ntfy_domain + '/v1/health (200)', 'status': 'PASS' if ntfy_public_check is succeeded else 'FAIL'}] }}"
      when:
        - llamenos_ntfy_enabled | default(false) | bool
        - (_smoke_serves_app | bool) or (_smoke_serves_ntfy | bool)
      tags: always

    - name: Check Signal Notifier sidecar health
      ansible.builtin.uri:
        url: "http://localhost:3100/health"
        method: GET
        status_code: 200
        return_content: true
      register: signal_notifier_check
      retries: 2
      delay: 3
      ignore_errors: true
      when: llamenos_signal_enabled | default(false) | bool
      tags: always

    - name: Record Signal Notifier result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'Signal Notifier sidecar health (port 3100)', 'status': 'PASS' if signal_notifier_check is succeeded else 'FAIL'
          if signal_notifier_check is failed else 'SKIP'}] }}"
      when: llamenos_signal_enabled | default(false) | bool
      tags: always

    # Catches the class of bug in issue #1119: preflight could report
    # self-hosted telephony as configured while no call could ever actually
    # route (no sip-bridge service, no config on disk). A probe that only
    # checked Asterisk's own health would have passed throughout — Asterisk
    # came up fine with an empty config directory, it just couldn't route
    # anything. This hits the bridge, which can only be healthy if it
    # connected to Asterisk's ARI over the config that was placed on disk.
    - name: Check SIP bridge health (self-hosted telephony)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sip_bridge_local_port | default(3101) }}/health"
        method: GET
        status_code: 200
        return_content: true
      register: sip_bridge_check
      retries: 3
      delay: 3
      ignore_errors: true
      when:
        - llamenos_asterisk_enabled | default(false) | bool
        - _smoke_serves_asterisk | bool
      tags: always

    - name: Record SIP bridge result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'SIP bridge health (self-hosted telephony, port ' + (sip_bridge_local_port | default(3101) | string) + ')',
          'status': 'PASS' if sip_bridge_check is succeeded else 'FAIL' if sip_bridge_check is failed else 'SKIP'}] }}"
      when:
        - llamenos_asterisk_enabled | default(false) | bool
        - _smoke_serves_asterisk | bool
      tags: always

    - name: Check update server health (official only)
      ansible.builtin.uri:
        url: "https://{{ updates_domain }}/health"
        return_content: true
        validate_certs: true
      register: update_health
      failed_when: update_health.content != "ok"
      ignore_errors: true
      when:
        - llamenos_update_server_enabled | default(false) | bool
        - _smoke_serves_app | bool
      tags: always

    - name: Record update server result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'Update server health', 'status': 'PASS' if update_health is succeeded else 'FAIL' if update_health is failed
          else 'SKIP'}] }}"
      when:
        - llamenos_update_server_enabled | default(false) | bool
        - _smoke_serves_app | bool
      tags: always

    # ─── TLS / Caddy ─────────────────────────────────────────────────────────

    - name: Check Caddy is serving HTTPS on the configured API domain
      ansible.builtin.uri:
        url: "{{ _api_base_url }}/api/health/live"
        method: GET
        status_code: 200
        validate_certs: true
      register: caddy_check
      retries: 3
      delay: 5
      ignore_errors: true
      when:
        - llamenos_caddy_enabled | default(true) | bool
        - _smoke_serves_app | bool
      tags: always

    - name: Record Caddy HTTPS result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'Caddy HTTPS serving ' + _api_base_url, 'status': 'PASS' if caddy_check is succeeded else 'FAIL' if caddy_check
          is failed else 'SKIP'}] }}"
      when:
        - llamenos_caddy_enabled | default(true) | bool
        - _smoke_serves_app | bool
      tags: always

    - name: Check HSTS and security headers are present in Caddy response
      ansible.builtin.uri:
        url: "{{ _api_base_url }}/api/health/live"
        method: GET
        status_code: 200
        return_content: false
      register: caddy_headers
      ignore_errors: true
      when:
        - llamenos_caddy_enabled | default(true) | bool
        - _smoke_serves_app | bool
      tags: always

    - name: Assert HSTS header is present
      ansible.builtin.assert:
        that:
          - caddy_headers.strict_transport_security is defined
          - "'max-age=' in caddy_headers.strict_transport_security"
        fail_msg: |
          MISSING SECURITY HEADER: Strict-Transport-Security (HSTS) not found in Caddy response.

          This header is required to prevent downgrade attacks.
          Check the Caddyfile security_headers snippet is applied to the API site block.
        success_msg: "HSTS header present: {{ caddy_headers.strict_transport_security | default('') }}"
      ignore_errors: true
      register: hsts_check
      when:
        - llamenos_caddy_enabled | default(true) | bool and caddy_headers is succeeded
        - _smoke_serves_app | bool
      tags: always

    - name: Record HSTS header result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'HSTS header present (Caddy security_headers)', 'status': 'PASS' if hsts_check is succeeded else 'FAIL' if hsts_check
          is defined and hsts_check is failed else 'SKIP'}] }}"
      when:
        - llamenos_caddy_enabled | default(true) | bool
        - _smoke_serves_app | bool
      tags: always

    - name: Assert X-Frame-Options header is present
      ansible.builtin.assert:
        that:
          - caddy_headers.x_frame_options is defined
          - caddy_headers.x_frame_options == 'DENY'
        fail_msg: |
          MISSING SECURITY HEADER: X-Frame-Options: DENY not found in Caddy response.

          This header is required to prevent clickjacking attacks.
        success_msg: "X-Frame-Options: {{ caddy_headers.x_frame_options | default('') }}"
      ignore_errors: true
      register: xframe_check
      when:
        - llamenos_caddy_enabled | default(true) | bool and caddy_headers is succeeded
        - _smoke_serves_app | bool
      tags: always

    - name: Record X-Frame-Options result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'X-Frame-Options: DENY header present', 'status': 'PASS' if xframe_check is succeeded else 'FAIL' if xframe_check
          is defined and xframe_check is failed else 'SKIP'}] }}"
      when:
        - llamenos_caddy_enabled | default(true) | bool
        - _smoke_serves_app | bool
      tags: always

    # ─── Disk space ──────────────────────────────────────────────────────────

    - name: Check available disk space on root volume
      ansible.builtin.shell: |
        df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}'
      args:
        executable: /bin/bash
      register: disk_free_gb
      changed_when: false
      tags: always

    - name: Assert at least 2 GiB free disk space post-deploy
      ansible.builtin.assert:
        that:
          - disk_free_gb.stdout | int >= 2
        fail_msg: |
          LOW DISK SPACE: Only {{ disk_free_gb.stdout }} GiB free on /.
          At least 2 GiB is required for log rotation, Docker image pulls, and backups.
        success_msg: "Disk space OK: {{ disk_free_gb.stdout }} GiB free on /"
      ignore_errors: true
      register: disk_check
      tags: always

    - name: Record disk space result
      ansible.builtin.set_fact:
        smoke_results: "{{ smoke_results + [{'check': 'Disk space >= 2 GiB free post-deploy', 'status': 'PASS' if disk_check is succeeded else 'FAIL: only ' + disk_free_gb.stdout
          + ' GiB free'}] }}"
      tags: always

    # ─── Summary ─────────────────────────────────────────────────────────────

    - name: Print pass/fail summary
      ansible.builtin.debug:
        msg: |
          ===========================================
          SMOKE CHECK SUMMARY
          ===========================================
          Host: {{ inventory_hostname }}
          Distribution: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
          API URL: {{ _api_base_url }}
          {% for result in smoke_results %}
          [{{ result.status }}] {{ result.check }}
          {% endfor %}
          ===========================================
          Total: {{ smoke_results | length }} checks
          Passed: {{ smoke_results | selectattr('status', 'equalto', 'PASS') | list | length }}
          Failed: {{ smoke_results | selectattr('status', 'startswith', 'FAIL') | list | length }}
          Skipped: {{ smoke_results | selectattr('status', 'equalto', 'SKIP') | list | length }}
          ===========================================
          Result: {{ 'PASSED' if (smoke_results | selectattr('status', 'startswith', 'FAIL') | list | length) == 0 else 'FAILED' }}
          ===========================================
      tags: always

    - name: Fail if any smoke check failed
      ansible.builtin.fail:
        msg: "Smoke check FAILED: {{ smoke_results | selectattr('status', 'startswith', 'FAIL') | list | length }} check(s) failed."
      when: (smoke_results | selectattr('status', 'startswith', 'FAIL') | list | length) > 0
      tags: always
