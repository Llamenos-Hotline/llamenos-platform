---
# Smoke-check Playbook
#
# Runs after deployment to validate that all hardening assertions hold
# and that application services are healthy. Exits non-zero on the first
# failure so CI/test scripts catch regressions.
#
# EVERY CHECK RECORDS ONE OF THREE STATES: PASS, FAIL or SKIPPED.
#
# SKIPPED is a first-class verdict, not a flavour of PASS. The recording used
# to read `'PASS' if <probe> is succeeded else 'FAIL'`, and Ansible's
# `succeeded` test means `not failed` — a probe that was skipped never ran, so
# it never failed, so it recorded PASS. Twenty-one checks in this file scored
# "healthy" for taking no measurement at all (issue #1617).
#
# Two rules follow, and playbooks/tasks/record-smoke-result.yml enforces both
# in one place so a new check cannot reintroduce the bug:
#
#   1. A probe that did not run records SKIPPED, and the summary counts and
#      lists skipped checks separately from passing ones.
#   2. PASS requires the probe's own MEASUREMENT — the status code, the header
#      value, the exit status, the number — not the task's self-report.
#
# scripts/check-succeeded-as-pass.py fails CI on any `is succeeded` /
# `is not failed` that is not paired with a skip test.
#
# EVERY CHECK ALSO DECLARES A SEVERITY: fatal or advisory (issue #1636).
#
# A FATAL failure stops the deploy. An ADVISORY failure is reported under its
# own DEGRADED heading and the deploy proceeds. Nothing is allowed to sit in
# the third state this suite used to have — reporting FAIL while the deploy
# carries on and nothing says why that was permitted, which is what the
# Kamailio probe did.
#
# THE RULE
#
#   fatal     the check measures something THIS DEPLOY is responsible for
#             putting in place, and whose absence either stops a call being
#             answered / a note being stored, or leaves the host or its
#             traffic exposed.
#   advisory  the check measures an OPTIONAL integration or convenience
#             sidecar: its absence costs a feature but neither breaks the call
#             path nor exposes anything.
#
# THE RULING, per check, in this file:
#
#   FATAL     ufw · fail2ban · docker · docker userns-remap · sshd hardening ·
#             tcp_syncookies · no unhealthy containers · app live/ready/health ·
#             PostgreSQL · RustFS · ntfy (local + public vhost) ·
#             Caddy HTTPS · HSTS · X-Frame-Options · disk space ·
#             SIP bridge health · SIP TLS listener · Kamailio JSONRPC ·
#             app readiness reports the SIP bridge dependency ok
#   ADVISORY  Signal Notifier sidecar · update server ·
#             app readiness reports no failing dependency
#
# Why ntfy is fatal: an Android volunteer learns of a call through the push
# relay, so an unreachable relay means an unanswered hotline. Why Kamailio is
# fatal: it is the SIP edge every registration and call leg traverses, so a
# Kamailio that never answered is the call path being down, not a degradation —
# the same consequence as the SIP bridge probe next to it, which was already
# fatal. Why Signal and the update server are advisory: the phone still rings
# without either.
#
# The DEFAULT is fatal, and so is any unrecognised value — see
# tasks/record-smoke-result.yml. A check that forgets to declare a severity is
# too strict, never silently advisory.
#
# Usage:
#   ansible-playbook playbooks/smoke-check.yml -e '@vars.yml'
#   ansible-playbook playbooks/smoke-check.yml --check --diff

- name: Smoke-check hardening and services on target host
  hosts: llamenos_servers
  gather_facts: true
  become: true
  vars_files:
    - ../vars.yml
  vars:
    # Derive the API base URL from deployment config (matches Caddyfile logic)
    _api_host: "{{ api_subdomain + '.' + domain if (api_subdomain | default('') | length > 0) else domain }}"
    _api_base_url: "https://{{ _api_host }}"
    # Each probe runs only where its service is placed (same rule as the
    # service roles: an empty group means every llamenos_servers host). In the
    # two-tier layout the relay host runs ntfy + Caddy and nothing else, so the
    # app/db/storage probes legitimately record SKIPPED there.
    _smoke_serves_app: "{{ groups.get('llamenos_app', []) | length == 0 or inventory_hostname in groups.get('llamenos_app', []) }}"
    _smoke_serves_db: "{{ groups.get('llamenos_db', []) | length == 0 or inventory_hostname in groups.get('llamenos_db', []) }}"
    _smoke_serves_storage: "{{ groups.get('llamenos_storage', []) | length == 0 or inventory_hostname in groups.get('llamenos_storage', []) }}"
    _smoke_serves_ntfy: "{{ groups.get('llamenos_ntfy', []) | length == 0 or inventory_hostname in groups.get('llamenos_ntfy', []) }}"
    # No _smoke_serves_asterisk: the telephony checks below derive placement
    # from the host's own rendered compose file instead of from the inventory
    # group, because a host that has the service DECLARED must serve it
    # whatever the inventory and the enablement flag say (#1697).
    _smoke_serves_kamailio: "{{ groups.get('llamenos_kamailio', []) | length == 0 or inventory_hostname in groups.get('llamenos_kamailio', []) }}"
    _smoke_serves_coturn: "{{ groups.get('llamenos_coturn', []) | length == 0 or inventory_hostname in groups.get('llamenos_coturn', []) }}"

    # ── SIP TLS probe inputs ────────────────────────────────────────────────
    # Role defaults are not visible to a playbook, so every kamailio_* default
    # below is restated rather than inherited. Keep them in step with
    # roles/kamailio/defaults/main.yml.
    smoke_sip_tls_host: 127.0.0.1
    smoke_sip_tls_port: "{{ kamailio_tls_port | default(5061) }}"
    # The names a volunteer's client may dial. The certificate must cover each
    # one: a client verifies the hostname as well as the chain, so a name that
    # is missing fails the handshake however the chain is anchored.
    smoke_sip_tls_names: "{{ kamailio_tls_sans | default([kamailio_sip_domain | default(domain)]) }}"
    # Where the trust anchor published to clients lands. Two candidates because
    # the role is moving it to its own directory; the first that exists wins,
    # and when the deployment publishes an anchor and NONE exists the probe is
    # pointed at the first anyway, so it fails saying the anchor is missing
    # rather than quietly skipping the verification.
    smoke_sip_tls_anchor_candidates:
      - "{{ kamailio_tls_anchor_dir | default(kamailio_tls_dir | default(app_dir ~ '/services/kamailio/tls')) }}/sip-edge-anchor.pem"
      - "{{ kamailio_tls_dir | default(app_dir ~ '/services/kamailio/tls') }}/sip-edge-anchor.pem"

  tasks:
    - name: Initialize smoke-check results
      ansible.builtin.set_fact:
        smoke_results: []
      tags: always

    # ─── System hardening ────────────────────────────────────────────────────

    - name: Assert ufw is active with deny-incoming default
      ansible.builtin.shell: |
        set -euo pipefail
        ufw status verbose | grep -q "Status: active"
        ufw status verbose | grep -q "Default: deny (incoming)"
      args:
        executable: /bin/bash
      changed_when: false
      register: ufw_check
      ignore_errors: true
      tags: always

    - name: Record ufw result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: UFW active with deny-incoming
        smoke_check_probe: "{{ ufw_check | default({}) }}"
        # `rc`, not `is succeeded`: the exit status is the thing both greps
        # above actually produced. A skipped result carries no `rc` key at all,
        # so the default is 1 — an absent measurement can never read as 0.
        smoke_check_pass: "{{ ufw_check.rc | default(1) | int == 0 }}"
        smoke_check_detail: ufw is not active, or its default incoming policy is not deny
      tags: always

    - name: Assert fail2ban is active
      ansible.builtin.command: systemctl is-active fail2ban
      changed_when: false
      register: fail2ban_check
      ignore_errors: true
      tags: always

    - name: Record fail2ban result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: fail2ban running
        smoke_check_probe: "{{ fail2ban_check | default({}) }}"
        # The word systemctl printed, which is what the check is for. `rc == 0`
        # would be equivalent today but `is-active` has had exit codes that
        # distinguish "inactive" from "unknown unit"; the state string is the
        # measurement.
        smoke_check_pass: "{{ (fail2ban_check.stdout | default('') | trim) == 'active' }}"
        smoke_check_detail: "systemctl is-active fail2ban reported: {{ fail2ban_check.stdout | default('(nothing)') | trim }}"
      tags: always

    - name: Assert docker is active
      ansible.builtin.command: systemctl is-active docker
      changed_when: false
      register: docker_check
      ignore_errors: true
      tags: always

    - name: Record docker result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: Docker running
        smoke_check_probe: "{{ docker_check | default({}) }}"
        smoke_check_pass: "{{ (docker_check.stdout | default('') | trim) == 'active' }}"
        smoke_check_detail: "systemctl is-active docker reported: {{ docker_check.stdout | default('(nothing)') | trim }}"
      tags: always

    - name: Assert docker userns-remap is enabled
      ansible.builtin.shell: |
        set -euo pipefail
        docker info --format '{{ "{{" }}.SecurityOptions{{ "}}" }}' | grep -q userns
      args:
        executable: /bin/bash
      changed_when: false
      register: userns_check
      ignore_errors: true
      tags: always

    - name: Record userns-remap result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: Docker userns-remap enabled
        smoke_check_probe: "{{ userns_check | default({}) }}"
        smoke_check_pass: "{{ userns_check.rc | default(1) | int == 0 }}"
        smoke_check_detail: "docker info SecurityOptions does not list userns — containers run as real root on the host"
      tags: always

    - name: Assert sshd disables password + root login
      ansible.builtin.shell: |
        set -euo pipefail
        count=$(sshd -T 2>/dev/null | grep -cE '^(passwordauthentication|permitrootlogin) no$')
        test "$count" -eq 2
      args:
        executable: /bin/bash
      changed_when: false
      register: ssh_check
      ignore_errors: true
      tags: always

    - name: Record SSH hardening result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: SSH password auth disabled + root login disabled
        smoke_check_probe: "{{ ssh_check | default({}) }}"
        smoke_check_pass: "{{ ssh_check.rc | default(1) | int == 0 }}"
        smoke_check_detail: "sshd -T does not report both `passwordauthentication no` and `permitrootlogin no`"
      tags: always

    - name: Assert tcp_syncookies is enabled
      ansible.builtin.command: sysctl -n net.ipv4.tcp_syncookies
      register: syncookies
      changed_when: false
      failed_when: syncookies.stdout | trim != "1"
      ignore_errors: true
      tags: always

    - name: Record syncookies result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: TCP syncookies enabled
        smoke_check_probe: "{{ syncookies | default({}) }}"
        # The sysctl VALUE, asserted here as well as in the task's
        # `failed_when`. Recording the value rather than the task's verdict is
        # what makes the two independent: a `failed_when` that stops matching
        # the probe (a renamed key, an added `| default`) can no longer quietly
        # turn the check green.
        smoke_check_pass: "{{ (syncookies.stdout | default('') | trim) == '1' }}"
        smoke_check_detail: "net.ipv4.tcp_syncookies = {{ syncookies.stdout | default('(unread)') | trim }}, expected 1"
      tags: always

    # ─── Container health ────────────────────────────────────────────────────

    - name: Check for unhealthy Docker containers
      ansible.builtin.shell: |
        set -euo pipefail
        unhealthy=$(docker ps --filter health=unhealthy --format '{{ "{{" }}.Names{{ "}}" }}' | tr '\n' ' ')
        if [ -n "$unhealthy" ]; then
          echo "UNHEALTHY: $unhealthy"
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
      register: container_health_check
      ignore_errors: true
      tags: always

    - name: Record container health result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: No unhealthy Docker containers
        smoke_check_probe: "{{ container_health_check | default({}) }}"
        # Both halves: a clean exit AND no container named. `docker ps` failing
        # outright (no daemon) is rc != 0 with an empty stdout, which must not
        # read as "nothing unhealthy".
        smoke_check_pass: >-
          {{ container_health_check.rc | default(1) | int == 0
             and 'UNHEALTHY' not in (container_health_check.stdout | default('UNHEALTHY')) }}
        smoke_check_detail: "{{ container_health_check.stdout | default('could not list containers') | trim }}"
      tags: always

    # ─── Application health endpoints ────────────────────────────────────────

    - name: Check app liveness probe (process alive)
      ansible.builtin.uri:
        url: "http://localhost:3000/api/health/live"
        method: GET
        status_code: 200
        return_content: true
      register: app_live
      retries: 3
      delay: 5
      ignore_errors: true
      when: _smoke_serves_app | bool
      tags: always

    # No `when:` on any recording task. The recorder is what turns "this probe
    # did not run here" into a visible SKIPPED line; gating it on the same
    # condition as its probe deletes the check from the summary instead, and a
    # Total that silently shrinks from 21 to 15 is the same lie told quietly.
    - name: Record app liveness result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: App liveness probe /api/health/live (200)
        smoke_check_probe: "{{ app_live | default({}) }}"
        smoke_check_pass: "{{ app_live.status | default(0) | int == 200 }}"
        smoke_check_detail: "/api/health/live returned {{ app_live.status | default('no response') }}"
      tags: always

    - name: Check app readiness probe (all dependencies reachable)
      ansible.builtin.uri:
        url: "http://localhost:3000/api/health/ready"
        method: GET
        status_code: 200
        return_content: true
      register: app_ready
      retries: 5
      delay: 5
      ignore_errors: true
      when: _smoke_serves_app | bool
      tags: always

    - name: Record app readiness result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: App readiness probe /api/health/ready (200)
        smoke_check_probe: "{{ app_ready | default({}) }}"
        smoke_check_pass: "{{ app_ready.status | default(0) | int == 200 }}"
        smoke_check_detail: >-
          /api/health/ready returned {{ app_ready.status | default('no response') }}
          (postgres/storage/relay dependency check failed)
      tags: always

    # The readiness STATUS CODE is not the whole report. /api/health/ready
    # deliberately does not 503 on an optional integration (#1418), so a
    # configured-but-dead sidecar leaves a 200 behind and the two checks above
    # see nothing. These read the body.
    #
    # They also close the loop on the defect that motivated them: SIP_BRIDGE_URL
    # went unrendered on a deployed host, the app's sipBridge check returned
    # null, and the check was OMITTED from the response entirely — three checks
    # plus `ok` where there should have been four plus `sipBridge: failing`. The
    # app no longer omits a probe (apps/worker/routes/health.ts), and this is
    # the deploy-side half: the app reports, and the DEPLOYMENT decides whether
    # a given dependency matters here, because only the deployment knows it
    # deployed self-hosted telephony.
    #
    # THE `when:` GOES ON THE PROBE, NEVER ON THE RECORDING. That is the house
    # rule in this file and it is the whole reason the recordings below are
    # unconditional: a `when:` on a recording makes the check VANISH from the
    # summary — 24 checks instead of 25 — and a check that can delete itself is
    # the same defect as a probe that can delete itself. A gated probe, read by
    # an ungated recording, records SKIPPED and stays visible. (Measured: the
    # first version of this block had the condition on the recordings, and a
    # live run against a deployment with no self-hosted telephony printed one
    # check fewer with nothing saying which.)
    - name: Read the app's readiness report for the SIP bridge dependency
      ansible.builtin.set_fact:
        _ready_sipbridge_status: "{{ app_ready.json.checks.sipBridge.status | default('absent') }}"
        _ready_sipbridge_detail: "{{ app_ready.json.checks.sipBridge.detail | default('no detail') }}"
      register: ready_sipbridge_probe
      when:
        - llamenos_asterisk_enabled | default(false) | bool
        - _smoke_serves_app | bool
      tags: always

    - name: Record app readiness SIP bridge dependency result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: App readiness reports the SIP bridge dependency ok
        smoke_check_probe: "{{ ready_sipbridge_probe | default({}) }}"
        # `== 'ok'` on the value, so BOTH a `failing` status and an ABSENT
        # sipBridge key fail: an omitted check reads as 'absent', not 'ok'.
        smoke_check_pass: "{{ (_ready_sipbridge_status | default('absent')) == 'ok' }}"
        smoke_check_detail: >-
          {{ '/api/health/ready did not answer, so nothing reports on the SIP bridge dependency'
             if (app_ready.status | default(0) | int) != 200
             else '/api/health/ready reports sipBridge as "' ~ (_ready_sipbridge_status | default('absent'))
                  ~ '" (' ~ (_ready_sipbridge_detail | default('no detail'))
                  ~ ') while this deployment runs self-hosted telephony — no call can route to a volunteer.
                     An "absent" status means the app omitted the check, which SIP_BRIDGE_URL being unrendered used to cause.' }}
      tags: always

    - name: Read the app's readiness report for every other dependency
      ansible.builtin.set_fact:
        _ready_failing: >-
          {{ (app_ready.json.checks | default({})) | dict2items
             | selectattr('value.status', 'defined')
             | selectattr('value.status', 'equalto', 'failing')
             | map(attribute='key') | list }}
      register: ready_deps_probe
      when: _smoke_serves_app | bool
      tags: always

    - name: Record app readiness dependency report result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: advisory
        smoke_check_name: App readiness reports no failing dependency
        smoke_check_probe: "{{ ready_deps_probe | default({}) }}"
        # The 200 is part of the measurement: a readiness probe that never
        # answered cannot support the claim that no dependency is failing. Its
        # `checks` would be empty, and an empty list of failures is not the
        # same statement as "nothing is failing".
        smoke_check_pass: >-
          {{ (app_ready.status | default(0) | int) == 200
             and ((_ready_failing | default([])) | length) == 0 }}
        # Advisory, because which of these is load-bearing depends on the
        # deployment: an unconfigured Signal sidecar reports failing on a
        # hotline that is perfectly able to answer the phone. The dependencies
        # that ARE load-bearing have their own fatal checks — the readiness
        # status code itself for postgres/storage/relay, and the two SIP checks
        # for telephony.
        smoke_check_detail: >-
          {{ '/api/health/ready returned ' ~ (app_ready.status | default('no response'))
             ~ ', so its dependency report could not be read'
             if (app_ready.status | default(0) | int) != 200
             else '/api/health/ready returned 200 but reports '
                  ~ ((_ready_failing | default([])) | length) ~ ' failing dependency/dependencies: '
                  ~ ((_ready_failing | default([])) | join(', '))
                  ~ '. Each names a capability that is unavailable on this host.' }}
      tags: always

    - name: Check app full health endpoint
      ansible.builtin.uri:
        url: "http://localhost:3000/api/health"
        method: GET
        status_code: 200
        return_content: true
      register: app_health
      retries: 3
      delay: 5
      ignore_errors: true
      when: _smoke_serves_app | bool
      tags: always

    - name: Record app health result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: App health endpoint /api/health (200)
        smoke_check_probe: "{{ app_health | default({}) }}"
        smoke_check_pass: "{{ app_health.status | default(0) | int == 200 }}"
        smoke_check_detail: "/api/health returned {{ app_health.status | default('no response') }}"
      tags: always

    # ─── Database ────────────────────────────────────────────────────────────

    - name: Check PostgreSQL is accepting connections
      ansible.builtin.shell: |
        set -euo pipefail
        docker compose -f "{{ app_dir }}/services/postgres/docker-compose.yml" exec -T postgres \
          pg_isready -U {{ backup_postgres_user | default('llamenos') }} -d {{ backup_postgres_db | default('llamenos') }}
      args:
        executable: /bin/bash
      changed_when: false
      register: postgres_check
      ignore_errors: true
      when:
        - llamenos_postgres_enabled | default(true) | bool
        - _smoke_serves_db | bool
      tags: always

    - name: Record PostgreSQL result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: PostgreSQL accepting connections
        smoke_check_probe: "{{ postgres_check | default({}) }}"
        # pg_isready's own words, not just its exit status: `docker compose
        # exec` can exit 0 having run nothing useful, and "accepting
        # connections" is the sentence that means the database answered.
        smoke_check_pass: >-
          {{ postgres_check.rc | default(1) | int == 0
             and 'accepting connections' in (postgres_check.stdout | default('')) }}
        smoke_check_detail: "pg_isready: {{ postgres_check.stdout | default('no output') | trim }}"
      tags: always

    # ─── Object storage ──────────────────────────────────────────────────────

    # Probed from INSIDE the container, as the PostgreSQL check above is, and
    # for the same reason: roles/llamenos-rustfs/templates/compose/rustfs.j2
    # publishes no ports (the app reaches it over the llamenos-internal Docker
    # network), so the host has nothing listening on 9000 and the old
    # `http://localhost:9000/` probe could never pass. `ignore_errors` hid that
    # until the summary gate started evaluating (issue #1602, finding 5).
    # curl exits 22 on the 403 RustFS returns for an unauthenticated root
    # request — which still proves the service answered, so it counts as
    # reachable, exactly as the container's own healthcheck treats it.
    - name: Check RustFS is reachable (S3-compatible object storage)
      ansible.builtin.shell: |
        set -euo pipefail
        docker compose -f "{{ app_dir }}/services/rustfs/docker-compose.yml" exec -T rustfs \
          curl -sf -o /dev/null http://localhost:9000/ || test $? -eq 22
      args:
        executable: /bin/bash
      changed_when: false
      register: rustfs_check
      ignore_errors: true
      when:
        - llamenos_rustfs_enabled | default(true) | bool
        - _smoke_serves_storage | bool
      tags: always

    - name: Record RustFS result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: RustFS object storage reachable (in-container, port 9000)
        smoke_check_probe: "{{ rustfs_check | default({}) }}"
        # The in-container curl's own exit status is the measurement. #1615
        # replaced the host-side `uri` probe (which could never pass — the
        # compose template publishes no ports) with `docker compose exec`, so
        # there is no `status` key to read here; `rc` is what the shell probe
        # measures, and `|| test $? -eq 22` inside it already folds RustFS's
        # unauthenticated-root 403 into rc 0.
        smoke_check_pass: "{{ rustfs_check.rc | default(1) | int == 0 }}"
        smoke_check_detail: >-
          in-container curl to port 9000 exited
          {{ rustfs_check.rc | default('no result — probe did not run') }}
      tags: always

    # ─── Optional sidecars ───────────────────────────────────────────────────

    - name: Check ntfy health endpoint (if push profile enabled)
      ansible.builtin.uri:
        url: "http://localhost:2586/v1/health"
        method: GET
        status_code: 200
        return_content: true
      register: ntfy_check
      retries: 2
      delay: 3
      ignore_errors: true
      when:
        - llamenos_ntfy_enabled | default(false) | bool
        - _smoke_serves_ntfy | bool
      tags: always

    - name: Record ntfy result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: ntfy health endpoint (200)
        smoke_check_probe: "{{ ntfy_check | default({}) }}"
        smoke_check_pass: "{{ ntfy_check.status | default(0) | int == 200 }}"
        smoke_check_detail: "localhost:2586/v1/health returned {{ ntfy_check.status | default('no response') }}"
      tags: always

    # The app publishes wake-ups through the relay's PUBLIC vhost (on another
    # host in the two-tier layout), and Android devices subscribe through it:
    # probe it over real DNS + TLS from both ends.
    - name: Check the ntfy relay's public vhost
      ansible.builtin.uri:
        url: "https://{{ ntfy_domain }}/v1/health"
        method: GET
        status_code: 200
        return_content: true
        validate_certs: true
      register: ntfy_public_check
      retries: 3
      delay: 5
      ignore_errors: true
      when:
        - llamenos_ntfy_enabled | default(false) | bool
        - (_smoke_serves_app | bool) or (_smoke_serves_ntfy | bool)
      tags: always

    - name: Record ntfy public vhost result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: "ntfy public vhost https://{{ ntfy_domain | default('(ntfy_domain unset)') }}/v1/health (200)"
        smoke_check_probe: "{{ ntfy_public_check | default({}) }}"
        smoke_check_pass: "{{ ntfy_public_check.status | default(0) | int == 200 }}"
        smoke_check_detail: >-
          the public vhost returned {{ ntfy_public_check.status | default('no response') }} —
          Android devices can only be rung for a call through this name
      tags: always

    - name: Check Signal Notifier sidecar health
      ansible.builtin.uri:
        url: "http://localhost:3100/health"
        method: GET
        status_code: 200
        return_content: true
      register: signal_notifier_check
      retries: 2
      delay: 3
      ignore_errors: true
      when: llamenos_signal_enabled | default(false) | bool
      tags: always

    - name: Record Signal Notifier result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: advisory
        smoke_check_name: Signal Notifier sidecar health (port 3100)
        smoke_check_probe: "{{ signal_notifier_check | default({}) }}"
        smoke_check_pass: "{{ signal_notifier_check.status | default(0) | int == 200 }}"
        smoke_check_detail: "localhost:3100/health returned {{ signal_notifier_check.status | default('no response') }}"
      tags: always

    # ─── Self-hosted telephony ───────────────────────────────────────────────
    #
    # WHAT IS DECLARED ON DISK IS WHAT MUST BE SERVING (issue #1697).
    #
    # The SIP bridge probe below used to be conditioned on
    # `llamenos_asterisk_enabled`. On the measured host that flag was FALSE
    # while roles/llamenos-asterisk had been applied anyway: the compose file
    # was on disk declaring a `sip-bridge` service, Asterisk was up and
    # healthy, and the bridge had no container at all because its image could
    # not be pulled. The one check that would have noticed took no measurement,
    # so the deploy reported success with a dead call path — the same defect as
    # a probe that omits itself (#1636), arriving via a variable instead.
    #
    # So these checks read the HOST'S OWN FILESYSTEM AND DOCKER STATE, never
    # the flag. A variable can no longer gate away the measurement, and the
    # flag disagreeing with reality is itself one of the failures.
    - name: Stat the rendered asterisk compose file
      ansible.builtin.stat:
        path: "{{ app_dir }}/services/asterisk/docker-compose.yml"
      register: asterisk_compose_stat
      tags: always

    # Neither direction is acceptable. Flag off + artifacts present is the
    # measured case: an unmanaged service nothing deploys and nothing checks.
    # Flag on + artifacts absent means the role never ran where it was meant to.
    - name: Record asterisk flag-versus-reality result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_name: asterisk enablement agrees with what is on disk
        smoke_check_severity: fatal
        smoke_check_probe: "{{ asterisk_compose_stat | default({}) }}"
        smoke_check_pass: >-
          {{ (asterisk_compose_stat.stat.exists | default(false) | bool)
             == (llamenos_asterisk_enabled | default(false) | bool) }}
        smoke_check_detail: >-
          llamenos_asterisk_enabled is {{ llamenos_asterisk_enabled | default(false) }}
          but {{ app_dir }}/services/asterisk/docker-compose.yml
          {{ 'EXISTS — a telephony stack is deployed that this deploy does not manage and no probe gated on the flag would ever check'
             if (asterisk_compose_stat.stat.exists | default(false) | bool)
             else 'is ABSENT — asterisk is enabled for this host but the role left nothing on disk, so no call can route' }}
      tags: always

    # The check #1697 is about. Every service the rendered compose DECLARES
    # must have a container. An image that cannot be obtained leaves the
    # service declared and absent, and `docker compose up` failing for one
    # service neither undoes the others nor stops the play. Reports the service
    # AND its image ref, because "sip-bridge has no container" sends a reader
    # to the logs whereas "sip-bridge has no container, image <ref>" names the
    # cause outright.
    #
    # The comparison is computed here, by the probe, rather than assembled in
    # Jinja from two registered results — so `smoke_check_pass` reads one
    # measured string and cannot be satisfied by a half-read compose project.
    - name: Check every service the asterisk compose declares has a container
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ app_dir }}/services/asterisk"
        cmd: |
          set -euo pipefail
          DECLARED="$(docker compose config --format json)" \
          RUNNING="$(docker compose ps --all --services)" \
          python3 -c '
          import json, os
          services = json.loads(os.environ["DECLARED"]).get("services", {})
          running = set(os.environ["RUNNING"].split())
          print(", ".join(
              "%s (image %s)" % (name, cfg.get("image") or "no image: built from source")
              for name, cfg in sorted(services.items())
              if name not in running
          ))
          '
      register: asterisk_absent_check
      changed_when: false
      failed_when: false
      when: asterisk_compose_stat.stat.exists | default(false) | bool
      tags: always

    - name: Record declared-but-absent asterisk services result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_name: every service the asterisk compose declares has a container
        smoke_check_severity: fatal
        smoke_check_probe: "{{ asterisk_absent_check | default({}) }}"
        # Both halves are required: the probe has to have RUN (rc 0, so the
        # comparison actually happened) and the list it produced has to be
        # empty. An unreadable compose project is an unmeasured one, not a
        # healthy one.
        smoke_check_pass: >-
          {{ (asterisk_absent_check.rc | default(1)) == 0
             and (asterisk_absent_check.stdout | default('') | trim | length) == 0 }}
        smoke_check_detail: >-
          {{ ('the probe could not read the compose project: '
               ~ (asterisk_absent_check.stderr | default('(no stderr)') | trim))
             if (asterisk_absent_check.rc | default(1)) != 0
             else ('declared with no container: '
                   ~ (asterisk_absent_check.stdout | default('') | trim)
                   ~ ' — nothing built or pulled it, so no call can route') }}
      tags: always

    # Now gated on the compose file EXISTING, not on llamenos_asterisk_enabled.
    # Catches the class of bug in issue #1119: preflight could report
    # self-hosted telephony as configured while no call could ever actually
    # route (no sip-bridge service, no config on disk). A probe that only
    # checked Asterisk's own health would have passed throughout — Asterisk
    # came up fine with an empty config directory, it just couldn't route
    # anything. This hits the bridge, which can only be healthy if it
    # connected to Asterisk's ARI over the config that was placed on disk.
    - name: Check SIP bridge health (self-hosted telephony)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sip_bridge_local_port | default(3101) }}/health"
        method: GET
        status_code: 200
        return_content: true
      register: sip_bridge_check
      retries: 3
      delay: 3
      ignore_errors: true
      when: asterisk_compose_stat.stat.exists | default(false) | bool
      tags: always

    - name: Record SIP bridge result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: "SIP bridge health (self-hosted telephony, port {{ sip_bridge_local_port | default(3101) }})"
        smoke_check_probe: "{{ sip_bridge_check | default({}) }}"
        # 200 ALONE IS NOT ENOUGH. The bridge answers 200 while reporting
        # `"status":"degraded","connected":false` — a Bun process that is up
        # and has no ARI session to the PBX. Measured on a deployed target:
        # the bridge container was healthy by its own healthcheck (which also
        # only checks for a 200) while Asterisk was in a restart loop, so
        # every call would still have gone unanswered. The probe exists to
        # tell us a call can route, so it reads the field that says so.
        smoke_check_pass: >-
          {{ (sip_bridge_check.status | default(0) | int == 200)
             and (sip_bridge_check.json.connected | default(false) | bool) }}
        smoke_check_detail: >-
          the bridge returned {{ sip_bridge_check.status | default('no response') }}
          {{ ('and reports connected=' ~ (sip_bridge_check.json.connected | default('(absent)') | string)
              ~ ', status=' ~ (sip_bridge_check.json.status | default('(absent)') | string)
              ~ ' — it is running but has no session to the PBX')
             if (sip_bridge_check.status | default(0) | int == 200)
             else '' }} — no call can route
      tags: always

    # ─── SIP edge: TLS listener and proxy ────────────────────────────────────
    #
    # deploy/docker/sip-tls-cert.sh degrades gracefully when certificate
    # generation fails: the container still comes up and still serves SIP over
    # UDP and TCP, because stopping it would remove the transports that do
    # work. That is deliberate and stays. What did not exist was any REPORT of
    # the degradation — the deploy came up TLS-less and the smoke check said
    # nothing, while every client that registers over TLS verifies the
    # certificate and has no "accept anything" mode, so it fails closed and no
    # volunteer is reachable (issue #1636).
    #
    # The probe completes a REAL TLS handshake. A config read proves nothing
    # (Kamailio reads TLS material once, at module init, and carries on without
    # the listener if it cannot load it) and a plain TCP connect proves less
    # than nothing — a port forward to a dead container accepts, and so does a
    # TCP listener with no TLS behind it.

    - name: Locate the SIP edge trust anchor published to clients
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ smoke_sip_tls_anchor_candidates }}"
      register: sip_tls_anchor_stat
      changed_when: false
      when:
        - kamailio_enabled | default(false) | bool
        - kamailio_tls_enabled | default(true) | bool
        - kamailio_tls_publish_anchor | default(true) | bool
        - _smoke_serves_kamailio | bool
      tags: always

    - name: Probe the SIP TLS listener with a real TLS handshake
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../../docker/sip-tls-probe.sh
          --host {{ smoke_sip_tls_host | quote }}
          --port {{ smoke_sip_tls_port | quote }}
          {% for name in smoke_sip_tls_names %}--expect-name {{ name | quote }} {% endfor %}
          {{ ('--ca-file ' ~ (_sip_tls_anchor | quote)) if (_sip_tls_anchor | length > 0) else '' }}
      vars:
        # The anchor the probe must verify against: the first candidate that
        # exists, else — when the deployment says it publishes one — the first
        # candidate regardless, so a missing anchor is measured as a failure
        # instead of silently dropping the verification step.
        _sip_tls_anchor_found: >-
          {{ (sip_tls_anchor_stat.results | default([]))
             | selectattr('stat', 'defined')
             | selectattr('stat.exists', 'equalto', true)
             | map(attribute='stat.path') | list }}
        _sip_tls_anchor: >-
          {{ (_sip_tls_anchor_found | first)
             if (_sip_tls_anchor_found | length) > 0
             else (smoke_sip_tls_anchor_candidates | first
                   if (kamailio_tls_publish_anchor | default(true) | bool) else '') }}
      register: sip_tls_probe
      changed_when: false
      ignore_errors: true
      when:
        - kamailio_enabled | default(false) | bool
        - kamailio_tls_enabled | default(true) | bool
        - _smoke_serves_kamailio | bool
      tags: always

    - name: Record SIP TLS listener result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: "SIP TLS listener bound and serving TLS (port {{ smoke_sip_tls_port }})"
        smoke_check_probe: "{{ sip_tls_probe | default({}) }}"
        # The script's exit status IS the measurement: it exits 0 only after a
        # completed handshake that produced a parseable, unexpired,
        # name-matching certificate — and non-zero when it could not measure at
        # all, so "no openssl on the host" cannot read as healthy.
        smoke_check_pass: "{{ sip_tls_probe.rc | default(1) | int == 0 }}"
        smoke_check_detail: >-
          {{ (sip_tls_probe.stdout_lines | default([]) | select('match', '^DETAIL: ') | list
              | first | default('the SIP TLS probe produced no DETAIL line — see the task output'))
             | regex_replace('^DETAIL: ', '') }}
      tags: always

    # Kamailio is the SIP edge: every registration and every call leg traverses
    # it. This probe existed in roles/kamailio but only ever printed HEALTHY /
    # NOT READY, so the verdict changed nothing — the open question in #1636.
    #
    # The ruling is FATAL, and the gate lives HERE rather than in the role. A
    # role that aborts stops the rest of the deploy mid-way, which is the real
    # form of the "it could block a deploy that fixes something else" worry.
    # The smoke check runs after everything has been applied, so a fatal
    # verdict here cannot prevent a fix landing; what it prevents is the deploy
    # reporting success over a hotline whose SIP proxy never answered.
    # IN-CONTAINER, for the same reason #1615 moved the RustFS probe inside the
    # container: a host-side probe of a port the compose file does not publish
    # can never pass, so it would have been a fatal check that is red on every
    # healthy deployment.
    #
    # And that is not hypothetical here. roles/kamailio still carries a
    # host-side `uri` probe of http://localhost:{{ kamailio_jsonrpc_port
    # }}/jsonrpc, and it CANNOT succeed on any deployment: the compose template
    # publishes 5060/udp, 5060/tcp and 5061/tcp and nothing else, kamailio.cfg
    # has no `listen` for the JSONRPC port, xhttp.so is not loaded, and
    # `modparam("jsonrpcs", "transport", 1)` enables the FIFO transport ONLY —
    # the HTTP transport is bit 4 and is off. Its verdict gated nothing, so a
    # probe that could never be green was never noticed; this is the other half
    # of why #1636's "Kamailio's verdict gates nothing" had to be settled
    # before a gate could be put on it.
    #
    # `kamcmd` speaks binrpc over the ctl.so unix socket, which kamailio.cfg
    # DOES load, and it is what the container's own healthcheck runs.
    - name: Check the Kamailio SIP proxy answers its management interface
      ansible.builtin.shell: |
        set -euo pipefail
        docker compose -f "{{ app_dir }}/services/kamailio/docker-compose.yml" exec -T kamailio \
          kamcmd core.version
      args:
        executable: /bin/bash
      register: kamailio_rpc_check
      changed_when: false
      ignore_errors: true
      when:
        - kamailio_enabled | default(false) | bool
        - _smoke_serves_kamailio | bool
      tags: always

    - name: Record Kamailio SIP proxy result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: Kamailio SIP proxy answering on its management socket
        smoke_check_probe: "{{ kamailio_rpc_check | default({}) }}"
        # The exit status AND the answer: `docker compose exec` returns 0 for a
        # command that ran, so a kamcmd that printed nothing useful must not
        # pass. A live Kamailio answers `core.version` with its version banner.
        smoke_check_pass: >-
          {{ kamailio_rpc_check.rc | default(1) | int == 0
             and 'kamailio' in (kamailio_rpc_check.stdout | default('') | lower) }}
        smoke_check_detail: >-
          `kamcmd core.version` in the kamailio container returned
          rc={{ kamailio_rpc_check.rc | default('(did not run)') }}
          "{{ (kamailio_rpc_check.stdout | default('') | trim) | truncate(60) }}" —
          the SIP proxy every registration and call leg traverses is not answering,
          so no call can route
      tags: always

    - name: Check update server health (official only)
      ansible.builtin.uri:
        url: "https://{{ updates_domain }}/health"
        return_content: true
        validate_certs: true
      register: update_health
      failed_when: update_health.content != "ok"
      ignore_errors: true
      when:
        - llamenos_update_server_enabled | default(false) | bool
        - _smoke_serves_app | bool
      tags: always

    - name: Record update server result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: advisory
        smoke_check_name: Update server health
        smoke_check_probe: "{{ update_health | default({}) }}"
        # Both the code and the body. `uri` defaults to accepting any 2xx, so a
        # 204 with no body would be `succeeded` while serving nothing.
        smoke_check_pass: >-
          {{ update_health.status | default(0) | int == 200
             and (update_health.content | default('')) == 'ok' }}
        smoke_check_detail: >-
          the update server returned {{ update_health.status | default('no response') }}
          with body {{ (update_health.content | default('')) | truncate(40) | trim }}, expected 200 / "ok"
      tags: always

    # ─── TLS / Caddy ─────────────────────────────────────────────────────────

    - name: Check Caddy is serving HTTPS on the configured API domain
      ansible.builtin.uri:
        url: "{{ _api_base_url }}/api/health/live"
        method: GET
        status_code: 200
        validate_certs: true
      register: caddy_check
      retries: 3
      delay: 5
      ignore_errors: true
      when:
        - llamenos_caddy_enabled | default(true) | bool
        - _smoke_serves_app | bool
      tags: always

    - name: Record Caddy HTTPS result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: "Caddy HTTPS serving {{ _api_base_url }}"
        smoke_check_probe: "{{ caddy_check | default({}) }}"
        smoke_check_pass: "{{ caddy_check.status | default(0) | int == 200 }}"
        smoke_check_detail: "{{ _api_base_url }}/api/health/live returned {{ caddy_check.status | default('no response — no TLS, no DNS, or no certificate') }}"
      tags: always

    # One probe, two header verdicts, read straight off the response.
    #
    # There used to be two `assert` tasks between this probe and the recording,
    # each with `when: ... and caddy_headers is succeeded`, each registering a
    # result the recording then tested with `is succeeded`. That is issue
    # #1617's confirmed instance: when the header probe did not succeed the
    # asserts SKIPPED, a skipped assert is `succeeded`, and the suite recorded
    # "HSTS header present" at exactly the moment nothing had looked for HSTS.
    #
    # The asserts are gone rather than corrected. They measured nothing the
    # response does not already carry, and an intermediate task whose skip can
    # be mistaken for a pass is the defect, not the expression that read it.
    # Their operator guidance moved into the detail strings below.
    - name: Check HSTS and security headers are present in Caddy response
      ansible.builtin.uri:
        url: "{{ _api_base_url }}/api/health/live"
        method: GET
        status_code: 200
        return_content: false
      register: caddy_headers
      ignore_errors: true
      when:
        - llamenos_caddy_enabled | default(true) | bool
        - _smoke_serves_app | bool
      tags: always

    - name: Record HSTS header result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: HSTS header present (Caddy security_headers)
        smoke_check_probe: "{{ caddy_headers | default({}) }}"
        smoke_check_pass: "{{ 'max-age=' in (caddy_headers.strict_transport_security | default('')) }}"
        smoke_check_detail: >-
          MISSING SECURITY HEADER: Strict-Transport-Security with a max-age was not in the
          Caddy response. It is required to prevent downgrade attacks — check the Caddyfile
          security_headers snippet is applied to the API site block.
      tags: always

    - name: Record X-Frame-Options result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: "X-Frame-Options: DENY header present"
        smoke_check_probe: "{{ caddy_headers | default({}) }}"
        smoke_check_pass: "{{ (caddy_headers.x_frame_options | default('')) == 'DENY' }}"
        smoke_check_detail: >-
          MISSING SECURITY HEADER: X-Frame-Options was
          "{{ caddy_headers.x_frame_options | default('absent') }}", expected DENY.
          It is required to prevent clickjacking attacks.
      tags: always

    # ─── Disk space ──────────────────────────────────────────────────────────

    - name: Check available disk space on root volume
      ansible.builtin.shell: |
        df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}'
      args:
        executable: /bin/bash
      register: disk_free_gb
      changed_when: false
      # ignore_errors so a df that cannot read / still reaches the summary as a
      # FAIL line rather than aborting the play before any verdict is printed.
      ignore_errors: true
      tags: always

    - name: Record disk space result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_severity: fatal
        smoke_check_name: Disk space >= 2 GiB free post-deploy
        smoke_check_probe: "{{ disk_free_gb | default({}) }}"
        # The parsed number is the measurement. `| int` on unparseable output
        # yields 0, which fails — an unreadable df must not pass.
        smoke_check_pass: >-
          {{ disk_free_gb.rc | default(1) | int == 0
             and (disk_free_gb.stdout | default('') | trim | int) >= 2 }}
        smoke_check_detail: >-
          LOW DISK SPACE: {{ disk_free_gb.stdout | default('(unreadable)') | trim }} GiB free on /.
          At least 2 GiB is required for log rotation, Docker image pulls, and backups.
      tags: always

    # ─── TURN relay ──────────────────────────────────────────────────────────

    # Issue #1689: coturn started with no explicit relay address enumerates
    # every host interface — each docker bridge included — and can source the
    # RTCP component of an allocation from an address its relay candidate never
    # named, which an ICE peer is entitled to reject as an unknown source. The
    # allocation still succeeds, so the failure is invisible until a call has
    # one-way or absent audio. coturn announces the condition itself, once, at
    # startup ("NO EXPLICIT RELAY ADDRESS(ES) ARE CONFIGURED"); the measurement
    # is whether that line is in the container's log. A dead or absent
    # container makes `docker compose logs` exit non-zero, which must not read
    # as "configured" — hence the rc half of the verdict.
    - name: Check coturn came up with an explicit relay address
      ansible.builtin.shell: |
        set -euo pipefail
        docker compose -f "{{ app_dir }}/services/coturn/docker-compose.yml" logs --no-color coturn 2>&1
      args:
        executable: /bin/bash
      changed_when: false
      register: coturn_relay_addr
      ignore_errors: true
      when:
        - llamenos_coturn_enabled | default(false) | bool
        - _smoke_serves_coturn | bool
      tags: always

    - name: Record coturn explicit relay address result
      ansible.builtin.include_tasks:
        file: tasks/record-smoke-result.yml
        apply:
          tags: always
      vars:
        smoke_check_name: coturn explicit relay address configured
        smoke_check_probe: "{{ coturn_relay_addr | default({}) }}"
        # Three halves: the log was actually read (rc 0), it is NON-EMPTY (an
        # empty log would "pass" while measuring nothing — coturn without
        # --log-file=stdout writes to a tmpfs file the driver never sees), and
        # the enumeration warning is absent. The default on stdout contains
        # the warning string itself, so an absent measurement can never read
        # as "no warning found".
        smoke_check_pass: >-
          {{ coturn_relay_addr.rc | default(1) | int == 0
             and (coturn_relay_addr.stdout | default('') | trim | length) > 0
             and 'NO EXPLICIT RELAY ADDRESS' not in (coturn_relay_addr.stdout | default('NO EXPLICIT RELAY ADDRESS')) }}
        smoke_check_detail: >-
          coturn logged NO EXPLICIT RELAY ADDRESS(ES) ARE CONFIGURED (or its log
          could not be read). It is enumerating the host's interfaces — docker
          bridges included — and can source RTCP from an address the ICE peer
          rejects (#1689: one-way/absent audio on a connected call). Set
          turn_relay_ip / turn_listening_ip (roles/llamenos-coturn).
      tags: always

    # ─── Summary ─────────────────────────────────────────────────────────────

    # Counted by equality on a status that is exactly PASS, FAIL or SKIPPED.
    # The detail text lives in its own key, so no prefix test is needed to tell
    # "FAIL" from "FAIL: <detail>" — which is what the dead `startswith` test
    # existed to do (issue #1602 finding 4, fixed in #1615). A gate that needs
    # no Jinja test cannot be broken by naming one that does not exist.
    - name: Print pass/fail summary
      ansible.builtin.debug:
        msg: |
          ===========================================
          SMOKE CHECK SUMMARY
          ===========================================
          Host: {{ inventory_hostname }}
          Distribution: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
          API URL: {{ _api_base_url }}
          {% for result in smoke_results %}
          [{{ result.status }}] {{ result.check }}{{ ' — ' + result.detail if (result.detail | default('') | length > 0 and result.status != 'PASS') else '' }}
          {% endfor %}
          ===========================================
          Total:    {{ smoke_results | length }} checks
          Passed:   {{ _smoke_passed | length }}
          Failed:   {{ _smoke_failed | length }} ({{ _smoke_fatal | length }} fatal, {{ _smoke_advisory | length }} advisory)
          Skipped:  {{ _smoke_skipped | length }}
          {% if (_smoke_skipped | length) > 0 %}
          -------------------------------------------
          NOT MEASURED on this host — {{ _smoke_skipped | length }} check(s) never ran. A skipped check
          is not a passing check. If any of these was expected to run here, this
          host is NOT verified, whatever the Result line says:
          {% for result in _smoke_skipped %}
            - {{ result.check }} ({{ result.detail }})
          {% endfor %}
          {% endif %}
          {% if (_smoke_advisory | length) > 0 %}
          -------------------------------------------
          DEGRADED but NOT FATAL — {{ _smoke_advisory | length }} advisory check(s) failed. The deploy is
          allowed to proceed: each of these costs a feature without breaking the
          call path or exposing anything. They are still real failures and the
          named capability is unavailable until each is fixed:
          {% for result in _smoke_advisory %}
            - {{ result.check }}{{ ' — ' + result.detail if (result.detail | default('') | length > 0) else '' }}
          {% endfor %}
          {% endif %}
          ===========================================
          Result: {{ 'FAILED' if (_smoke_fatal | length) > 0 else 'PASSED' }}{{ ', ' + (_smoke_advisory | length | string) + ' DEGRADED' if (_smoke_advisory | length) > 0 else '' }}{{ ', ' + (_smoke_skipped | length | string) + ' NOT MEASURED' if (_smoke_skipped | length) > 0 else '' }}
          ===========================================
      vars:
        _smoke_passed: "{{ smoke_results | selectattr('status', 'equalto', 'PASS') | list }}"
        _smoke_failed: "{{ smoke_results | selectattr('status', 'equalto', 'FAIL') | list }}"
        _smoke_fatal: "{{ smoke_results | selectattr('status', 'equalto', 'FAIL') | selectattr('severity', 'equalto', 'fatal') | list }}"
        _smoke_advisory: "{{ smoke_results | selectattr('status', 'equalto', 'FAIL') | selectattr('severity', 'equalto', 'advisory') | list }}"
        _smoke_skipped: "{{ smoke_results | selectattr('status', 'equalto', 'SKIPPED') | list }}"
      tags: always

    # The gate fires on FATAL failures only, and every advisory failure is
    # named in the DEGRADED block above. The state issue #1636 set out to
    # remove is the third one: a check reporting FAIL while the deploy proceeds
    # and nothing says why that was allowed.
    - name: Fail if any FATAL smoke check failed
      ansible.builtin.fail:
        msg: |
          Smoke check FAILED on {{ inventory_hostname }}: {{ _smoke_fatal | length }} of {{ smoke_results | length }} check(s) failed fatally.
          {% for result in _smoke_fatal %}
            - {{ result.check }}{{ ' — ' + result.detail if (result.detail | default('') | length > 0) else '' }}
          {% endfor %}
          {% if (_smoke_advisory | length) > 0 %}
          Also DEGRADED (advisory, did not cause this failure):
          {% for result in _smoke_advisory %}
            - {{ result.check }}
          {% endfor %}
          {% endif %}
      vars:
        _smoke_fatal: "{{ smoke_results | selectattr('status', 'equalto', 'FAIL') | selectattr('severity', 'equalto', 'fatal') | list }}"
        _smoke_advisory: "{{ smoke_results | selectattr('status', 'equalto', 'FAIL') | selectattr('severity', 'equalto', 'advisory') | list }}"
      when: >-
        (smoke_results | selectattr('status', 'equalto', 'FAIL')
                       | selectattr('severity', 'equalto', 'fatal') | list | length) > 0
      tags: always
