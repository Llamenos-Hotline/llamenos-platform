---
# Cross-Host Restore Playbook
#
# Restores services from backup in the correct order:
# 1. Stop all services
# 2. Restore config (docker-compose.yml, .env, Caddyfile)
# 3. Restore PostgreSQL
# 4. Restore RustFS (file attachments)
# 6. Verify data integrity
# 7. Start services
#
# A restore never clears its target before it can prove it can write the
# replacement. A recovery is run by someone who has just lost data, and the
# data they still have may be the only copy:
#   - PostgreSQL is restored into a side database, which must hold a schema
#     before it is swapped in by rename; the old database is dropped last.
#   - RustFS is extracted into a staging directory on the SAME volume, counted,
#     and only then swapped in; the old objects are deleted last.
# A failure at any point before the swap leaves the live data untouched.
#
# Decrypted data is streamed to the container that needs it (stdin), never
# handed over through a bind mount of a host directory: Docker's userns-remap
# (which harden.yml enables) maps the container's root to an unprivileged
# sub-UID that cannot traverse a 0700 host directory. A restore that bind-mounts
# one fails on exactly the hosts that were hardened -- and it used to do so after
# it had already emptied the volume. A static guard in
# scripts/check-restore-no-bind-mounts.py keeps it that way.
#
# Supports:
# - Point-in-time restore from a specific manifest or timestamp
# - Dry-run mode (--check or -e restore_dry_run=true)
# - Individual service restore via --tags
#
# Usage:
#   ansible-playbook playbooks/restore.yml --ask-vault-pass
#   ansible-playbook playbooks/restore.yml --ask-vault-pass -e restore_timestamp=20260308-030000
#   ansible-playbook playbooks/restore.yml --ask-vault-pass -e restore_dry_run=true
#   ansible-playbook playbooks/restore.yml --ask-vault-pass --tags postgres
#   ansible-playbook playbooks/restore.yml --ask-vault-pass -e restore_source_host=old-server
#   ansible-playbook playbooks/restore.yml --ask-vault-pass -e restore_discard_previous=true   # after inspecting a kept llamenos_pre_restore

- name: Restore from backup
  hosts: all
  become: true
  vars_files:
    - ../vars.yml

  vars:
    # Override these to restore a specific point-in-time
    restore_timestamp: "" # e.g., "20260308-030000" — empty means latest
    restore_dry_run: false # true = log actions without executing
    restore_source_dir: "{{ app_dir }}/backups" # override for cross-host restore
    restore_age_key_path: "{{ backup_age_private_key_path | default('') }}"

  pre_tasks:
    - name: Skip hosts without disk encryption (this play keeps data at rest)
      ansible.builtin.import_tasks: tasks/skip-unencrypted-host.yml
      tags: always

    - name: Validate age key path (if encryption is configured)
      ansible.builtin.stat:
        path: "{{ restore_age_key_path }}"
      register: age_key_stat
      when: backup_age_public_key | default('') | length > 0
      tags: always

    - name: Fail if encrypted backups but no private key
      ansible.builtin.fail:
        msg: >
          Backups are encrypted with age but no private key path was provided.
          Set backup_age_private_key_path or restore_age_key_path.
      when:
        - backup_age_public_key | default('') | length > 0
        - restore_age_key_path | length == 0 or (age_key_stat.stat.exists | default(false) == false)
      tags: always

    - name: Display restore parameters
      ansible.builtin.debug:
        msg: |
          Restore parameters:
            Timestamp filter: {{ restore_timestamp | default('latest') }}
            Source directory: {{ restore_source_dir }}
            Dry run: {{ restore_dry_run }}
            Encrypted: {{ 'yes' if backup_age_public_key | default('') | length > 0 else 'no' }}
      tags: always

  tasks:
    - name: "Restore services (with guaranteed temp dir cleanup)"
      block:
        # ── Find backup files ──────────────────────────────────────────

        - name: Find PostgreSQL backup
          ansible.builtin.find:
            paths: "{{ restore_source_dir }}/postgres/daily"
            patterns: "{{ 'llamenos-postgres-' + restore_timestamp + '*' if restore_timestamp else 'llamenos-postgres-*' }}"
            file_type: file
          register: pg_backup_files
          tags: [postgres, rustfs, config]

        - name: Select PostgreSQL backup file
          ansible.builtin.set_fact:
            pg_backup_file: "{{ (pg_backup_files.files | sort(attribute='mtime') | last).path }}"
          when: pg_backup_files.matched > 0
          tags: [postgres]

        - name: Find RustFS backup
          ansible.builtin.find:
            paths: "{{ restore_source_dir }}/rustfs/daily"
            patterns: "{{ 'llamenos-rustfs-' + restore_timestamp + '*' if restore_timestamp else 'llamenos-rustfs-*' }}"
            file_type: file
          register: rustfs_backup_files
          tags: [rustfs]

        - name: Select RustFS backup file
          ansible.builtin.set_fact:
            rustfs_backup_file: "{{ (rustfs_backup_files.files | sort(attribute='mtime') | last).path }}"
          when: rustfs_backup_files.matched > 0
          tags: [rustfs]

        - name: Find config backup
          ansible.builtin.find:
            paths: "{{ restore_source_dir }}/config/daily"
            patterns: "{{ 'llamenos-config-' + restore_timestamp + '*' if restore_timestamp else 'llamenos-config-*' }}"
            file_type: file
          register: config_backup_files
          tags: [config]

        - name: Select config backup file
          ansible.builtin.set_fact:
            config_backup_file: "{{ (config_backup_files.files | sort(attribute='mtime') | last).path }}"
          when: config_backup_files.matched > 0
          tags: [config]

        - name: Display selected backup files
          ansible.builtin.debug:
            msg: |
              Selected backup files:
                PostgreSQL: {{ pg_backup_file | default('NOT FOUND') }}
                RustFS:     {{ rustfs_backup_file | default('NOT FOUND') }}
                Config:     {{ config_backup_file | default('NOT FOUND') }}
          tags: always

        # ── Stop services ──────────────────────────────────────────────

        # Every service has its own Compose project under
        # {{ llamenos_services_dir }}/<service>/ (see group_vars/all/compose.yml).
        # There is no aggregate {{ app_dir }}/docker-compose.yml on a
        # production host, which is why none of this playbook could run
        # before (#1121). Iterating the directory also means a host that
        # runs only some of the optional services needs no special casing.
        - name: Stop every service Compose project
          ansible.builtin.shell: |
            set -u
            shopt -s nullglob
            for f in {{ llamenos_compose_glob }}; do
              echo "down: ${f}"
              docker compose -f "${f}" down || true
            done
          args:
            executable: /bin/bash
          register: stack_down
          changed_when: true
          when: not restore_dry_run
          tags: [postgres, rustfs, config]

        - name: "[DRY RUN] Would stop Docker Compose stack"
          ansible.builtin.debug:
            msg: "docker compose down (skipped — dry run)"
          when: restore_dry_run
          tags: [postgres, rustfs, config]

        # ── Create temp directory ──────────────────────────────────────

        - name: Create temp directory for restore
          ansible.builtin.tempfile:
            state: directory
            prefix: llamenos-restore-
          register: restore_tmpdir
          tags: always

        # ── Restore config ─────────────────────────────────────────────

        - name: Decrypt config backup
          ansible.builtin.shell: |
            {% if backup_age_public_key | default('') | length > 0 %}
            age -d -i {{ restore_age_key_path }} -o {{ restore_tmpdir.path }}/config.tar.gz {{ config_backup_file }}
            {% else %}
            cp {{ config_backup_file }} {{ restore_tmpdir.path }}/config.tar.gz
            {% endif %}
          when:
            - config_backup_file is defined
            - not restore_dry_run
          tags: [config]

        # The archive stores paths relative to /, so extracting it
        # reproduces {{ llamenos_services_dir }}/<svc>/{docker-compose.yml,.env.<svc>}
        # and the Caddyfile under the temp dir. Copy the whole service tree
        # back rather than the three hardcoded filenames the single-compose
        # layout used to have (#1121).
        - name: Extract and restore config files
          ansible.builtin.shell: |
            set -euo pipefail
            cd {{ restore_tmpdir.path }}
            tar -xzf config.tar.gz
            restored=0
            if [ -d "{{ restore_tmpdir.path }}{{ llamenos_services_dir }}" ]; then
              mkdir -p "{{ llamenos_services_dir }}"
              cp -a "{{ restore_tmpdir.path }}{{ llamenos_services_dir }}/." "{{ llamenos_services_dir }}/"
              echo "Restored: {{ llamenos_services_dir }}"
              restored=1
            fi
            for f in {{ app_dir }}/Caddyfile {{ app_dir }}/caddy/Caddyfile; do
              if [ -f "{{ restore_tmpdir.path }}${f}" ]; then
                mkdir -p "$(dirname "${f}")"
                cp -a "{{ restore_tmpdir.path }}${f}" "${f}"
                echo "Restored: ${f}"
                restored=1
              fi
            done
            if [ "${restored}" -eq 0 ]; then
              echo "ERROR: the config archive contained none of the expected paths" >&2
              exit 1
            fi
          args:
            executable: /bin/bash
          when:
            - config_backup_file is defined
            - not restore_dry_run
          register: config_restore_result
          changed_when: true
          tags: [config]

        - name: "[DRY RUN] Would restore config from {{ config_backup_file | default('N/A') }}"
          ansible.builtin.debug:
            msg: "Config restore skipped (dry run)"
          when: restore_dry_run and config_backup_file is defined
          tags: [config]

        # ── Start PostgreSQL only for data restore ─────────────────────

        - name: Start PostgreSQL container only
          ansible.builtin.command:
            cmd: docker compose -f {{ llamenos_compose_postgres }} up -d postgres
          when: not restore_dry_run and (pg_backup_file is defined or rustfs_backup_file is defined)
          tags: [postgres, rustfs]

        - name: Wait for PostgreSQL to be ready
          ansible.builtin.command:
            cmd: docker compose -f {{ llamenos_compose_postgres }} exec -T postgres pg_isready -U llamenos -d llamenos
          register: pg_ready
          retries: 15
          delay: 2
          until: pg_ready.rc == 0
          changed_when: false
          when: not restore_dry_run and pg_backup_file is defined
          tags: [postgres]

        # ── Restore PostgreSQL ─────────────────────────────────────────

        - name: Decrypt PostgreSQL backup
          ansible.builtin.shell: |
            {% if backup_age_public_key | default('') | length > 0 %}
            age -d -i {{ restore_age_key_path }} -o {{ restore_tmpdir.path }}/pg.dump {{ pg_backup_file }}
            {% else %}
            cp {{ pg_backup_file }} {{ restore_tmpdir.path }}/pg.dump
            {% endif %}
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]

        # The live database is not touched until the dump has been proven
        # readable AND restored into a side database that holds a schema. The
        # old order -- DROP DATABASE, then pg_restore under ignore_errors --
        # turned any unreadable or corrupt dump into a database that no
        # longer existed.
        - name: Prove the PostgreSQL dump is a readable archive before touching the live database
          ansible.builtin.shell: |
            set -euo pipefail
            n="$(docker compose -f {{ llamenos_compose_postgres }} exec -T postgres \
                  pg_restore --list < {{ restore_tmpdir.path }}/pg.dump | grep -c '^[0-9]' || true)"
            if [ "${n}" -eq 0 ]; then
              echo "ERROR: {{ pg_backup_file }} lists no restorable entries; the live database was not touched" >&2
              exit 1
            fi
            echo "dump lists ${n} entries"
          args:
            executable: /bin/bash
          changed_when: false
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]

        - name: Restore PostgreSQL into a side database
          ansible.builtin.shell: |
            set -u
            psql_admin() {
              docker compose -f {{ llamenos_compose_postgres }} exec -T postgres \
                psql -U llamenos -d postgres -v ON_ERROR_STOP=1 "$@"
            }
            psql_admin -c "DROP DATABASE IF EXISTS llamenos_restore;" || exit 1
            psql_admin -c "CREATE DATABASE llamenos_restore OWNER llamenos;" || exit 1
            # pg_restore exits non-zero on warnings it can carry on past; whether
            # the restore is good is decided below by what the side database
            # holds, not by this exit code.
            docker compose -f {{ llamenos_compose_postgres }} exec -T postgres \
              pg_restore -U llamenos -d llamenos_restore --no-owner --no-privileges \
              < {{ restore_tmpdir.path }}/pg.dump
            echo "pg_restore exit: $?"
          args:
            executable: /bin/bash
          register: pg_restore_result
          changed_when: true
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]

        - name: Count the tables in the side database
          ansible.builtin.command:
            cmd: >
              docker compose -f {{ llamenos_compose_postgres }} exec -T postgres
              psql -U llamenos -d llamenos_restore -tAc
              "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'"
          register: pg_side_count
          changed_when: false
          failed_when: false
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]

        # pg_restore exits non-zero on warnings it can carry on past, so its
        # exit code cannot decide whether the restore is good. What can: the
        # dump's table of contents says how many tables it holds, and the side
        # database must hold exactly that many. A restore that silently dropped
        # a table (an error mid-restore) is refused before the swap.
        - name: Count the tables the dump says it holds, and the tables the side database holds
          ansible.builtin.shell: |
            set -euo pipefail
            expected="$(docker compose -f {{ llamenos_compose_postgres }} exec -T postgres               pg_restore --list < {{ restore_tmpdir.path }}/pg.dump | grep -c '^[0-9]*; [0-9]* [0-9]* TABLE public ' || true)"
            actual="$(docker compose -f {{ llamenos_compose_postgres }} exec -T postgres               psql -U llamenos -d llamenos_restore -tAc               "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r','p')")"
            echo "${expected} ${actual}"
          args:
            executable: /bin/bash
          register: pg_toc_vs_side
          changed_when: false
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]

        - name: Drop a side database that is empty or incomplete
          ansible.builtin.command:
            cmd: >
              docker compose -f {{ llamenos_compose_postgres }} exec -T postgres
              psql -U llamenos -d postgres -c "DROP DATABASE IF EXISTS llamenos_restore;"
          changed_when: true
          when:
            - pg_backup_file is defined
            - not restore_dry_run
            - (pg_side_count.stdout | default('0') | trim | int) == 0
              or (pg_toc_vs_side.stdout | default('0 0') | trim).split()[0] != (pg_toc_vs_side.stdout | default('0 0') | trim).split()[1]
          tags: [postgres]

        - name: Refuse to swap in a side database that is empty or incomplete
          ansible.builtin.fail:
            msg: >-
              Restoring {{ pg_backup_file }} did not produce the database the
              dump describes (tables in the dump / tables restored:
              {{ pg_toc_vs_side.stdout | default('unknown') | trim }}), so the
              live database was NOT replaced. pg_restore said:
              {{ pg_restore_result.stdout | default('no output') }}
          when:
            - pg_backup_file is defined
            - not restore_dry_run
            - (pg_side_count.stdout | default('0') | trim | int) == 0
              or (pg_toc_vs_side.stdout | default('0 0') | trim).split()[0] != (pg_toc_vs_side.stdout | default('0 0') | trim).split()[1]
          tags: [postgres]

        # Only now is the live database replaced. The app and every other
        # client are stopped; ALLOW_CONNECTIONS false plus a terminate keeps
        # a straggler (a metrics exporter) from holding the old database open
        # across the rename. If the second rename fails the first is undone.
        # The replaced database is KEPT as llamenos_pre_restore until the
        # restored one has been validated below; only then is it dropped.
        - name: Swap the restored database in
          ansible.builtin.shell: |
            set -u
            psql_admin() {
              docker compose -f {{ llamenos_compose_postgres }} exec -T postgres \
                psql -U llamenos -d postgres -v ON_ERROR_STOP=1 "$@"
            }
            exists() {
              [ "$(psql_admin -tAc "SELECT count(*) FROM pg_database WHERE datname = '$1'")" = "1" ]
            }
            if ! exists llamenos; then
              if exists llamenos_pre_restore; then
                echo "ERROR: there is no 'llamenos' database but there is a 'llamenos_pre_restore': an earlier restore stopped mid-swap and that is your data. Rename it back by hand before restoring again." >&2
                exit 1
              fi
              echo "ERROR: there is no 'llamenos' database to replace" >&2
              exit 1
            fi
            # llamenos_pre_restore is the previous live database, kept until a
            # restore has validated its replacement. One still here means an
            # earlier restore did not get that far, so it may be the only good
            # copy: refuse rather than delete it, as the RustFS swap does with
            # its marker. -e restore_discard_previous=true is the operator saying
            # they have looked.
            if exists llamenos_pre_restore; then
              {% if restore_discard_previous | default(false) | bool %}
              psql_admin -c "DROP DATABASE llamenos_pre_restore;" || exit 1
              {% else %}
              echo "ERROR: 'llamenos_pre_restore' exists: an earlier restore replaced the database but did not validate its replacement, so it may hold your only good copy. Inspect it, then drop it by hand or re-run with -e restore_discard_previous=true. The live database was not touched." >&2
              exit 1
              {% endif %}
            fi
            psql_admin -c "ALTER DATABASE llamenos ALLOW_CONNECTIONS false;" || exit 1
            psql_admin -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'llamenos' AND pid <> pg_backend_pid();" >/dev/null || true
            if ! psql_admin -c "ALTER DATABASE llamenos RENAME TO llamenos_pre_restore;"; then
              psql_admin -c "ALTER DATABASE llamenos ALLOW_CONNECTIONS true;" || true
              echo "ERROR: could not move the live database aside; it is unchanged" >&2
              exit 1
            fi
            if ! psql_admin -c "ALTER DATABASE llamenos_restore RENAME TO llamenos;"; then
              psql_admin -c "ALTER DATABASE llamenos_pre_restore RENAME TO llamenos;" || true
              psql_admin -c "ALTER DATABASE llamenos ALLOW_CONNECTIONS true;" || true
              echo "ERROR: could not move the restored database into place; the original was put back" >&2
              exit 1
            fi
            echo "swapped"
          args:
            executable: /bin/bash
          changed_when: true
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]

        # This used to query kv_store -- a Durable-Objects-era table that has
        # not existed in any migration for a long time -- with no
        # failed_when, so the play died here and skipped "Start full stack",
        # leaving the operator mid-recovery with the application down
        # (#1125). information_schema is schema-version independent, so this
        # check cannot rot the same way.
        - name: Validate PostgreSQL restore (table count)
          ansible.builtin.command:
            cmd: >
              docker compose -f {{ llamenos_compose_postgres }} exec -T postgres
              psql -U llamenos -d llamenos -tAc
              "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'"
          register: pg_validate
          changed_when: false
          failed_when: false
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]

        - name: Record restored table count
          ansible.builtin.set_fact:
            pg_restored_tables: "{{ pg_validate.stdout | default('0') | trim | int }}"
          when: pg_validate is defined and pg_validate.stdout is defined
          tags: [postgres]

        - name: Display PostgreSQL restore result
          ansible.builtin.debug:
            msg: >-
              PostgreSQL restore: {{ pg_restored_tables | default(0) }} tables
              in schema "public"
          when: pg_restored_tables is defined
          tags: [postgres]

        # A restore that produced an empty schema is a failed restore, and the
        # operator must be told so rather than reading a success summary. This
        # is deliberately the LAST thing that can fail inside the block: the
        # stack is brought back up from the always: section regardless.
        - name: Fail if the restored database has no tables
          ansible.builtin.fail:
            msg: >-
              PostgreSQL restore produced an empty schema (0 tables in
              "public"). pg_restore output:
              {{ pg_restore_result.stderr | default(pg_restore_result.stdout) | default('no output') }}
          when:
            - pg_backup_file is defined
            - not restore_dry_run
            - (pg_restored_tables | default(0) | int) == 0
          tags: [postgres]

        # The replaced database has been kept until now. The restored one holds
        # the schema the dump described and passed the check above, so this is
        # the first moment the old data is no longer the only complete copy.
        - name: Drop the replaced database now that the restored one is validated
          ansible.builtin.command:
            cmd: >
              docker compose -f {{ llamenos_compose_postgres }} exec -T postgres
              psql -U llamenos -d postgres -c "DROP DATABASE IF EXISTS llamenos_pre_restore;"
          changed_when: true
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]

        - name: "[DRY RUN] Would restore PostgreSQL from {{ pg_backup_file | default('N/A') }}"
          ansible.builtin.debug:
            msg: "PostgreSQL restore skipped (dry run)"
          when: restore_dry_run and pg_backup_file is defined
          tags: [postgres]

        # ── Restore RustFS ─────────────────────────────────────────────

        - name: Start RustFS container
          ansible.builtin.command:
            cmd: docker compose -f {{ llamenos_compose_rustfs }} up -d rustfs
          when: not restore_dry_run and rustfs_backup_file is defined
          tags: [rustfs]

        - name: Wait for RustFS to be healthy
          ansible.builtin.command:
            cmd: docker compose -f {{ llamenos_compose_rustfs }} exec -T rustfs curl -sf http://localhost:9000/health
          register: rustfs_ready
          retries: "{{ restore_rustfs_retries | default(10) }}"
          delay: "{{ restore_rustfs_delay | default(2) }}"
          until: rustfs_ready.rc == 0
          when: not restore_dry_run and rustfs_backup_file is defined
          tags: [rustfs]
          ignore_errors: true

        # This used to `aws s3 sync` inside the rustfs image, which has no
        # AWS CLI, under ignore_errors -- so attachments were never restored
        # and the summary said "RESTORED" anyway (#1125). The backup archives
        # the /data volume, so the restore writes that volume back with the
        # same helper container. RustFS must be stopped while its data
        # directory is replaced underneath it.
        - name: Stop RustFS before replacing its data volume
          ansible.builtin.command:
            cmd: docker compose -f {{ llamenos_compose_rustfs }} stop rustfs
          when:
            - rustfs_backup_file is defined
            - not restore_dry_run
          changed_when: true
          tags: [rustfs]

        # The archive is streamed into the helper container on stdin. It is
        # never decrypted to a host directory and never bind-mounted: a
        # container under userns-remap cannot read a 0700 host directory, and
        # this step used to fail on that after `rm -rf /data/*` had already
        # emptied the volume.
        #
        # Inside the helper the archive is extracted into a staging directory
        # on the SAME volume (so the swap is a rename, not a copy), counted,
        # and only then swapped in: the live objects are moved aside, the
        # staged ones moved in, and the old ones deleted last. Any failure
        # before the swap leaves the live objects exactly as they were; a
        # failure during it moves them back. It needs room for the live data
        # and the restored data at once.
        #
        # .restore-swap marks a swap in progress. If one is found the previous
        # restore died mid-swap and .restore-previous holds the live data, so
        # this refuses to proceed rather than delete it.
        - name: Restore the RustFS data volume (staged, then swapped in)
          ansible.builtin.shell: |
            set -euo pipefail
            CONTAINER_ID="$(docker compose -f {{ llamenos_compose_rustfs }} ps -aq rustfs)"
            if [ -z "${CONTAINER_ID}" ]; then
              echo "ERROR: no rustfs container under {{ llamenos_compose_rustfs }}" >&2
              exit 1
            fi
            {% raw %}
            DATA_VOLUME="$(docker inspect \
              --format '{{ range .Mounts }}{{ if eq .Destination "/data" }}{{ .Name }}{{ end }}{{ end }}' \
              "${CONTAINER_ID}")"
            {% endraw %}
            if [ -z "${DATA_VOLUME}" ]; then
              echo "ERROR: could not resolve the volume behind rustfs /data" >&2
              exit 1
            fi
            read -r -d '' HELPER_SCRIPT <<'EOS' || true
            set -eu
            STAGE=/data/.restore-staging
            PREV=/data/.restore-previous
            MARK=/data/.restore-swap
            # `find -exec mv` would report success whatever mv did (the exit
            # status is about find itself), so entries are moved by an explicit loop that
            # stops at the first failure. The glob trio covers ordinary, dot- and
            # double-dot-prefixed names; an unmatched glob stays literal and is
            # skipped by the existence test.
            move_entries() {
              for e in "$1"/* "$1"/.[!.]* "$1"/..?*; do
                if [ ! -e "$e" ] && [ ! -L "$e" ]; then continue; fi
                case "${e##*/}" in .restore-*) continue ;; esac
                mv "$e" "$2"/ || return 1
              done
            }
            count_entries() {
              n=0
              for e in "$1"/* "$1"/.[!.]* "$1"/..?*; do
                if [ ! -e "$e" ] && [ ! -L "$e" ]; then continue; fi
                case "${e##*/}" in .restore-*) continue ;; esac
                n=$((n + 1))
              done
              echo "$n"
            }
            if [ -e "${MARK}" ]; then
              echo "ERROR: an earlier restore stopped part-way through swapping. The live objects are in ${PREV} on this volume. Move them back by hand before restoring again; nothing was changed." >&2
              exit 4
            fi
            rm -rf "${STAGE}" "${PREV}"
            mkdir "${STAGE}"
            if ! tar -xzf - -C "${STAGE}"; then
              rm -rf "${STAGE}"
              echo "ERROR: the archive could not be extracted; the live objects were not touched" >&2
              exit 3
            fi
            count="$(find "${STAGE}" -type f | wc -l)"
            if [ "${count}" -eq 0 ]; then
              rm -rf "${STAGE}"
              echo "ERROR: the archive holds no files; the live objects were not touched" >&2
              exit 3
            fi
            staged_entries="$(count_entries "${STAGE}")"
            live_entries="$(count_entries /data)"
            touch "${MARK}"
            mkdir "${PREV}"
            # The marker is removed only when a rollback fully succeeded (nothing
            # left in PREV). Otherwise it stays, so the next run refuses (exit 4)
            # instead of deleting the live objects that are still in PREV.
            rollback() {
              move_entries /data "${STAGE}" || true
              move_entries "${PREV}" /data || true
              if [ "$(count_entries "${PREV}")" -eq 0 ]; then
                rm -rf "${PREV}"; rm -f "${MARK}"
                echo "$1; the live objects were put back" >&2
              else
                echo "$1, and the rollback was incomplete: some live objects are still in ${PREV}. Move them back by hand; the marker ${MARK} stays so a second restore cannot delete them." >&2
              fi
            }
            if ! move_entries /data "${PREV}"; then
              rollback "ERROR: could not move the live objects aside"
              exit 5
            fi
            if ! move_entries "${STAGE}" /data || [ "$(count_entries /data)" -ne "${staged_entries}" ]; then
              rollback "ERROR: could not move the restored objects into place"
              exit 5
            fi
            # The replacement is in place and complete. Only now is the old data
            # deleted, and only if what was moved aside is still what was found.
            if [ "$(count_entries "${PREV}")" -ne "${live_entries}" ]; then
              echo "WARNING: ${PREV} holds a different number of entries than the live data had; keeping it and the marker ${MARK}. Check it, then delete both by hand." >&2
            else
              rm -f "${MARK}"
              rm -rf "${PREV}"
            fi
            rm -rf "${STAGE}"
            echo "Restored ${count} files"
            EOS
            {% if backup_age_public_key | default('') | length > 0 %}
            age -d -i {{ restore_age_key_path }} {{ rustfs_backup_file }} \
            {% else %}
            cat {{ rustfs_backup_file }} \
            {% endif %}
              | docker run --rm -i \
                  -v "${DATA_VOLUME}:/data" \
                  "{{ backup_rustfs_helper_image | default('alpine:3.22') }}" \
                  sh -c "${HELPER_SCRIPT}"
          args:
            executable: /bin/bash
          register: rustfs_restore_result
          changed_when: true
          when:
            - rustfs_backup_file is defined
            - not restore_dry_run
          tags: [rustfs]

        - name: Display RustFS restore result
          ansible.builtin.debug:
            msg: "RustFS restore: {{ rustfs_restore_result.stdout_lines | default(['no output']) }}"
          when: rustfs_restore_result is defined
          tags: [rustfs]

        - name: "[DRY RUN] Would restore RustFS from {{ rustfs_backup_file | default('N/A') }}"
          ansible.builtin.debug:
            msg: "RustFS restore skipped (dry run)"
          when: restore_dry_run and rustfs_backup_file is defined
          tags: [rustfs]

      # Bringing the stack back up lives in `always`, not in the block.
      # Every one of these tasks used to sit after the validation step, so
      # any failure during the restore -- including the validation query
      # itself, which referenced a table that no longer exists -- skipped
      # them and left the operator with a restored database, postgres up
      # and the application down (#1125). Recovery must never be the thing
      # that takes the app offline permanently.
      always:
        - name: Start every service Compose project
          ansible.builtin.shell: |
            set -u
            shopt -s nullglob
            rc=0
            for f in {{ llamenos_compose_glob }}; do
              echo "up: ${f}"
              docker compose -f "${f}" up -d || rc=1
            done
            exit "${rc}"
          args:
            executable: /bin/bash
          register: stack_up
          changed_when: true
          when: not restore_dry_run
          tags: always

        - name: Wait for application health check
          ansible.builtin.uri:
            url: "http://localhost:3000/api/health"
            method: GET
            status_code: 200
            return_content: true
          register: health_check
          retries: "{{ restore_health_retries | default(20) }}"
          delay: "{{ restore_health_delay | default(5) }}"
          until: health_check.status == 200
          when: not restore_dry_run
          tags: always
          ignore_errors: true

        - name: Clean up temp directory
          ansible.builtin.file:
            path: "{{ restore_tmpdir.path }}"
            state: absent
          when: restore_tmpdir is defined
          tags: always

        - name: Display restore summary
          ansible.builtin.debug:
            msg: |
              Restore {{ 'DRY RUN ' if restore_dry_run else '' }}complete.

               PostgreSQL: {{ 'RESTORED (' ~ (pg_restored_tables | default(0)) ~ ' tables)' if pg_restored_tables is defined else ('ATTEMPTED' if pg_backup_file is defined and not restore_dry_run else 'SKIPPED') }}
               RustFS:     {{ 'RESTORED' if rustfs_restore_result is defined and not (rustfs_restore_result.failed | default(false)) else ('FAILED' if rustfs_backup_file is defined and not restore_dry_run else 'SKIPPED') }}
               Config:     {{ 'RESTORED' if config_restore_result is defined and not (config_restore_result.failed | default(false)) else ('FAILED' if config_backup_file is defined and not restore_dry_run else 'SKIPPED') }}

              Stack restarted: {{ 'yes' if stack_up is defined and not (stack_up.failed | default(false)) else 'NO -- check the Compose projects by hand' }}
              Health check: {{ health_check.json | default('N/A') }}

              Verify data integrity before resuming operations.
          tags: always
