---
# Cross-Host Restore Playbook
#
# Restores services from backup in the correct order:
# 1. Stop all services
# 2. Restore config (docker-compose.yml, .env, Caddyfile)
# 3. Restore PostgreSQL
# 4. Restore RustFS (file attachments)
# 6. Verify data integrity
# 7. Start services
#
# Supports:
# - Point-in-time restore from a specific manifest or timestamp
# - Dry-run mode (--check or -e restore_dry_run=true)
# - Individual service restore via --tags
#
# Usage:
#   ansible-playbook playbooks/restore.yml --ask-vault-pass
#   ansible-playbook playbooks/restore.yml --ask-vault-pass -e restore_timestamp=20260308-030000
#   ansible-playbook playbooks/restore.yml --ask-vault-pass -e restore_dry_run=true
#   ansible-playbook playbooks/restore.yml --ask-vault-pass --tags postgres
#   ansible-playbook playbooks/restore.yml --ask-vault-pass -e restore_source_host=old-server

- name: Restore from backup
  hosts: all
  become: true
  vars_files:
    - ../vars.yml

  vars:
    # Override these to restore a specific point-in-time
    restore_timestamp: "" # e.g., "20260308-030000" — empty means latest
    restore_dry_run: false # true = log actions without executing
    restore_source_dir: "{{ app_dir }}/backups" # override for cross-host restore
    restore_age_key_path: "{{ backup_age_private_key_path | default('') }}"

  pre_tasks:
    - name: Skip hosts without disk encryption (this play keeps data at rest)
      ansible.builtin.import_tasks: tasks/skip-unencrypted-host.yml
      tags: always

    - name: Validate age key path (if encryption is configured)
      ansible.builtin.stat:
        path: "{{ restore_age_key_path }}"
      register: age_key_stat
      when: backup_age_public_key | default('') | length > 0
      tags: always

    - name: Fail if encrypted backups but no private key
      ansible.builtin.fail:
        msg: >
          Backups are encrypted with age but no private key path was provided.
          Set backup_age_private_key_path or restore_age_key_path.
      when:
        - backup_age_public_key | default('') | length > 0
        - restore_age_key_path | length == 0 or (age_key_stat.stat.exists | default(false) == false)
      tags: always

    - name: Display restore parameters
      ansible.builtin.debug:
        msg: |
          Restore parameters:
            Timestamp filter: {{ restore_timestamp | default('latest') }}
            Source directory: {{ restore_source_dir }}
            Dry run: {{ restore_dry_run }}
            Encrypted: {{ 'yes' if backup_age_public_key | default('') | length > 0 else 'no' }}
      tags: always

  tasks:
    - name: "Restore services (with guaranteed temp dir cleanup)"
      block:
        # ── Find backup files ──────────────────────────────────────────

        - name: Find PostgreSQL backup
          ansible.builtin.find:
            paths: "{{ restore_source_dir }}/postgres/daily"
            patterns: "{{ 'llamenos-postgres-' + restore_timestamp + '*' if restore_timestamp else 'llamenos-postgres-*' }}"
            file_type: file
          register: pg_backup_files
          tags: [postgres, rustfs, config]

        - name: Select PostgreSQL backup file
          ansible.builtin.set_fact:
            pg_backup_file: "{{ (pg_backup_files.files | sort(attribute='mtime') | last).path }}"
          when: pg_backup_files.matched > 0
          tags: [postgres]

        - name: Find RustFS backup
          ansible.builtin.find:
            paths: "{{ restore_source_dir }}/rustfs/daily"
            patterns: "{{ 'llamenos-rustfs-' + restore_timestamp + '*' if restore_timestamp else 'llamenos-rustfs-*' }}"
            file_type: file
          register: rustfs_backup_files
          tags: [rustfs]

        - name: Select RustFS backup file
          ansible.builtin.set_fact:
            rustfs_backup_file: "{{ (rustfs_backup_files.files | sort(attribute='mtime') | last).path }}"
          when: rustfs_backup_files.matched > 0
          tags: [rustfs]

        - name: Find config backup
          ansible.builtin.find:
            paths: "{{ restore_source_dir }}/config/daily"
            patterns: "{{ 'llamenos-config-' + restore_timestamp + '*' if restore_timestamp else 'llamenos-config-*' }}"
            file_type: file
          register: config_backup_files
          tags: [config]

        - name: Select config backup file
          ansible.builtin.set_fact:
            config_backup_file: "{{ (config_backup_files.files | sort(attribute='mtime') | last).path }}"
          when: config_backup_files.matched > 0
          tags: [config]

        - name: Display selected backup files
          ansible.builtin.debug:
            msg: |
              Selected backup files:
                PostgreSQL: {{ pg_backup_file | default('NOT FOUND') }}
                RustFS:     {{ rustfs_backup_file | default('NOT FOUND') }}
                Config:     {{ config_backup_file | default('NOT FOUND') }}
          tags: always

        # ── Stop services ──────────────────────────────────────────────

        - name: Stop Docker Compose stack
          ansible.builtin.command:
            cmd: docker compose -f {{ app_dir }}/docker-compose.yml down
          when: not restore_dry_run
          tags: [postgres, rustfs, config]
          ignore_errors: true

        - name: "[DRY RUN] Would stop Docker Compose stack"
          ansible.builtin.debug:
            msg: "docker compose down (skipped — dry run)"
          when: restore_dry_run
          tags: [postgres, rustfs, config]

        # ── Create temp directory ──────────────────────────────────────

        - name: Create temp directory for restore
          ansible.builtin.tempfile:
            state: directory
            prefix: llamenos-restore-
          register: restore_tmpdir
          tags: always

        # ── Restore config ─────────────────────────────────────────────

        - name: Decrypt config backup
          ansible.builtin.shell: |
            {% if backup_age_public_key | default('') | length > 0 %}
            age -d -i {{ restore_age_key_path }} -o {{ restore_tmpdir.path }}/config.tar.gz {{ config_backup_file }}
            {% else %}
            cp {{ config_backup_file }} {{ restore_tmpdir.path }}/config.tar.gz
            {% endif %}
          when:
            - config_backup_file is defined
            - not restore_dry_run
          tags: [config]

        - name: Extract and restore config files
          ansible.builtin.shell: |
            cd {{ restore_tmpdir.path }}
            tar -xzf config.tar.gz
            # Restore docker-compose.yml, .env, Caddyfile (preserve ownership)
            for f in {{ app_dir }}/docker-compose.yml {{ app_dir }}/.env {{ app_dir }}/Caddyfile; do
              relpath="${f}"
              if [ -f "{{ restore_tmpdir.path }}${relpath}" ]; then
                cp "{{ restore_tmpdir.path }}${relpath}" "${f}"
                echo "Restored: ${f}"
              fi
            done
          when:
            - config_backup_file is defined
            - not restore_dry_run
          register: config_restore_result
          tags: [config]

        - name: "[DRY RUN] Would restore config from {{ config_backup_file | default('N/A') }}"
          ansible.builtin.debug:
            msg: "Config restore skipped (dry run)"
          when: restore_dry_run and config_backup_file is defined
          tags: [config]

        # ── Start PostgreSQL only for data restore ─────────────────────

        - name: Start PostgreSQL container only
          ansible.builtin.command:
            cmd: docker compose -f {{ app_dir }}/docker-compose.yml up -d postgres
          when: not restore_dry_run and (pg_backup_file is defined or rustfs_backup_file is defined)
          tags: [postgres, rustfs]

        - name: Wait for PostgreSQL to be ready
          ansible.builtin.command:
            cmd: docker compose -f {{ app_dir }}/docker-compose.yml exec -T postgres pg_isready -U llamenos -d llamenos
          register: pg_ready
          retries: 15
          delay: 2
          until: pg_ready.rc == 0
          changed_when: false
          when: not restore_dry_run and pg_backup_file is defined
          tags: [postgres]

        # ── Restore PostgreSQL ─────────────────────────────────────────

        - name: Decrypt PostgreSQL backup
          ansible.builtin.shell: |
            {% if backup_age_public_key | default('') | length > 0 %}
            age -d -i {{ restore_age_key_path }} -o {{ restore_tmpdir.path }}/pg.dump {{ pg_backup_file }}
            {% else %}
            cp {{ pg_backup_file }} {{ restore_tmpdir.path }}/pg.dump
            {% endif %}
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]

        - name: Drop and recreate database
          ansible.builtin.shell: |
            docker compose -f {{ app_dir }}/docker-compose.yml exec -T postgres \
              psql -U llamenos -d postgres -c "DROP DATABASE IF EXISTS llamenos;"
            docker compose -f {{ app_dir }}/docker-compose.yml exec -T postgres \
              psql -U llamenos -d postgres -c "CREATE DATABASE llamenos OWNER llamenos;"
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]

        - name: Restore PostgreSQL from backup
          ansible.builtin.shell: |
            docker compose -f {{ app_dir }}/docker-compose.yml exec -T postgres \
              pg_restore -U llamenos -d llamenos --no-owner --no-privileges \
              < {{ restore_tmpdir.path }}/pg.dump
          register: pg_restore_result
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]
          ignore_errors: true

        # Validation queries are intentionally ignore_errors: true and never
        # abort the play — a validation failure must not skip "Start full
        # Docker Compose stack" below. Leaving the operator with a restored
        # database AND a down application is worse than a loud warning on an
        # unverified restore (this is exactly how kv_store — a table removed
        # from the schema long ago — used to take the whole play down).
        - name: Validate PostgreSQL restore (schema came back)
          ansible.builtin.command:
            cmd: >
              docker compose -f {{ app_dir }}/docker-compose.yml exec -T postgres
              psql -U llamenos -d llamenos -t -c
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public'"
          register: pg_validate_tables
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]
          ignore_errors: true

        - name: Validate PostgreSQL restore (core table is queryable)
          ansible.builtin.command:
            cmd: >
              docker compose -f {{ app_dir }}/docker-compose.yml exec -T postgres
              psql -U llamenos -d llamenos -t -c "SELECT COUNT(*) FROM users"
          register: pg_validate_users
          when:
            - pg_backup_file is defined
            - not restore_dry_run
          tags: [postgres]
          ignore_errors: true

        - name: Warn if the restored schema looks empty
          ansible.builtin.debug:
            msg: >-
              WARNING: restore produced {{ pg_validate_tables.stdout | default('0') | trim }}
              table(s) in the public schema — the dump may not have actually restored
              anything. The application stack is being started anyway; verify manually
              before trusting it.
          when:
            - pg_validate_tables is defined
            - pg_validate_tables.stdout is defined
            - (pg_validate_tables.stdout | trim | int(0)) <= 0
          tags: [postgres]

        - name: Display PostgreSQL restore result
          ansible.builtin.debug:
            msg: >-
              PostgreSQL restore: {{ pg_validate_tables.stdout | default('unknown') | trim }}
              tables in public schema, users table has
              {{ pg_validate_users.stdout | default('unknown') | trim }} row(s)
          when: pg_validate_tables is defined
          tags: [postgres]

        - name: "[DRY RUN] Would restore PostgreSQL from {{ pg_backup_file | default('N/A') }}"
          ansible.builtin.debug:
            msg: "PostgreSQL restore skipped (dry run)"
          when: restore_dry_run and pg_backup_file is defined
          tags: [postgres]

        # ── Restore RustFS ─────────────────────────────────────────────
        #
        # Extracts directly into the RustFS data volume via a throwaway
        # container, the mirror image of how backup-rustfs.sh.j2 creates the
        # archive. This replaces shelling `aws s3 sync` inside the
        # rustfs/rustfs image, which has no AWS CLI and silently did nothing.

        - name: Start RustFS container (so its volume exists and can be resolved)
          ansible.builtin.command:
            cmd: docker compose -f {{ app_dir }}/docker-compose.yml up -d rustfs
          when: not restore_dry_run and rustfs_backup_file is defined
          tags: [rustfs]

        - name: Wait for RustFS to be healthy
          ansible.builtin.command:
            cmd: docker compose -f {{ app_dir }}/docker-compose.yml exec -T rustfs curl -sf http://localhost:9000/health
          register: rustfs_ready
          retries: 10
          delay: 2
          until: rustfs_ready.rc == 0
          when: not restore_dry_run and rustfs_backup_file is defined
          tags: [rustfs]
          ignore_errors: true

        # Every task below is ignore_errors: true for the same reason the
        # PostgreSQL validation queries are: a failure here must be loud
        # (visible in the play recap and the warning below) but must never
        # abort the block and skip "Start full Docker Compose stack".
        - name: Resolve the RustFS data volume name
          ansible.builtin.shell: |
            CONTAINER_ID="$(docker compose -f {{ app_dir }}/docker-compose.yml ps -q rustfs)"
            docker inspect "${CONTAINER_ID}" --format \
              '{% raw %}{{ range .Mounts }}{{ if eq .Destination "/data" }}{{ .Name }}{{ end }}{{ end }}{% endraw %}'
          register: rustfs_volume_name
          changed_when: false
          failed_when: rustfs_volume_name.stdout | trim | length == 0
          when:
            - rustfs_backup_file is defined
            - not restore_dry_run
          tags: [rustfs]
          ignore_errors: true

        - name: Stop RustFS container before replacing its data (avoid concurrent writes)
          ansible.builtin.command:
            cmd: docker compose -f {{ app_dir }}/docker-compose.yml stop rustfs
          when:
            - rustfs_backup_file is defined
            - not restore_dry_run
            - rustfs_volume_name is defined and not (rustfs_volume_name.failed | default(false))
          tags: [rustfs]
          ignore_errors: true

        - name: Decrypt RustFS backup
          ansible.builtin.shell: |
            {% if backup_age_public_key | default('') | length > 0 %}
            age -d -i {{ restore_age_key_path }} -o {{ restore_tmpdir.path }}/rustfs-data.tar.gz {{ rustfs_backup_file }}
            {% else %}
            cp {{ rustfs_backup_file }} {{ restore_tmpdir.path }}/rustfs-data.tar.gz
            {% endif %}
          when:
            - rustfs_backup_file is defined
            - not restore_dry_run
            - rustfs_volume_name is defined and not (rustfs_volume_name.failed | default(false))
          tags: [rustfs]
          ignore_errors: true

        - name: Extract RustFS backup directly into its data volume
          ansible.builtin.command:
            cmd: >
              docker run --rm
              -v {{ rustfs_volume_name.stdout | default('') | trim }}:/data
              -v {{ restore_tmpdir.path }}:/backup
              alpine:3
              sh -c "rm -rf /data/* /data/..?* /data/.[!.]* 2>/dev/null; tar -xzf /backup/rustfs-data.tar.gz -C /data"
          register: rustfs_restore_result
          when:
            - rustfs_backup_file is defined
            - not restore_dry_run
            - rustfs_volume_name is defined and not (rustfs_volume_name.failed | default(false))
          tags: [rustfs]
          ignore_errors: true

        - name: Start RustFS container after restore
          ansible.builtin.command:
            cmd: docker compose -f {{ app_dir }}/docker-compose.yml up -d rustfs
          when:
            - rustfs_backup_file is defined
            - not restore_dry_run
          tags: [rustfs]
          ignore_errors: true

        - name: Wait for RustFS to be healthy after restore
          ansible.builtin.command:
            cmd: docker compose -f {{ app_dir }}/docker-compose.yml exec -T rustfs curl -sf http://localhost:9000/health
          register: rustfs_ready_after
          retries: 10
          delay: 2
          until: rustfs_ready_after.rc == 0
          when:
            - rustfs_backup_file is defined
            - not restore_dry_run
          tags: [rustfs]
          ignore_errors: true

        - name: Warn if the RustFS volume could not be resolved or restored
          ansible.builtin.debug:
            msg: >-
              WARNING: RustFS restore did not complete cleanly
              (volume resolved: {{ not (rustfs_volume_name.failed | default(true)) }},
              extract rc: {{ rustfs_restore_result.rc | default('not run') }}).
              The application stack is being started anyway; verify attachments
              manually before trusting this restore.
          when:
            - rustfs_backup_file is defined
            - not restore_dry_run
            - (rustfs_volume_name.failed | default(true)) or (rustfs_restore_result.rc | default(1)) != 0
          tags: [rustfs]

        - name: Display RustFS restore result
          ansible.builtin.debug:
            msg: "RustFS restore: {{ rustfs_restore_result.stdout_lines | default(['no output']) }}"
          when: rustfs_restore_result is defined
          tags: [rustfs]

        - name: "[DRY RUN] Would restore RustFS from {{ rustfs_backup_file | default('N/A') }}"
          ansible.builtin.debug:
            msg: "RustFS restore skipped (dry run)"
          when: restore_dry_run and rustfs_backup_file is defined
          tags: [rustfs]

        # ── Start full stack ───────────────────────────────────────────

        - name: Start full Docker Compose stack
          ansible.builtin.command:
            cmd: docker compose -f {{ app_dir }}/docker-compose.yml up -d
          when: not restore_dry_run
          tags: [postgres, rustfs, config]

        - name: Wait for application health check
          ansible.builtin.uri:
            url: "http://localhost:3000/api/health"
            method: GET
            status_code: 200
            return_content: true
          register: health_check
          retries: 20
          delay: 5
          until: health_check.status == 200
          when: not restore_dry_run
          tags: [postgres, rustfs, config]
          ignore_errors: true

        - name: Display restore summary
          ansible.builtin.debug:
            msg: |
              Restore {{ 'DRY RUN ' if restore_dry_run else '' }}complete.

               PostgreSQL: {{ 'RESTORED' if pg_backup_file is defined and not restore_dry_run else 'SKIPPED' }}
               RustFS:     {{ 'RESTORED' if rustfs_backup_file is defined and not restore_dry_run else 'SKIPPED' }}
               Config:     {{ 'RESTORED' if config_backup_file is defined and not restore_dry_run else 'SKIPPED' }}

              Health check: {{ health_check.json | default('N/A') }}

              ⚠ Verify data integrity manually before resuming operations.
          tags: always

      always:
        - name: Clean up temp directory
          ansible.builtin.file:
            path: "{{ restore_tmpdir.path }}"
            state: absent
          when: restore_tmpdir is defined
          tags: always
