---
# Rolling Update Playbook with Automatic Rollback
#
# Performs a health-check-gated rolling update:
# 1. Snapshot current per-service compose/env files and image versions (for rollback)
# 2. Run pre-update backup
# 3. Pull new images and recreate each target service in dependency order,
#    health-gating as each one restarts
# 4. Health-check the full stack
# 5. Record successful deployment to version history
# 6. Automatic rollback on ANY failure (via rescue block)
#
# Production hosts render one docker-compose.yml per service under
# {{ app_dir }}/services/<service>/ (roles/llamenos-app, roles/llamenos-postgres,
# etc. — see playbooks/deploy.yml). This playbook pulls fresh images for the
# ALREADY-RENDERED per-service compose files and recreates the containers that
# changed; it does not re-template them — that is playbooks/deploy.yml's job
# (run it first if you changed vars.yml). Which services belong on a host, and
# where their files live, is declared in group_vars/all/compose.yml — never
# discovered from the host, which would fail precisely when the host is
# half-down. A declared service whose files are missing fails loudly. See
# issue #1121.
#
# There is no blue-green app swap: roles/llamenos-app binds the app port
# statically (127.0.0.1:3000:3000 — roles/llamenos-app/templates/compose/app.j2),
# so `--scale app=2` cannot work, and even if it could, the health check below
# would be asserting the OLD container's health (it still owns the port) while
# believing it checked the new one. A plain recreate (`docker compose up -d`
# after a fresh image pull) replaces the single app container directly, so the
# health check that follows unambiguously addresses the new instance — and it
# avoids running two instances of the app's migration-on-boot
# (deploy/docker/docker-entrypoint.sh) concurrently against the same database,
# which issue #1118 flags as unsafe.
#
# Usage:
#   ansible-playbook playbooks/update.yml --ask-vault-pass
#   ansible-playbook playbooks/update.yml --ask-vault-pass -e update_skip_backup=true
#   ansible-playbook playbooks/update.yml --ask-vault-pass -e update_services=app

- name: Rolling Update with Rollback
  hosts: all
  become: true
  vars_files:
    - ../vars.yml
  vars:
    # Which services to update: "all" or comma-separated list (e.g., "app" or "app,caddy")
    update_services: all
    # Skip pre-update backup (faster, less safe)
    update_skip_backup: false
    # Number of health check retries (each retry waits health_check_delay seconds)
    health_check_retries: 30
    health_check_delay: 5

  tasks:
    - name: Skip hosts without disk encryption (this play keeps data at rest)
      ansible.builtin.import_tasks: tasks/skip-unencrypted-host.yml
      tags: always

    - name: Determine target services for this update
      # `selectattr('name', 'in', ...)` (not `intersect`, which goes through a
      # Python set and loses order) keeps the dependency order of
      # llamenos_compose_stack_here — postgres/rustfs before app, app before
      # caddy — when the caller restricts to a subset via update_services.
      ansible.builtin.set_fact:
        _update_target_services: >-
          {{ llamenos_compose_stack_here
             if update_services == 'all'
             else (llamenos_compose_stack_here | selectattr('name', 'in', update_services | split(',')) | list) }}
      tags: [update]

    - name: Name the target services
      ansible.builtin.set_fact:
        _update_target_names: "{{ _update_target_services | map(attribute='name') | list }}"
      tags: [update]

    - name: Fail if no requested services are declared for this host
      ansible.builtin.fail:
        msg: >
          update_services={{ update_services }} matched none of the services
          declared for this host ({{ llamenos_compose_stack_here | map(attribute='name') | join(', ') }}).
      when: _update_target_services | length == 0
      tags: [update]

    # ── Phase 1: Snapshot & Backup (runs outside rescue) ───────────
    - name: Track current versions (pre-update snapshot)
      # `apply` is what tags the role's own tasks; `tags:` alone tags only the
      # include, so `--tags update` would run this and skip the role body.
      ansible.builtin.include_role:
        name: llamenos-version-tracker
        apply:
          tags: [update, version]
      tags: [update, version]

    - name: Display pre-update versions
      ansible.builtin.debug:
        msg: "Pre-update versions: {{ current_versions | to_nice_json }}"
      tags: [update]

    - name: Clear previous rollback snapshot
      ansible.builtin.file:
        path: "{{ llamenos_rollback_dir }}"
        state: absent
      tags: [update]

    - name: Create rollback snapshot directory
      ansible.builtin.file:
        path: "{{ llamenos_rollback_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0750"
      tags: [update]

    - name: Save pre-update per-service compose/env files for rollback
      # Snapshot every service declared for this host (not just the ones targeted this
      # run), so a later `just rollback` can restore the whole host even if
      # this update only touched a subset via update_services.
      ansible.builtin.command:
        cmd: >
          cp -a {{ item.project_src }} {{ llamenos_rollback_dir }}/{{ item.name }}
      loop: "{{ llamenos_compose_stack_here }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      tags: [update]

    - name: Run pre-update backup
      ansible.builtin.include_role:
        name: backup
        apply:
          tags: [update, backup]
      when: not (update_skip_backup | bool)
      tags: [update, backup]

    # ── Phase 2-4: Update with automatic rollback on failure ───────
    - name: "Perform rolling update (rollback on failure)"
      tags: [update]
      block:
        # ── Pull + recreate each target service, in dependency order ──
        # One service at a time: pull its image, recreate if it changed,
        # and gate on that service's own health signal before moving on.
        - name: "Pull and recreate: {{ item.name }}"
          community.docker.docker_compose_v2:
            project_src: "{{ item.project_src }}"
            pull: always
            state: present
            recreate: always
            wait: true
            wait_timeout: 120
          loop: "{{ _update_target_services }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Wait for PostgreSQL health after update
          ansible.builtin.command: >
            docker compose -f {{ llamenos_compose_postgres }}
            exec -T postgres pg_isready -U llamenos -d llamenos
          register: pg_health
          retries: 15
          delay: 3
          until: pg_health.rc == 0
          changed_when: false
          when: "'postgres' in _update_target_names"

        - name: Wait for application health check after update
          ansible.builtin.uri:
            url: "http://localhost:3000/api/health"
            method: GET
            status_code: 200
            return_content: true
          register: app_health_after_update
          retries: "{{ health_check_retries }}"
          delay: "{{ health_check_delay }}"
          until: app_health_after_update.status == 200
          when: "'app' in _update_target_names"

        # ── Final Health Verification ──────────────────────────────
        - name: Wait for application health check (final)
          ansible.builtin.uri:
            url: "http://localhost:3000/api/health"
            method: GET
            status_code: 200
            return_content: true
          register: final_health
          retries: "{{ health_check_retries }}"
          delay: "{{ health_check_delay }}"
          until: final_health.status == 200

        - name: Verify all declared services are running
          ansible.builtin.shell: |
            set -euo pipefail
            unhealthy=$(docker compose -f "{{ item.compose }}" ps --format json | \
              python3 -c "
            import sys, json
            lines = sys.stdin.read().strip().split('\n')
            for line in lines:
                if not line: continue
                svc = json.loads(line)
                state = svc.get('State', '')
                health = svc.get('Health', '')
                if state != 'running' or (health and health != 'healthy'):
                    print(svc.get('Service', 'unknown'))
            " 2>/dev/null || true)
            if [ -n "$unhealthy" ]; then
              echo "UNHEALTHY in {{ item.name }}: $unhealthy"
              exit 1
            fi
            echo "{{ item.name }}: healthy"
          loop: "{{ llamenos_compose_stack_here }}"
          loop_control:
            label: "{{ item.name }}"
          register: all_services_check
          changed_when: false

        # ── Record Success ─────────────────────────────────────────
        - name: Record new version to history
          ansible.builtin.include_role:
            name: llamenos-version-tracker
            tasks_from: record
          vars:
            version_action: update
            version_result: success

        - name: Clean up old Docker images
          ansible.builtin.command: docker image prune -f
          changed_when: true

        - name: Display update summary
          ansible.builtin.debug:
            msg: |
              Rolling update completed successfully.

              Services updated: {{ _update_target_names | join(', ') }}
              Application: https://{{ domain }}
              Health check: {{ final_health.json | default('OK') }}

              Previous versions saved. Rollback available via:
                just rollback

      # ── RESCUE: Automatic Rollback on ANY failure ────────────────
      rescue:
        - name: "ROLLBACK: Log rollback trigger"
          ansible.builtin.debug:
            msg: |
              UPDATE FAILED. Initiating automatic rollback.
              Restoring previous per-service compose/env files, then restarting.

        - name: "ROLLBACK: Restore previous per-service compose/env files"
          ansible.builtin.command:
            cmd: >
              cp -a {{ llamenos_rollback_dir }}/{{ item.name }}/. {{ item.project_src }}/
          loop: "{{ llamenos_compose_stack_here }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: true

        - name: "ROLLBACK: Stop all services"
          community.docker.docker_compose_v2:
            project_src: "{{ item.project_src }}"
            state: stopped
          loop: "{{ llamenos_compose_stack_here | reverse | list }}"
          loop_control:
            label: "{{ item.name }}"

        - name: "ROLLBACK: Start services with previous configuration"
          # No pull here — the restored compose file references the image
          # that was already running before the update, which must still be
          # cached locally.
          community.docker.docker_compose_v2:
            project_src: "{{ item.project_src }}"
            pull: never
            state: present
            recreate: always
            wait: true
            wait_timeout: 180
          loop: "{{ llamenos_compose_stack_here }}"
          loop_control:
            label: "{{ item.name }}"

        - name: "ROLLBACK: Verify PostgreSQL health after rollback"
          ansible.builtin.command: >
            docker compose -f {{ llamenos_compose_postgres }}
            exec -T postgres pg_isready -U llamenos -d llamenos
          register: pg_rollback_health
          retries: 15
          delay: 3
          until: pg_rollback_health.rc == 0
          changed_when: false
          when: "'postgres' in (llamenos_compose_stack_here | map(attribute='name'))"

        - name: "ROLLBACK: Verify health after rollback"
          ansible.builtin.uri:
            url: "http://localhost:3000/api/health"
            method: GET
            status_code: 200
          register: rollback_health
          retries: 20
          delay: 5
          until: rollback_health.status == 200

        - name: "ROLLBACK: Record rollback to version history"
          ansible.builtin.include_role:
            name: llamenos-version-tracker
            tasks_from: record
          vars:
            version_action: rollback-auto
            version_result: success

        - name: "ROLLBACK: Fail with rollback notice"
          ansible.builtin.fail:
            msg: |
              Update FAILED and has been ROLLED BACK automatically.
              The previous version is running at https://{{ domain }}.

              Investigate:
                ssh {{ deploy_user }}@{{ ansible_host }} 'docker compose -f {{ llamenos_compose_app }} logs --tail=100 app'

              Version history:
                just version-history
