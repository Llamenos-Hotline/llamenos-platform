---
# Manual Rollback Playbook
#
# Rolls back to the previous known-good deployment state.
# Restores the per-service compose/env snapshot taken by the last
# playbooks/update.yml run (under {{ app_dir }}/.rollback/services/), then
# restarts all installed services.
#
# Usage:
#   ansible-playbook playbooks/rollback.yml --ask-vault-pass
#   ansible-playbook playbooks/rollback.yml --ask-vault-pass -e rollback_skip_backup=true

- name: Rollback Llamenos to Previous Version
  hosts: all
  become: true
  vars_files:
    - ../vars.yml
  vars:
    rollback_skip_backup: false

  tasks:
    - name: Skip hosts without disk encryption (this play keeps data at rest)
      ansible.builtin.import_tasks: tasks/skip-unencrypted-host.yml
      tags: always

    - name: Discover installed per-service compose stacks
      ansible.builtin.import_tasks: tasks/discover-services.yml
      tags: always

    # ── Pre-flight Checks ──────────────────────────────────────────
    - name: Check rollback snapshot exists for each installed service
      ansible.builtin.stat:
        path: "{{ app_dir }}/.rollback/services/{{ item }}/docker-compose.yml"
      loop: "{{ llamenos_installed_services }}"
      register: rollback_files

    - name: Fail if no rollback state available
      ansible.builtin.fail:
        msg: |
          No rollback snapshot found for: {{ rollback_files.results
            | selectattr('stat.exists', 'false') | map(attribute='item') | join(', ') }}
          Expected under: {{ app_dir }}/.rollback/services/<service>/

          This snapshot is created by every playbooks/update.yml run. If this
          is a fresh deployment, there is nothing to roll back to.
      when: rollback_files.results | selectattr('stat.exists', 'false') | list | length > 0

    # ── Snapshot Current State ─────────────────────────────────────
    - name: Track current versions before rollback
      # `apply` is what tags the role's own tasks; `tags:` alone tags only the
      # include, so `--tags rollback` would run this and skip the role body.
      ansible.builtin.include_role:
        name: llamenos-version-tracker
        apply:
          tags: [rollback, version]
      tags: [rollback, version]

    - name: Display current versions (about to roll back from)
      ansible.builtin.debug:
        msg: "Rolling back from: {{ current_versions | to_nice_json }}"

    # ── Pre-rollback Backup ────────────────────────────────────────
    - name: Run pre-rollback backup
      ansible.builtin.include_role:
        name: backup
        apply:
          tags: [rollback, backup]
      when: not (rollback_skip_backup | bool)
      tags: [rollback, backup]

    # ── Perform Rollback ───────────────────────────────────────────
    - name: Restore previous per-service compose/env files
      ansible.builtin.command:
        cmd: >
          cp -a {{ app_dir }}/.rollback/services/{{ item }}/. {{ app_dir }}/services/{{ item }}/
      loop: "{{ llamenos_installed_services }}"
      changed_when: true

    - name: Stop all services
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}/services/{{ item }}"
        state: stopped
      loop: "{{ llamenos_installed_services | reverse | list }}"

    - name: Pull images referenced in restored compose files
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}/services/{{ item }}"
        pull: policy
        state: present
        recreate: always
        wait: true
        wait_timeout: 180
      loop: "{{ llamenos_installed_services }}"

    # ── Health Verification ────────────────────────────────────────
    - name: Wait for PostgreSQL after rollback
      ansible.builtin.command: >
        docker compose -f {{ app_dir }}/services/postgres/docker-compose.yml
        exec -T postgres pg_isready -U llamenos -d llamenos
      register: pg_health
      retries: 15
      delay: 3
      until: pg_health.rc == 0
      changed_when: false
      when: "'postgres' in llamenos_installed_services"

    - name: Wait for application health check
      ansible.builtin.uri:
        url: "http://localhost:3000/api/health"
        method: GET
        status_code: 200
        return_content: true
      register: rollback_health
      retries: 30
      delay: 5
      until: rollback_health.status == 200

    - name: Verify all installed services are running
      ansible.builtin.shell: |
        set -euo pipefail
        unhealthy=$(docker compose -f "{{ app_dir }}/services/{{ item }}/docker-compose.yml" ps --format json | \
          python3 -c "
        import sys, json
        lines = sys.stdin.read().strip().split('\n')
        for line in lines:
            if not line: continue
            svc = json.loads(line)
            state = svc.get('State', '')
            health = svc.get('Health', '')
            if state != 'running' or (health and health != 'healthy'):
                print(svc.get('Service', 'unknown'))
        " 2>/dev/null || true)
        if [ -n "$unhealthy" ]; then
          echo "UNHEALTHY in {{ item }}: $unhealthy"
          exit 1
        fi
        echo "{{ item }}: healthy"
      loop: "{{ llamenos_installed_services }}"
      register: all_services_check
      changed_when: false

    # ── Record Rollback ────────────────────────────────────────────
    - name: Record rollback to version history
      ansible.builtin.include_role:
        name: llamenos-version-tracker
        tasks_from: record
      vars:
        version_action: rollback-manual
        version_result: success

    - name: Clean up old images
      ansible.builtin.command: docker image prune -f
      changed_when: true

    - name: Display rollback summary
      ansible.builtin.debug:
        msg: |
          Rollback completed successfully.

          Application: https://{{ domain }}
          Health check: {{ rollback_health.json | default('OK') }}

          The previous version is now running. To view version history:
            ssh {{ deploy_user }}@{{ ansible_host }} 'cat {{ version_tracker_dir }}/history.json'
