---
# CI/dev verification playbook -- NOT part of the deployment flow.
#
# Proves the repo's group_vars/all/compose.yml (llamenos_compose_glob,
# llamenos_services_dir, llamenos_secrets_dir, the per-service Compose paths, ...)
# reaches a playbook under playbooks/ whatever directory the INVENTORY is in.
#
# Ansible loads group_vars from the inventory's directory and from the
# playbook's directory. group_vars/ used to live at deploy/ansible/, which is
# neither when the inventory is kept elsewhere -- a private directory, a scratch
# directory, `-i /somewhere/else/inventory.yml`. Every playbook that reads one of
# those variables then died with "'llamenos_compose_glob' is undefined" -- for
# harden.yml, in its LAST role, after sshd had already moved port. It now lives
# in playbooks/group_vars, next to the playbooks that need it, so the lookup by
# playbook directory finds it and the inventory can be anywhere. (It is a real
# directory, not a symlink: a directory symlink breaks every tool that walks the
# repo and reads what it finds.) This plays against an inventory in another
# directory and fails if the variables do not resolve.
#
# Usage (CI does exactly this):
#   d="$(mktemp -d)"; printf 'all:\n  hosts:\n    localhost:\n      ansible_connection: local\n' > "$d/inventory.yml"
#   cd deploy/ansible && ansible-playbook -i "$d/inventory.yml" playbooks/check-group-vars-resolve.yml

- name: Check group_vars resolve with the inventory outside deploy/ansible
  hosts: all
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../vars.yml
  tasks:
    - name: The canonical Compose paths must be defined and derive from app_dir
      ansible.builtin.assert:
        that:
          - llamenos_services_dir is defined
          - llamenos_compose_glob is defined
          - llamenos_secrets_dir is defined
          - llamenos_compose_app is defined
          - llamenos_compose_glob == app_dir ~ '/services/*/docker-compose.yml'
        fail_msg: >-
          group_vars/all/compose.yml was not loaded. The inventory is in
          {{ inventory_dir }}; Ansible looks for group_vars there and next to the
          playbook. playbooks/group_vars/all/compose.yml must exist next to the playbooks.
        quiet: true
