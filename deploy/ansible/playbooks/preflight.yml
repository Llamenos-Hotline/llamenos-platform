---
# Preflight Validation Playbook
#
# Validates all required variables before any server changes are made.
# Fails fast with a descriptive error if any required var is missing or invalid.
#
# This playbook is imported by setup.yml before any deployment operations.
# It is safe to run in --check mode (no changes made).
#
# Usage:
#   ansible-playbook playbooks/preflight.yml --check --diff
#   ansible-playbook playbooks/preflight.yml -e '@vars.yml'

- name: Validate target distribution before any role runs
  hosts: all
  gather_facts: true
  tasks:
    - name: Assert supported distribution
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - >
            (
              ansible_facts.distribution == 'Debian'
              and ansible_facts.distribution_major_version | int >= 12
            )
            or
            (
              ansible_facts.distribution == 'Ubuntu'
              and ansible_facts.distribution_release in supported_ubuntu_releases
            )
        fail_msg: |
          Unsupported target distribution.

          Detected: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} ({{ ansible_facts.distribution_release | default('unknown') }})

          Supported targets:
            - Debian 12 (bookworm) or newer
            - Ubuntu 22.04 (jammy)
            - Ubuntu 24.04 (noble)

          RHEL-family support is planned but not yet implemented.
          See deploy/ansible/README.md for the full supported list.
        success_msg: "Target {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} is supported."
      vars:
        supported_ubuntu_releases:
          - jammy
          - noble
      tags: always

    # The service roles skip hosts outside their inventory group with
    # `meta: end_role`, which is per-host. It exists from ansible-core 2.18;
    # the older `end_play` it replaced was evaluated for the FIRST host only
    # and then ended the play for all of them — in a two-host inventory that
    # put PostgreSQL on every host whenever the first one was in llamenos_db.
    - name: Assert the control node runs ansible-core 2.18 or newer
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.18', '>=')
        fail_msg: |
          ansible-core {{ ansible_version.full }} is too old: the roles rely on
          `meta: end_role` (ansible-core >= 2.18) to place each service only on its
          own hosts. Upgrade: pipx upgrade ansible (CI pins ansible==14.1.0).
        success_msg: "ansible-core {{ ansible_version.full }}"
        quiet: true
      run_once: true
      delegate_to: localhost
      become: false
      tags: always

    - name: Check SSH connectivity to target hosts
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ansible_port | default(22) }}"
        timeout: 10
      delegate_to: localhost
      become: false
      ignore_errors: true
      register: ssh_check
      tags: always

    - name: Report SSH connectivity
      ansible.builtin.debug:
        msg: "SSH connectivity check: {{ 'PASSED' if ssh_check is succeeded else 'FAILED (may require VPN or different network)' }}"
      tags: always

    - name: Verify Docker is installed and running
      ansible.builtin.command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
      register: docker_version
      changed_when: false
      ignore_errors: true
      tags: always

    - name: Report Docker status
      ansible.builtin.debug:
        msg: "Docker status: {{ docker_version.stdout if docker_version is succeeded else 'NOT INSTALLED (will be installed during hardening)' }}"
      tags: always

    - name: Assert minimum free disk space (10 GiB on root volume)
      ansible.builtin.assert:
        that:
          - (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | list | first).size_available >= 10737418240
        fail_msg: |
          INSUFFICIENT DISK SPACE: The root filesystem has less than 10 GiB free.

          Available: {{ ((ansible_facts.mounts | selectattr('mount', 'equalto', '/') | list | first).size_available / 1073741824) | round(1) }} GiB
          Required:  10 GiB minimum

          Free up space or provision a larger volume before deploying.
        success_msg: >-
          Disk space OK: {{ ((ansible_facts.mounts | selectattr('mount', 'equalto', '/') | list | first).size_available / 1073741824) | round(1) }} GiB free on /
      tags: always

    # import_tasks, not include_tasks: `tags: always` on a dynamic include tags only
    # the include itself, so under `--tags app` (every `just deploy-*` recipe) the
    # inner assert would be silently filtered out. An import is resolved at parse
    # time and hands the tag to every task in the file. scripts/check-disk-tier-guards.py
    # (group `tags`) fails the build if this regresses.
    - name: Assert minimum available RAM
      ansible.builtin.import_tasks: tasks/assert-memory.yml
      tags: always

- name: Preflight variable validation
  hosts: all
  gather_facts: false
  vars_files:
    - ../vars.yml

  tasks:
    - name: Print deployment target summary
      ansible.builtin.debug:
        msg: |
          ===========================================
          Llamenos Deployment Preflight Check
          ===========================================
          Target: {{ inventory_hostname }}
          Domain: {{ domain | default('NOT SET') }}
          Environment: {{ app_environment | default('production') }}
          Deploy User: {{ deploy_user | default('deploy') }}
          App Directory: {{ app_dir | default('/opt/llamenos') }}
          ===========================================
      tags: always

    - name: Assert domain is set
      ansible.builtin.assert:
        that:
          - domain is defined
          - domain | length > 0
          - domain != "hotline.yourdomain.org"
        fail_msg: |
          REQUIRED: 'domain' must be set to your actual domain name.

          Current value: {{ domain | default('NOT SET') }}

          To fix:
            1. Edit vars.yml
            2. Set domain: your-actual-domain.org
        success_msg: "domain: {{ domain }}"

    - name: Assert acme_email is set
      ansible.builtin.assert:
        that:
          - acme_email is defined
          - acme_email | length > 0
          - acme_email != "admin@yourdomain.org"
        fail_msg: |
          REQUIRED: 'acme_email' must be set to your actual email address for Let's Encrypt.

          Current value: {{ acme_email | default('NOT SET') }}

          To fix:
            1. Edit vars.yml
            2. Set acme_email: your-email@example.org
        success_msg: "acme_email: {{ acme_email }}"

    - name: Assert deploy_user is set
      ansible.builtin.assert:
        that:
          - deploy_user is defined
          - deploy_user | length > 0
        fail_msg: |
          REQUIRED: 'deploy_user' must be set to the non-root user that runs the application.

          Current value: {{ deploy_user | default('NOT SET') }}

          To fix:
            1. Edit vars.yml
            2. Set deploy_user: deploy
        success_msg: "deploy_user: {{ deploy_user }}"

    - name: Assert llamenos_app_image is set
      ansible.builtin.assert:
        that:
          - llamenos_app_image is defined
          - llamenos_app_image | length > 0
        fail_msg: |
          REQUIRED: 'llamenos_app_image' must be set to the Docker image for the Llamenos app.

          Current value: {{ llamenos_app_image | default('NOT SET') }}

          Example: llamenos_app_image: ghcr.io/<owner>/llamenos-platform:<version>

          There is deliberately no default. Set it to an image that actually
          exists and that this host can pull (if the package is private, the
          host needs a `docker login` first — no playbook performs one).

          To fix:
            1. Set llamenos_app_image in your vars file (vars-production.yml)
            2. Use a fully-qualified reference including an explicit tag
        success_msg: "llamenos_app_image: {{ llamenos_app_image }}"

    # apps/worker/lib/config.ts hard-fails at startup if ENVIRONMENT=production
    # and WEBHOOK_BASE_URL is unset (webhook signature validation would
    # otherwise fall back to the spoofable Host header). Fail here, before
    # anything is rendered to disk, rather than after the container is
    # already running and refusing to serve traffic. See #716/#771 review
    # round 2 — this is the same class of bug as the missing DATABASE_URL
    # that PR fixed, caught by the same completeness check
    # (deploy/ansible/scripts/check-required-env.py).
    - name: Assert webhook_base_url is set when app_environment is production
      ansible.builtin.assert:
        that:
          - webhook_base_url is defined
          - webhook_base_url | length > 0
        fail_msg: |
          REQUIRED: 'webhook_base_url' must be set to your public base URL
          (e.g. https://api.yourdomain.org) when app_environment is 'production'.

          Current value: {{ webhook_base_url | default('NOT SET') }}

          To fix:
            1. Edit vars.yml
            2. Set webhook_base_url: https://your-public-domain.org
        success_msg: "webhook_base_url: {{ webhook_base_url }}"
      when: (app_environment | default('production')) == 'production'

    - name: Warn if admin_pubkey is not set (Tauri desktop app bootstrap allowed)
      ansible.builtin.debug:
        msg: |
          WARNING: 'admin_pubkey' is not set. The first admin will need to be bootstrapped via the Tauri desktop app.

          To pre-configure an admin:
            1. Generate a keypair: bun run bootstrap-admin
            2. Copy the hex public key to admin_pubkey in vars.yml
      when: admin_pubkey is not defined or admin_pubkey | length == 0

    - name: Assert admin_pubkey is a valid 64-character hex string (if set)
      ansible.builtin.assert:
        that:
          - admin_pubkey | length == 64
          - admin_pubkey | regex_search('^[0-9a-f]{64}$') is truthy
        fail_msg: |
          INVALID: 'admin_pubkey' must be a 64-character lowercase hex string (Nostr public key).

          Current value: {{ admin_pubkey }}
          Length: {{ admin_pubkey | length }} chars (expected: 64)

          To fix:
            1. Generate a keypair: bun run bootstrap-admin
            2. Copy the hex public key to admin_pubkey in vars.yml
        success_msg: "admin_pubkey: {{ admin_pubkey[:8] }}... (64 chars)"
      when: admin_pubkey is defined and admin_pubkey | length > 0

    # The app demands EXACTLY 64 lowercase hex characters (assertHex64 in
    # apps/worker/lib/config.ts). This used to accept any 32+ characters, so a
    # 32- or 40-char secret passed preflight and then hard-failed at container
    # boot, long after Ansible reported success. The old fail_msg also echoed
    # the secret's value into the Ansible log; it now reports only its length.
    - name: Assert hmac_secret is a valid 64-character lowercase hex string
      ansible.builtin.assert:
        that:
          - hmac_secret is defined
          - hmac_secret | length == 64
          - hmac_secret is match('^[0-9a-f]{64}$')
        fail_msg: |
          REQUIRED: 'hmac_secret' must be exactly 64 lowercase hex characters.

          Length seen: {{ hmac_secret | default('') | length }} (expected: 64)

          The application rejects anything else at startup, so a value that is
          merely "long enough" here will crash-loop the container later.

          To generate:
            openssl rand -hex 32
        success_msg: "hmac_secret: [set, 64 hex chars]"

    - name: Assert server_secret is a valid 64-character hex string
      ansible.builtin.assert:
        that:
          - server_secret is defined
          - server_secret | length == 64
          - server_secret | regex_search('^[0-9a-f]{64}$') is truthy
        fail_msg: |
          REQUIRED: 'server_secret' must be exactly 64 lowercase hex characters.

          Current value: {{ server_secret | default('NOT SET') }}
          Length: {{ server_secret | default('') | length }} chars (expected: 64)

          To generate:
            openssl rand -hex 32
        success_msg: "server_secret: [set, 64 chars]"

    - name: Assert pg_password meets minimum length
      ansible.builtin.assert:
        that:
          - pg_password is defined
          - pg_password | length >= 16
        fail_msg: |
          REQUIRED: 'pg_password' must be at least 16 characters long.

          Current value: {{ pg_password | default('NOT SET') }}
          Length: {{ pg_password | default('') | length }} chars (expected: >= 16)

          To generate:
            openssl rand -base64 24
        success_msg: "pg_password: [set, {{ pg_password | length }} chars]"

    - name: Assert storage_access_key is set
      ansible.builtin.assert:
        that:
          - storage_access_key is defined
          - storage_access_key | length > 0
        fail_msg: |
          REQUIRED: 'storage_access_key' must be set.

          Current value: {{ storage_access_key | default('NOT SET') }}

          To generate:
            openssl rand -base64 24
        success_msg: "storage_access_key: [set]"

    - name: Assert storage_secret_key meets minimum length
      ansible.builtin.assert:
        that:
          - storage_secret_key is defined
          - storage_secret_key | length >= 16
        fail_msg: |
          REQUIRED: 'storage_secret_key' must be at least 16 characters long.

          Current value: {{ storage_secret_key | default('NOT SET') }}
          Length: {{ storage_secret_key | default('') | length }} chars (expected: >= 16)

          To generate:
            openssl rand -base64 24
        success_msg: "storage_secret_key: [set, {{ storage_secret_key | length }} chars]"

    # Demo/dev-only settings (demo_mode, dev_routes_enabled, dev_reset_secret) must
    # never reach a production instance. See issue #716.
    # import_tasks so the tag reaches every guard task under `--tags` (see the RAM
    # assert above for why include_tasks is not enough).
    - name: Include shared demo/dev-mode production safety guard
      ansible.builtin.import_tasks: tasks/guard-demo-mode.yml
      tags: always

    # Hosts without full-disk encryption may run only the push relay.
    # import_tasks: this is the control that keeps PostgreSQL and every secret off
    # an unencrypted host; a dynamic include would skip it under `--tags`.
    - name: Include shared disk-tier guard (no secrets at rest on unencrypted hosts)
      ansible.builtin.import_tasks: tasks/guard-disk-tier.yml
      tags: always

    - name: Assert bridge_secret is set when SIP bridge or Asterisk is enabled
      ansible.builtin.assert:
        that:
          - bridge_secret is defined
          - bridge_secret | length > 0
        fail_msg: |
          REQUIRED: 'bridge_secret' must be set when SIP bridge or Asterisk PBX is enabled.

          Current value: {{ bridge_secret | default('NOT SET') }}

          To generate:
            openssl rand -hex 32
        success_msg: "bridge_secret: [set, {{ bridge_secret | length }} chars]"
      when: (llamenos_asterisk_enabled | default(false) | bool) or (llamenos_sip_bridge_enabled | default(false) | bool)

    - name: Assert ntfy_domain is set when ntfy is enabled
      ansible.builtin.assert:
        that:
          - ntfy_domain is defined
          - ntfy_domain | length > 0
        fail_msg: |
          REQUIRED: 'ntfy_domain' must be set when ntfy push relay is enabled.
          This is the public hostname Caddy and Android devices use to reach
          the broker (see roles/llamenos-ntfy).

          Current value: {{ ntfy_domain | default('NOT SET') }}

          Example:
            ntfy_domain: "push.{{ domain }}"
        success_msg: "ntfy_domain: {{ ntfy_domain | default('NOT SET') }}"
      when: llamenos_ntfy_enabled | default(false) | bool

    # Unlike bridge_secret/signal_notifier_bearer_token below, ntfy_auth_token
    # is intentionally NOT asserted here: ntfy only accepts bearer tokens it
    # mints itself, so an operator-chosen value would be useless anyway.
    # roles/llamenos-ntfy generates it on first deploy — see that role's
    # tasks/main.yml — and it runs after preflight, so a hard requirement
    # here would make every fresh ntfy-enabled deploy fail before it starts.

    - name: Assert signal_notifier_bearer_token is set when Signal is enabled
      ansible.builtin.assert:
        that:
          - signal_notifier_bearer_token is defined
          - signal_notifier_bearer_token | length >= 32
        fail_msg: |
          REQUIRED: 'signal_notifier_bearer_token' must be at least 32 characters when the Signal messaging sidecar is enabled.
          This token must match the value configured in the signal-notifier sidecar.

          Current value: {{ signal_notifier_bearer_token | default('NOT SET') }}
          Length: {{ signal_notifier_bearer_token | default('') | length }} chars (expected: >= 32)

          To generate:
            openssl rand -hex 32
        success_msg: "signal_notifier_bearer_token: [set, {{ signal_notifier_bearer_token | length }} chars]"
      when: llamenos_signal_enabled | default(false) | bool

    - name: Warn if ntfy is not enabled
      ansible.builtin.debug:
        msg: "Note: ntfy push relay not enabled (Android push notifications via UnifiedPush disabled)"
      when: not (llamenos_ntfy_enabled | default(false) | bool)

    - name: Warn if bridge_secret is not set but SIP bridge/Asterisk is disabled
      ansible.builtin.debug:
        msg: "Note: bridge_secret not set (SIP bridge and Asterisk are disabled, so this is OK)"
      when: not (llamenos_asterisk_enabled | default(false) | bool) and not (llamenos_sip_bridge_enabled | default(false) | bool) and (bridge_secret is not
        defined or bridge_secret | length == 0)

    - name: Assert ssh_port is a valid port and differs from the FDE unlock port
      ansible.builtin.assert:
        that:
          - ssh_port is defined
          - (ssh_port | int) >= 1
          - (ssh_port | int) <= 65535
        fail_msg: |
          INVALID: 'ssh_port' must be an integer between 1 and 65535 (got: {{ ssh_port | default('NOT SET') }}).
        success_msg: "ssh_port: {{ ssh_port }}"

    - name: Warn if ssh_port collides with the dropbear unlock port
      ansible.builtin.debug:
        msg: >-
          WARNING: ssh_port is 2222, the port dropbear-initramfs uses for the FDE
          unlock shell. The two have DIFFERENT host keys, so your SSH client will
          report a changed host key after every reboot. Use a different port.
      when: (ssh_port | int) == 2222

    - name: Assert ssh_allowed_cidrs holds real CIDR ranges (a placeholder would lock you out or fail mid-hardening)
      ansible.builtin.assert:
        that:
          - ssh_allowed_cidrs is defined
          - ssh_allowed_cidrs | length > 0
          - >-
            ssh_allowed_cidrs
            | reject('match', '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
            | reject('match', '^[0-9a-fA-F:]+:[0-9a-fA-F:]*/[0-9]{1,3}$')
            | list | length == 0
        fail_msg: |
          INVALID: every entry of 'ssh_allowed_cidrs' must be an IPv4/IPv6 CIDR such as 203.0.113.7/32.

          Current value: {{ ssh_allowed_cidrs | default('NOT SET') }}

          These are the ONLY addresses UFW will let reach SSH after hardening. Use your
          admin machine's public egress address(es).
        success_msg: "ssh_allowed_cidrs: {{ ssh_allowed_cidrs }}"

    - name: Warn if SSH is open to the world
      ansible.builtin.debug:
        msg: |
          WARNING: ssh_allowed_cidrs includes '0.0.0.0/0' — SSH is open to the entire internet.

          This is a security risk. Restrict to your admin IP addresses:
            ssh_allowed_cidrs:
              - "203.0.113.1/32"
      when: "'0.0.0.0/0' in (ssh_allowed_cidrs | default([]))"

    - name: Validate backup_age_public_key format (if set)
      ansible.builtin.assert:
        that:
          - backup_age_public_key | length > 0
          - backup_age_public_key | regex_search('^age1[0-9a-z]{58}$') is truthy
        fail_msg: |
          INVALID: 'backup_age_public_key' does not appear to be a valid age public key.

          Expected format: age1... (59 characters starting with 'age1')
          Current value: {{ backup_age_public_key[:20] | default('NOT SET') }}...

          To generate a keypair:
            age-keygen -o backup-key.txt

          Then copy the public key (starts with 'age1') to backup_age_public_key in vars.yml.
          Store the private key somewhere safe (NOT on the server).
        success_msg: "backup_age_public_key: [valid age key]"
      when: backup_age_public_key | default('') | length > 0

    # DNS validation (official profile only)
    #
    # Resolved from the CONTROL node with getent (glibc — always present), NOT on
    # the target: a fresh box has no `dig`, and asking a third-party "what is my
    # IP" service from the server would leak its address for no reason. The
    # expected address is the inventory's ansible_host, so it must be the VPS's
    # public IPv4 (not a hostname) for this check to be meaningful.
    #
    # (In subdomain mode the apex is included: Caddy also requests a certificate
    # for it, to serve the redirect to the API host.)
    # Every name that Caddy will request a certificate for must already resolve
    # to this box: Let's Encrypt validates over HTTP-01/TLS-ALPN, so a missing
    # record means no certificate, and no certificate means the pinned Android
    # client cannot connect at all.
    #
    # Checked per host, for the names THIS host's Caddy serves (same placement
    # rule as roles/llamenos-caddy): in a split deployment the API names must
    # resolve to the app host and ntfy_domain to the relay host — so a push.
    # record left pointing at the app host fails here.
    - name: Validate DNS records point to this server
      when:
        - llamenos_dns_validation_enabled | default(false) | bool
        - groups.get('llamenos_proxy', []) | length == 0 or inventory_hostname in groups.get('llamenos_proxy', [])
      block:
        - name: Build the list of hostnames this host's Caddy will serve
          ansible.builtin.set_fact:
            _dns_names: >-
              {{
                (
                  ( [ (api_subdomain ~ '.' ~ domain) if (api_subdomain | default('') | length > 0) else domain ]
                    + ([ domain ] if (api_subdomain | default('') | length > 0) else [])
                    + ([ updates_domain, releases_domain ] if (llamenos_update_server_enabled | default(false) | bool) else []) )
                  if (_dns_serves_app | bool) else []
                )
                + ([ ntfy_domain ] if (_dns_serves_ntfy | bool) else [])
              }}
          vars:
            _dns_serves_app: >-
              {{ groups.get('llamenos_app', []) | length == 0
                 or inventory_hostname in groups.get('llamenos_app', []) }}
            _dns_serves_ntfy: >-
              {{ (llamenos_ntfy_enabled | default(false) | bool)
                 and (groups.get('llamenos_ntfy', []) | length == 0
                      or inventory_hostname in groups.get('llamenos_ntfy', [])) }}

        - name: Resolve each hostname (IPv4) from the control node
          ansible.builtin.command: getent ahostsv4 {{ item }}
          loop: "{{ _dns_names }}"
          register: _dns_lookups
          changed_when: false
          failed_when: false
          delegate_to: localhost
          become: false

        - name: Assert every hostname resolves to this server
          ansible.builtin.assert:
            that:
              - (ansible_host | default(inventory_hostname)) in (item.stdout_lines | map('split') | map('first') | list)
            fail_msg: >-
              DNS mismatch: {{ item.item }} resolves to
              {{ (item.stdout_lines | map('split') | map('first') | unique | list) or 'nothing' }},
              expected this server's address {{ ansible_host | default(inventory_hostname) }}.
              Create/fix the A record at your DNS host and wait for propagation
              (ansible_host in the inventory must be the VPS public IPv4, not a hostname).
            quiet: true
          loop: "{{ _dns_lookups.results }}"
          loop_control:
            label: "{{ item.item }}"

    - name: Preflight checks passed
      ansible.builtin.debug:
        msg: |
          ===========================================
          ALL PREFLIGHT CHECKS PASSED
          ===========================================
          Domain: {{ domain }}
          Admin Pubkey: {{ (admin_pubkey[:16] + '...') if (admin_pubkey | default('') | length > 0) else 'NOT SET (bootstrap via Tauri app)' }}
          Server Secret: {{ server_secret[:8] }}...
          PostgreSQL Password: [set, {{ pg_password | length }} chars]
          Storage Access Key: [set]
          Storage Secret Key: [set, {{ storage_secret_key | length }} chars]
          HMAC Secret: [set, {{ hmac_secret | length }} chars]
          Signal Messaging: {{ 'ENABLED' if llamenos_signal_enabled | default(false) | bool else 'DISABLED' }}
          SIP Bridge: {{ 'ENABLED' if llamenos_sip_bridge_enabled | default(false) | bool else 'DISABLED' }}
          Backup Encryption: {{ 'ENABLED' if backup_age_public_key | default('') | length > 0 else 'DISABLED (set backup_age_public_key to enable)' }}
          iOS Push (APNs): {{ 'ENABLED' if (apns_key_p8 | default('') | length > 0 and apns_key_id | default('') | length > 0 and apns_team_id | default('') | length > 0) else 'DISABLED' }}
          Android Push (ntfy): {{ 'ENABLED' if llamenos_ntfy_enabled | default(false) | bool else 'DISABLED' }}
          Crash Reporting (GlitchTip): {{ 'ENABLED' if glitchtip_dsn | default('') | length > 0 else 'DISABLED' }}
          Demo Mode: {{ 'ENABLED' if demo_mode | default(false) | bool else 'DISABLED' }} (app_environment={{ app_environment | default('production') }})
          Dev Routes: {{ 'ENABLED' if dev_routes_enabled | default(false) | bool else 'DISABLED' }}
          Webhook Base URL: {{ webhook_base_url if (webhook_base_url | default('') | length > 0) else 'NOT SET' }}
          ===========================================
          Proceeding with deployment...
          ===========================================
