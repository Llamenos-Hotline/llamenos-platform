---
# One definition of "a usable Grafana admin password", imported by BOTH
# playbooks/preflight.yml (fail before any host is touched) and
# roles/llamenos-grafana (fail even when the role is run on its own, e.g.
# `ansible-playbook playbooks/observability.yml --tags grafana`, which skips
# preflight).
#
# Why it is an error and not a default: GF_SECURITY_ADMIN_PASSWORD="" is not
# "no admin account", it is "unset" -- Grafana then keeps its built-in
# admin/admin login. A role that tolerates an empty value therefore does not
# fail safe; it deploys a default credential. Measured on a deployed host:
#
#   grafana admin:[admin] -> HTTP 200
#   grafana admin:[]      -> HTTP 401
#
# The value is never echoed: neither the failure message nor the success message
# contains it, only whether it is set and how long it is.
#
# Imported (not included) so that `tags: always` reaches the assert under a
# `--tags` run.

- name: Assert grafana_admin_password is a real credential
  ansible.builtin.assert:
    that:
      - grafana_admin_password is defined
      - grafana_admin_password is string
      - grafana_admin_password | length >= 16
      - grafana_admin_password is not search('\s')
      - grafana_admin_password is not search('["\\\\]')
    fail_msg: |
      REQUIRED: 'grafana_admin_password' must be set to a password of at least 16
      characters (no whitespace, double quotes or backslashes) whenever Grafana is
      deployed. Left empty, Grafana ships its built-in admin/admin login.

      Current state: {{ 'SET' if (grafana_admin_password | default('') | string) | length > 0 else 'NOT SET' }}
      Length: {{ (grafana_admin_password | default('') | string) | length }} chars (expected: >= 16)

      To generate:
        openssl rand -base64 24
      Add it to vars-production.yml (or vars.yml) and re-run. If Grafana was already
      deployed with the default login, the role changes the live password to this
      value on the next run.
    success_msg: "grafana_admin_password: [set, {{ (grafana_admin_password | default('') | string) | length }} chars]"
  tags: always
