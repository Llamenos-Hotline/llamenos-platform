---
# CI/dev verification playbook — NOT part of the deployment flow.
#
# Renders both the monolithic role's .env template (roles/llamenos/templates/env.j2)
# and the per-service app role's .env template (roles/llamenos-app/templates/env/app.j2)
# against a representative variable set, so that
# deploy/ansible/scripts/check-required-env.py can assert that every
# environment variable apps/worker/lib/config.ts requires at startup is
# present in BOTH renders. See PR #771 review round 2 / issue #716.
#
# `env_check_suffix` lets the same playbook be run twice for two different
# scenarios without one run's output clobbering the other's:
#   - "required vars" scenario (production, no optional features) -> default
#     destination names (no suffix)
#   - "optional vars" scenario (every push/crash/Signal feature enabled, via
#     scripts/full-scenario.extra-vars.json) -> "-full" suffix, proving
#     APNS_*/NTFY_*/GLITCHTIP_DSN/SIGNAL_NOTIFIER_BEARER_TOKEN actually reach a
#     rendered .env and aren't dead plumbing (the "also fix" #2 finding in
#     review round 2).
#
# It also renders the two COMPOSE templates. The PostgreSQL service publishes
# its port on 127.0.0.1 only when `dev_routes_enabled` is set on a
# non-production environment (the end-to-end suite has to reach the deployed
# database over an SSH forward), and must publish nothing otherwise. That is the
# same "opposite outcomes from the same inputs" shape as the dev-route env vars,
# so check-required-env.py asserts both directions here too.
#
# Usage:
#   cd deploy/ansible
#   ansible-playbook playbooks/check-env-templates.yml \
#     -e @vars.example.yml -e app_environment=production \
#     -e webhook_base_url=https://example.org
#   ansible-playbook playbooks/check-env-templates.yml \
#     -e @vars.example.yml -e @scripts/full-scenario.extra-vars.json
#   python3 scripts/check-required-env.py

- name: Render both .env templates for completeness verification
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Render monolithic role env template (roles/llamenos/templates/env.j2)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/llamenos/templates/env.j2"
        dest: "/tmp/llamenos-check-env-monolithic{{ env_check_suffix | default('') }}.env"
        mode: "0600"

    - name: Render per-service app role env template (roles/llamenos-app/templates/env/app.j2)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/llamenos-app/templates/env/app.j2"
        dest: "/tmp/llamenos-check-env-app{{ env_check_suffix | default('') }}.env"
        mode: "0600"

    - name: Render per-service postgres role compose template (roles/llamenos-postgres/templates/compose/postgres.j2)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/llamenos-postgres/templates/compose/postgres.j2"
        dest: "/tmp/llamenos-check-compose-postgres{{ env_check_suffix | default('') }}.yml"
        mode: "0600"

    - name: Render monolithic role compose template (roles/llamenos/templates/docker-compose.j2)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/llamenos/templates/docker-compose.j2"
        dest: "/tmp/llamenos-check-compose-monolithic{{ env_check_suffix | default('') }}.yml"
        mode: "0600"
