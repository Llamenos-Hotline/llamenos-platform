---
# Llamenos Deployment Configuration
#
# This is a template configuration. Copy to vars.yml and customize for your deployment.
# All values shown here are defaults — uncomment and modify as needed.
#
# Deployment modes:
#   1. Production domain: domain = "hotline.example.org"
#   2. Subdomain mode (default): app.hotline.example.org, api.hotline.example.org
#   3. Single domain: set use_subdomains: false
#   4. Home/nip.io: domain = "192-168-1-100.nip.io" or local IP

# ─── Deployment Profile ─────────────────────────────────────────
# Deployment profile: "self-hoster" (default) or "official"
# self-hoster: app + postgres + rustfs + caddy + hardening + backups
# official: self-hoster + update server + monitoring + signal notifier + DNS validation
deployment_profile: "self-hoster"

# Official-profile feature flags (auto-enabled when deployment_profile == "official")
# These can also be set independently for custom configurations
llamenos_update_server_enabled: "{{ deployment_profile == 'official' }}"
llamenos_monitoring_enabled: "{{ deployment_profile == 'official' }}"
llamenos_signal_enabled: "{{ deployment_profile == 'official' }}"
llamenos_dns_validation_enabled: "{{ deployment_profile == 'official' }}"

# Update server configuration (only used when llamenos_update_server_enabled)
updates_domain: "updates.{{ domain }}"
releases_domain: "releases.{{ domain }}"
update_artifacts_dir: "{{ app_dir }}/services/update-server/artifacts"

# ─── Domain & TLS ────────────────────────────────────────────────
# Your domain name. Can be:
#   - A real domain: "hotline.example.org"
#   - A nip.io domain: "192-168-1-100.nip.io" (for local/home setups)
#   - A bare IP: "203.0.113.10" (not recommended for production)
domain: ""

# API subdomain — leave empty to serve API directly from the root domain
# Examples:
#   api_subdomain: "api"   → API at https://api.hotline.example.org
#   api_subdomain: ""      → API at https://hotline.example.org
api_subdomain: ""

# Email for Let's Encrypt certificate notifications
# Required for TLS certificate issuance
acme_email: ""

# ─── SSH Hardening ────────────────────────────────────────────────
# Port to move SSH to (default 22 is heavily targeted by bots)
# Set to 22 to keep default, or change to a non-standard port
ssh_port: 22

# CIDR ranges allowed to connect via SSH
# Default allows all (0.0.0.0/0) — restrict this in production!
# Examples:
#   - Your home IP: "203.0.113.10/32"
#   - Your office: "198.51.100.0/24"
#   - Disable SSH hardening: set ssh_hardening_enabled: false below
ssh_allowed_cidrs:
  - "0.0.0.0/0"

# Set to false to skip SSH hardening (useful for local/Vagrant deployments)
ssh_hardening_enabled: true

# ─── Deploy User ─────────────────────────────────────────────────
# The user that will own the application files and run Docker containers
deploy_user: deploy
deploy_group: deploy

# ─── Service Toggles ────────────────────────────────────────────
# Enable/disable services as needed
llamenos_app_enabled: true
llamenos_postgres_enabled: true
llamenos_caddy_enabled: true
llamenos_rustfs_enabled: true
# Whisper transcription — requires GPU or significant CPU
llamenos_transcription_enabled: false
# Asterisk PBX — for self-hosted telephony
llamenos_asterisk_enabled: false
# Signal messaging bridge (auto-enabled by deployment_profile == "official"; see Deployment Profile section)
# Kamailio SIP proxy
kamailio_enabled: false

# ─── Service Images ─────────────────────────────────────────────
# Docker images for each service
# Override these to use your own registry or specific versions
# No default. `docker.io/llamenos/llamenos:latest` used to sit here and has
# never existed — nothing in this project publishes to Docker Hub. Because
# preflight only asserts non-empty, that placeholder PASSED validation and
# then failed ~20 minutes later at the image pull, on the target host. An
# empty value makes preflight reject it up front instead.
llamenos_app_image: ""
llamenos_postgres_image: "postgres:17-alpine"
llamenos_caddy_image: "caddy:2.9-alpine"
llamenos_rustfs_image: "rustfs/rustfs:latest"
llamenos_whisper_image: "fedirz/faster-whisper-server:0.4.0-cpu" # 0.4.1 was never published (see #722)
llamenos_asterisk_image: "andrius/asterisk:20"
llamenos_signal_image: "bbernhard/signal-cli-rest-api:0.92"
llamenos_ntfy_image: "binwiederhier/ntfy:v2.11.0@sha256:4a7d0f0adc6d5d9fc36e64ab55ef676e76e124a2bdd50ce115b6d9c1c7430294"

# ─── Application ─────────────────────────────────────────────────
app_dir: /opt/llamenos
hotline_name: Hotline
app_environment: production

# Admin public key (hex pubkey for first admin)
# Leave empty to bootstrap via the Tauri desktop app
admin_pubkey: ""
# The admin's X25519 ENCRYPTION public key — a different value from
# admin_pubkey (which is the Ed25519 SIGNING key). Both are printed by
# `bun run bootstrap-admin`. Leaving this empty makes the app fall back to
# admin_pubkey, which seals admin envelopes to a key that cannot open them.
admin_decryption_pubkey: ""

# HMAC secret for hashing phone numbers and IPs
# Generate with: openssl rand -hex 32
hmac_secret: ""

# ─── PostgreSQL ──────────────────────────────────────────────────
# Generate with: openssl rand -hex 16
pg_password: ""
pg_pool_size: 10
llamenos_postgres_port: 5432

# ─── Storage (RustFS) ──────────────────────────────────────────
# Generate with: openssl rand -hex 16 (access key) and openssl rand -base64 32 (secret)
storage_access_key: ""
storage_secret_key: ""
storage_bucket: llamenos-files
storage_endpoint: http://rustfs:9000
storage_sse_enabled: true
llamenos_rustfs_port: 9000

# ─── Telephony (Twilio) ─────────────────────────────────────────
# Leave empty if configuring via the admin UI or using Asterisk
twilio_account_sid: ""
twilio_auth_token: ""
twilio_phone_number: ""

# ─── Server Identity ─────────────────────────────────────────────
# Generate with: openssl rand -hex 32
server_secret: ""

# ─── Push Notifications (Epic 86) ────────────────────────────────
# APNs (iOS). Leave all three empty to disable iOS push — the app already
# no-ops safely without them. Get these from the Apple Developer Portal.
apns_key_p8: ""
apns_key_id: ""
apns_team_id: ""

# ntfy/UnifiedPush (Android) — the ONLY Android push transport (no FCM; see
# deploy/PUSH_NOTIFICATIONS.md). Any deployment that serves Android testers
# must set llamenos_ntfy_enabled: true. Setting llamenos_ntfy_enabled: true stands up a
# self-hosted ntfy broker (roles/llamenos-ntfy) reachable by the app
# container at ntfy_url and by Android devices at ntfy_domain over TLS.
llamenos_ntfy_enabled: false
ntfy_url: "http://ntfy:80"
# Public hostname for the broker, e.g. "push.{{ domain }}". Required when
# llamenos_ntfy_enabled is true — Caddy and NTFY_BASE_URL both use it.
ntfy_domain: "push.{{ domain }}"
# Unlike every other secret in this file, do NOT generate this one with
# openssl: ntfy only accepts bearer tokens it mints itself. Leave this empty
# — roles/llamenos-ntfy generates it on first deploy (via `ntfy token add`)
# and overrides this value with the real one for the rest of the run. It is
# also persisted on the host at {{ app_dir }}/services/ntfy/.publish-token
# so re-deploys don't mint a new token every time.
ntfy_auth_token: ""

# ─── Crash Reporting (Epic 293) ──────────────────────────────────
# GlitchTip/Sentry DSN for client-side crash reporting. Leave empty to
# disable — the app already no-ops safely without it.
glitchtip_dsn: ""

# ─── Signal Messaging Sidecar Auth ───────────────────────────────
# Must match the token configured in the signal-notifier sidecar.
# Generate with: openssl rand -hex 32
signal_notifier_bearer_token: ""

# ─── Demo / Staging Mode ──────────────────────────────────────────
# NEVER set demo_mode: true when app_environment is 'production' — both the
# app (apps/worker/lib/config.ts) and the Ansible preflight guard
# (playbooks/tasks/guard-demo-mode.yml) hard-fail if you do.
# When demo_mode is true, demo_mode_confirm must be exactly "DESTROY_ALL_DATA"
# (two-factor confirmation the app requires at startup before it will run
# scheduled data resets).
demo_mode: false
demo_mode_confirm: ""

# ─── Developer/Test Routes ────────────────────────────────────────
# NEVER set dev_routes_enabled: true or a non-empty dev_reset_secret in
# production — same guard as demo_mode above applies. Currently these only
# take effect when app_environment is 'development' (widening that to
# staging/demo is tracked separately — #723).
dev_routes_enabled: false
dev_reset_secret: ""

# ─── Optional Profiles ──────────────────────────────────────────
# Docker Compose profiles to enable
# Available: transcription, asterisk, signal, monitoring
compose_profiles: []

# ─── Cross-Host Networking ──────────────────────────────────────
llamenos_internal_tls_enabled: false

# ─── Backup ─────────────────────────────────────────────────────
backup_enabled: true
backup_age_public_key: ""
backup_cron_hour: "3"
backup_cron_minute: "0"
backup_rclone_remote: ""

# ─── Per-Service Backup Retention ──────────────────────────────
backup_postgres_retain_daily: 7
backup_postgres_retain_weekly: 4
backup_postgres_retain_monthly: 3

backup_rustfs_retain_daily: 7
backup_rustfs_retain_weekly: 4
backup_rustfs_retain_monthly: 3

backup_config_retain_daily: 14
backup_config_retain_weekly: 8
backup_config_retain_monthly: 6
backup_config_extra_paths: []

# ─── Backup Monitoring ──────────────────────────────────────────
backup_monitor_max_age_hours: 26

# ─── Docker Hardening ───────────────────────────────────────────
# Enable Docker userns-remap for additional isolation
# Set to false if you encounter permission issues
docker_userns_remap: true

# ─── Firewall ───────────────────────────────────────────────────
# Additional ports to open (beyond SSH and HTTPS)
firewall_extra_ports: []

# ─── NTP ─────────────────────────────────────────────────────────
ntp_servers:
  - "0.pool.ntp.org"
  - "1.pool.ntp.org"
  - "2.pool.ntp.org"
  - "3.pool.ntp.org"

# ─── Observability ──────────────────────────────────────────────
# Auto-enabled when deployment_profile == "official" (via llamenos_monitoring_enabled,
# defined above). Previously this was hardcoded to `false` regardless of profile --
# the comment lied and a stock "official" deploy shipped with no metrics and no
# alerts (#1148). Self-hosters: set `observability_enabled: true` explicitly.
observability_enabled: "{{ llamenos_monitoring_enabled }}"
prometheus_enabled: true
grafana_enabled: true
loki_enabled: true
promtail_enabled: true
alertmanager_enabled: true
node_exporter_enabled: true
postgres_exporter_enabled: true
healthcheck_only: false

# Bearer token the Prometheus `llamenos-app` scrape job authenticates with against
# /api/metrics/prometheus (apps/worker/routes/metrics.ts). REQUIRED for the scrape
# to ever succeed -- without it the route has no way to authenticate a scraper that
# holds no admin session, and `up{job="llamenos-app"}` is permanently 0 (#1148).
# Generate with: openssl rand -hex 32
metrics_scrape_token: ""

prometheus_image: prom/prometheus:v3.2.1
prometheus_retention: 15d
prometheus_retention_size: 5GB
prometheus_scrape_interval: 15s

postgres_exporter_image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0

grafana_image: grafana/grafana-oss:11.5.2
grafana_admin_password: ""
grafana_domain: ""
grafana_allow_signup: false

loki_image: grafana/loki:3.4.2
loki_retention_period: 168h

promtail_image: grafana/promtail:3.4.2

alertmanager_image: prom/alertmanager:v0.28.1

alert_notification_method: ntfy
alert_smtp_host: ""
alert_smtp_port: 587
alert_smtp_username: ""
alert_smtp_password: ""
alert_smtp_from: ""
alert_smtp_to: ""

# No default receiver. "https://ntfy.sh/llamenos-alerts" was a guessable PUBLIC
# topic -- anyone who guessed it could watch this deployment's outage/health state
# in real time, and publish forged alerts into the on-call channel (#1148). The
# llamenos-alertmanager role's preflight fails the play if alertmanager_enabled is
# true and no receiver below is actually configured for alert_notification_method.
alert_ntfy_url: ""
alert_ntfy_topic: ""
alert_ntfy_token: ""

alert_webhook_url: ""

node_exporter_image: prom/node-exporter:v1.9.0

healthcheck_image: curlimages/curl:8.12.1
healthcheck_interval: 30
healthcheck_endpoints:
  - name: app
    url: "http://app:3000/api/health"
  - name: postgres
    url: "tcp://postgres:5432"
# Same guessable-public-topic problem as alert_ntfy_* above. Empty = no
# notification sent (logged locally only), which is strictly safer than
# broadcasting to a public default.
healthcheck_ntfy_url: ""
healthcheck_ntfy_topic: ""
healthcheck_ntfy_token: ""

# ─── Auto-Healing & Monitoring ──────────────────────────────────
llamenos_alert_webhook: ""
llamenos_watchdog_max_failures: 3
llamenos_watchdog_max_restarts: 5
llamenos_alert_cert_expiry_days: 7
llamenos_alert_disk_percent: 85

# ─── Alerting ───────────────────────────────────────────────────
# Auto-enabled for the "official" profile, same as llamenos_monitoring_enabled
# above -- this is the cron-based check (backup staleness, TLS expiry, NTP
# drift, disk, container health, PG size) that actually covers the signals the
# Prometheus alert rules can't yet, because the metrics behind them
# (llamenos_backup_age_seconds, llamenos_sip_bridge_status) have no production
# call sites (#1148). Self-hosters: set `llamenos_alerting_enabled: true`
# explicitly, and a receiver below, or this stays silent.
llamenos_alerting_enabled: "{{ deployment_profile == 'official' }}"
llamenos_alerting_provider: ntfy
# Same guessable-public-topic problem as alert_ntfy_* above -- empty by default.
llamenos_ntfy_url: ""
llamenos_ntfy_topic: ""
llamenos_ntfy_token: ""
llamenos_alerting_tags: "llamenos"

# ─── Security Scanning ──────────────────────────────────────────
security_auto_updates: true
security_update_hour: "4"
security_update_minute: "0"
security_scan_severity: "CRITICAL,HIGH"
security_scan_fail_on_os_updates: false
security_generate_sbom: false

# ─── System ─────────────────────────────────────────────────────
timezone: UTC
locale: en_US.UTF-8
