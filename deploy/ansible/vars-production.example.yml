---
# Llamenos PRODUCTION vars — template for an "official" deployment: an encrypted
# platform host plus an unencrypted push-relay host (inventory-production.example.yml
# holds the host layout and each host's llamenos_disk_encrypted marker).
#
# THIS FILE IS A TEMPLATE AND MUST NEVER CONTAIN REAL VALUES. Copy it, fill it in,
# then encrypt the copy:
#
#   cd deploy/ansible
#   cp vars-production.example.yml vars-production.yml     # gitignored
#   $EDITOR vars-production.yml
#   ansible-vault encrypt vars-production.yml               # prompts for the vault password
#
# vars-production.yml is passed with `-e @vars-production.yml` (extra-vars beat
# everything). Every playbook also loads the tracked deploy/ansible/vars.yml via
# `vars_files`; that file is a set of safe defaults (image tags, retention,
# toggles) — NEVER put real values in it, it is committed to git. Anything you
# set here overrides it.
#
# Every secret below is deliberately EMPTY so preflight (playbooks/preflight.yml)
# fails loudly if you forget one. Generate secrets on your workstation, not on
# the server, and keep the vault password out of the repo and out of shell history.

# ─── Profile ─────────────────────────────────────────────────────
# "official" = app + postgres + rustfs + caddy + hardening + the desktop update
# origin + DNS pre-validation. Set explicitly (also passed with -e by the
# scripts/workflow) so behaviour does not depend on the tracked vars.yml.
deployment_profile: official
llamenos_update_server_enabled: true
llamenos_dns_validation_enabled: true
# Android has no FCM by design: without ntfy, Android devices can never be rung.
# ntfy runs on the relay host (the `llamenos_ntfy` inventory group).
llamenos_ntfy_enabled: true
# Signal sidecar needs a registered Signal number + bearer token; enable it as a
# separate, later step (then also set signal_notifier_bearer_token below).
llamenos_signal_enabled: false
# observability_enabled and llamenos_alerting_enabled are deliberately NOT set
# here: the tracked vars.yml already derives both to `true` for
# deployment_profile == official (#1148). Set metrics_scrape_token and a
# notification receiver below, or preflight refuses to deploy with monitoring
# half-configured. Set either var to `false` here only to deliberately opt a
# specific official deployment out.

# ─── Domain & TLS ────────────────────────────────────────────────
# Apex domain you control. TLS terminates ON THIS BOX with a Let's Encrypt
# (ISRG-chained) certificate — see docs/deployment/first-deploy.md for why a CDN
# or provider proxy in front of it breaks the Android client.
domain: ""                       # REQUIRED e.g. your-domain.example
# Serve the app/API on api.<domain>; the apex only redirects to it.
api_subdomain: api
updates_domain: "updates.{{ domain }}"
releases_domain: "releases.{{ domain }}"
# The push relay's public name. It must resolve to the RELAY host, not the
# platform host every other name points at (preflight checks this per host).
# Infrastructure names for the official deployment live on llamenos-hotline.org
# whatever `domain` is; a self-hoster sets e.g. "push.{{ domain }}".
ntfy_domain: "push.llamenos-hotline.org"
# Public base URL clients and telephony webhooks use. REQUIRED in production.
webhook_base_url: "https://{{ api_subdomain }}.{{ domain }}"
# Let's Encrypt account/expiry notices. REQUIRED.
acme_email: ""                   # REQUIRED

# System hostname (cosmetic for TLS: Caddy takes its vhosts from `domain`, not the
# system hostname; it does affect logs, shell prompts and `uname -n`).
# Set per host in inventory/host_vars; defaults to the inventory hostname when unset.
# llamenos_system_hostname: hotline-host.example

# ─── SSH hardening (applied by playbooks/harden.yml, on both hosts) ─
# harden.yml moves sshd to this port. Pick a port that is NOT 2222: the FDE
# unlock shell (dropbear, initramfs) also listens on 2222 with a different host
# key, so reusing it produces host-key-changed warnings that train operators to
# ignore the very warning that would reveal a MITM.
ssh_port: 22022
# Only these source addresses may reach SSH (UFW), on both hosts. REQUIRED — your admin egress
# IP(s). Locking yourself out is recoverable only through the provider console.
ssh_allowed_cidrs:
  - "REPLACE_WITH_YOUR_IP/32"

# ─── Application ─────────────────────────────────────────────────
app_environment: production
hotline_name: Hotline
# App container image. The default in vars.yml (docker.io/llamenos/llamenos:latest)
# is NOT published — set this explicitly. See docs/deployment/first-deploy.md
# ("Getting the app image onto the server").
llamenos_app_image: ""           # REQUIRED e.g. llamenos:0.19.16 (docker load) or a registry ref
# Pull policy for the app image only: missing (default; use a docker-loaded image,
# pull only if absent) | always (refresh from a registry every run) | never.
# Leave unset unless you publish the image to a registry and want `always`.
# llamenos_app_image_pull_policy: missing
# Admin Ed25519 public key (64 lowercase hex): `bun run bootstrap-admin` on your
# workstation. Optional — the first admin can be bootstrapped from the desktop app.
# ─── Self-hosted telephony image (only used if asterisk is enabled) ─
# The sip-bridge sidecar's image. The bridge is obtained by WHICHEVER ROUTE
# this deployment uses for the app image — never a different one (issue #1697):
#   * Docker Hub release path: leave empty. Derived from llamenos_app_image by
#     putting `-sip-bridge` on the REPOSITORY, which is how the image is named
#     when it is published (images are published from a local machine, never
#     by CI).
#   * docker save | docker load: build and side-load it next to the app image —
#         docker build -t llamenos-sip-bridge:<version> ./sip-bridge
#         docker save llamenos-sip-bridge:<version> | ssh <host> sudo docker load
#     then set this to the tag you loaded.
#   * REQUIRED when llamenos_app_image is digest-pinned (repo@sha256:...): one
#     image's digest cannot imply a sibling's, so nothing can be derived.
# roles/llamenos-asterisk refuses to declare the service at all unless this
# image is actually obtainable, rather than rendering a compose entry that
# answers `manifest unknown` while the deploy reports success.
# llamenos_sip_bridge_image: ""

admin_pubkey: ""
# The admin's X25519 ENCRYPTION public key — a different value from
# admin_pubkey (which is the Ed25519 SIGNING key). Both are printed by
# `bun run bootstrap-admin`. Leaving this empty makes the app fall back to
# admin_pubkey, which seals admin envelopes to a key that cannot open them.
admin_decryption_pubkey: ""

# ─── Pinned service images (digests re-verified 2026-09-25) ──────
llamenos_postgres_image: postgres:17-alpine@sha256:3430fe182f5065a6ea505c3d432d2c7fff18fbab954df8f277c1dbf4c70124af
llamenos_caddy_image: caddy:2.9-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0

# ─── Secrets — generate each on your workstation ─────────────────
hmac_secret: ""                  # openssl rand -hex 32   (exactly 64 lowercase hex)
server_secret: ""                # openssl rand -hex 32   (exactly 64 hex chars)
server_kek: ""                   # openssl rand -hex 32   (own value: encrypts server-readable data)
ban_hash_key: ""                 # openssl rand -hex 32   (own value: secret FILE, never in .env or backups)
pg_password: ""                  # openssl rand -hex 24   (>= 16 chars)
storage_access_key: ""           # openssl rand -hex 16
storage_secret_key: ""           # openssl rand -hex 24   (>= 16 chars)
# signal_notifier_bearer_token: ""   # openssl rand -hex 32 — only if llamenos_signal_enabled
# REQUIRED when observability_enabled (true by default for this profile, see
# above): the bearer Prometheus presents to /api/metrics/prometheus. Without
# it the endpoint demands a signed-in admin holding `metrics:read`, which a
# scrape never is (#1624), so preflight refuses the deploy (#1148). Rendered
# into BOTH the worker's .env and the Prometheus scrape config from this value.
metrics_scrape_token: ""         # openssl rand -hex 32
# Password for the DEDICATED postgres_exporter DB role (pg_monitor only) --
# never reuse pg_password, which can read/write every table.
postgres_exporter_password: ""   # openssl rand -hex 24   (>= 16 chars)

# ─── Alert receiver (required when observability/alerting is enabled) ────
# Pick ONE: an unguessable ntfy topic (self-hosted ntfy strongly preferred over
# a public instance for an opsec-sensitive deployment), or a webhook. Never
# reuse a guessable topic like "llamenos-alerts" — see #1148.
alert_ntfy_url: ""
alert_ntfy_topic: ""
alert_ntfy_token: ""
llamenos_ntfy_url: "{{ alert_ntfy_url }}"
llamenos_ntfy_topic: "{{ alert_ntfy_topic }}"
llamenos_ntfy_token: "{{ alert_ntfy_token }}"

# ─── Backups (playbooks/backup.yml) ──────────────────────────────
# age PUBLIC key only. Keep the private key OFF the server (age-keygen -o key.txt).
# REQUIRED: preflight fails without it and no unencrypted backup path exists.
# Length is 62 characters: the literal "age1" prefix plus 58 bech32 characters.
# playbooks/preflight.yml asserts exactly that (^age1[0-9a-z]{58}$).
backup_age_public_key: ""        # age1...  (62 chars)

# Path ON THE TARGET HOST to the matching age PRIVATE key. Consumed by:
#   playbooks/restore.yml     — via restore_age_key_path, which defaults to
#                               this var. With backup_age_public_key set and
#                               this unset, restore.yml aborts: "Backups are
#                               encrypted with age but no private key path
#                               was provided."
#   playbooks/test-restore.yml — used directly, with NO default, so an unset
#                               value is an undefined-variable error.
#   playbooks/dr-test.yml     — does NOT read this var; it has its own
#                               `age_identity_file`, defaulting to
#                               /root/backup-key.txt. Set that one separately
#                               (or point it here) if you run DR drills.
#
# DECIDE THIS BEFORE YOUR FIRST BACKUP — the repo genuinely pulls both ways
# and cannot pick for you:
#   * The comment above, and standard practice, say keep the private key off
#     the server: an attacker who owns the box then cannot decrypt the
#     backups they can already read.
#   * restore.yml / test-restore.yml / dr-test.yml are host-side playbooks.
#     They run ON the server and shell out to `age -d -i <path>`, so an
#     automated restore drill needs the key present on that same box.
# Pick one:
#   (a) Highest confidentiality — leave this unset. Accept that restores and
#       DR drills are manual: copy the key to the host for the duration of
#       the restore, then shred it. Do not schedule dr-test.yml.
#   (b) Automated restore verification — store the key on the host at a path
#       only the deploy user can read (chmod 0400) and set it here. Your
#       backups are then only as confidential as the host is. Only do this
#       if the host has full-disk encryption.
# Either way this is a path, never the key material itself; never commit the
# key, and never put it in this file.
# backup_age_private_key_path: "/home/llamenos/.config/age/backup-key.txt"

# Off-site copy (rclone remote you configured on the server). Empty = local only.
backup_rclone_remote: ""

# ─── CORS / browser origins ──────────────────────────────────────
# The origins the app returns CORS headers for, and the only http(s) origins
# an OAuth redirect may target (apps/worker/middleware/cors.ts,
# apps/worker/lib/redirect-guard.ts). Rendered unconditionally into the
# worker's .env — before #1624 nothing rendered it, so every deployed host
# fell through to two origins hardcoded for this project's own hosts and a
# self-hoster's SPA was not on its own allowlist.
#
# Leave both of these unset to get the default, which is the vhost set Caddy
# actually serves: https://<api_subdomain>.<domain> plus https://<domain> when
# api_subdomain is set, https://<domain> alone when it is not, and app_domain
# as well when you define one. Tauri's own origins are always allowed and are
# never listed here.
#
# Setting CORS_ALLOWED_ORIGINS at all switches OFF the localhost-in-
# development escape hatch in both files, so if you override the list it must
# be COMPLETE — anything the browser actually loads from has to appear.
#
# cors_allowed_origins_extra: []        # appended to the two defaults
# cors_allowed_origins: []              # replaces them entirely

# ─── Signal queue retention ──────────────────────────────────────
# Days the Signal delivery queue keeps rows before cleanup (1-3650). Unset
# keeps the worker's 30-day default. The worker refuses to boot on a value
# outside that range.
# signal_queue_retention_days: 30

# ─── Webhook IP allowlists ───────────────────────────────────────
# Per-provider CIDR allowlists for inbound webhooks, rendered as
# <PROVIDER>_WEBHOOK_IPS (apps/worker/middleware/webhook-auth.ts,
# middleware/webhook-ip-allowlist.ts, messaging/router.ts). Empty by default:
# webhooks are authenticated by provider signature regardless, and a stale
# CIDR here rejects real traffic. Only add ranges you will keep current with
# what the provider publishes.
#
# webhook_ip_allowlists:
#   twilio: ["54.172.60.0/23", "34.203.250.0/23"]
#   telephony: ["54.172.60.0/23"]
webhook_ip_allowlists: {}
