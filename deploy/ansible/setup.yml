---
# Llamenos Main Setup Playbook
#
# This is the single entry point for all deployment operations.
# It runs hardening and deployment in the correct order.
#
# Usage:
#   ansible-playbook setup.yml                     # Full setup
#   ansible-playbook setup.yml --tags harden       # Hardening only
#   ansible-playbook setup.yml --tags deploy       # Deploy only
#   ansible-playbook setup.yml --ask-vault-pass    # If vars.yml is encrypted
#
# FIRST RUN ON A FRESH VPS: harden.yml moves sshd from port 22 to `ssh_port`,
# so the inventory's `ansible_port` must change between hardening and every run
# after it. Do not use this one-shot entry point for the very first run — run
# playbooks/harden.yml, edit ansible_port, then run setup.yml (or deploy.yml).
# See docs/deployment/first-deploy.md.

- name: Preflight validation
  ansible.builtin.import_playbook: playbooks/preflight.yml
  tags:
    - always
    - preflight

- name: Load configuration variables
  hosts: llamenos_servers
  gather_facts: false
  tasks:
    - name: Include vars file
      ansible.builtin.include_vars:
        file: vars.yml
      tags: always

- name: Harden server
  ansible.builtin.import_playbook: playbooks/harden.yml
  tags:
    - harden

- name: Deploy Llamenos
  ansible.builtin.import_playbook: playbooks/deploy.yml
  tags:
    - deploy

- name: Deploy Kamailio SIP Proxy
  hosts: llamenos_servers
  become: true
  vars_files:
    - vars.yml
  roles:
    - role: kamailio
      tags:
        - kamailio
        - deploy
      when: kamailio_enabled | default(false) | bool

- name: Deploy Observability Stack
  ansible.builtin.import_playbook: playbooks/observability.yml
  when: observability_enabled | default(false) | bool
  tags:
    - observability
    - deploy

# Backups are part of a deployment, not a separate thing an operator has
# to remember to run by full path afterwards. Before this import, a
# freshly deployed host had no backup scripts and no cron at all: nothing
# in setup.yml, deploy.yml, deploy-official.sh or any workflow referenced
# playbooks/backup.yml (#1125).
#
# It runs after deploy (the roles take an initial backup, which needs the
# services up) and before smoke-check (so a host that cannot back itself
# up fails the deploy rather than passing it).
- name: Install and verify backups
  ansible.builtin.import_playbook: playbooks/backup.yml
  when: backup_enabled | default(true) | bool
  tags:
    - backup
    - deploy

- name: Smoke-check validation
  ansible.builtin.import_playbook: playbooks/smoke-check.yml
  tags:
    - always
    - smoke-check
