---
# Canonical Docker Compose file locations.
#
# The multi-host refactor gave every service its own Compose project under
# {{ app_dir }}/services/<service>/. There is no aggregate
# {{ app_dir }}/docker-compose.yml on a production host — only the legacy
# `llamenos` role (used solely by playbooks/deploy-demo.yml) writes one.
#
# Day-2 operations (backup, restore, alerting, security scanning) must
# resolve service Compose files through these variables, never by
# hardcoding a path. CI enforces that: see the "No monolithic compose
# path outside the legacy demo role" step in .github/workflows/ci.yml.
#
# These live in inventory group_vars (not role defaults) so that every
# playbook and every role sees the same value, and an operator can
# override the layout in exactly one place.

llamenos_services_dir: "{{ app_dir }}/services"

llamenos_compose_app: "{{ llamenos_services_dir }}/app/docker-compose.yml"
llamenos_compose_postgres: "{{ llamenos_services_dir }}/postgres/docker-compose.yml"
llamenos_compose_rustfs: "{{ llamenos_services_dir }}/rustfs/docker-compose.yml"
llamenos_compose_caddy: "{{ llamenos_services_dir }}/caddy/docker-compose.yml"

# Glob expanding to every deployed service's Compose file. Used by the
# operations that act on "the whole stack" (restore's stop/start), which
# must not assume which optional services a given host runs.
llamenos_compose_glob: "{{ llamenos_services_dir }}/*/docker-compose.yml"

# Per-service `.env` file, rendered next to each Compose file.
llamenos_compose_env_app: "{{ llamenos_services_dir }}/app/.env.app"
llamenos_compose_env_postgres: "{{ llamenos_services_dir }}/postgres/.env.postgres"
llamenos_compose_env_rustfs: "{{ llamenos_services_dir }}/rustfs/.env.rustfs"
llamenos_compose_env_caddy: "{{ llamenos_services_dir }}/caddy/.env.caddy"

# Where update.yml snapshots each service's directory (Compose file + env)
# so rollback.yml and update.yml's own rescue can restore it.
llamenos_rollback_dir: "{{ app_dir }}/.rollback/services"

# The core stack in dependency order: data and storage before the app that
# needs them, the app before the proxy in front of it. update.yml and
# rollback.yml iterate this; they stop it in reverse.
#
# `group` is the inventory group that places the service (the same group the
# service's role checks before it renders anything), and `enabled` mirrors
# the role's own switch. Placement is therefore declared, never probed: a
# day-2 run against a half-broken host must still know what *should* be
# there, and fail on what is missing instead of silently skipping it.
llamenos_compose_stack:
  - name: postgres
    group: llamenos_db
    enabled: "{{ llamenos_postgres_enabled | default(true) }}"
    compose: "{{ llamenos_compose_postgres }}"
    env: "{{ llamenos_compose_env_postgres }}"
    project_src: "{{ llamenos_compose_postgres | dirname }}"
  - name: rustfs
    group: llamenos_storage
    enabled: "{{ llamenos_rustfs_enabled | default(true) }}"
    compose: "{{ llamenos_compose_rustfs }}"
    env: "{{ llamenos_compose_env_rustfs }}"
    project_src: "{{ llamenos_compose_rustfs | dirname }}"
  - name: app
    group: llamenos_app
    enabled: "{{ llamenos_app_enabled | default(true) }}"
    compose: "{{ llamenos_compose_app }}"
    env: "{{ llamenos_compose_env_app }}"
    project_src: "{{ llamenos_compose_app | dirname }}"
  - name: caddy
    group: llamenos_proxy
    enabled: "{{ llamenos_caddy_enabled | default(true) }}"
    compose: "{{ llamenos_compose_caddy }}"
    env: "{{ llamenos_compose_env_caddy }}"
    project_src: "{{ llamenos_compose_caddy | dirname }}"

# The subset of llamenos_compose_stack that belongs on THIS host, same
# placement rule the roles use: an empty group means "single host, runs
# everything"; otherwise the host must be a member.
llamenos_compose_stack_here: >-
  {%- set here = [] -%}
  {%- for svc in llamenos_compose_stack -%}
  {%- if (svc.enabled | bool)
         and (groups.get(svc.group, []) | length == 0
              or inventory_hostname in groups.get(svc.group, [])) -%}
  {%- set _ = here.append(svc) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ here }}
