---
# Service Discovery Role
#
# Computes cross-host connection variables based on inventory groups.
# When a service (e.g., postgres) runs on a different host than the consumer
# (e.g., app), the consumer gets the remote host's IP as the connection target.
#
# Single-host: all services use Docker network names (e.g., "postgres:5432").
# Multi-host: remote services use ansible_host IPs.

- name: Determine PostgreSQL connection target
  ansible.builtin.set_fact:
    llamenos_pg_host: >-
      {%- if groups.get('llamenos_db', []) | length > 0 and
             inventory_hostname not in groups.get('llamenos_db', []) -%}
        {{ hostvars[groups['llamenos_db'][0]]['ansible_host'] }}
      {%- else -%}
        postgres
      {%- endif -%}
    llamenos_pg_port: >-
      {%- if groups.get('llamenos_db', []) | length > 0 and
             inventory_hostname not in groups.get('llamenos_db', []) -%}
        {{ llamenos_postgres_port | default('5432') }}
      {%- else -%}
        5432
      {%- endif -%}

- name: Determine RustFS connection target
  ansible.builtin.set_fact:
    llamenos_rustfs_endpoint: >-
      {%- if groups.get('llamenos_storage', []) | length > 0 and
             inventory_hostname not in groups.get('llamenos_storage', []) -%}
        http://{{ hostvars[groups['llamenos_storage'][0]]['ansible_host'] }}:{{ llamenos_rustfs_port | default('9000') }}
      {%- else -%}
        http://rustfs:9000
      {%- endif -%}

- name: Determine Whisper transcription URL
  ansible.builtin.set_fact:
    llamenos_whisper_url: >-
      {%- if not (llamenos_transcription_enabled | default(false)) -%}
        {{ '' }}
      {%- elif groups.get('llamenos_transcription', []) | length > 0 and
              inventory_hostname not in groups.get('llamenos_transcription', []) -%}
        http://{{ hostvars[groups['llamenos_transcription'][0]]['ansible_host'] }}:8080/v1/audio/transcriptions
      {%- else -%}
        http://whisper:8080/v1/audio/transcriptions
      {%- endif -%}

- name: Determine app host for cross-service references
  ansible.builtin.set_fact:
    llamenos_app_host: >-
      {%- if groups.get('llamenos_app', []) | length > 0 and
             inventory_hostname not in groups.get('llamenos_app', []) -%}
        {{ hostvars[groups['llamenos_app'][0]]['ansible_host'] }}
      {%- else -%}
        app
      {%- endif -%}

# ntfy is the one service a split deployment deliberately puts on a DIFFERENT
# host (the push relay on an unencrypted, no-secrets-at-rest box; see
# docs/deployment/first-deploy.md). The app then cannot use the Docker-network
# name `ntfy` — it publishes through the relay's public TLS vhost instead.
# The bearer token follows from roles/llamenos-ntfy, which hands it to the app
# hosts once it has minted it.
- name: Determine ntfy publish URL (relay on another host)
  ansible.builtin.set_fact:
    ntfy_url: "https://{{ ntfy_domain }}"
  when:
    - llamenos_ntfy_enabled | default(false) | bool
    - groups.get('llamenos_ntfy', []) | length > 0
    - inventory_hostname not in groups.get('llamenos_ntfy', [])

- name: Compute DATABASE_URL for app service
  ansible.builtin.set_fact:
    llamenos_database_url: "postgresql://llamenos:{{ pg_password | url_userinfo }}@{{ llamenos_pg_host | trim }}:{{ llamenos_pg_port | trim }}/llamenos"

- name: Display service topology
  ansible.builtin.debug:
    msg: |
      Service topology for {{ inventory_hostname }}:
        PostgreSQL:    {{ llamenos_pg_host | trim }}:{{ llamenos_pg_port | trim }}
        RustFS:        {{ llamenos_rustfs_endpoint | trim }}
        ntfy:          {{ (ntfy_url | default('disabled')) if (llamenos_ntfy_enabled | default(false) | bool) else 'disabled' }}
        Whisper:       {{ llamenos_whisper_url | trim | default('disabled', true) }}
        App:           {{ llamenos_app_host | trim }}
        DATABASE_URL:  postgresql://llamenos:***@{{ llamenos_pg_host | trim }}:{{ llamenos_pg_port | trim }}/llamenos
