---
# RustFS backup defaults

backup_base_dir: "{{ app_dir }}/backups"
backup_rustfs_dir: "{{ backup_base_dir }}/rustfs"

# The backup reads the Docker volume behind the rustfs container's /data
# mount, so it needs no S3 endpoint, alias or credentials. Only the bucket
# name is still recorded, for the manifest and the restore summary.
backup_rustfs_bucket: llamenos-files

# Image used as the volume reader/writer. Needs only a shell and cp/tar.
backup_rustfs_helper_image: "alpine:3.22"

# Retention policy
backup_rustfs_retain_daily: 7
backup_rustfs_retain_weekly: 4
backup_rustfs_retain_monthly: 3

# Encryption
backup_age_public_key: ""

# Remote storage via rclone
backup_rclone_remote: ""

# Docker compose file path -- the rustfs service's own Compose project.
# See group_vars/all/compose.yml.
backup_compose_file: "{{ llamenos_compose_rustfs }}"
