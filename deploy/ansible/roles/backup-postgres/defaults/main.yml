---
# PostgreSQL backup defaults

# Base backup directory
backup_base_dir: "{{ app_dir }}/backups"
backup_postgres_dir: "{{ backup_base_dir }}/postgres"

# pg_dump options
backup_postgres_format: custom # custom (compressed), plain, directory
backup_postgres_jobs: 2 # parallel dump jobs (directory format only)
backup_postgres_compress: 9 # compression level (0-9)
backup_postgres_exclude_tables: [] # tables to skip (e.g., sessions, cache)

# NOTE: there is deliberately no `backup_postgres_wal_enabled` knob here.
# It used to exist and only ever created an empty directory -- no
# archive_command, no WAL shipping, no PITR. A switch that silently does
# nothing is worse than its absence, so it was removed (#1125). RPO is the
# backup interval (24h by default). Reinstate it only together with real
# WAL archiving.

# Retention policy
backup_postgres_retain_daily: 7
backup_postgres_retain_weekly: 4
backup_postgres_retain_monthly: 3

# Encryption -- REQUIRED. There is no unencrypted backup path: the script
# refuses to run without a recipient (#1125). playbooks/preflight.yml fails
# the deploy when backups are enabled and this is unset.
backup_age_public_key: ""

# Remote storage via rclone
backup_rclone_remote: "" # e.g., "s3:llamenos-backups/postgres"

# Docker compose file path -- the postgres service's own Compose project.
# See group_vars/all/compose.yml.
backup_compose_file: "{{ llamenos_compose_postgres }}"

# Database credentials
backup_postgres_user: llamenos
backup_postgres_db: llamenos
