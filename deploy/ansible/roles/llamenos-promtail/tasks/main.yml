---
# Promtail role
#
# Deploys Promtail to ship Docker container logs and system logs to Loki.
# Mounts the Docker socket (read-only) to auto-discover container labels.

- name: Create Promtail directory
  ansible.builtin.file:
    path: "{{ app_dir }}/observability/promtail"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"

# 0644, for the same reason as the Caddyfile (issue #1602, finding 2's class):
# compose bind-mounts this config into the promtail container, which runs as
# root — and `docker_userns_remap: true` maps that to host uid 100000, which
# is neither this file's owner nor in the deploy group, so 0640 made it
# unreadable. The config holds no credential; one that did would keep 0600 and
# be made readable by owner instead.
- name: Template Promtail config
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: "{{ app_dir }}/observability/promtail/promtail-config.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"
  notify: Restart promtail

- name: Template Promtail docker-compose.yml
  ansible.builtin.template:
    src: ../../../templates/compose/promtail.j2
    dest: "{{ app_dir }}/observability/promtail/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  notify: Restart promtail

- name: Start Promtail
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/observability/promtail"
    state: present
