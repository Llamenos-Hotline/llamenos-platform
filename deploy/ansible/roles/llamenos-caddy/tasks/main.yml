---
# Caddy reverse proxy role — deploys the TLS-terminating proxy
#
# Skips if:
#   - llamenos_caddy_enabled is false
#   - This host is not in the llamenos_proxy group (when the group has members)

- name: Skip if caddy not enabled
  ansible.builtin.meta: end_role
  when: not (llamenos_caddy_enabled | default(true))

- name: Skip if not assigned to this host
  ansible.builtin.meta: end_role
  when: >
    groups.get('llamenos_proxy', []) | length > 0 and
    inventory_hostname not in groups.get('llamenos_proxy', [])

- name: Decide which vhosts this host serves
  ansible.builtin.include_tasks: placement.yml

- name: Create caddy service directory
  ansible.builtin.file:
    path: "{{ app_dir }}/services/caddy"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"

# The updater artifacts directory is bind-mounted read-only into Caddy, so it
# must exist (owned by the deploy user, who rsyncs releases into it) before the
# stack starts — otherwise Docker creates it root-owned.
- name: Create update-server artifacts directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"
  loop:
    - "{{ update_artifacts_dir }}"
    - "{{ update_artifacts_dir }}/desktop"
  when:
    - _caddy_serves_app | bool
    - llamenos_update_server_enabled | default(false) | bool

- name: Template caddy compose file
  ansible.builtin.template:
    src: compose/caddy.j2
    dest: "{{ app_dir }}/services/caddy/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  notify: Restart caddy service

- name: Template Caddyfile
  ansible.builtin.template:
    src: caddy.j2
    dest: "{{ app_dir }}/services/caddy/Caddyfile"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"
  notify: Restart caddy service

- name: Pull caddy image
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/services/caddy"
    pull: always
    state: present
    recreate: never

- name: Start caddy service
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/services/caddy"
    state: present
  register: caddy_compose

# On an unencrypted disk, prove the log policy against the config Caddy
# actually runs — the deployed Caddyfile adapted by Caddy itself, not the
# template text: no server may carry an access log, and the default logger
# must drop client addresses and URIs. The file is fed on stdin because the
# container's single-file bind mount still shows the previous version until
# the restart handler runs.
- name: Read the deployed Caddyfile
  ansible.builtin.slurp:
    src: "{{ app_dir }}/services/caddy/Caddyfile"
  register: caddy_deployed_caddyfile
  when: not (llamenos_disk_encrypted | default(false) | bool)

- name: Adapt the deployed Caddyfile
  community.docker.docker_container_exec:
    container: llamenos-caddy-caddy-1
    command: caddy adapt --adapter caddyfile --config /dev/stdin
    stdin: "{{ caddy_deployed_caddyfile.content | b64decode }}"
  register: caddy_adapted
  changed_when: false
  when: not (llamenos_disk_encrypted | default(false) | bool)

- name: Assert no access log and IP/URI stripping on an unencrypted disk
  ansible.builtin.include_tasks: assert-log-policy.yml
  vars:
    caddy_adapted_config: "{{ caddy_adapted.stdout | from_json }}"
  when: not (llamenos_disk_encrypted | default(false) | bool)

# Handlers normally run at the end of the play. The certificate check below
# must see the Caddyfile this run deployed, so flush the restart handler here
# — the same reasoning roles/ssh-hardening documents for its own early flush.
- name: Apply any pending Caddy restart before verifying certificates
  ansible.builtin.meta: flush_handlers

- name: Verify Caddy obtained a certificate for every vhost it serves
  ansible.builtin.include_tasks: verify-certificates.yml
  when: llamenos_verify_certificates | default(true) | bool
