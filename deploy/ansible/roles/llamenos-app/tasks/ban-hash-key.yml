---
# Writes the ban-list hash key to its secret file (BAN_HASH_KEY, D6 / #2171).
#
# Included by roles/llamenos-app and, for the deprecated monolithic path, by
# roles/llamenos. The directory is a sibling of llamenos_services_dir, NOT inside
# it (group_vars/all/compose.yml explains why): no config backup, rollback
# snapshot or env_file may ever hold this key.
#
# `ban_hash_key_restart_handler` names the handler that restarts the app on the
# including role's path (the two paths use different handler names).
#
# Modes. The directory is 0700 so no other host user can reach the file. The
# file is 0444 because compose bind-mounts it at /run/secrets/ban-hash-key and
# the app reads it as its own uid, which under `docker_userns_remap: true` is
# neither the owner nor in the deploy group; the daemon (root) traverses the
# 0700 directory, the container only ever sees the file.
- name: Create the secrets directory (outside the backed-up services directory)
  ansible.builtin.file:
    path: "{{ llamenos_secrets_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0700"

- name: Write the ban-list hash key secret file
  ansible.builtin.copy:
    content: "{{ ban_hash_key }}\n"
    dest: "{{ llamenos_ban_hash_key_file }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0444"
  no_log: true
  notify: "{{ ban_hash_key_restart_handler }}"
