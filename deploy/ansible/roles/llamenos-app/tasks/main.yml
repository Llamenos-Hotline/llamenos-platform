---
# App service role — deploys the Node.js application container
#
# Skips if:
#   - llamenos_app_enabled is false
#   - This host is not in the llamenos_app group (when the group has members)

- name: Skip if app not enabled
  ansible.builtin.meta: end_role
  when: not (llamenos_app_enabled | default(true))

- name: Skip if not assigned to this host
  ansible.builtin.meta: end_role
  when: >
    groups.get('llamenos_app', []) | length > 0 and
    inventory_hostname not in groups.get('llamenos_app', [])

- name: Create app service directory
  ansible.builtin.file:
    path: "{{ app_dir }}/services/app"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"

- name: Write the hash key secret files
  ansible.builtin.include_tasks: hash-keys.yml
  vars:
    hash_keys_restart_handler: Restart app service

- name: Template app compose file
  ansible.builtin.template:
    src: compose/app.j2
    dest: "{{ app_dir }}/services/app/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  notify: Restart app service

- name: Template app environment
  ansible.builtin.template:
    src: env/app.j2
    dest: "{{ app_dir }}/services/app/.env.app"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  notify: Restart app service

# Pull policy: `missing` (default) pulls only when the image is absent locally, so
# an image put on the host with `docker save | ssh ... docker load` (the documented
# install path — docs/deployment/first-deploy.md) is used as-is instead of being
# re-pulled from a registry that does not have it. A registry-published image is
# still pulled when absent. Set llamenos_app_image_pull_policy: always to force a
# registry refresh on every run (e.g. a mutable tag you publish yourself).
# No ignore_errors: if the image is neither loaded nor pullable this must fail here,
# with the daemon's message, rather than surface later from the start task.
- name: Pull app image if not present locally
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/services/app"
    pull: "{{ llamenos_app_image_pull_policy | default('missing') }}"
    state: present
    recreate: never

# Before the container (re)starts and migrates: deploy.yml reaches here with a
# new image whenever llamenos_app_image changes, not only update.yml.
- name: Judge the image's migrations against this database before it starts
  ansible.builtin.include_tasks: migration-gate.yml

- name: Start app service
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/services/app"
    state: present
  register: app_compose

- name: Wait for app health check
  ansible.builtin.uri:
    url: "http://localhost:3000/api/health"
    method: GET
    status_code: 200
    return_content: true
  register: app_health
  retries: 20
  delay: 5
  until: app_health.status == 200
