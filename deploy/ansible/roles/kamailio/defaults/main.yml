---
# Kamailio SIP Proxy Role Defaults
#
# Kamailio acts as a SIP proxy/load-balancer for multiple PBX backends.
# It uses the dispatcher module for load balancing and JSONRPC for management.

# Enable/disable Kamailio deployment
kamailio_enabled: false

# Docker image
kamailio_image: kamailio/kamailio:5.8.2

# Service configuration
kamailio_service_name: llamenos-kamailio
kamailio_http_port: 5060
kamailio_tls_port: 5061
kamailio_jsonrpc_port: 5065

# Dispatcher configuration (PBX backends)
# List of SIP URIs for PBX backends to load balance across
kamailio_dispatcher_targets: []
# Example:
# kamailio_dispatcher_targets:
#   - sip:asterisk1.internal:5060
#   - sip:asterisk2.internal:5060
#   - sip:freeswitch1.internal:5060

# Dispatcher algorithm: 0=none, 4=weight-based, 8=call-load
kamailio_dispatcher_alg: 4

# Dispatcher probing: 0=disable, 1=enable
kamailio_dispatcher_probe: 1

# Dispatcher ping interval (seconds)
kamailio_dispatcher_ping_interval: 30

# TLS configuration
kamailio_tls_enabled: true

# HOST directory holding the TLS material, bind-mounted read-only into the
# container at kamailio_tls_container_dir. The self-signed certificate is
# generated here when nothing is present.
kamailio_tls_dir: "{{ app_dir }}/services/kamailio/tls"
kamailio_tls_container_dir: /etc/kamailio/tls

# HOST directory holding ONLY the published trust anchor, bind-mounted
# read-only into the APP container (not kamailio's) so the app can publish it in
# /api/telephony/sip-token.
#
# A directory of its own, deliberately, and not kamailio_tls_dir. That one is
# 0750 and holds kamailio.key at 0600, and under `docker_userns_remap: true` the
# app container's uid is neither its owner nor in the deploy group — so mounting
# it gave the app "Permission denied" on the directory itself (MEASURED on a
# hardened host: `ls` and `touch` both refused, and readSipTlsTrustAnchor
# therefore logged "not readable" and returned undefined). Loosening that
# directory is not the fix: the private key lives in it. Separating is — the
# anchor is a PUBLIC certificate this deployment hands to every client, so it
# can sit in a world-readable directory that contains nothing else.
kamailio_tls_anchor_dir: "{{ app_dir }}/services/kamailio/anchor"

# CONTAINER paths written into tls.cfg. Separate cert and key, because a real
# certificate is two files: Let's Encrypt via Caddy gives `<domain>.crt` +
# `<domain>.key`, certbot `fullchain.pem` + `privkey.pem`. The defaults name
# the self-signed pair generated below, so a deployment that overrides neither
# behaves as before.
kamailio_tls_cert_file: "{{ kamailio_tls_container_dir }}/kamailio.crt"
kamailio_tls_key_file: "{{ kamailio_tls_container_dir }}/kamailio.key"

# Let's Encrypt (ENCOURAGED for production).
#
# Caddy already holds an ISRG-chained certificate for `domain` in its own
# `caddy-data` volume. Set this to the HOST directory holding the certificate
# and key you want the SIP edge to serve — typically a directory an export job
# or Caddy itself writes to — and it is mounted READ-ONLY at
# kamailio_tls_container_dir in place of kamailio_tls_dir. Then point
# kamailio_tls_cert_file / kamailio_tls_key_file at the files inside it, and
# leave the published anchor empty (see kamailio_tls_publish_anchor) so clients
# verify against the public roots — ISRG Root X1 and X2 are both in
# liblinphone's bundled CA set, so no anchor is needed for an LE chain.
#
# A renewal does NOT reach a running daemon on its own: see
# kamailio_tls_reload_enabled.
# kamailio_tls_cert_source_dir: /var/lib/llamenos/sip-tls

# Publish the SIP edge's certificate as a trust anchor for clients. Required
# for the self-signed default — nothing in the device trust store can vouch for
# it. Set false for a publicly-trusted (e.g. Let's Encrypt) certificate: the
# client then verifies against its own CA set and no anchor is published.
kamailio_tls_publish_anchor: true

# Watch the certificate and reload Kamailio when it changes. MUST stay on for
# any ACME certificate: Kamailio reads the certificate once at module init, so
# a renewal is invisible to it and the edge serves an expired certificate about
# 60 days after deploy — clients then fail closed and no call is answered.
kamailio_tls_reload_enabled: true
# How often to check. The check is a hash comparison and reloads nothing when
# unchanged, so this is cheap.
kamailio_tls_reload_on_calendar: "hourly"

# Every hostname or IP a volunteer's client may dial for the SIP domain. These
# become subjectAltName entries on the generated certificate: a client verifies
# the hostname as well as the chain, so a name missing here fails the handshake
# no matter how the chain is anchored. Bare IPv4 literals become IP: SANs.
kamailio_tls_sans:
  - "{{ kamailio_sip_domain }}"

# Path on the host to the ISSUING ROOT of a real certificate, when one is
# installed. Publishing the root rather than the leaf keeps registered clients
# working across renewals. Unset = the self-signed certificate is its own
# anchor, which is correct for that case.
# kamailio_tls_anchor_source: /etc/ssl/certs/my-ca.pem

# Rate limiting
kamailio_rate_limit_enabled: true
kamailio_rate_limit_reqs_per_sec: 100

# Logging
kamailio_log_level: 2 # 0=alert, 1=crit, 2=err, 3=warn, 4=notice, 5=info, 6=debug

# JSONRPC credentials (for sip-bridge integration)
kamailio_jsonrpc_user: kamailio
kamailio_jsonrpc_password: ""

# SIP domain
kamailio_sip_domain: "{{ domain }}"

# Max call duration (seconds, 0=unlimited)
kamailio_max_call_duration: 3600

# Enable record routing for NAT traversal
kamailio_record_route_enabled: true

# NAT keepalive interval (seconds)
kamailio_nat_keepalive: 60
