---
# Configuration backup role
#
# Archives deployment configuration files:
# - docker-compose.yml, .env, Caddyfile
# - Optional extra paths (TLS certs, etc.)
# - Docker image versions, installed packages
# - Optional age encryption
# - Retention policy (daily/weekly/monthly)
# - Manifest logging with SHA-256 checksums

# Checked before reaching for apt so the role is a no-op on a host that
# already has age (and so it can run unprivileged where age is provided
# out of band, which is how playbooks/verify-backup-restore.yml exercises
# these roles without root).
- name: Check whether age is already installed
  ansible.builtin.command: age --version
  register: age_installed
  changed_when: false
  failed_when: false

- name: Install age encryption tool
  ansible.builtin.apt:
    name: age
    state: present
  when: age_installed.rc != 0

# BAN_HASH_KEY must stay out of every backup (D6, A16): a key that has to stay
# out of the database must also stay out of the archive that ships offsite. It
# lives in llamenos_secrets_dir, a sibling of llamenos_services_dir. Refuse to
# run if a path in the archive set would collect it -- whether someone widened
# backup_config_paths to {{ app_dir }}, or moved the secret under the services tree.
- name: Assert no config backup path collects the ban-hash-key secret file
  ansible.builtin.assert:
    that:
      - llamenos_ban_hash_key_file != item
      - not (llamenos_ban_hash_key_file | string).startswith((item | string | regex_replace('/+$', '')) ~ '/')
    fail_msg: >-
      The config backup path '{{ item }}' would collect {{ llamenos_ban_hash_key_file }}.
      BAN_HASH_KEY must be excluded from every backup: narrow the path or move
      llamenos_secrets_dir (group_vars/all/compose.yml).
    quiet: true
  loop: "{{ backup_config_paths + backup_config_extra_paths }}"

- name: Create config backup directories
  ansible.builtin.file:
    path: "{{ backup_config_dir }}/{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0700"
  loop:
    - daily
    - weekly
    - monthly

- name: Template config backup script
  ansible.builtin.template:
    src: backup-config.sh.j2
    dest: "{{ app_dir }}/scripts/backup-config.sh"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"

- name: Run initial config backup
  ansible.builtin.command: "{{ app_dir }}/scripts/backup-config.sh --manifest"
  become_user: "{{ deploy_user }}"
  register: initial_config_backup
  # See the note in roles/backup-postgres/tasks/main.yml: the match string
  # never matched the script's output and ignore_errors hid failures
  # (#1125). The config archive holds every service .env, so a silent
  # failure here means the secrets are not backed up at all.
  changed_when: "'backup complete' in initial_config_backup.stdout"

- name: Display initial backup result
  ansible.builtin.debug:
    msg: "{{ initial_config_backup.stdout_lines | default(['No output']) }}"
  when: initial_config_backup is defined
