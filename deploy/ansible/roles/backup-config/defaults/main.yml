---
# Configuration backup defaults

backup_base_dir: "{{ app_dir }}/backups"
backup_config_dir: "{{ backup_base_dir }}/config"

# Paths to back up.
#
# The per-service layout ({{ app_dir }}/services/<svc>/) holds both the
# Compose projects and the per-service .env files, so archiving the
# directory captures the whole deployed configuration -- including the
# service secrets. That is why this archive MUST be encrypted; the script
# refuses to run without an age recipient (#1125).
backup_config_paths:
  - "{{ llamenos_services_dir }}"
  - "{{ app_dir }}/Caddyfile"
  - "{{ app_dir }}/caddy/Caddyfile"

# Optional extra paths (TLS certs, etc.)
backup_config_extra_paths: []
# NOTE: `backup_config_ansible_dir` used to be declared here and was
# referenced by nothing -- the Ansible vault holding the server secrets
# lives on the control node, not the target host, so this role can never
# reach it. Back the vault up where it lives; see
# docs/runbooks/disaster-recovery.md (#1125).

# Retention policy
backup_config_retain_daily: 14
backup_config_retain_weekly: 8
backup_config_retain_monthly: 6

# Encryption -- REQUIRED, and non-negotiable for this archive specifically:
# it contains every service .env, i.e. the database password, the server
# identity secret and every provider credential. An unencrypted copy of it
# sitting next to the plaintext pg_dump -- and uploaded to the same offsite
# remote -- is ciphertext shipped with its own key (#1125).
backup_age_public_key: ""

# Remote storage via rclone
backup_rclone_remote: ""
