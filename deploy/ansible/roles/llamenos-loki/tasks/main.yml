---
# Loki role
#
# Deploys Grafana Loki for centralized log aggregation. Stores logs on local
# filesystem with configurable retention. Promtail ships logs to Loki.

- name: Create Loki directories
  ansible.builtin.file:
    path: "{{ app_dir }}/observability/loki/{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"
  loop:
    - ""
    - data

# 0644, for the same reason as the Caddyfile (issue #1602, finding 2's class):
# compose bind-mounts this config into the loki container, which runs as uid
# 10001 (grafana/loki sets USER 10001), so a 0640 file owned by the deploy
# user was unreadable to it. The config holds no credential (auth_enabled is
# false and storage is a local volume); one that did would keep 0600 and be
# made readable by owner instead.
- name: Template Loki config
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ app_dir }}/observability/loki/loki-config.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"
  notify: Restart loki

- name: Template Loki docker-compose.yml
  ansible.builtin.template:
    src: ../../../templates/compose/loki.j2
    dest: "{{ app_dir }}/observability/loki/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  notify: Restart loki

- name: Start Loki
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/observability/loki"
    state: present
