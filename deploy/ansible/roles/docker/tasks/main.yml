---
# Docker role
#
# Installs Docker CE from the official repository with security hardening:
# - User namespace remapping (isolates container UIDs from host)
# - Default no-new-privileges (prevents privilege escalation in containers)
# - Logging configuration with rotation
# - Deploy user added to docker group

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present

# Docker publishes separate apt trees per distribution
# (download.docker.com/linux/debian vs /linux/ubuntu). The project's FDE installer
# ISO installs Debian 13 (trixie), so the distribution and codename are taken
# from gathered facts instead of being hard-coded to Ubuntu — an Ubuntu URL
# with a Debian codename (linux/ubuntu trixie) is a 404 and fails `apt update`.
- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    owner: root
    group: root

- name: Get system architecture
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
      {{ ansible_facts.distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Create Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

# ORDERING INVARIANT — do not reorder.
# daemon.json sets "userns-remap": "default", which dockerd resolves to the
# `dockremap` user. dockerd refuses to start ("no subuid ranges found for user
# dockremap") unless that user AND its /etc/subuid + /etc/subgid ranges already
# exist. So: create the user, write the ranges, THEN render daemon.json and let
# the `Restart docker` handler (flushed below) bring dockerd up in remap mode.
# Restarting inline before the ranges exist aborts the play on a fresh host,
# and the range tasks after it never run.
- name: Create dockremap user for userns-remap
  ansible.builtin.user:
    name: dockremap
    system: true
    home: /nonexistent
    shell: /usr/sbin/nologin
    create_home: false
  when: docker_userns_remap

# lineinfile (not copy) so unrelated entries in /etc/subuid + /etc/subgid are
# preserved. The regexp anchors on the user name, so a re-run replaces the
# existing line in place instead of appending a duplicate.
- name: Set userns-remap subordinate ID ranges
  ansible.builtin.lineinfile:
    path: "{{ item.file }}"
    regexp: "^{{ item.user }}:"
    line: "{{ item.user }}:{{ item.start }}:65536"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - { file: /etc/subuid, user: dockremap, start: 100000 }
    - { file: /etc/subgid, user: dockremap, start: 100000 }
    - { file: /etc/subuid, user: "{{ deploy_user }}", start: 200000 }
    - { file: /etc/subgid, user: "{{ deploy_user }}", start: 200000 }
  when: docker_userns_remap

- name: Configure Docker daemon for production
  ansible.builtin.template:
    src: docker-daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

# Apply the daemon.json change (and with it userns-remap) now, not at end of play:
# the checks and network creation below must run against the final daemon, since
# userns-remap switches dockerd to a different data root.
- name: Apply Docker daemon configuration
  ansible.builtin.meta: flush_handlers

- name: Verify Docker restart policies on all containers
  ansible.builtin.shell: |
    docker ps -a --format '{{ '{{' }}.Names{{ '}}' }}:{{ '{{' }}.Status{{ '}}' }}' | \
      while IFS=: read name status; do
        policy=$(docker inspect --format '{{ '{{' }}.HostConfig.RestartPolicy.Name{{ '}}' }}' "$name" 2>/dev/null)
        if [ "$policy" != "unless-stopped" ] && [ "$policy" != "always" ]; then
          echo "WARNING: $name has restart policy: $policy"
        fi
      done
  register: restart_policy_check
  changed_when: false
  failed_when: false

- name: Add deploy user to docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Enable containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Verify Docker is running
  ansible.builtin.command: docker info
  changed_when: false

- name: Create Llamenos Docker networks
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
    driver: bridge
  loop:
    - llamenos-web
    - llamenos-observability
  tags: [docker, deploy]

# llamenos-internal has a DECLARED subnet because Asterisk is pinned to an
# address in it (roles/llamenos-asterisk) and CoTURN allows exactly that one
# address as a relay peer (roles/llamenos-coturn, #2136). A network on the
# daemon's default pool would hand Asterisk whatever address was free, and the
# relay's allowance would then name a container that is not the media server.
- name: Assert the llamenos-internal addressing variables are set
  ansible.builtin.assert:
    that:
      - llamenos_internal_subnet is defined
      - llamenos_internal_ip_range is defined
      - asterisk_internal_ip is defined
    fail_msg: >-
      llamenos_internal_subnet, llamenos_internal_ip_range and asterisk_internal_ip
      are required (#2136). They are in vars.example.yml; copy them into vars.yml.
  tags: [docker, deploy]

- name: Create the llamenos-internal Docker network with its declared subnet
  community.docker.docker_network:
    name: llamenos-internal
    state: present
    driver: bridge
    ipam_config:
      - subnet: "{{ llamenos_internal_subnet }}"
        # Dynamic allocations come from here ONLY. Docker otherwise hands out the
        # lowest free address, so the ninth container on this network would be
        # given Asterisk's pinned address if it started first — and inherit the
        # relay's allowance. Measured: with an iprange, unpinned containers get
        # .129, .130, ... and a pinned .10 outside it works.
        iprange: "{{ llamenos_internal_ip_range }}"
  tags: [docker, deploy]

# community.docker reconciles an existing network with the declared addressing
# (measured: a network created with another subnet, containers attached, comes
# back with this one and the containers re-attached on new addresses). This reads
# it back anyway, because the alternative if that ever stops holding is the first
# `docker compose up` of Asterisk failing on its pinned address with a message
# about address pools; say what is wrong, and how to fix it, here instead.
- name: Read back the llamenos-internal network
  community.docker.docker_network_info:
    name: llamenos-internal
  register: llamenos_internal_network
  tags: [docker, deploy]

- name: Assert llamenos-internal has the declared subnet
  ansible.builtin.assert:
    that:
      - llamenos_internal_subnet in (llamenos_internal_network.network.IPAM.Config | map(attribute='Subnet') | list)
      - llamenos_internal_ip_range in (llamenos_internal_network.network.IPAM.Config | map(attribute='IPRange') | list)
    fail_msg: |
      llamenos-internal exists with different addressing than llamenos_internal_subnet
      ({{ llamenos_internal_subnet }}) / llamenos_internal_ip_range ({{ llamenos_internal_ip_range }}).
      Asterisk is pinned to an address in it and CoTURN allows exactly that address
      as a relay peer (#2136), so the addressing cannot be left to the daemon.
      Seen: {{ llamenos_internal_network.network.IPAM.Config }}
      To fix, on this host: stop the stacks attached to the network
      (`docker compose down` in each app_dir/services/* directory), run
      `docker network rm llamenos-internal`, and re-run this playbook.
  tags: [docker, deploy]
