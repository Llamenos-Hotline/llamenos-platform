[defaults]
inventory = inventory.yml
roles_path = roles
; Repo-local Jinja filters (filter_plugins/url_userinfo.py). Resolved relative
; to this file, so every entry point that reads this config -- setup.yml, the
; playbooks/ tree, check-env-templates.yml under check-required-env.py -- sees
; the same set.
filter_plugins = filter_plugins
remote_user = deploy
timeout = 30
host_key_checking = false
retry_files_enabled = false
; `community.general.yaml` was removed in community.general 12.0.0 (deprecated
; since ansible-core 2.13) -- CI's `ansible==14.1.0` pulls a community.general
; new enough that ansible-playbook hard-errors the instant any task actually
; executes and the stdout callback has to format a real result (discovered by
; playbooks/check-env-templates.yml, the first real task-executing
; ansible-playbook invocation in CI -- --syntax-check and ansible-lint never
; exercise the callback, so this was silently broken until then). The
; built-in `default` callback's `result_format=yaml` option is the
; ansible-core-native replacement and needs no collection at all.
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = profile_tasks
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

[privilege_escalation]
become = true
become_method = sudo
become_user = root
become_ask_pass = false

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=no
