name = "Check every smoke check declares a severity"
run = "python3 deploy/ansible/scripts/check-smoke-severity.py --list"
why = """
Issue #1636: before it, the suite had three behaviours and named one. A FAIL
stopped the deploy except where it quietly did not (the Kamailio probe reported
NOT READY and the deploy succeeded), so "Smoke check FAILED" did not tell an
operator whether anything had stopped. Every check now declares fatal or
advisory. The recorder defaults an undeclared severity to fatal, so a forgotten
one is too strict rather than silently advisory -- this keeps the ruling
readable in the playbook instead of living in that default.
"""
