name = "Check group_vars resolve with the inventory outside deploy/ansible"
run = '''
set -euo pipefail
inv_dir="$(mktemp -d)"
printf 'all:\n  hosts:\n    localhost:\n      ansible_connection: local\n' > "$inv_dir/inventory.yml"
cd deploy/ansible
ansible-playbook -i "$inv_dir/inventory.yml" playbooks/check-group-vars-resolve.yml -e ansible_become=false
'''
why = """
group_vars/ is found next to the inventory or next to the playbook. It sat at
deploy/ansible/, so with the inventory kept anywhere else (the normal case for a
private inventory) every playbook under playbooks/ lost it and died on
"'llamenos_compose_glob' is undefined". It now lives next to the playbooks; this
plays against an inventory in a different directory.
"""
