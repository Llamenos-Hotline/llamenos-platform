name = "Check an empty or weak Grafana admin password cannot be deployed"
run = "python3 deploy/ansible/scripts/check-grafana-password-guard.py"
why = """
GF_SECURITY_ADMIN_PASSWORD="" is "unset", and an unset Grafana keeps its
built-in admin/admin login. The production vars template never listed the key,
preflight never asserted it and the role defaulted it to "", so a deploy shipped
a default credential. Judges the shared assertion against a table of good and
bad values and checks preflight and the role still call it.
"""
