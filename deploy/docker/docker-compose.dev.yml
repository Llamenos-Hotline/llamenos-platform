# Llamenos Dev Services
#
# Starts only the backing services (PostgreSQL, RustFS) without the app.
# The app runs locally via `bun run dev:server`.
#
# Usage:
#   docker compose -f deploy/docker/docker-compose.dev.yml up -d                    # Core dev services
#   docker compose -f deploy/docker/docker-compose.dev.yml --profile signal up -d   # + Signal
#   docker compose -f deploy/docker/docker-compose.dev.yml --profile inference up -d # + Ollama
#   bun run dev:server
#
# Optional profiles:
#   --profile signal      - Signal CLI + notifier sidecar
#   --profile telephony   - Kamailio SIP edge + Asterisk PBX + SIP bridge + CoTURN (STUN/TURN)
#   --profile push        - ntfy (UnifiedPush relay for Android push notifications)
#
# Stop:
#   docker compose -f deploy/docker/docker-compose.dev.yml down
#
# Reset data:
#   docker compose -f deploy/docker/docker-compose.dev.yml down -v

name: llamenos-dev

services:
  postgres:
    image: postgres:17-alpine@sha256:3430fe182f5065a6ea505c3d432d2c7fff18fbab954df8f277c1dbf4c70124af  # pinned 2026-05-18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: llamenos
      POSTGRES_PASSWORD: ${PG_PASSWORD:-dev}
      POSTGRES_DB: llamenos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llamenos -d llamenos"]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest@sha256:0725587f6fcca83c1898f321424327d6e6da5e01ea20382905dd258ed5af3be4  # pinned 2026-05-18
    ports:
      - "9000:9000"
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
    command: server /data
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Optional: Signal notifications (for local dev with Signal)
  # Start with: docker compose -f deploy/docker/docker-compose.dev.yml --profile signal up -d
  signal-cli:
    image: bbernhard/signal-cli-rest-api:0.92@sha256:702db336aa1a87611595e66755c9ccf65b24c25589857301eabef1d46056b3c5  # pinned 2026-05-18
    profiles: ["signal"]
    ports:
      - "8090:8080"
    # AUTO_RECEIVE_SCHEDULE is NOT set — incompatible with MODE=json-rpc, see
    # deploy/docker/docker-compose.yml for the full explanation (#944).
    environment:
      - MODE=json-rpc
    volumes:
      - signal-data:/home/.local/share/signal-cli
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/about"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  signal-notifier:
    profiles: ["signal"]
    build:
      context: ../../signal-notifier
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - NOTIFIER_API_KEY=${NOTIFIER_API_KEY:-dev-notifier-key}
      - NOTIFIER_API_KEY_PREVIOUS=${NOTIFIER_API_KEY_PREVIOUS:-}
      - NOTIFIER_TOKEN_SECRET=${NOTIFIER_TOKEN_SECRET:-dev-token-secret}
      - DATABASE_URL=postgres://llamenos:${PG_PASSWORD:-dev}@postgres:5432/llamenos?sslmode=disable
      - SIGNAL_BRIDGE_URL=http://signal-cli:8080
      - SIGNAL_BRIDGE_API_KEY=${SIGNAL_BRIDGE_API_KEY:-}
      - SIGNAL_REGISTERED_NUMBER=${SIGNAL_REGISTERED_NUMBER:-}
    depends_on:
      postgres:
        condition: service_healthy
      signal-cli:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Optional: Ollama local inference (inference profile) ──
  # Start with: docker compose -f deploy/docker/docker-compose.dev.yml --profile inference up -d
  ollama:
    # NOTE: "0.6" was never a published tag (see #722) — pinned to 0.6.0, the
    # earliest published patch in the 0.6.x line. scripts/update-image-digests.sh
    # is owned by a different lane and still lists the old ref; needs a
    # follow-up from that lane so refreshes don't revert this pin.
    image: ollama/ollama:0.6.0@sha256:5ff3909f83e01e5a13a0caa8269b484059e841abd9cfe9a86b079b5eae315866  # pinned 2026-09-19
    profiles: ["inference"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Optional: Asterisk PBX behind the Kamailio SIP edge ────────────────
  # Start with: docker compose -f deploy/docker/docker-compose.dev.yml --profile telephony up -d
  # No call can route until the app provisions the SIP trunk
  # (POST /api/provider-setup/create-sip-trunk; see asterisk-config/sorcery.conf).
  # An end-to-end call against a simulated carrier: deploy/docker/tests/telephony/README.md
  # Asterisk >= 22.10.0 is required: older builds silently turn
  # `dtls_verify = fingerprint` into chain verification and kill every
  # DTLS-SRTP call. See deploy/docker/docker-compose.yml and #1687.
  asterisk:
    image: andrius/asterisk@sha256:fa1d49e3826d3e85232e9a63bb1659a20088dabe8e41980ecc7948fb1da6efe6 # 22.10.1 — NOT below 22.10.0, see #1687
    profiles: ["telephony"]
    ports:
      - "8088:8088"       # ARI HTTP; SIP is reached only through Kamailio.
    # Root only for the entrypoint's chown of the astdb volume; Asterisk drops
    # to the asterisk user as it starts (-U/-G, as the image's own CMD does).
    user: root
    entrypoint: ["/bin/sh", "/usr/local/share/llamenos/asterisk-entrypoint.sh"]
    environment:
      # Names covered by the Asterisk internal TLS certificate and by the
      # Kamailio edge certificate. 10.0.2.2 is the Android emulator's alias
      # for the host; 127.0.0.1/localhost are added unconditionally.
      - SIP_TLS_SANS=${SIP_TLS_SANS:-10.0.2.2}
      # Certificate and key the TLS/WSS transports serve. Unset = the
      # entrypoint generates a self-signed combined PEM at
      # /var/lib/asterisk/keys/asterisk.pem, which is what dev and the
      # telephony e2e harnesses rely on — so leave them unset there.
      - ASTERISK_TLS_CERT_FILE=${ASTERISK_TLS_CERT_FILE:-}
      - ASTERISK_TLS_KEY_FILE=${ASTERISK_TLS_KEY_FILE:-}
    volumes:
      - ./asterisk-config:/etc/asterisk:ro
      - ./asterisk-entrypoint.sh:/usr/local/share/llamenos/asterisk-entrypoint.sh:ro
      - ./sip-tls-cert.sh:/usr/local/share/llamenos/sip-tls-cert.sh:ro
      # Read-only source for an externally-managed certificate; the default is
      # a committed placeholder directory, so dev generates its own as before.
      - ${SIP_TLS_CERT_DIR:-./sip-tls-mount}:/etc/llamenos/sip-tls:ro
      - asterisk-db:/var/lib/asterisk/astdb   # the provisioned SIP trunk
      # A stable keypair across restarts: the trust anchor clients pinned at
      # their last /sip-token fetch must keep verifying after a PBX restart.
      - asterisk-keys:/var/lib/asterisk/keys
      # The PUBLIC trust anchor the app publishes to clients (SIP_TLS_CA_FILE).
      - sip-tls-anchor:/var/lib/llamenos/sip-tls
    # ari.conf #includes this file for the ARI user's password — Asterisk
    # cannot read ARI_PASSWORD from its environment itself.
    configs:
      - source: ari_credentials
        target: /run/llamenos/ari-credentials.conf
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # CoTURN — STUN + TURN relay for the ICE servers /api/telephony/sip-token
  # mints time-limited credentials against. Without it a volunteer behind a
  # symmetric NAT gathers no usable candidate and the media leg never connects,
  # however well signalling went.
  #
  # Host networking, not published ports: a TURN server has to advertise an
  # address the client can actually reach for its RELAY candidate, and inside a
  # bridge network it would advertise its 172.x container address. Host mode is
  # also coturn's own recommended deployment, and unlike published ports it
  # stays subject to the host firewall.
  coturn:
    image: coturn/coturn:4@sha256:867607152c6ed9504a0b59a2546a9bd2872dcf74313b3bc6cf9b69cc81be6fb3  # pinned 2026-05-18
    profiles: ["telephony"]
    network_mode: host
    command: >
      --realm=${TURN_REALM:-localhost}
      --fingerprint
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-changeme}
      --listening-port=${TURN_PORT:-3478}
      --min-port=${TURN_RELAY_MIN_PORT:-49160}
      --max-port=${TURN_RELAY_MAX_PORT:-49200}
      --no-tls
      --no-dtls
      --no-cli
    healthcheck:
      # A STUN Binding request, which coturn answers UNAUTHENTICATED even in
      # --use-auth-secret mode (only TURN allocation needs the credential). So
      # unlike a process probe this proves the listener actually answers — and
      # unlike the `pgrep` it replaces, it can pass at all: the pinned image
      # ships no pgrep, so that healthcheck failed every time and marked a
      # perfectly working coturn unhealthy. A dead listener never replies, so
      # the probe hangs and the timeout below is what fails it.
      test: ["CMD-SHELL", "turnutils_stunclient -p ${TURN_PORT:-3478} 127.0.0.1 2>&1 | grep -q 'reflexive addr'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # SIP bridge — translates ARI events to Llamenos webhook format.
  sip-bridge:
    profiles: ["telephony"]
    build:
      context: ../../sip-bridge
      dockerfile: Dockerfile
    ports:
      - "3200:3000"
    # host.docker.internal is Docker Desktop only; on Linux it must be mapped
    # to the host gateway or every webhook to the dev server fails to resolve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # PBX_TYPE names the PBX, not the protocol: `asterisk`, never `ari`.
      - PBX_TYPE=asterisk
      - ARI_URL=ws://asterisk:8088/ari/events
      - ARI_REST_URL=http://asterisk:8088/ari
      - ARI_USERNAME=${ARI_USERNAME:-llamenos}
      - ARI_PASSWORD=${ARI_PASSWORD:-changeme}
      # The dev server (bun run dev:server) on the host; override the port for a
      # worktree server on a PORT other than 3000.
      - WORKER_WEBHOOK_URL=${SIP_BRIDGE_WORKER_URL:-http://host.docker.internal:3000}
      - BRIDGE_SECRET=${BRIDGE_SECRET:-changeme}
    depends_on:
      asterisk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Kamailio is the client-facing SIP edge in the telephony dev profile, as it
  # is in the self-hosted deployment. Asterisk has no published SIP ports, so
  # clients and call measurements cannot accidentally bypass this listener.
  kamailio:
    image: ghcr.io/kamailio/kamailio:5.7.1-bookworm@sha256:a5c0564fe4bf12315ec3aed97303bc63207c0cec0c5b1150ea6500f4747163e9 # pinned 2026-09-19
    profiles: ["telephony"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/share/llamenos/kamailio-entrypoint.sh"]
    ports:
      - "${SIP_UDP_PORT:-5060}:5060/udp"
      - "${SIP_TCP_PORT:-5060}:5060/tcp"
      - "${SIPS_PORT:-5061}:5061/tcp"
    environment:
      - SIP_TLS_SANS=${SIP_TLS_SANS:-10.0.2.2}
      - SIP_TLS_ANCHOR_SOURCE=${KAMAILIO_TLS_ANCHOR_SOURCE:-}
      - KAMAILIO_TLS_CERT_FILE=${KAMAILIO_TLS_CERT_FILE:-/var/lib/kamailio/cert.pem}
      - KAMAILIO_TLS_KEY_FILE=${KAMAILIO_TLS_KEY_FILE:-/var/lib/kamailio/cert.pem}
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./kamailio/tls.cfg.template:/usr/local/share/llamenos/tls.cfg.template:ro
      - ./kamailio/dispatcher.list:/etc/kamailio/dispatcher.list:ro
      - ./kamailio/kamailio-entrypoint.sh:/usr/local/share/llamenos/kamailio-entrypoint.sh:ro
      - ./sip-tls-cert.sh:/usr/local/share/llamenos/sip-tls-cert.sh:ro
      - ${SIP_TLS_CERT_DIR:-./sip-tls-mount}:/etc/llamenos/sip-tls:ro
      - kamailio-keys:/var/lib/kamailio
      - sip-tls-anchor:/var/lib/llamenos/sip-tls
    depends_on:
      asterisk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kamcmd", "core.version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Optional: ntfy push relay for UnifiedPush (Android) ──────────────────
  # Start with: docker compose -f deploy/docker/docker-compose.dev.yml --profile push up -d
  ntfy:
    image: binwiederhier/ntfy:v2.11.0@sha256:ce845e0f0e7eba0f75e553ed4b3c550e74c1e3ab0e89b21b89b85a7d2b67cd42
    profiles: ["push"]
    ports:
      - "2586:80"
    environment:
      - NTFY_BASE_URL=http://localhost:2586
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_BEHIND_PROXY=true
      - NTFY_ENABLE_SIGNUP=false
      - NTFY_ENABLE_LOGIN=false
    command: serve
    volumes:
      - ntfy-data:/var/lib/ntfy
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:80/v1/health", "-O", "-"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

configs:
  # Rendered from ARI_PASSWORD so asterisk and sip-bridge share one credential.
  ari_credentials:
    content: |
      password = ${ARI_PASSWORD:-changeme}

volumes:
  asterisk-db:
  asterisk-keys:
  kamailio-keys:
  sip-tls-anchor:
  pgdata:
  rustfsdata:
  signal-data:
  ollama-data:
  ntfy-data:
