; Simulated PSTN carrier — TEST ONLY, never deployed.
;
; Plays the phone network on both sides of a hotline call:
;   - the caller: originates an INVITE to the hotline's Asterisk (see [place-call])
;   - the volunteer's phone: answers the hotline's PJSIP/<number>@trunk legs
;     (see [volunteer-phones])
;
; It offers the hotline two kinds of trunk, as real carriers do:
;   - IP-authenticated: `hotline`, trusted by source address
;   - registration: `hotline-reg`, for a hotline that registers with the
;     credentials below, as a carrier would issue them

[global]
type = global
; Username before source address, so the hotline's registration trunk (From
; user hotline-reg) is told apart from the catch-all IP match below.
endpoint_identifier_order = username,ip

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[hotline]
type = aor
contact = sip:asterisk:5060

[hotline]
type = endpoint
context = volunteer-phones
disallow = all
allow = ulaw,alaw
aors = hotline
direct_media = no
dtmf_mode = rfc4733

; Accept the hotline by CIDR, not hostname: the hotline container may not exist
; yet when this one loads its config, and an unresolvable `match` drops the rule.
[hotline]
type = identify
endpoint = hotline
match = 0.0.0.0/0

; Registration trunk. Matched by the From user (see [global]), so it takes
; precedence over the catch-all IP match above.
[hotline-reg]
type = aor
max_contacts = 1
remove_existing = yes

[hotline-reg-auth]
type = auth
auth_type = userpass
username = hotline-reg
; Test fixture, not a secret: asterisk-call.e2e.ts provisions the hotline's
; trunk with the same value (CARRIER_ISSUED_PASSWORD).
password = carrier-issued-e2e-only

[hotline-reg]
type = endpoint
context = volunteer-phones
disallow = all
allow = ulaw,alaw
aors = hotline-reg
auth = hotline-reg-auth
direct_media = no
dtmf_mode = rfc4733
