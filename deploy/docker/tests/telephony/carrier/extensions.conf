; Simulated PSTN carrier dialplan — TEST ONLY.

[general]
static = yes
writeprotect = yes

[globals]
; Set per call with `dialplan set global CALLER_NUMBER <number>`
CALLER_NUMBER = +15557770000
; How long a volunteer stays on the line after answering
VOLUNTEER_TALK_SECONDS = 8

; A caller dialling the hotline:
;   channel originate Local/<hotline number>@place-call application Wait 120
[place-call]
exten => _+X.,1,Set(CALLERID(num)=${CALLER_NUMBER})
 same => n,Dial(PJSIP/${EXTEN}@hotline,60)
 same => n,Hangup()

; The same, delivered to the contact the hotline registered (registration trunk):
;   channel originate Local/<hotline number>@place-call-registered application Wait 120
[place-call-registered]
exten => _+X.,1,Set(CALLERID(num)=${CALLER_NUMBER})
 same => n,Dial(PJSIP/${EXTEN}@hotline-reg,60)
 same => n,Hangup()

; A volunteer's phone: rings, answers, talks, hangs up.
; Numbers starting +1555021 belong to volunteers who never pick up.
[volunteer-phones]
exten => _+1555021X.,1,NoOp(Volunteer phone ${EXTEN} ringing, nobody answers)
 same => n,Ringing()
 same => n,Wait(120)
 same => n,Hangup()

exten => _+X.,1,NoOp(Volunteer phone ${EXTEN} ringing)
 same => n,Ringing()
 same => n,Wait(1)
 same => n,Answer()
 same => n,Wait(${VOLUNTEER_TALK_SECONDS})
 same => n,Hangup()
