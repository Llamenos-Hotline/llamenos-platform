# Overlay: the telephony stack as an Android emulator sees it, for
# run-android-sip-e2e.sh. TEST ONLY.
#
# Layered on top of docker-compose.dev.yml + docker-compose.carrier.yml, so the
# app, Postgres, RustFS, Asterisk and the simulated carrier all come from there.
# What this adds is the part an emulator needs:
#
#   * Asterisk's TLS port on the host, because the emulator reaches the host at
#     10.0.2.2 and nothing else. Its certificate therefore has to carry
#     IP:10.0.2.2 as a SAN — the client verifies the hostname, not only the
#     chain — which SIP_TLS_SANS arranges.
#   * The app serving the SIP edge's trust anchor (SIP_TLS_CA_FILE) from the
#     volume Asterisk's entrypoint exported it to. Asterisk is the edge here;
#     in the full deployment Kamailio is.
#   * A test-only answer-and-echo target in the volunteer dialplan context, so
#     the media leg can be driven and the AGREED encryption read off the PBX.
#
# CoTURN comes from the dev file's telephony profile on host networking, which
# is what makes its relay candidate reachable from the emulator at all.
#
# Paths are relative to deploy/docker/ (the first compose file's directory).
services:
  asterisk:
    ports: !override
      # TLS only, for signalling. 5060/8088 stay unpublished so this stack
      # cannot collide with a dev stack on the same box; nothing outside the
      # compose network needs them, and the harness reaches ARI through
      # `docker exec`/the app.
      - "0.0.0.0:${E2E_SIP_TLS_PORT:-5061}:5061/tcp"
      # RTP, matching the range e2e-rtp.conf narrows Asterisk to. The shipped
      # range is 200 ports and Asterisk picks at random inside it, so the
      # harness narrows rather than publishing 200 docker-proxy processes.
      - "0.0.0.0:10000-10019:10000-10019/udp"
    environment:
      # Every address the emulator may dial for the SIP domain. 10.0.2.2 is the
      # emulator's alias for the host; localhost/127.0.0.1 are added anyway.
      - SIP_TLS_SANS=${E2E_SIP_TLS_SANS:-10.0.2.2}
    volumes:
      # Whole directories, not files inside them: /etc/asterisk is a read-only
      # bind, and Docker cannot create a nested mount point inside a read-only
      # filesystem. asterisk-config/extensions.d/ and pjsip.d/ exist (holding
      # only a note each) so these mounts have somewhere to land.
      - ./tests/telephony/extensions.d:/etc/asterisk/extensions.d:ro
      - ./tests/telephony/pjsip.d:/etc/asterisk/pjsip.d:ro
      # A FILE over a file, which works because rtp.conf exists in the config
      # directory; a file over a path that does not exist cannot be mounted
      # inside a read-only parent, which is why the two above are directories.
      - ./tests/telephony/e2e-rtp.conf:/etc/asterisk/rtp.conf:ro

  app:
    environment:
      # Asterisk is the client-facing SIP edge in this stack, so its anchor is
      # the one clients must verify against.
      - SIP_TLS_CA_FILE=/var/lib/llamenos/sip-tls/asterisk.pem
    volumes:
      - sip-tls-anchor:/var/lib/llamenos/sip-tls:ro

  sip-bridge:
    ports: !reset []

volumes:
  sip-tls-anchor:
