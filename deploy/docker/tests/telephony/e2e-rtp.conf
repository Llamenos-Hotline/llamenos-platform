; TEST ONLY — mounted over /etc/asterisk/rtp.conf by
; docker-compose.android-sip.yml. Never part of a deployment.
;
; The shipped range is 10000-10199, and Asterisk picks a port at RANDOM inside
; it. Publishing 200 UDP ports to catch one call would cost 200 docker-proxy
; processes, so the harness narrows the range to what it publishes instead.
[general]
rtpstart = 10000
rtpend = 10019
icesupport = yes
