; TEST ONLY — mounted into /etc/asterisk/extensions.d/ by
; docker-compose.android-sip.yml. Never part of a deployment.
;
; Adds one target to the context the registrar provisions each volunteer
; endpoint into (VOLUNTEER_DIALPLAN_CONTEXT in apps/worker/telephony/
; registrar.ts). Asterisk merges same-named contexts across included files, so
; the shipped [volunteers-sframe] is unchanged and simply gains this extension
; while the harness is running.
;
; Why an echo: it makes the PBX ANSWER, which is the only way to read the
; AGREED media encryption and the nominated ICE pair off the PBX rather than
; off the client. Asterisk's SDP answer carries the DTLS fingerprint and
; `UDP/TLS/RTP/SAVPF`, the DTLS handshake then has to complete for media to
; flow, and Echo() returns the volunteer's own audio so RTP is proven in both
; directions on the volunteer<->PBX leg.
[volunteers-sframe]
exten => e2eecho,1,NoOp(E2E: echoing ${CALLERID(num)} back to itself)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
