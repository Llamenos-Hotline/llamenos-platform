; TEST ONLY — mounted over /etc/asterisk/pjsip.d/ by
; docker-compose.android-sip.yml. Never part of a deployment.
;
; An Android emulator can reach exactly one address outside itself: 10.0.2.2,
; its alias for the host. Asterisk is in a Docker bridge network, so left alone
; it advertises 172.x in `c=` and the emulator cannot send media there — the
; call negotiates and no audio arrives.
;
; This is the same mechanism a real deployment uses (asterisk-entrypoint.sh
; generates the equivalent from SIP_EXTERNAL_ADDRESS); it is written out here
; rather than env-driven because no local_net can work in this topology, and a
; deployment's defaults should not be bent to suit that.
;
; Why no local_net: every connection reaches Asterisk through docker-proxy, so
; it sees the bridge gateway (172.x) as the peer no matter where the client
; actually is. Any local_net covering the bridge therefore marks the emulator
; "local" and suppresses the rewriting — which is exactly what happened the
; first time, with `c=IN IP4 172.20.0.5` in the answer. With no local_net at
; all, every peer gets the external address, which is what this harness wants.
[transport-tls](+)
external_media_address = 10.0.2.2
external_signaling_address = 10.0.2.2
