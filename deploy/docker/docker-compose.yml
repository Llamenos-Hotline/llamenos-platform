# Llamenos Self-Hosted Docker Compose
#
# Core services (always start):
#   app      - Llamenos application (Bun)
#   postgres - PostgreSQL database
#   caddy    - Reverse proxy with automatic TLS
#   rustfs   - S3-compatible object storage (RustFS)
#
# Optional services (via --profile):
#   whisper    - Self-hosted transcription (profile: transcription)
#   asterisk   - Self-hosted PBX (profile: asterisk)
#   sip-bridge - PBX-to-webhook translator (profile: asterisk)
#   kamailio   - SIP proxy / load balancer (profile: telephony)
#   coturn     - STUN/TURN relay for WebRTC (profile: telephony)
#   signal-cli - Signal messaging bridge (profile: signal)
#   glitchtip  - Sentry-compatible error tracking (profile: monitoring)
#
# Usage:
#   cp .env.example .env && edit .env
#   docker compose up -d                               # Core (includes relay)
#   docker compose --profile transcription up -d        # + Whisper
#   docker compose --profile asterisk up -d             # + Asterisk
#   docker compose --profile telephony up -d            # + Kamailio + CoTURN
#   docker compose --profile signal up -d               # + Signal
#   docker compose --profile monitoring up -d            # + GlitchTip
#   COMPOSE_PROFILES=asterisk,telephony,signal docker compose up -d
#
# IMPORTANT: You MUST set PG_PASSWORD, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY,
# and BRIDGE_SECRET (if using Asterisk) in your .env file before starting.

name: llamenos

services:
  # ── Core ──────────────────────────────────────────────────
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      # Dockerfile's later stages (frontend-deps/frontend-builder/caddy-builder/
      # static) build the Caddy static-file image consumed by
      # docker-compose.production.yml's `caddy` service. Without an explicit
      # target here, `docker build`/`docker compose build` default to the
      # LAST stage in the file — which is `static`, not `app` — so the `app`
      # service would silently build and run the Caddy static server instead
      # of the Bun backend.
      target: app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M
    environment:
      - PLATFORM=bun
      - PORT=3000
      - DATABASE_URL=postgresql://llamenos:${PG_PASSWORD:?PG_PASSWORD is required}@postgres:5432/llamenos
      - PG_POOL_SIZE=${PG_POOL_SIZE:-10}
      - ADMIN_PUBKEY=${ADMIN_PUBKEY:?ADMIN_PUBKEY is required}
      # The admin's X25519 HPKE recipient key. Required alongside ADMIN_PUBKEY:
      # validateConfig() refuses to boot without it rather than seal admin
      # envelopes to the Ed25519 ADMIN_PUBKEY, which nothing can decrypt (#1283).
      # `bun run bootstrap-admin` prints both from one seed.
      - "ADMIN_DECRYPTION_PUBKEY=${ADMIN_DECRYPTION_PUBKEY:?ADMIN_DECRYPTION_PUBKEY is required — the admin's X25519 key; run bun run bootstrap-admin}"
      - HOTLINE_NAME=${HOTLINE_NAME:-Hotline}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # Required by the app whenever ENVIRONMENT is production (the default above).
      # validateConfig() throws without it rather than fall back to the spoofable
      # Host header for webhook signature validation — so the container would
      # crash-loop with no compose-level explanation. Fail at `up` instead.
      - "WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:?WEBHOOK_BASE_URL is required — the public https:// base URL webhooks are delivered to, e.g. https://api.example.org}"
      - "HMAC_SECRET=${HMAC_SECRET:?HMAC_SECRET is required — generate with openssl rand -hex 32}"
      - STORAGE_ENDPOINT=http://rustfs:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-llamenos-files}
      - WHISPER_URL=${WHISPER_URL:-http://whisper:8080/v1/audio/transcriptions}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      # Server signing secret — required for WebSocket relay auth and event signing
      - "SERVER_SECRET=${SERVER_SECRET:?SERVER_SECRET is required — generate with openssl rand -hex 32}"
      # Optional: GlitchTip/Sentry DSN for client crash reporting (profile: monitoring)
      - GLITCHTIP_DSN=${GLITCHTIP_DSN:-}
      # Signal notification sidecar (profile: signal)
      - NOTIFIER_URL=${NOTIFIER_URL:-http://signal-notifier:3100}
      - NOTIFIER_API_KEY=${NOTIFIER_API_KEY:-}
      # ntfy/UnifiedPush relay (profile: push)
      # No default. The `ntfy` service below sits behind the `push` profile, so
      # defaulting this to a hostname that usually is not running made the app
      # advertise a broker that does not exist. That was invisible while this
      # variable never reached the routes (the `c.env` literal in
      # src/server/index.ts omitted it, so push was inert everywhere); now that
      # it does, an unset value must mean "no ntfy", not "a dead one".
      # Set NTFY_URL explicitly when you run `--profile push`.
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_AUTH_TOKEN=${NTFY_AUTH_TOKEN:-}
    networks:
      - web
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "llamenos-app"
    healthcheck:
      # oven/bun:1-slim has no curl — use bun's built-in fetch
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=llamenos
      - POSTGRES_USER=llamenos
      - POSTGRES_PASSWORD=${PG_PASSWORD:?PG_PASSWORD is required}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llamenos -d llamenos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    # Digest bump (issue #650, 2026-09-20): refreshes the Alpine package layer
    # (curl/c-ares/libcrypto3/libssl3 CVEs) under the same 2.11.4 tag.
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-}
    networks:
      - web
    depends_on:
      app:
        condition: service_healthy

  rustfs:
    image: rustfs/rustfs:latest@sha256:378642b05b7dcb4849fb77ebe6aca4ced1c3f66e7e504247df95a5c9018d3358
    command: server /data --console-address ":9001"
    restart: unless-stopped
    volumes:
      - rustfs-data:/data
    environment:
      - RUSTFS_ACCESS_KEY=${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      - RUSTFS_SECRET_KEY=${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      - RUSTFS_CONSOLE_ENABLE=true
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/ || test $? -eq 22"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Optional: ntfy push relay (UnifiedPush for Android) ───
  ntfy:
    image: binwiederhier/ntfy:v2.11.0@sha256:4a7d0f0adc6d5d9fc36e64ab55ef676e76e124a2bdd50ce115b6d9c1c7430294
    profiles: ["push"]
    restart: unless-stopped
    command: serve
    environment:
      - NTFY_BASE_URL=https://${NTFY_DOMAIN:-ntfy.localhost}
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_BEHIND_PROXY=true
      - NTFY_ENABLE_SIGNUP=false
      - NTFY_ENABLE_LOGIN=false
      # Bearer token for server→ntfy auth (must match NTFY_AUTH_TOKEN in app env)
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
    volumes:
      - ntfy-data:/var/lib/ntfy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:80/v1/health", "-O", "-"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Optional: Whisper Transcription ───────────────────────
  whisper:
    # NOTE: "0.4.1" was never a published tag (see #722) — no bare/untagged
    # release exists for this image, only -cpu/-cuda variants. Pinned to
    # 0.4.0-cpu (the earliest published 0.4.x patch, matching the cpu default
    # in WHISPER__DEVICE below). scripts/update-image-digests.sh is owned by
    # a different lane and still lists the old ref; needs a follow-up from
    # that lane so refreshes don't revert this pin.
    image: fedirz/faster-whisper-server:0.4.0-cpu@sha256:f77aaf85e2e811aae96a60b04c85ff7cb0e0f2be6729c6fd7600340842412539  # pinned 2026-09-19
    profiles: ["transcription"]
    restart: unless-stopped
    environment:
      - WHISPER__MODEL=${WHISPER_MODEL:-Systran/faster-whisper-base}
      - WHISPER__DEVICE=${WHISPER_DEVICE:-cpu}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Optional: Asterisk PBX ───────────────────────────────
  asterisk:
    image: andrius/asterisk@sha256:e30df5ec1b512827bf3cffc49b8000b07376a05c950736d028348eba80035015 # 20.x
    # Also enabled by "telephony": kamailio (telephony profile) has a hard
    # `depends_on: asterisk: condition: service_healthy` below, so activating
    # telephony without asterisk previously failed compose config resolution
    # entirely (pre-existing bug, found while verifying #722's fix)
    profiles: ["asterisk", "telephony"]
    restart: unless-stopped
    volumes:
      - ./asterisk-config:/etc/asterisk:ro
    # ari.conf #includes this file for the ARI user's password — Asterisk
    # cannot read ARI_PASSWORD from its environment itself.
    configs:
      - source: ari_credentials
        target: /run/llamenos/ari-credentials.conf
    networks:
      - internal
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  sip-bridge:
    profiles: ["asterisk"]
    build:
      context: ../../sip-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PBX_TYPE=${PBX_TYPE:-asterisk}
      - ARI_URL=ws://asterisk:8088/ari/events
      - ARI_REST_URL=http://asterisk:8088/ari
      - ARI_USERNAME=${ARI_USERNAME:-llamenos}
      - ARI_PASSWORD=${ARI_PASSWORD:-changeme}
      - WORKER_WEBHOOK_URL=http://app:3000
      - BRIDGE_SECRET=${BRIDGE_SECRET:-changeme}
      - BRIDGE_HOST=0.0.0.0
    networks:
      - internal
    depends_on:
      asterisk:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Optional: Kamailio SIP Proxy (telephony profile) ──────
  kamailio:
    # NOTE: "kamailio/kamailio" does not exist on Docker Hub (only
    # kamailio-ci/kamailio-store, neither suitable for production) and ":5.7"
    # was never a published tag anywhere (see #722). The project's official
    # runtime images live at ghcr.io/kamailio/kamailio; pinned to 5.7.1-bookworm,
    # the earliest published patch in the 5.7.x line. scripts/update-image-digests.sh
    # is owned by a different lane and still lists the old ref; needs a
    # follow-up from that lane so refreshes don't revert this pin.
    image: ghcr.io/kamailio/kamailio:5.7.1-bookworm@sha256:a5c0564fe4bf12315ec3aed97303bc63207c0cec0c5b1150ea6500f4747163e9  # pinned 2026-09-19
    profiles: ["telephony"]
    restart: unless-stopped
    ports:
      - "${SIP_UDP_PORT:-5060}:5060/udp"
      - "${SIP_TCP_PORT:-5060}:5060/tcp"
      - "${SIPS_PORT:-5061}:5061/tcp"
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./kamailio/dispatcher.list:/etc/kamailio/dispatcher.list:ro
    networks:
      - internal
    depends_on:
      asterisk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kamcmd", "core.version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Optional: CoTURN STUN/TURN relay (telephony profile) ──
  coturn:
    image: coturn/coturn:4@sha256:867607152c6ed9504a0b59a2546a9bd2872dcf74313b3bc6cf9b69cc81be6fb3  # pinned 2026-05-18
    profiles: ["telephony"]
    restart: unless-stopped
    ports:
      - "${TURN_UDP_PORT:-3478}:3478/udp"
      - "${TURN_TCP_PORT:-3478}:3478/tcp"
    command: >
      --realm=${DOMAIN:-localhost}
      --fingerprint
      --lt-cred-mech
      --user=llamenos:${TURN_SECRET:-changeme}
      --no-tls
      --no-dtls
    networks:
      - internal
    healthcheck:
      test: ["CMD", "turnutils_uclient", "-T", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Optional: GlitchTip Error Tracking ────────────────────
  # Sentry-compatible error tracking. Clients send crash reports here.
  # Enable with: docker compose --profile monitoring up -d
  glitchtip:
    image: glitchtip/glitchtip:v4.1@sha256:0803e1820215905c305cd0e7c497e5bbdbb2c2c65fcbe6bdc131f4538b8ed048
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://llamenos:${PG_PASSWORD:?PG_PASSWORD is required}@postgres:5432/glitchtip
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY:-changeme}
      - PORT=8000
      - EMAIL_URL=${GLITCHTIP_EMAIL_URL:-consolemail://}
      - GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN:-http://localhost:8000}
      - DEFAULT_FROM_EMAIL=${GLITCHTIP_FROM_EMAIL:-noreply@localhost}
      - CELERY_WORKER_AUTOSCALE=1,3
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=10000
    networks:
      - web
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/_health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  glitchtip-worker:
    image: glitchtip/glitchtip:v4.1@sha256:0803e1820215905c305cd0e7c497e5bbdbb2c2c65fcbe6bdc131f4538b8ed048
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment:
      - DATABASE_URL=postgresql://llamenos:${PG_PASSWORD:?PG_PASSWORD is required}@postgres:5432/glitchtip
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY:-changeme}
      - EMAIL_URL=${GLITCHTIP_EMAIL_URL:-consolemail://}
      - GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN:-http://localhost:8000}
      - DEFAULT_FROM_EMAIL=${GLITCHTIP_FROM_EMAIL:-noreply@localhost}
      - CELERY_WORKER_AUTOSCALE=1,3
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=10000
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy

  glitchtip-redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Optional: Signal Messaging + Notifications ──────────
  signal-cli:
    image: bbernhard/signal-cli-rest-api:0.92@sha256:702db336aa1a87611595e66755c9ccf65b24c25589857301eabef1d46056b3c5
    profiles: ["signal"]
    restart: unless-stopped
    # AUTO_RECEIVE_SCHEDULE is NOT set — it is incompatible with MODE=json-rpc.
    # signal-cli-rest-api 0.92 fatals at startup ("Env variable
    # AUTO_RECEIVE_SCHEDULE can't be used with mode json-rpc") the instant the
    # var is *present* in the container's environment, even set to an empty
    # string — the binary checks for the key's presence, not its value.
    # Combined with `restart: unless-stopped` this crash-looped the container
    # indefinitely (#944): every restart tears down and recreates the
    # container's network attachment, which surfaced as bursts of Chromium
    # net::ERR_NETWORK_CHANGED errors in unrelated Playwright E2E tests,
    # misread as a login/PIN flake. In json-rpc mode the daemon receives
    # messages continuously on its own — no receive schedule needed.
    environment:
      - MODE=json-rpc
    volumes:
      - signal-data:/home/.local/share/signal-cli
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/about"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  signal-notifier:
    profiles: ["signal"]
    build:
      context: ../../signal-notifier
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3100
      - "NOTIFIER_API_KEY=${NOTIFIER_API_KEY:-changeme}"
      - NOTIFIER_API_KEY_PREVIOUS=${NOTIFIER_API_KEY_PREVIOUS:-}
      - "NOTIFIER_TOKEN_SECRET=${NOTIFIER_TOKEN_SECRET:-${HMAC_SECRET}}"
      - "DATABASE_URL=postgres://llamenos:${PG_PASSWORD}@postgres:5432/llamenos?sslmode=disable"
      - SIGNAL_BRIDGE_URL=http://signal-cli:8080
      - SIGNAL_BRIDGE_API_KEY=${SIGNAL_BRIDGE_API_KEY:-}
      - "SIGNAL_REGISTERED_NUMBER=${SIGNAL_REGISTERED_NUMBER:-}"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      signal-cli:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

configs:
  # Rendered from ARI_PASSWORD so asterisk and sip-bridge share one credential.
  ari_credentials:
    content: |
      password = ${ARI_PASSWORD:-changeme}

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  rustfs-data:
  signal-data:
  ntfy-data:

networks:
  web:
    driver: bridge
  internal:
    driver: bridge
    internal: true
