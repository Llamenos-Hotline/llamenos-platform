# Llamenos Self-Hosted Docker Compose
#
# Core services (always start):
#   app      - Llamenos application (Bun)
#   postgres - PostgreSQL database
#   caddy    - Reverse proxy with automatic TLS
#   rustfs   - S3-compatible object storage (RustFS)
#
# Optional services (via --profile):
#   whisper    - Self-hosted transcription (profile: transcription)
#   asterisk   - Self-hosted PBX (profile: asterisk)
#   sip-bridge - PBX-to-webhook translator (profile: asterisk)
#   kamailio   - SIP proxy / load balancer (profile: telephony)
#   coturn     - STUN/TURN relay for WebRTC (profile: telephony)
#   signal-cli - Signal messaging bridge (profile: signal)
#   glitchtip  - Sentry-compatible error tracking (profile: monitoring)
#
# Usage:
#   cp .env.example .env && edit .env
#   docker compose up -d                               # Core (includes relay)
#   docker compose --profile transcription up -d        # + Whisper
#   docker compose --profile asterisk up -d             # + Asterisk
#   docker compose --profile telephony up -d            # + Kamailio + CoTURN
#   docker compose --profile signal up -d               # + Signal
#   docker compose --profile monitoring up -d            # + GlitchTip
#   COMPOSE_PROFILES=asterisk,telephony,signal docker compose up -d
#
# IMPORTANT: You MUST set PG_PASSWORD, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY,
# and BRIDGE_SECRET (if using Asterisk) in your .env file before starting.

name: llamenos

services:
  # ── Core ──────────────────────────────────────────────────
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      # Dockerfile's later stages (frontend-deps/frontend-builder/caddy-builder/
      # static) build the Caddy static-file image consumed by
      # docker-compose.production.yml's `caddy` service. Without an explicit
      # target here, `docker build`/`docker compose build` default to the
      # LAST stage in the file — which is `static`, not `app` — so the `app`
      # service would silently build and run the Caddy static server instead
      # of the Bun backend.
      target: app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M
    environment:
      - PLATFORM=bun
      - PORT=3000
      - DATABASE_URL=postgresql://llamenos:${PG_PASSWORD:?PG_PASSWORD is required}@postgres:5432/llamenos
      - PG_POOL_SIZE=${PG_POOL_SIZE:-10}
      - ADMIN_PUBKEY=${ADMIN_PUBKEY:?ADMIN_PUBKEY is required}
      # The admin's X25519 HPKE recipient key — a DIFFERENT key from ADMIN_PUBKEY
      # (Ed25519). Required whenever ADMIN_PUBKEY is set: validateConfig() refuses
      # to start rather than seal admin envelopes to a signing key, which succeeds
      # and yields notes nobody can ever decrypt (#1283). `bun run bootstrap-admin`
      # prints both, derived from one seed.
      - "ADMIN_DECRYPTION_PUBKEY=${ADMIN_DECRYPTION_PUBKEY:?ADMIN_DECRYPTION_PUBKEY is required — the admin's X25519 key from `bun run bootstrap-admin`, not ADMIN_PUBKEY}"

      - HOTLINE_NAME=${HOTLINE_NAME:-Hotline}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # Required by the app whenever ENVIRONMENT is production (the default above).
      # validateConfig() throws without it rather than fall back to the spoofable
      # Host header for webhook signature validation — so the container would
      # crash-loop with no compose-level explanation. Fail at `up` instead.
      - "WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:?WEBHOOK_BASE_URL is required — the public https:// base URL webhooks are delivered to, e.g. https://api.example.org}"
      - "HMAC_SECRET=${HMAC_SECRET:?HMAC_SECRET is required — generate with openssl rand -hex 32}"
      - STORAGE_ENDPOINT=http://rustfs:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-llamenos-files}
      - WHISPER_URL=${WHISPER_URL:-http://whisper:8080/v1/audio/transcriptions}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      # Server signing secret — required for WebSocket relay auth and event signing
      - "SERVER_SECRET=${SERVER_SECRET:?SERVER_SECRET is required — generate with openssl rand -hex 32}"
      # Optional: GlitchTip/Sentry DSN for client crash reporting (profile: monitoring)
      - GLITCHTIP_DSN=${GLITCHTIP_DSN:-}
      # Signal notification sidecar (profile: signal)
      # Points at the sidecar the `signal` profile starts. Keeping this
      # default is what makes `--profile signal` work without extra operator
      # configuration — removing it silently disconnects a deployment that
      # DOES use Signal, which is worse than the problem it would solve.
      #
      # It does mean the variable is set even when the profile is off, so the
      # health route cannot use "is the URL set?" to decide whether Signal is
      # deployed. That is handled where it belongs — readiness no longer lets
      # an OPTIONAL integration gate the verdict (#1418, routes/health.ts).
      - NOTIFIER_URL=${NOTIFIER_URL:-http://signal-notifier:3100}
      - NOTIFIER_API_KEY=${NOTIFIER_API_KEY:-}
      # ntfy/UnifiedPush relay (profile: push)
      # No default. The `ntfy` service below sits behind the `push` profile, so
      # defaulting this to a hostname that usually is not running made the app
      # advertise a broker that does not exist. That was invisible while this
      # variable never reached the routes (the `c.env` literal in
      # src/server/index.ts omitted it, so push was inert everywhere); now that
      # it does, an unset value must mean "no ntfy", not "a dead one".
      # Set NTFY_URL explicitly when you run `--profile push`.
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_AUTH_TOKEN=${NTFY_AUTH_TOKEN:-}
      # Per-volunteer SIP registrar (profile: asterisk/telephony). Master
      # secret the worker derives each volunteer's unique PJSIP endpoint
      # secret from (telephony/registrar.ts) — NOT the hub credential and
      # not the ARI password. Falls back to HMAC_SECRET when unset; set it
      # separately to rotate SIP secrets independently.
      - "SIP_REGISTRAR_SECRET=${SIP_REGISTRAR_SECRET:-}"
      # CoTURN relay (profile: telephony). Both must be set for /sip-token
      # to return time-limited TURN credentials; TURN_SECRET must equal the
      # coturn --static-auth-secret above. Unset = STUN-only ICE servers.
      - TURN_HOST=${TURN_HOST:-}
      - TURN_SECRET=${TURN_SECRET:-}
      # The SIP edge's PUBLIC TLS trust anchor, published to clients in
      # /api/telephony/sip-token so a volunteer's client can verify the PBX
      # certificate without a public CA ever vouching for it — the anchor
      # arrives over the app's own pinned HTTPS channel. Kamailio is the edge
      # here (asterisk publishes no ports), so this is Kamailio's certificate;
      # its entrypoint exports it to the shared volume below. Point it at a
      # different file, or leave it unset, when the edge serves a
      # publicly-trusted certificate and clients should use the device trust
      # store instead. Never a private key: sip-tls-cert.sh refuses to publish
      # one, and the worker rejects a PEM containing key material.
      - SIP_TLS_CA_FILE=${SIP_TLS_CA_FILE-/var/lib/llamenos/sip-tls/kamailio.pem}
    volumes:
      # Read-only: the app publishes the anchor, it never writes one.
      - sip-tls-anchor:/var/lib/llamenos/sip-tls:ro
    networks:
      - web
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "llamenos-app"
    healthcheck:
      # oven/bun:1-slim has no curl — use bun's built-in fetch
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=llamenos
      - POSTGRES_USER=llamenos
      - POSTGRES_PASSWORD=${PG_PASSWORD:?PG_PASSWORD is required}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llamenos -d llamenos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    # Digest bump (issue #650, 2026-09-20): refreshes the Alpine package layer
    # (curl/c-ares/libcrypto3/libssl3 CVEs) under the same 2.11.4 tag.
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-}
    networks:
      - web
    depends_on:
      app:
        condition: service_healthy

  rustfs:
    image: rustfs/rustfs:latest@sha256:378642b05b7dcb4849fb77ebe6aca4ced1c3f66e7e504247df95a5c9018d3358
    command: server /data --console-address ":9001"
    restart: unless-stopped
    volumes:
      - rustfs-data:/data
    environment:
      - RUSTFS_ACCESS_KEY=${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      - RUSTFS_SECRET_KEY=${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      - RUSTFS_CONSOLE_ENABLE=true
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/ || test $? -eq 22"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Optional: ntfy push relay (UnifiedPush for Android) ───
  ntfy:
    image: binwiederhier/ntfy:v2.11.0@sha256:4a7d0f0adc6d5d9fc36e64ab55ef676e76e124a2bdd50ce115b6d9c1c7430294
    profiles: ["push"]
    restart: unless-stopped
    command: serve
    environment:
      - NTFY_BASE_URL=https://${NTFY_DOMAIN:-ntfy.localhost}
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_BEHIND_PROXY=true
      - NTFY_ENABLE_SIGNUP=false
      - NTFY_ENABLE_LOGIN=false
      # Bearer token for server→ntfy auth (must match NTFY_AUTH_TOKEN in app env)
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
    volumes:
      - ntfy-data:/var/lib/ntfy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:80/v1/health", "-O", "-"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Optional: Whisper Transcription ───────────────────────
  whisper:
    # NOTE: "0.4.1" was never a published tag (see #722) — no bare/untagged
    # release exists for this image, only -cpu/-cuda variants. Pinned to
    # 0.4.0-cpu (the earliest published 0.4.x patch, matching the cpu default
    # in WHISPER__DEVICE below). scripts/update-image-digests.sh is owned by
    # a different lane and still lists the old ref; needs a follow-up from
    # that lane so refreshes don't revert this pin.
    image: fedirz/faster-whisper-server:0.4.0-cpu@sha256:f77aaf85e2e811aae96a60b04c85ff7cb0e0f2be6729c6fd7600340842412539  # pinned 2026-09-19
    profiles: ["transcription"]
    restart: unless-stopped
    environment:
      - WHISPER__MODEL=${WHISPER_MODEL:-Systran/faster-whisper-base}
      - WHISPER__DEVICE=${WHISPER_DEVICE:-cpu}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Optional: Asterisk PBX ───────────────────────────────
  #
  # Minimum Asterisk 22.10.0. Below that, `dtls_verify = fingerprint` — which
  # apps/worker/telephony/registrar.ts sets on every volunteer endpoint — does
  # NOT give fingerprint-only verification. asterisk-config/sorcery.conf backs
  # `endpoint` with astdb, so every endpoint is serialised on write and parsed
  # back on each inbound INVITE, and before 22.10.0 the serialiser wrote any
  # non-zero verify mode as the string "Yes". "Yes" parses back as
  # fingerprint AND certificate, so Asterisk ran full X.509 chain verification
  # against an empty trust store and no RFC 5763 self-signed peer certificate
  # could ever pass: every DTLS-SRTP call died at the handshake with
  # `certificate verify failed` and the leg carried no audio (#1687).
  #
  # Upstream fixed the serialiser in 269a566a347f, first released in 22.10.0.
  # A pin below that silently turns the media plane's only
  # certificate-to-session binding into a call-killing chain check, so
  # deploy/docker/tests/telephony/asterisk-image-dtls-pin.test.ts refuses any
  # digest not vetted for it. If you bump this image, add the new digest there
  # with its Asterisk version.
  asterisk:
    image: andrius/asterisk@sha256:fa1d49e3826d3e85232e9a63bb1659a20088dabe8e41980ecc7948fb1da6efe6 # 22.10.1 — NOT below 22.10.0, see #1687
    # Also enabled by "telephony": kamailio (telephony profile) has a hard
    # `depends_on: asterisk: condition: service_healthy` below, so activating
    # telephony without asterisk previously failed compose config resolution
    # entirely (pre-existing bug, found while verifying #722's fix)
    profiles: ["asterisk", "telephony"]
    restart: unless-stopped
    # No call can route until the app provisions the SIP trunk
    # (POST /api/provider-setup/create-sip-trunk). The trunk lives in astdb on
    # the asterisk-db volume — see asterisk-config/sorcery.conf.
    # Root only for the entrypoint's chown of the astdb volume; Asterisk drops
    # to the asterisk user as it starts (-U/-G, as the image's own CMD does).
    user: root
    entrypoint: ["/bin/sh", "/usr/local/share/llamenos/asterisk-entrypoint.sh"]
    # RTP, and only RTP. SIP SIGNALLING reaches the PBX through Kamailio (the
    # edge); media does not, because Kamailio is a signalling proxy with no
    # media relay — so RTP runs directly between the volunteer and this
    # container. Published and firewall-opened, or a call connects and carries
    # no audio. The range is bounded by asterisk-config/rtp.conf; publishing
    # Asterisk's 10,001-port default is not possible, which is why it is
    # bounded there rather than left alone.
    #
    # An operator who would rather not publish 200 UDP ports can put this
    # service on host networking instead — the usual Asterisk-in-Docker
    # arrangement — but then ARI is no longer reachable at `asterisk:8088`
    # from the app and the provider configuration has to name the host.
    #
    # NOT YET VALIDATED ON A DEPLOYED VPS. These ports are published from a
    # service attached only to `internal` (an internal: true network), exactly
    # as kamailio's 5060/5061 already are. If published ports turn out not to
    # be routable from there, both services need `web` adding to `networks` —
    # one change, affecting both, which is why it is not pre-emptively made
    # here for one of them.
    ports:
      - "${RTP_MIN_PORT:-10000}-${RTP_MAX_PORT:-10199}:10000-10199/udp"
    environment:
      # Names the self-signed certificate must cover when the operator mounts
      # none. Asterisk is NOT the client-facing SIP edge for SIGNALLING here
      # (Kamailio is), so for TLS these matter only for the internal hop and
      # for DTLS-SRTP. SIP_TLS_ANCHOR_SOURCE, if set, is the issuing root of a
      # mounted real certificate.
      - SIP_TLS_SANS=${SIP_TLS_SANS:-${DOMAIN:-localhost}}
      - SIP_TLS_ANCHOR_SOURCE=${ASTERISK_TLS_ANCHOR_SOURCE:-}
      # Certificate and key for transport-tls/transport-wss. Unset = the
      # entrypoint generates a self-signed combined PEM at the previous
      # hardcoded path, so nothing changes for a deployment that sets neither.
      - ASTERISK_TLS_CERT_FILE=${ASTERISK_TLS_CERT_FILE:-}
      - ASTERISK_TLS_KEY_FILE=${ASTERISK_TLS_KEY_FILE:-}
      # The address Asterisk advertises for MEDIA (and signalling). Unset, it
      # advertises its container address, which no volunteer can route to: the
      # call sets up and no audio arrives. See asterisk-entrypoint.sh.
      - SIP_EXTERNAL_ADDRESS=${SIP_EXTERNAL_ADDRESS:-${DOMAIN:-}}
      - SIP_LOCAL_NETS=${SIP_LOCAL_NETS:-}
    volumes:
      - ./asterisk-config:/etc/asterisk:ro
      - ./asterisk-entrypoint.sh:/usr/local/share/llamenos/asterisk-entrypoint.sh:ro
      # Same read-only certificate mount as kamailio. Asterisk publishes no
      # ports in this deployment, so Kamailio is the edge and this matters only
      # if that changes — but the paths stay configurable either way.
      - ${SIP_TLS_CERT_DIR:-./sip-tls-mount}:/etc/llamenos/sip-tls:ro
      - ./sip-tls-cert.sh:/usr/local/share/llamenos/sip-tls-cert.sh:ro
      - asterisk-db:/var/lib/asterisk/astdb
      # A stable keypair across restarts: an anchor a client pinned at its last
      # /sip-token fetch must keep verifying after a PBX restart.
      - asterisk-keys:/var/lib/asterisk/keys
      - sip-tls-anchor:/var/lib/llamenos/sip-tls
    # ari.conf #includes this file for the ARI user's password — Asterisk
    # cannot read ARI_PASSWORD from its environment itself.
    configs:
      - source: ari_credentials
        target: /run/llamenos/ari-credentials.conf
    networks:
      - internal
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  sip-bridge:
    profiles: ["asterisk"]
    build:
      context: ../../sip-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PBX_TYPE=${PBX_TYPE:-asterisk}
      - ARI_URL=ws://asterisk:8088/ari/events
      - ARI_REST_URL=http://asterisk:8088/ari
      - ARI_USERNAME=${ARI_USERNAME:-llamenos}
      - ARI_PASSWORD=${ARI_PASSWORD:-changeme}
      - WORKER_WEBHOOK_URL=http://app:3000
      - BRIDGE_SECRET=${BRIDGE_SECRET:-changeme}
      - BRIDGE_HOST=0.0.0.0
    networks:
      - internal
    depends_on:
      asterisk:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Optional: Kamailio SIP Proxy (telephony profile) ──────
  kamailio:
    # NOTE: "kamailio/kamailio" does not exist on Docker Hub (only
    # kamailio-ci/kamailio-store, neither suitable for production) and ":5.7"
    # was never a published tag anywhere (see #722). The project's official
    # runtime images live at ghcr.io/kamailio/kamailio; pinned to 5.7.1-bookworm,
    # the earliest published patch in the 5.7.x line. scripts/update-image-digests.sh
    # is owned by a different lane and still lists the old ref; needs a
    # follow-up from that lane so refreshes don't revert this pin.
    image: ghcr.io/kamailio/kamailio:5.7.1-bookworm@sha256:a5c0564fe4bf12315ec3aed97303bc63207c0cec0c5b1150ea6500f4747163e9  # pinned 2026-09-19
    profiles: ["telephony"]
    restart: unless-stopped
    # Generates the self-signed certificate the TLS listener binds when the
    # operator has not mounted a real one, then starts Kamailio with the
    # image's own flags (see kamailio/kamailio-entrypoint.sh).
    entrypoint: ["/bin/sh", "/usr/local/share/llamenos/kamailio-entrypoint.sh"]
    ports:
      - "${SIP_UDP_PORT:-5060}:5060/udp"
      - "${SIP_TCP_PORT:-5060}:5060/tcp"
      - "${SIPS_PORT:-5061}:5061/tcp"
    environment:
      # Kamailio IS the client-facing SIP edge, so its certificate is the one a
      # volunteer's client verifies: every hostname clients dial for the SIP
      # domain must be a SAN here, or hostname verification fails even with the
      # right anchor. SIP_TLS_ANCHOR_SOURCE is the issuing root when a real
      # certificate is mounted at ./kamailio/cert.pem — publish the root, not
      # the leaf, so renewals do not break registered clients.
      - SIP_TLS_SANS=${SIP_TLS_SANS:-${DOMAIN:-localhost}}
      - SIP_TLS_ANCHOR_SOURCE=${KAMAILIO_TLS_ANCHOR_SOURCE:-}
      # Certificate and key the TLS listener serves. Two settings, not one:
      # the self-signed default is a single combined PEM, but Let's Encrypt is
      # always two files (Caddy: <domain>.crt + <domain>.key). Unset = the
      # entrypoint generates and serves a self-signed combined PEM, exactly as
      # before these were configurable. To serve a real certificate, mount it
      # via SIP_TLS_CERT_DIR and point these at it under /etc/llamenos/sip-tls
      # — see .env.example, and note that a renewal needs `kamcmd tls.reload`.
      - KAMAILIO_TLS_CERT_FILE=${KAMAILIO_TLS_CERT_FILE:-}
      - KAMAILIO_TLS_KEY_FILE=${KAMAILIO_TLS_KEY_FILE:-}
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      # The TEMPLATE, not the live config: tls.cfg names the certificate and
      # key literally and has no variable expansion, so the entrypoint renders
      # it to /etc/kamailio/tls.cfg with the configured paths substituted in.
      - ./kamailio/tls.cfg.template:/usr/local/share/llamenos/tls.cfg.template:ro
      - ./kamailio/dispatcher.list:/etc/kamailio/dispatcher.list:ro
      - ./kamailio/kamailio-entrypoint.sh:/usr/local/share/llamenos/kamailio-entrypoint.sh:ro
      - ./sip-tls-cert.sh:/usr/local/share/llamenos/sip-tls-cert.sh:ro
      # Externally-managed certificate material, READ-ONLY. Defaults to a
      # committed placeholder directory so compose stays valid when unset;
      # point SIP_TLS_CERT_DIR at the host directory holding a real
      # certificate (e.g. Caddy's Let's Encrypt storage) to use one.
      - ${SIP_TLS_CERT_DIR:-./sip-tls-mount}:/etc/llamenos/sip-tls:ro
      - sip-tls-anchor:/var/lib/llamenos/sip-tls
    networks:
      - internal
    depends_on:
      asterisk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kamcmd", "core.version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Optional: CoTURN STUN/TURN relay (telephony profile) ──
  coturn:
    image: coturn/coturn:4@sha256:867607152c6ed9504a0b59a2546a9bd2872dcf74313b3bc6cf9b69cc81be6fb3  # pinned 2026-05-18
    profiles: ["telephony"]
    restart: unless-stopped
    # Host networking, not published ports. A TURN server must advertise an
    # address the client can actually reach in its RELAY candidate, and on a
    # bridge network it advertises its 172.x container address — so relay
    # allocation succeeds and the candidate is then useless, which is exactly
    # the case a volunteer behind a symmetric NAT depends on. Host mode is also
    # coturn's own recommended deployment, and it keeps the relay port range
    # subject to the host firewall instead of bypassing it the way published
    # ports do. Open UDP ${TURN_PORT:-3478} and the relay range below.
    network_mode: host
    # Time-limited per-volunteer TURN credentials (RFC 8489 long-term
    # credential scheme): the worker mints `username = <expiry>:<vol_…>` /
    # `credential = base64(HMAC-SHA1(TURN_SECRET, username))` tokens for
    # /api/telephony/sip-token, and coturn verifies them against the shared
    # --static-auth-secret below. The secret stays server-side; a seized
    # client credential dies at its expiry.
    #
    # --external-ip is needed only behind 1:1 NAT (a cloud VM whose public
    # address the host does not see on an interface); set TURN_EXTERNAL_IP to
    # `public/private` there, e.g. 203.0.113.4/10.0.0.4.
    command: >
      --realm=${DOMAIN:-localhost}
      --fingerprint
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-changeme}
      --listening-port=${TURN_PORT:-3478}
      --min-port=${TURN_RELAY_MIN_PORT:-49160}
      --max-port=${TURN_RELAY_MAX_PORT:-49200}
      ${TURN_EXTERNAL_IP:+--external-ip=${TURN_EXTERNAL_IP}}
      --no-tls
      --no-dtls
      --no-cli
    healthcheck:
      # A STUN Binding request, which coturn answers UNAUTHENTICATED even in
      # --use-auth-secret mode (only TURN allocation needs the credential). So
      # unlike a process probe this proves the listener actually answers — and
      # unlike the `pgrep` it replaces, it can pass at all: the pinned image
      # ships no pgrep, so that healthcheck failed every time and marked a
      # perfectly working coturn unhealthy. A dead listener never replies, so
      # the probe hangs and the timeout below is what fails it.
      test: ["CMD-SHELL", "turnutils_stunclient -p ${TURN_PORT:-3478} 127.0.0.1 2>&1 | grep -q 'reflexive addr'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Optional: GlitchTip Error Tracking ────────────────────
  # Sentry-compatible error tracking. Clients send crash reports here.
  # Enable with: docker compose --profile monitoring up -d
  glitchtip:
    image: glitchtip/glitchtip:v4.1@sha256:0803e1820215905c305cd0e7c497e5bbdbb2c2c65fcbe6bdc131f4538b8ed048
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://llamenos:${PG_PASSWORD:?PG_PASSWORD is required}@postgres:5432/glitchtip
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY:-changeme}
      - PORT=8000
      - EMAIL_URL=${GLITCHTIP_EMAIL_URL:-consolemail://}
      - GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN:-http://localhost:8000}
      - DEFAULT_FROM_EMAIL=${GLITCHTIP_FROM_EMAIL:-noreply@localhost}
      - CELERY_WORKER_AUTOSCALE=1,3
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=10000
    networks:
      - web
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/_health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  glitchtip-worker:
    image: glitchtip/glitchtip:v4.1@sha256:0803e1820215905c305cd0e7c497e5bbdbb2c2c65fcbe6bdc131f4538b8ed048
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment:
      - DATABASE_URL=postgresql://llamenos:${PG_PASSWORD:?PG_PASSWORD is required}@postgres:5432/glitchtip
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY:-changeme}
      - EMAIL_URL=${GLITCHTIP_EMAIL_URL:-consolemail://}
      - GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN:-http://localhost:8000}
      - DEFAULT_FROM_EMAIL=${GLITCHTIP_FROM_EMAIL:-noreply@localhost}
      - CELERY_WORKER_AUTOSCALE=1,3
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=10000
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy

  glitchtip-redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Optional: Signal Messaging + Notifications ──────────
  signal-cli:
    image: bbernhard/signal-cli-rest-api:0.92@sha256:702db336aa1a87611595e66755c9ccf65b24c25589857301eabef1d46056b3c5
    profiles: ["signal"]
    restart: unless-stopped
    # AUTO_RECEIVE_SCHEDULE is NOT set — it is incompatible with MODE=json-rpc.
    # signal-cli-rest-api 0.92 fatals at startup ("Env variable
    # AUTO_RECEIVE_SCHEDULE can't be used with mode json-rpc") the instant the
    # var is *present* in the container's environment, even set to an empty
    # string — the binary checks for the key's presence, not its value.
    # Combined with `restart: unless-stopped` this crash-looped the container
    # indefinitely (#944): every restart tears down and recreates the
    # container's network attachment, which surfaced as bursts of Chromium
    # net::ERR_NETWORK_CHANGED errors in unrelated Playwright E2E tests,
    # misread as a login/PIN flake. In json-rpc mode the daemon receives
    # messages continuously on its own — no receive schedule needed.
    environment:
      - MODE=json-rpc
    volumes:
      - signal-data:/home/.local/share/signal-cli
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/about"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  signal-notifier:
    profiles: ["signal"]
    build:
      context: ../../signal-notifier
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3100
      - "NOTIFIER_API_KEY=${NOTIFIER_API_KEY:-changeme}"
      - NOTIFIER_API_KEY_PREVIOUS=${NOTIFIER_API_KEY_PREVIOUS:-}
      - "NOTIFIER_TOKEN_SECRET=${NOTIFIER_TOKEN_SECRET:-${HMAC_SECRET}}"
      - "DATABASE_URL=postgres://llamenos:${PG_PASSWORD}@postgres:5432/llamenos?sslmode=disable"
      - SIGNAL_BRIDGE_URL=http://signal-cli:8080
      - SIGNAL_BRIDGE_API_KEY=${SIGNAL_BRIDGE_API_KEY:-}
      - "SIGNAL_REGISTERED_NUMBER=${SIGNAL_REGISTERED_NUMBER:-}"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      signal-cli:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

configs:
  # Rendered from ARI_PASSWORD so asterisk and sip-bridge share one credential.
  ari_credentials:
    content: |
      password = ${ARI_PASSWORD:-changeme}

volumes:
  asterisk-db:
  asterisk-keys:
  # The SIP edge's PUBLIC TLS trust anchor: written by whichever entrypoint
  # terminates client TLS, read-only for the app, which publishes it to clients
  # in /api/telephony/sip-token. Certificates only — never key material.
  sip-tls-anchor:
  postgres-data:
  caddy-data:
  caddy-config:
  rustfs-data:
  signal-data:
  ntfy-data:

networks:
  web:
    driver: bridge
  internal:
    driver: bridge
    internal: true
