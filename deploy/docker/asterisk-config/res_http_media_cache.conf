; ============================================================
; res_http_media_cache — how Asterisk fetches IVR prompts
; ============================================================
; Every prompt the caller hears is fetched from the app over HTTP
; (ARI `sound:http://app:3000/api/ivr-audio/…` or `/api/ivr-speech/…`),
; and the channel plays nothing until the fetch completes. The default
; timeout is 180 s: a hung app would hold a caller in silence for three
; minutes per prompt. An upload is at most 1 MB and generated speech is
; synthesised in well under a second, so fail — audibly, in the bridge's
; log — after 10 s instead.
; ============================================================

[general]
timeout_secs = 10
