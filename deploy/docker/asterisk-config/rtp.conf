; ============================================================
; RTP port range for Llamenos
; ============================================================
; Asterisk's default range is 10000-20000 — 10,001 UDP ports.
; Nothing can firewall or publish that, so on any deployment
; where the volunteer's media does not share a flat network
; with the PBX it is equivalent to "media never arrives".
;
; 10000-10199 is 100 concurrent calls — well beyond what a
; hotline runs, and few enough that an operator can open it and
; Docker can publish it. Open it in the host firewall (UDP)
; alongside the SIP port — see docs/deployment/first-deploy.md.
;
; The media ADDRESS Asterisk advertises is separate and equally
; necessary: see pjsip.d/nat.conf, which the entrypoint
; generates from SIP_EXTERNAL_ADDRESS.
; ============================================================

[general]
rtpstart = 10000
rtpend = 10199

; ICE/STUN/TURN for the per-volunteer endpoints (ice_support=yes
; in apps/worker/telephony/registrar.ts). Asterisk gathers its
; own host candidates and answers the client's connectivity
; checks; the client's STUN/TURN servers come from
; /api/telephony/sip-token, so none are configured here.
icesupport = yes
