; Sorcery configuration for Llamenos
;
; The SIP trunk — endpoint, aor, identify, and for a registration trunk auth +
; registration, all named `trunk` (`trunk-auth` for the auth) — is provisioned
; by the app through ARI's dynamic config API
; (PUT /ari/asterisk/config/dynamic/res_pjsip/<type>/<id>), from
; POST /api/provider-setup/create-sip-trunk. The per-volunteer endpoints
; (`vol_<pubkey16>`: auth, aor, endpoint) are provisioned the same way from
; /api/telephony/sip-token.
;
; astdb is the one store for those objects: ARI can write it, and it lives in
; astdbdir (asterisk.conf), a compose volume, so the trunk survives a restart.
; There is deliberately no config-file wizard for these types: a second store
; would shadow the provisioned trunk (sorcery reads wizards in order) with no
; sign of which one is live. pjsip.conf holds only transports.
;
; identify and registration must be listed: their default wizard is the config
; file, which ARI cannot write, so a trunk could never match the carrier's calls.
;
; Privacy: contacts stay in memory — which volunteer registered from which IP
; must never reach disk (#1207). But sorcery cannot route objects of one type to
; different stores, so ANY endpoint/auth/aor created through ARI lands in astdb
; and persists.
;
; Decision (per-volunteer SIP registrar, #1203/#1435): the trunk AND the
; per-volunteer endpoints (`vol_<pubkey16>`, provisioned by
; /api/telephony/sip-token) share the astdb store above. The #1207 property
; is preserved — contacts stay in memory, so volunteer IPs and presence never
; reach disk. What persists is the endpoint/auth objects themselves: names
; (`vol_<pubkey16>`) and HMAC-derived digest secrets, each revocable through
; ARI delete on role loss or account deletion (telephony/registrar.ts). The
; memory-for-everything alternative (re-applying the trunk whenever the PBX
; reconnects, #1332) stays available if a seized disk ever proves the worse
; trade-off.

[general]

[res_pjsip]
auth = astdb,llamenos-pjsip
aor = astdb,llamenos-pjsip
endpoint = astdb,llamenos-pjsip
contact = memory

[res_pjsip_endpoint_identifier_ip]
identify = astdb,llamenos-pjsip

[res_pjsip_outbound_registration]
registration = astdb,llamenos-pjsip
