; Sorcery configuration for Llamenos
;
; PJSIP objects load from pjsip.conf first — that is where the SIP trunk lives
; (rendered from SIP_PROVIDER / SIP_USERNAME / SIP_PASSWORD by
; deploy/docker/asterisk-entrypoint.sh and #included by pjsip.conf).
;
; The memory wizard comes second so objects can still be created at runtime via
; ARI's dynamic config API (PUT /ari/asterisk/config/dynamic/res_pjsip/...).
; With memory ALONE, every object in pjsip.conf is silently ignored: Asterisk
; boots with no endpoints and no call can route in or out.

[general]

[res_pjsip]
auth = config,pjsip.conf,criteria=type=auth
auth = memory
aor = config,pjsip.conf,criteria=type=aor
aor = memory
endpoint = config,pjsip.conf,criteria=type=endpoint
endpoint = memory
contact = memory
