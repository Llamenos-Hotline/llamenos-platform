; Deliberately empty.
;
; extensions.conf #includes this directory, and Asterisk treats a glob that
; matches nothing as an ERROR and abandons the rest of the file — which would
; take the whole dialplan with it. This file is what keeps the glob satisfied
; in a deployment that mounts nothing here.
;
; The telephony e2e harnesses bind-mount their own directory OVER this one, so
; this file is absent while they run and their fragment is what is read.
