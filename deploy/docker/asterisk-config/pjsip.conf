; ============================================================
; PJSIP Configuration for Llamenos
; ============================================================
; Transports only. The SIP trunk (endpoint `trunk`: aor,
; identify, and auth + registration for a registration trunk)
; and every per-volunteer endpoint (`vol_<pubkey16>`: auth, aor,
; endpoint) are provisioned by the app through ARI and stored in
; astdb — see sorcery.conf. Endpoints defined here would be
; ignored.
;
; The TLS/WSS transports read their certificate from
; /var/lib/asterisk/keys/asterisk.pem, which the compose
; entrypoint generates (self-signed) when absent, covering
; every name in SIP_TLS_SANS — a client verifies the hostname
; as well as the chain, so the SIP domain it dials must be in
; there. Deployments that mount a real certificate there get a
; real one. If the file is missing the transport fails to load
; and is skipped — UDP/TCP keep working.
;
; The entrypoint also exports the certificate's PUBLIC half as
; the trust anchor the app hands clients in
; /api/telephony/sip-token, so a self-hoster's self-signed PBX
; certificate is verifiable without a public CA. See
; deploy/docker/sip-tls-cert.sh.
; ============================================================

[global]
type = global
; DTLS-SRTP key material is NOT configurable here. `dtls_cert_file` and
; `dtls_private_key` are ENDPOINT options; `type = global` silently ignores
; them, which is how a PBX ended up answering with an empty
; `a=fingerprint:SHA-256` and failing every DTLS handshake with
; `tls alert bad certificate` while looking correctly configured.
;
; The per-volunteer endpoints carry `dtls_auto_generate_cert = yes` instead
; (apps/worker/telephony/registrar.ts). DTLS-SRTP authenticates by the
; fingerprint in the SDP, which travelled over the TLS signalling channel, so
; the certificate needs no CA and no stable identity.

; ----------------------------------------------------------
; Transport — UDP on port 5060
; ----------------------------------------------------------
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; ----------------------------------------------------------
; Transport — TCP on port 5060
; ----------------------------------------------------------
[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; ----------------------------------------------------------
; Transport — TLS on port 5061 (native SIP clients: Linphone)
; Per-volunteer endpoints register here (directly, or through
; Kamailio's TLS listener when it fronts the PBX).
; ----------------------------------------------------------
[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /var/lib/asterisk/keys/asterisk.pem
priv_key_file = /var/lib/asterisk/keys/asterisk.pem
method = tlsv1_2
; Clients authenticate with a per-volunteer digest secret, not a client
; certificate, so verify_client stays off and this list is never consulted for
; authorisation. It must still be set: with no CA list Asterisk hands pjproject
; an empty buffer and pjproject logs "Error reading CA certificates from
; buffer" on EVERY inbound TLS connection — noise that reads like a trust
; failure and is not one. The entrypoint writes ca-list.pem (our own
; certificate, public half only) next to the keypair.
ca_list_file = /var/lib/asterisk/keys/ca-list.pem

; ----------------------------------------------------------
; Transport — WSS on port 8089 (WebRTC clients)
; SIP-over-WebSocket signaling for JsSIP/webview UAs.
; Caddy terminates TLS in production; for local dev, Asterisk
; serves WSS directly with the entrypoint-generated cert.
; ----------------------------------------------------------
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8089
cert_file = /var/lib/asterisk/keys/asterisk.pem
priv_key_file = /var/lib/asterisk/keys/asterisk.pem

; ----------------------------------------------------------
; Fragments appended to the transports above
; ----------------------------------------------------------
; Both includes are LAST so the categories they extend with
; `(+)` already exist.
;
; 1. NAT media/signalling addresses, generated by
;    asterisk-entrypoint.sh from SIP_EXTERNAL_ADDRESS. Without
;    it Asterisk advertises its own (container) address in
;    `c=`, which a volunteer on the Internet cannot reach — so
;    signalling succeeds and media silently never arrives.
;    /etc/asterisk is mounted read-only, hence a writable path.
; 2. /etc/asterisk/pjsip.d/ ships only a placeholder, which it
;    must: Asterisk treats a #include glob that matches NOTHING
;    as an error and abandons the rest of the file — which took
;    every transport with it the first time this was tried. The
;    telephony e2e harnesses mount their own directory over it.
#include "/var/lib/asterisk/pjsip.d/*.conf"
#include "pjsip.d/*.conf"
