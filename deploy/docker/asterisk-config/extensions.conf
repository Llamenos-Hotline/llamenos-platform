; ============================================================
; Dialplan for Llamenos Hotline
; ============================================================
; All incoming calls are routed to the Stasis application
; "llamenos", which is handled by the ARI bridge service.
;
; Place this file in /etc/asterisk/extensions.conf
; ============================================================

[general]
static = yes
writeprotect = no
clearglobalvars = no

; ----------------------------------------------------------
; Default context — reject everything not explicitly routed
; ----------------------------------------------------------
[default]
exten => _X.,1,NoOp(Rejecting unrouted call to ${EXTEN})
 same => n,Congestion()
 same => n,Hangup()

; ----------------------------------------------------------
; Incoming calls from SIP trunk(s)
; ----------------------------------------------------------
; All incoming calls go directly into the Stasis app.
; The bridge service handles IVR, routing, and bridging.
[from-trunk]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,Stasis(llamenos)
 same => n,Hangup()

; Catch-all for E.164 numbers
exten => _+X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,Stasis(llamenos)
 same => n,Hangup()

; ----------------------------------------------------------
; Internal extensions (for testing / volunteer SIP phones)
; ----------------------------------------------------------
[internal]
; Route internal calls through Stasis for testing
exten => _X.,1,NoOp(Internal call from ${CALLERID(num)} to ${EXTEN})
 same => n,Stasis(llamenos)
 same => n,Hangup()

; ----------------------------------------------------------
; Volunteer endpoints — SFrame E2EE (eventually)
; ----------------------------------------------------------
; Every per-volunteer endpoint the registrar provisions lands here
; (VOLUNTEER_DIALPLAN_CONTEXT in apps/worker/telephony/registrar.ts):
; native SIP/TLS clients (Linphone on mobile) and SIP-over-WSS
; browser UAs alike.
;
; The leg to this PBX is DTLS-SRTP today, which protects it hop by
; hop but leaves Asterisk holding the media key. SFrame closes that
; by encrypting the RTP payload end to end underneath the transport,
; so it layers on top of DTLS-SRTP rather than replacing it. When it
; lands, this context must stop transcoding: an SFrame payload
; cannot survive a codec change.
[volunteers-sframe]
exten => _X.,1,NoOp(SFrame E2EE call from ${CALLERID(num)})
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Stasis(llamenos,sframe)
 same => n,Hangup()

; ----------------------------------------------------------
; Outgoing calls (bridge originates these for volunteer ringing)
; ----------------------------------------------------------
[to-trunk]
exten => _+X.,1,NoOp(Outgoing call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@trunk,30)
 same => n,Hangup()

exten => _X.,1,NoOp(Outgoing call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@trunk,30)
 same => n,Hangup()

; ----------------------------------------------------------
; Test-harness contexts
; ----------------------------------------------------------
; Only a placeholder ships in this directory, and it has to:
; Asterisk treats a #include glob that matches NOTHING as an
; error and abandons the rest of the file, which would take the
; whole dialplan above with it.
;
; The telephony e2e harnesses bind-mount their own directory
; over it to add extensions a test needs — e.g. an
; answer-and-echo target in [volunteers-sframe], so a registered
; volunteer endpoint's media leg can be driven and the agreed
; encryption read off the PBX. A deployment mounts nothing and
; the dialplan is exactly what is above.
#include "extensions.d/*.conf"
